<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">NovelForge chapter production run</title>
  <desc id="desc">A four-phase chapter production pipeline showing preparation, drafting, challenge and repair, and release, with raw draft kept internal and failures routed back to the mechanism that owns them.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#796BC4"/>
    </marker>
    <marker id="returnArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#B95767"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1398" height="758" rx="28" fill="#FFFDFC" stroke="#E2DAE8" stroke-width="2"/>
  <text x="58" y="64" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#241D2B">A chapter is a production run, not one model call</text>
  <text x="58" y="98" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#62556D">Preparation creates bounded story pressure. Drafting creates an internal candidate. Challenge layers attack it before anything becomes user-visible.</text>

  <!-- phase labels -->
  <rect x="58" y="132" width="228" height="38" rx="19" fill="#DDEFF8" stroke="#4F8FBA"/>
  <text x="78" y="157" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#241D2B">01 · PREPARE THE RUN</text>
  <rect x="468" y="132" width="228" height="38" rx="19" fill="#FFFDFC" stroke="#62556D"/>
  <text x="488" y="157" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#241D2B">02 · CREATE CANDIDATE</text>
  <rect x="768" y="132" width="250" height="38" rx="19" fill="#F9DDE9" stroke="#D6679A"/>
  <text x="788" y="157" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#241D2B">03 · CHALLENGE &amp; REPAIR</text>
  <rect x="1136" y="132" width="206" height="38" rx="19" fill="#DCF1E7" stroke="#4D9B7D"/>
  <text x="1156" y="157" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#241D2B">04 · RELEASE GATE</text>

  <!-- prepare cluster -->
  <rect x="58" y="190" width="360" height="338" rx="22" fill="#F7FCFF" stroke="#B8D9EC"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
    <rect x="82" y="216" width="312" height="50" rx="14" fill="#DDEFF8" stroke="#4F8FBA" stroke-width="1.5"/>
    <text x="98" y="238" font-size="13" font-weight="700" fill="#4F8FBA">01</text><text x="128" y="247" font-size="18" font-weight="650" fill="#241D2B">Context Freeze</text>
    <rect x="82" y="279" width="312" height="50" rx="14" fill="#DDEFF8" stroke="#4F8FBA" stroke-width="1.5"/>
    <text x="98" y="301" font-size="13" font-weight="700" fill="#4F8FBA">02</text><text x="128" y="310" font-size="18" font-weight="650" fill="#241D2B">Story / Canon Preflight</text>
    <rect x="82" y="342" width="147" height="66" rx="14" fill="#FFFDFC" stroke="#62556D" stroke-width="1.5"/>
    <text x="98" y="364" font-size="13" font-weight="700" fill="#796BC4">03</text><text x="98" y="389" font-size="17" font-weight="650" fill="#241D2B">Scene</text><text x="98" y="406" font-size="14" fill="#62556D">Simulation</text>
    <rect x="247" y="342" width="147" height="66" rx="14" fill="#FFFDFC" stroke="#62556D" stroke-width="1.5"/>
    <text x="263" y="364" font-size="13" font-weight="700" fill="#796BC4">04</text><text x="263" y="389" font-size="17" font-weight="650" fill="#241D2B">Character</text><text x="263" y="406" font-size="14" fill="#62556D">Simulation</text>
    <rect x="82" y="421" width="312" height="78" rx="14" fill="#F9DDE9" stroke="#D6679A" stroke-width="1.5"/>
    <text x="98" y="444" font-size="13" font-weight="700" fill="#D6679A">05</text><text x="128" y="454" font-size="18" font-weight="650" fill="#241D2B">Reader Pressure</text>
    <text x="98" y="480" font-size="14" fill="#62556D">Define conflict, choice, cost, curiosity and reward before prose.</text>
  </g>

  <!-- candidate -->
  <rect x="468" y="190" width="250" height="338" rx="22" fill="#FAF8FF" stroke="#CFC7EE"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
    <rect x="492" y="229" width="202" height="86" rx="16" fill="#FFFDFC" stroke="#62556D" stroke-width="1.5"/>
    <text x="510" y="254" font-size="13" font-weight="700" fill="#796BC4">06</text>
    <text x="510" y="280" font-size="18" font-weight="700" fill="#241D2B">Event-first</text>
    <text x="510" y="303" font-size="18" font-weight="700" fill="#241D2B">Raw Draft</text>
    <rect x="492" y="329" width="202" height="77" rx="16" fill="#F9DDE9" stroke="#D6679A" stroke-width="1.5"/>
    <text x="510" y="354" font-size="13" font-weight="700" fill="#D6679A">07</text>
    <text x="510" y="381" font-size="18" font-weight="700" fill="#241D2B">Surface Realization</text>
    <rect x="492" y="426" width="202" height="74" rx="14" fill="#F0ECF4" stroke="#796BC4" stroke-dasharray="6 5"/>
    <text x="510" y="451" font-size="14" font-weight="700" fill="#796BC4">INTERNAL BOUNDARY</text>
    <text x="510" y="475" font-size="15" fill="#3C3245">Raw Draft never ships.</text>
  </g>

  <!-- challenge -->
  <rect x="768" y="190" width="320" height="338" rx="22" fill="#FFFAFC" stroke="#EDC3D6"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
    <rect x="792" y="216" width="272" height="74" rx="14" fill="#F9EDCF" stroke="#BE892F" stroke-width="1.5"/>
    <text x="808" y="240" font-size="13" font-weight="700" fill="#BE892F">08</text><text x="838" y="250" font-size="17" font-weight="700" fill="#241D2B">Regression + independent review</text>
    <text x="808" y="274" font-size="13" fill="#62556D">Bad-example evidence is post-generation only.</text>
    <rect x="792" y="304" width="272" height="67" rx="14" fill="#F7DEE2" stroke="#B95767" stroke-width="1.5"/>
    <text x="808" y="328" font-size="13" font-weight="700" fill="#B95767">09</text><text x="838" y="338" font-size="17" font-weight="700" fill="#241D2B">Repair at owning mechanism</text>
    <text x="808" y="358" font-size="13" fill="#62556D">Rewrite locally or regenerate upstream.</text>
    <rect x="792" y="385" width="130" height="88" rx="14" fill="#F9DDE9" stroke="#D6679A" stroke-width="1.5"/>
    <text x="808" y="409" font-size="13" font-weight="700" fill="#D6679A">10</text><text x="808" y="436" font-size="16" font-weight="700" fill="#241D2B">Reader</text><text x="808" y="456" font-size="16" font-weight="700" fill="#241D2B">Engagement</text>
    <rect x="934" y="385" width="130" height="88" rx="14" fill="#F9DDE9" stroke="#D6679A" stroke-width="1.5"/>
    <text x="950" y="409" font-size="13" font-weight="700" fill="#D6679A">11</text><text x="950" y="436" font-size="16" font-weight="700" fill="#241D2B">Continuity</text><text x="950" y="456" font-size="16" font-weight="700" fill="#241D2B">Audit</text>
  </g>

  <!-- release -->
  <rect x="1136" y="190" width="206" height="338" rx="22" fill="#F7FCFA" stroke="#B9DFC F"/>
  <rect x="1162" y="274" width="154" height="148" rx="22" fill="#DCF1E7" stroke="#4D9B7D" stroke-width="2"/>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="1182" y="305" font-size="13" font-weight="700" fill="#4D9B7D">12</text>
    <text x="1182" y="339" font-size="18" font-weight="750" fill="#241D2B">USER-VISIBLE</text>
    <text x="1182" y="363" font-size="18" font-weight="750" fill="#241D2B">GATE</text>
    <text x="1182" y="393" font-size="13" fill="#3C3245">Only after mandatory</text>
    <text x="1182" y="411" font-size="13" fill="#3C3245">quality gates resolve.</text>
  </g>

  <!-- primary connectors -->
  <path d="M418 359 H454" fill="none" stroke="#796BC4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M718 359 H754" fill="none" stroke="#796BC4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1088 359 H1122" fill="none" stroke="#796BC4" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- failure routing -->
  <rect x="58" y="570" width="1284" height="132" rx="22" fill="#F8F5FA" stroke="#E2DAE8"/>
  <text x="82" y="603" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#B95767">FAILURE ROUTING · REPAIR THE OWNER, NOT THE SYMPTOM</text>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#241D2B">
    <rect x="82" y="622" width="277" height="52" rx="13" fill="#FFFDFC" stroke="#D6679A"/>
    <text x="98" y="645" font-weight="700">Isolated surface defect</text><text x="98" y="664" fill="#62556D">local rewrite</text>
    <rect x="375" y="622" width="277" height="52" rx="13" fill="#FFFDFC" stroke="#D6679A"/>
    <text x="391" y="645" font-weight="700">Surface cluster</text><text x="391" y="664" fill="#62556D">whole-scene regeneration</text>
    <rect x="668" y="622" width="300" height="52" rx="13" fill="#FFFDFC" stroke="#D6679A"/>
    <text x="684" y="645" font-weight="700">SAFE-BUT-FLAT / grip failure</text><text x="684" y="664" fill="#62556D">Reader Pressure + Scene Simulation</text>
    <rect x="984" y="622" width="334" height="52" rx="13" fill="#FFFDFC" stroke="#796BC4"/>
    <text x="1000" y="645" font-weight="700">Character or story failure</text><text x="1000" y="664" fill="#62556D">Character Simulation or Story / Plan</text>
  </g>
  <path d="M928 570 C928 546 928 534 928 514" fill="none" stroke="#B95767" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#returnArrow)"/>
</svg>
