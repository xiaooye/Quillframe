<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 980" role="img" data-doc-tier="A"><title>NovelForge production pipeline</title><desc>Four-stage chapter production with freeze/simulation, internal candidate, diagnosis/evolution, release gate, and ownership-based failure routing.</desc><style>
text{font-family:"Noto Sans CJK SC","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#241D2B}
.eyebrow{font-size:22px;font-weight:800;letter-spacing:1.6px;fill:#62556D}
.title{font-size:34px;font-weight:850;letter-spacing:-.4px}
.subtitle{font-size:23px;font-weight:500;fill:#62556D}
.section{font-size:24px;font-weight:850}
.lead{font-size:22px;font-weight:750}
.body{font-size:22px;font-weight:650}
.small{font-size:21px;font-weight:500;fill:#62556D}
.pill{font-size:20px;font-weight:800}
.num{font-size:21px;font-weight:850}
</style><rect width="800" height="980" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="798" height="978" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/><text x="42" y="54" class="eyebrow" text-anchor="start">PRODUCTION RUN</text><text x="42" y="94" class="title" text-anchor="start" data-max-width="720">A chapter evolves through gates</text><text x="42" y="130" class="title" text-anchor="start">not one model call</text><text x="42" y="164" class="subtitle" text-anchor="start" data-max-width="720">Failure returns to the mechanism that actually owns it.</text><rect x="42" y="202" width="344" height="254" rx="22" fill="#DDEFF8" stroke="#4F8FBA" stroke-width="2.2"/><circle cx="70" cy="232" r="18" fill="#FFFDFC" stroke="#4F8FBA" stroke-width="2"/><text x="70" y="239" class="num" text-anchor="middle">01</text><text x="98" y="240" class="section" text-anchor="start">FREEZE + SIMULATE</text><circle cx="68" cy="284" r="4" fill="#4F8FBA"/><text x="82" y="290" class="body">Sparse context</text><circle cx="68" cy="317" r="4" fill="#4F8FBA"/><text x="82" y="323" class="body">Story + Canon preflight</text><circle cx="68" cy="350" r="4" fill="#4F8FBA"/><text x="82" y="356" class="body">Character agendas</text><circle cx="68" cy="383" r="4" fill="#4F8FBA"/><text x="82" y="389" class="body">Scene resolution</text><circle cx="68" cy="416" r="4" fill="#4F8FBA"/><text x="82" y="422" class="body">Reader pressure</text><rect x="414" y="202" width="344" height="254" rx="22" fill="#F9DDE9" stroke="#D6679A" stroke-width="2.2"/><circle cx="442" cy="232" r="18" fill="#FFFDFC" stroke="#D6679A" stroke-width="2"/><text x="442" y="239" class="num" text-anchor="middle">02</text><text x="470" y="240" class="section">INTERNAL CANDIDATE</text><circle cx="440" cy="284" r="4" fill="#D6679A"/><text x="454" y="290" class="body">Event-first Raw Draft</text><circle cx="440" cy="317" r="4" fill="#D6679A"/><text x="454" y="323" class="body">Surface realization</text><circle cx="440" cy="350" r="4" fill="#D6679A"/><text x="454" y="356" class="body">Regression after freeze</text><circle cx="440" cy="383" r="4" fill="#D6679A"/><text x="454" y="389" class="body">Never user-visible yet</text><rect x="42" y="500" width="344" height="254" rx="22" fill="#E7E1F8" stroke="#796BC4" stroke-width="2.2"/><circle cx="70" cy="530" r="18" fill="#FFFDFC" stroke="#796BC4" stroke-width="2"/><text x="70" y="537" class="num" text-anchor="middle">03</text><text x="98" y="538" class="section">DIAGNOSE + EVOLVE</text><circle cx="68" cy="582" r="4" fill="#796BC4"/><text x="82" y="588" class="body">Quality findings</text><circle cx="68" cy="615" r="4" fill="#796BC4"/><text x="82" y="621" class="body">Revision diagnosis</text><circle cx="68" cy="648" r="4" fill="#796BC4"/><text x="82" y="654" class="body">Repair owning layer</text><circle cx="68" cy="681" r="4" fill="#796BC4"/><text x="82" y="687" class="body">Candidate comparison</text><circle cx="68" cy="714" r="4" fill="#796BC4"/><text x="82" y="720" class="body">Stop at plateau</text><rect x="414" y="500" width="344" height="254" rx="22" fill="#DCF1E7" stroke="#4D9B7D" stroke-width="2.2"/><circle cx="442" cy="530" r="18" fill="#FFFDFC" stroke="#4D9B7D" stroke-width="2"/><text x="442" y="537" class="num" text-anchor="middle">04</text><text x="470" y="538" class="section">RELEASE GATE</text><circle cx="440" cy="582" r="4" fill="#4D9B7D"/><text x="454" y="588" class="body">Reader engagement</text><circle cx="440" cy="615" r="4" fill="#4D9B7D"/><text x="454" y="621" class="body">Commitment audit</text><circle cx="440" cy="648" r="4" fill="#4D9B7D"/><text x="454" y="654" class="body">State + authority audit</text><circle cx="440" cy="681" r="4" fill="#4D9B7D"/><text x="454" y="687" class="body">Review Draft gate</text><circle cx="440" cy="714" r="4" fill="#4D9B7D"/><text x="454" y="720" class="body">Settle after acceptance</text><line x1="386" y1="329" x2="414" y2="329" stroke="#62556D" stroke-width="3" stroke-linecap="round"/><line x1="586" y1="456" x2="586" y2="500" stroke="#62556D" stroke-width="3" stroke-linecap="round"/><line x1="386" y1="627" x2="414" y2="627" stroke="#62556D" stroke-width="3" stroke-linecap="round"/><circle cx="400" cy="329" r="6" fill="#D6679A"/><circle cx="586" cy="478" r="6" fill="#796BC4"/><circle cx="400" cy="627" r="6" fill="#4D9B7D"/><rect x="42" y="786" width="716" height="166" rx="20" fill="#F8F5FA" stroke="#E2DAE8" stroke-width="1.6"/><text x="66" y="822" class="eyebrow">FAILURE ROUTING</text><rect x="66" y="842" width="155" height="58" rx="16" fill="#FFFDFC" stroke="#D6679A" stroke-width="1.6"/><rect x="232" y="842" width="155" height="58" rx="16" fill="#FFFDFC" stroke="#796BC4" stroke-width="1.6"/><rect x="398" y="842" width="155" height="58" rx="16" fill="#FFFDFC" stroke="#796BC4" stroke-width="1.6"/><rect x="564" y="842" width="170" height="58" rx="16" fill="#FFFDFC" stroke="#B95767" stroke-width="1.6"/><text x="143" y="866" class="pill" text-anchor="middle">SURFACE</text><text x="143" y="891" class="small" text-anchor="middle">rewrite</text><text x="309" y="866" class="pill" text-anchor="middle">FLAT</text><text x="309" y="891" class="small" text-anchor="middle">resimulate</text><text x="475" y="866" class="pill" text-anchor="middle">CHARACTER</text><text x="475" y="891" class="small" text-anchor="middle">agenda</text><text x="649" y="866" class="pill" text-anchor="middle">STORY</text><text x="649" y="891" class="small" text-anchor="middle">plan</text><text x="66" y="932" class="small" data-max-width="650">Semantic reject means repair; reviewer switching does not.</text></svg>