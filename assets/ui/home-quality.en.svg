<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">NovelForge quality assurance stack</title><desc id="desc">A six-stage quality pipeline showing deterministic checks, surface quality, reader engagement, independent semantic review, continuity, and user-visible gate, with failure routing.</desc>
<rect width="1200" height="620" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="1198" height="618" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/>
<text x="52" y="62" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#D6679A" letter-spacing="2">QUALITY &amp; QA</text>
<text x="52" y="108" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="750" fill="#241D2B">Quality is a gate stack, not one “critic” prompt</text>
<text x="52" y="141" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" fill="#62556D">Each failure routes back to the mechanism that owns it. Surface polish cannot hide story, character, reader-grip, or continuity failures.</text>
<g transform="translate(52 190)">
<g><rect width="166" height="142" rx="20" fill="#F7FCFF" stroke="#B8D9EC"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#4F8FBA">01 · DETERMINISTIC</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">Contracts</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">schema · lifecycle</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">authority · fingerprint</text></g>
<g transform="translate(184 0)"><rect width="166" height="142" rx="20" fill="#FFFAFC" stroke="#EDC3D6"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#D6679A">02 · SURFACE</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">Prose Floor</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">AI-ish patterns</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">malformed realization</text></g>
<g transform="translate(368 0)"><rect width="166" height="142" rx="20" fill="#FFFAFC" stroke="#EDC3D6"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#D6679A">03 · READER</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">Engagement</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">pressure · reward</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">causality · forward pull</text></g>
<g transform="translate(552 0)"><rect width="166" height="142" rx="20" fill="#FAF8FF" stroke="#CFC7EE"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#796BC4">04 · INDEPENDENT</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">Semantic Review</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">fresh invocation</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">fingerprint-bound</text></g>
<g transform="translate(736 0)"><rect width="166" height="142" rx="20" fill="#FFFCF5" stroke="#E8D2A5"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#BE892F">05 · CONTINUITY</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">State Audit</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">knowledge · location</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">obligation · aftermath</text></g>
<g transform="translate(920 0)"><rect width="176" height="142" rx="20" fill="#F2FBF7" stroke="#9FCDBB" stroke-width="2"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#4D9B7D">06 · USER-VISIBLE</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">Gate</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">only after required</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">gates are resolved</text></g>
</g>
<g transform="translate(52 372)"><rect width="1096" height="168" rx="22" fill="#F8F5FA" stroke="#E2DAE8"/><text x="24" y="34" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="750" fill="#241D2B">FAILURE ROUTING</text>
<g transform="translate(24 56)"><rect width="238" height="78" rx="14" fill="#FFFDFC" stroke="#E2DAE8"/><text x="16" y="29" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#D6679A">Surface cluster</text><text x="16" y="54" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">→ regenerate the scene</text></g>
<g transform="translate(282 56)"><rect width="238" height="78" rx="14" fill="#FFFDFC" stroke="#E2DAE8"/><text x="16" y="29" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#D6679A">Safe but flat</text><text x="16" y="54" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">→ reader pressure + simulation</text></g>
<g transform="translate(540 56)"><rect width="238" height="78" rx="14" fill="#FFFDFC" stroke="#E2DAE8"/><text x="16" y="29" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#796BC4">Character failure</text><text x="16" y="54" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">→ character simulation</text></g>
<g transform="translate(798 56)"><rect width="274" height="78" rx="14" fill="#FFFDFC" stroke="#E2DAE8"/><text x="16" y="29" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#BE892F">Story / continuity failure</text><text x="16" y="54" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">→ story plan / state repair</text></g></g>
<text x="52" y="584" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Normal CI verifies deterministic contracts and blind-queue hygiene; semantic gates require a real eligible model invocation or human reviewer.</text>
</svg>