<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" data-doc-tier="A"><title>NovelForge quality system</title><desc>Four-part quality model separating deterministic QA, semantic QA, evidence-backed quality evolution, and independent fingerprint-bound review.</desc><style>
text{font-family:"Noto Sans CJK SC","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#241D2B}
.eyebrow{font-size:22px;font-weight:800;letter-spacing:1.5px;fill:#62556D}
.title{font-size:34px;font-weight:850;letter-spacing:-.4px}
.subtitle{font-size:23px;font-weight:500;fill:#62556D}
.section{font-size:24px;font-weight:850}
.lead{font-size:22px;font-weight:750}
.body{font-size:22px;font-weight:650}
.small{font-size:21px;font-weight:500;fill:#62556D}
.pill{font-size:20px;font-weight:800}
</style><rect width="800" height="900" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="798" height="898" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/><text x="42" y="54" class="eyebrow" text-anchor="start">QUALITY SYSTEM</text><text x="42" y="94" class="title" text-anchor="start">Quality is diagnosis</text><text x="42" y="130" class="title" text-anchor="start">not one score</text><text x="42" y="164" class="subtitle" text-anchor="start" data-max-width="720">Different evidence answers different questions.</text><rect x="42" y="202" width="344" height="240" rx="22" fill="#E7E1F8" stroke="#796BC4" stroke-width="2.2"/><rect x="414" y="202" width="344" height="240" rx="22" fill="#F9DDE9" stroke="#D6679A" stroke-width="2.2"/><rect x="42" y="480" width="344" height="240" rx="22" fill="#F9EDCF" stroke="#BE892F" stroke-width="2.2"/><rect x="414" y="480" width="344" height="240" rx="22" fill="#DCF1E7" stroke="#4D9B7D" stroke-width="2.2"/><text x="66" y="242" class="section" text-anchor="start">DETERMINISTIC QA</text><text x="66" y="278" class="lead" text-anchor="start">Machine-provable facts</text><line x1="66" y1="296" x2="360" y2="296" stroke="#796BC4" stroke-width="1.5" stroke-linecap="round"/><text x="66" y="330" class="body" text-anchor="start">Schema + lifecycle</text><text x="66" y="364" class="body" text-anchor="start">Authority + permissions</text><text x="66" y="398" class="body" text-anchor="start" data-max-width="320">Fingerprint + consume-once</text><text x="66" y="432" class="body" text-anchor="start">Rights + provenance</text><text x="438" y="242" class="section" text-anchor="start">SEMANTIC QA</text><text x="438" y="278" class="lead" text-anchor="start" data-max-width="320">Questions that need reading</text><line x1="438" y1="296" x2="732" y2="296" stroke="#D6679A" stroke-width="1.5" stroke-linecap="round"/><text x="438" y="330" class="body" text-anchor="start">Reader reaction</text><text x="438" y="364" class="body" text-anchor="start">Character integrity</text><text x="438" y="398" class="body" text-anchor="start">Revision diagnosis</text><text x="438" y="432" class="body" text-anchor="start">Candidate comparison</text><text x="66" y="520" class="section" text-anchor="start">QUALITY EVOLUTION</text><text x="66" y="556" class="lead" text-anchor="start" data-max-width="320">Improve only with evidence</text><line x1="66" y1="574" x2="360" y2="574" stroke="#BE892F" stroke-width="1.5" stroke-linecap="round"/><text x="66" y="608" class="body" text-anchor="start">Findings ledger</text><text x="66" y="642" class="body" text-anchor="start">Candidate lineage</text><text x="66" y="676" class="body" text-anchor="start">Incumbent / challenger</text><text x="66" y="710" class="body" text-anchor="start" data-max-width="660">Plateau can stop revision</text><text x="438" y="520" class="section" text-anchor="start">INDEPENDENT GATE</text><text x="438" y="556" class="lead" text-anchor="start" data-max-width="320">Fresh independent run</text><line x1="438" y1="574" x2="732" y2="574" stroke="#4D9B7D" stroke-width="1.5" stroke-linecap="round"/><text x="438" y="608" class="body" text-anchor="start" data-max-width="320">Exact artifact fingerprint</text><text x="438" y="642" class="body" text-anchor="start" data-max-width="320">Bounded context + rubric</text><text x="438" y="676" class="body" text-anchor="start">Typed result</text><text x="438" y="710" class="body" text-anchor="start">Reject routes repair</text><rect x="42" y="758" width="716" height="104" rx="20" fill="#F8F5FA" stroke="#E2DAE8" stroke-width="1.6"/><text x="66" y="794" class="eyebrow" text-anchor="start">CORE RULE</text><text x="66" y="830" class="small" text-anchor="start" data-max-width="680">Code proves invariants. Models interpret. Projects own Canon.</text></svg>