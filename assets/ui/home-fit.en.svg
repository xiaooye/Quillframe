<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 812" role="img" data-doc-tier="A"><title>Quillframe honest fit</title><desc>Honest fit guide showing when Quillframe is strong, when a lighter tool may be better, and the tradeoffs accepted.</desc><style>
text{font-family:"Noto Sans CJK SC","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#241D2B}
.eyebrow{font-size:22px;font-weight:800;letter-spacing:1.5px;fill:#62556D}
.title{font-size:34px;font-weight:850;letter-spacing:-.4px}
.subtitle{font-size:23px;font-weight:500;fill:#62556D}
.section{font-size:24px;font-weight:850}
.lead{font-size:22px;font-weight:750}
.body{font-size:22px;font-weight:650}
.small{font-size:21px;font-weight:500;fill:#62556D}
.pill{font-size:20px;font-weight:800}
</style><rect width="800" height="812" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="798" height="810" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/><text x="42" y="54" class="eyebrow" text-anchor="start">HONEST FIT</text><text x="42" y="94" class="title" text-anchor="start" data-max-width="720">Use Quillframe when the project</text><text x="42" y="130" class="title" text-anchor="start" data-max-width="720">is complex enough to need it</text><text x="42" y="164" class="subtitle" text-anchor="start" data-max-width="720">Trades simplicity for authority, recovery, and auditability.</text><rect x="42" y="202" width="344" height="330" rx="22" fill="#DCF1E7" stroke="#4D9B7D" stroke-width="2.2"/><rect x="414" y="202" width="344" height="330" rx="22" fill="#F8F5FA" stroke="#E2DAE8" stroke-width="2.2"/><text x="66" y="244" class="section" text-anchor="start">STRONG FIT</text><text x="66" y="282" class="lead" text-anchor="start" data-max-width="320">Long-lived fiction systems</text><line x1="66" y1="300" x2="360" y2="300" stroke="#4D9B7D" stroke-width="1.5" stroke-linecap="round"/><circle cx="68" cy="332" r="4" fill="#4D9B7D"/><text x="82" y="338" class="body" text-anchor="start" data-max-width="320">Many chapters / sessions</text><circle cx="68" cy="366" r="4" fill="#4D9B7D"/><text x="82" y="372" class="body" text-anchor="start">Strict Canon boundaries</text><circle cx="68" cy="400" r="4" fill="#4D9B7D"/><text x="82" y="406" class="body" text-anchor="start" data-max-width="320">Several models or runtimes</text><circle cx="68" cy="434" r="4" fill="#4D9B7D"/><text x="82" y="440" class="body" text-anchor="start">Audited semantic QA</text><circle cx="68" cy="468" r="4" fill="#4D9B7D"/><text x="82" y="474" class="body" text-anchor="start" data-max-width="320">Context / memory control</text><circle cx="68" cy="502" r="4" fill="#4D9B7D"/><text x="82" y="508" class="body" text-anchor="start" data-max-width="320">Evidence-backed learning</text><text x="438" y="244" class="section" text-anchor="start">LIGHTER TOOL MAY WIN</text><text x="438" y="282" class="lead" text-anchor="start" data-max-width="320">Governance is secondary</text><line x1="438" y1="300" x2="732" y2="300" stroke="#62556D" stroke-width="1.5" stroke-linecap="round"/><circle cx="440" cy="332" r="4" fill="#62556D"/><text x="454" y="338" class="body" text-anchor="start">Quick ideation</text><circle cx="440" cy="366" r="4" fill="#62556D"/><text x="454" y="372" class="body" text-anchor="start">Short one-off fiction</text><circle cx="440" cy="400" r="4" fill="#62556D"/><text x="454" y="406" class="body" text-anchor="start" data-max-width="320">Line editing / polishing</text><circle cx="440" cy="434" r="4" fill="#62556D"/><text x="454" y="440" class="body" text-anchor="start">Consumer editor UX</text><circle cx="440" cy="468" r="4" fill="#62556D"/><text x="454" y="474" class="body" text-anchor="start">Export-first workflow</text><circle cx="440" cy="502" r="4" fill="#62556D"/><text x="454" y="508" class="body" text-anchor="start">Minimal setup</text><rect x="42" y="570" width="716" height="206" rx="22" fill="#F9EDCF" stroke="#BE892F" stroke-width="2.0"/><text x="66" y="610" class="section" text-anchor="start">TRADEOFFS YOU ACCEPT</text><circle cx="68" cy="648" r="4" fill="#BE892F"/><text x="82" y="654" class="body" text-anchor="start">More ceremony</text><circle cx="398" cy="648" r="4" fill="#BE892F"/><text x="412" y="654" class="body" text-anchor="start">Semantic review costs</text><circle cx="68" cy="688" r="4" fill="#BE892F"/><text x="82" y="694" class="body" text-anchor="start">Smaller ecosystem</text><circle cx="398" cy="688" r="4" fill="#BE892F"/><text x="412" y="694" class="body" text-anchor="start">Not a managed SaaS</text><circle cx="68" cy="728" r="4" fill="#BE892F"/><text x="82" y="734" class="body" text-anchor="start">Publishing UX not focus</text><circle cx="398" cy="728" r="4" fill="#BE892F"/><text x="412" y="734" class="body" text-anchor="start">More setup discipline</text><text x="66" y="762" class="small" text-anchor="start" data-max-width="650">The extra structure should earn its keep.</text></svg>