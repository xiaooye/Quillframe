<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">NovelForge fit and tradeoffs</title><desc id="desc">Two-column panel showing when NovelForge is a strong fit and when a lighter fiction tool is a better choice.</desc><rect width="1200" height="510" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="1198" height="508" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/><text x="52" y="60" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#4D9B7D" letter-spacing="2">HONEST FIT</text><text x="52" y="106" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="750" fill="#241D2B">NovelForge is deliberately not the lightest option</text><text x="52" y="139" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" fill="#62556D">Its extra ceremony pays off only when long-running fiction state and quality are genuinely hard.</text><g transform="translate(52 185)"><rect width="526" height="250" rx="22" fill="#F2FBF7" stroke="#B7DEC9"/><text x="26" y="39" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="750" fill="#4D9B7D">Use NovelForge when…</text><text x="26" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">✓ the novel spans many chapters, sessions, or models</text><text x="26" y="110" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">✓ plan, review, memory, research, and Canon must stay distinct</text><text x="26" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">✓ character knowledge/agenda drift is a serious failure mode</text><text x="26" y="174" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">✓ semantic review must be genuinely independent</text><text x="26" y="206" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">✓ reader grip matters separately from clean prose</text><text x="26" y="232" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">✓ the project must resume, migrate, audit, and learn safely</text></g><g transform="translate(622 185)"><rect width="526" height="250" rx="22" fill="#FFF7F9" stroke="#F0CCD9"/><text x="26" y="39" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="750" fill="#D6679A">Choose something lighter when…</text><text x="26" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">→ you mainly want fast drafting or prose assistance</text><text x="26" y="110" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">→ the project is short enough to manage manually</text><text x="26" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">→ one trusted model/session is sufficient</text><text x="26" y="174" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">→ you want a polished consumer editor more than framework control</text><text x="26" y="206" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">→ publishing, formatting, or marketing is the primary problem</text><text x="26" y="232" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#241D2B">→ explicit gates/fingerprints would be needless overhead</text></g><text x="52" y="475" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">The tradeoff is intentional: more governance and reproducibility in exchange for more setup and runtime ceremony.</text></svg>