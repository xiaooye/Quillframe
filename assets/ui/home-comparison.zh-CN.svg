<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">NovelForge 与主流智能体框架的定位对比</title><desc id="desc">四张对比卡片展示 LangGraph、CrewAI、AutoGen 和 OpenAI Agents SDK 的主要优势，以及 NovelForge 在小说生产层增加的机制。</desc>
<rect width="1200" height="660" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="1198" height="658" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/>
<text x="52" y="62" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#796BC4" letter-spacing="2">为什么是 NOVELFORGE</text>
<text x="52" y="108" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="750" fill="#241D2B">站在通用智能体编排之上，再解决小说自己的难题</text>
<text x="52" y="141" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#62556D">通用框架解决运行时与编排；NovelForge 专注于正典权威、人物边界、读者质量与长期故事状态。</text>
<g transform="translate(52 184)"><rect width="1096" height="92" rx="18" fill="#F7FCFF" stroke="#B8D9EC"/><text x="24" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="750" fill="#241D2B">LangGraph</text><text x="24" y="63" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#4F8FBA">持久、有状态的工作流编排</text><path d="M275 46H358" stroke="#4F8FBA" stroke-width="2" stroke-dasharray="5 6"/><path d="M350 40l10 6-10 6" fill="none" stroke="#4F8FBA" stroke-width="2"/><text x="390" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#241D2B">NovelForge 额外提供小说权威边界</text><text x="390" y="62" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#62556D">正典生命周期 · 人物知识边界 · 读者质量门槛 · 正典结算</text></g>
<g transform="translate(52 292)"><rect width="1096" height="92" rx="18" fill="#FAF8FF" stroke="#CFC7EE"/><text x="24" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="750" fill="#241D2B">CrewAI</text><text x="24" y="63" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#796BC4">智能体团队 + 自动化流程</text><path d="M275 46H358" stroke="#796BC4" stroke-width="2" stroke-dasharray="5 6"/><path d="M350 40l10 6-10 6" fill="none" stroke="#796BC4" stroke-width="2"/><text x="390" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#241D2B">NovelForge 默认单管理器，而不是智能体圆桌</text><text x="390" y="62" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#62556D">只有为隔离、能力或真正独立判断服务时，才增加专门执行器</text></g>
<g transform="translate(52 400)"><rect width="1096" height="92" rx="18" fill="#FFFAFC" stroke="#EDC3D6"/><text x="24" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="750" fill="#241D2B">AutoGen</text><text x="24" y="63" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#D6679A">通用多智能体协作</text><path d="M275 46H358" stroke="#D6679A" stroke-width="2" stroke-dasharray="5 6"/><path d="M350 40l10 6-10 6" fill="none" stroke="#D6679A" stroke-width="2"/><text x="390" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#241D2B">NovelForge 把审阅独立性写成硬契约</text><text x="390" y="62" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#62556D">独立调用 · 有界上下文 · 内容指纹绑定 · 禁止挑审阅者直到通过</text></g>
<g transform="translate(52 508)"><rect width="1096" height="92" rx="18" fill="#FFFCF5" stroke="#E8D2A5"/><text x="24" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="750" fill="#241D2B">OpenAI Agents SDK</text><text x="24" y="63" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#BE892F">轻量智能体 · 工具 · 交接 · 追踪</text><path d="M275 46H358" stroke="#BE892F" stroke-width="2" stroke-dasharray="5 6"/><path d="M350 40l10 6-10 6" fill="none" stroke="#BE892F" stroke-width="2"/><text x="390" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#241D2B">NovelForge 在运行时之上增加完整小说生产契约</text><text x="390" y="62" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#62556D">项目锁定 · 正典 · 文本 QA · 读者 QA · 连贯性 · 证据学习</text></g>
<text x="52" y="632" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">对比快照：2026-08-14 · NovelForge 更专用，不代表处处更强。真正该选的是最匹配你核心难题的框架。</text>
</svg>