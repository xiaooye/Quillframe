<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1190" role="img" data-doc-tier="A"><title>Quillframe direct fiction-system comparison</title><desc>Evidence-led mechanism comparison of Quillframe, NovelClaw, Novel OS, AuthorAgent, and autonovel.</desc><style>text{font-family:"Noto Sans CJK SC","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#241D2B}.eyebrow{font-size:22px;font-weight:800;letter-spacing:1.5px;fill:#62556D}.title{font-size:34px;font-weight:850;letter-spacing:-.4px}.subtitle{font-size:22px;font-weight:500;fill:#62556D}.panel{font-size:23px;font-weight:850}.prod{font-size:19px;font-weight:850}.row{font-size:20px;font-weight:650}.note{font-size:19px;font-weight:500;fill:#62556D}.symbol{font-size:27px;font-weight:900}.position{font-size:20px;font-weight:750}</style><rect width="800" height="1190" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="798" height="1188" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/><text x="42" y="54" class="eyebrow" text-anchor="start">直接小说系统对比</text><text x="42" y="94" class="title" text-anchor="start" data-max-width="720">比较公开机制，不做营销式打分</text><text x="42" y="130" class="subtitle" text-anchor="start" data-max-width="720">公开文档能确认“写明了什么”，不能证明“绝对没有什么”。</text><rect x="42" y="170" width="716" height="350" rx="22" fill="#FFFDFC" stroke="#E2DAE8" stroke-width="1.7"/><text x="66" y="208" class="panel" text-anchor="start" data-max-width="650">长篇状态与作者工作区</text><line x1="66" y1="228" x2="734" y2="228" stroke="#E2DAE8" stroke-width="1.3"/><rect x="340" y="242" width="128" height="48" rx="14" fill="#DDEFF8" stroke="#4F8FBA" stroke-width="1.4"/><text x="404" y="273" class="prod" text-anchor="middle" data-max-width="120">Quillframe</text><rect x="476" y="242" width="128" height="48" rx="14" fill="#F8F5FA" stroke="#E2DAE8" stroke-width="1.4"/><text x="540" y="273" class="prod" text-anchor="middle" data-max-width="120">NovelClaw</text><rect x="612" y="242" width="128" height="48" rx="14" fill="#E7E1F8" stroke="#796BC4" stroke-width="1.4"/><text x="676" y="273" class="prod" text-anchor="middle" data-max-width="120">Novel OS</text><text x="66" y="328" class="row" text-anchor="start" data-max-width="255">持久项目 / 故事状态</text><text x="404" y="328" class="symbol" text-anchor="middle">●</text><text x="540" y="328" class="symbol" text-anchor="middle">●</text><text x="676" y="328" class="symbol" text-anchor="middle">●</text><line x1="66" y1="347" x2="734" y2="347" stroke="#EEE8F1" stroke-width="1"/><text x="66" y="372" class="row" text-anchor="start" data-max-width="255">可编辑的记忆控制</text><text x="404" y="372" class="symbol" text-anchor="middle">●</text><text x="540" y="372" class="symbol" text-anchor="middle">●</text><text x="676" y="372" class="symbol" text-anchor="middle">◐</text><line x1="66" y1="391" x2="734" y2="391" stroke="#EEE8F1" stroke-width="1"/><text x="66" y="416" class="row" text-anchor="start" data-max-width="255">运行 / 会话可检查性</text><text x="404" y="416" class="symbol" text-anchor="middle">●</text><text x="540" y="416" class="symbol" text-anchor="middle">●</text><text x="676" y="416" class="symbol" text-anchor="middle">●</text><line x1="66" y1="435" x2="734" y2="435" stroke="#EEE8F1" stroke-width="1"/><text x="66" y="460" class="row" text-anchor="start" data-max-width="255">确定性 + 语义 QA</text><text x="404" y="460" class="symbol" text-anchor="middle">●</text><text x="540" y="460" class="symbol" text-anchor="middle">○</text><text x="676" y="460" class="symbol" text-anchor="middle">●</text><line x1="66" y1="479" x2="734" y2="479" stroke="#EEE8F1" stroke-width="1"/><text x="66" y="504" class="row" text-anchor="start" data-max-width="255">显式正典权威等级</text><text x="404" y="504" class="symbol" text-anchor="middle">●</text><text x="540" y="504" class="symbol" text-anchor="middle">○</text><text x="676" y="504" class="symbol" text-anchor="middle">○</text><rect x="42" y="538" width="716" height="112" rx="18" fill="#F8F5FA" stroke="#E2DAE8" stroke-width="1.4"/><text x="66" y="570" class="position" text-anchor="start" data-max-width="650">Quillframe：权威治理 + 可恢复执行</text><text x="66" y="600" class="note" text-anchor="start" data-max-width="650">NovelClaw：面向作者的工作区控制</text><text x="66" y="630" class="note" text-anchor="start" data-max-width="650">Novel OS：紧凑的编辑 Agent 流水线</text><rect x="42" y="674" width="716" height="394" rx="22" fill="#FFFDFC" stroke="#E2DAE8" stroke-width="1.7"/><text x="66" y="712" class="panel" text-anchor="start" data-max-width="650">质量演化与出版能力</text><line x1="66" y1="732" x2="734" y2="732" stroke="#E2DAE8" stroke-width="1.3"/><rect x="340" y="746" width="128" height="48" rx="14" fill="#DDEFF8" stroke="#4F8FBA" stroke-width="1.4"/><text x="404" y="777" class="prod" text-anchor="middle" data-max-width="120">Quillframe</text><rect x="476" y="746" width="128" height="48" rx="14" fill="#F9DDE9" stroke="#D6679A" stroke-width="1.4"/><text x="540" y="777" class="prod" text-anchor="middle" data-max-width="120">AuthorAgent</text><rect x="612" y="746" width="128" height="48" rx="14" fill="#F9EDCF" stroke="#BE892F" stroke-width="1.4"/><text x="676" y="777" class="prod" text-anchor="middle" data-max-width="120">autonovel</text><text x="66" y="832" class="row" text-anchor="start" data-max-width="255">人物专属诊断</text><text x="404" y="832" class="symbol" text-anchor="middle">●</text><text x="540" y="832" class="symbol" text-anchor="middle">●</text><text x="676" y="832" class="symbol" text-anchor="middle">◐</text><line x1="66" y1="851" x2="734" y2="851" stroke="#EEE8F1" stroke-width="1"/><text x="66" y="876" class="row" text-anchor="start" data-max-width="255">读者面板 / 反应证据</text><text x="404" y="876" class="symbol" text-anchor="middle">●</text><text x="540" y="876" class="symbol" text-anchor="middle">●</text><text x="676" y="876" class="symbol" text-anchor="middle">●</text><line x1="66" y1="895" x2="734" y2="895" stroke="#EEE8F1" stroke-width="1"/><text x="66" y="920" class="row" text-anchor="start" data-max-width="255">候选稿语义成对比较</text><text x="404" y="920" class="symbol" text-anchor="middle">●</text><text x="540" y="920" class="symbol" text-anchor="middle">●</text><text x="676" y="920" class="symbol" text-anchor="middle">●</text><line x1="66" y1="939" x2="734" y2="939" stroke="#EEE8F1" stroke-width="1"/><text x="66" y="964" class="row" text-anchor="start" data-max-width="255">绑定指纹的独立审查</text><text x="404" y="964" class="symbol" text-anchor="middle">●</text><text x="540" y="964" class="symbol" text-anchor="middle">○</text><text x="676" y="964" class="symbol" text-anchor="middle">○</text><line x1="66" y1="983" x2="734" y2="983" stroke="#EEE8F1" stroke-width="1"/><text x="66" y="1008" class="row" text-anchor="start" data-max-width="255">出版与导出套件</text><text x="404" y="1008" class="symbol" text-anchor="middle">○</text><text x="540" y="1008" class="symbol" text-anchor="middle">●</text><text x="676" y="1008" class="symbol" text-anchor="middle">●</text><line x1="66" y1="1027" x2="734" y2="1027" stroke="#EEE8F1" stroke-width="1"/><text x="66" y="1052" class="row" text-anchor="start" data-max-width="255">证据驱动的持久学习</text><text x="404" y="1052" class="symbol" text-anchor="middle">●</text><text x="540" y="1052" class="symbol" text-anchor="middle">●</text><text x="676" y="1052" class="symbol" text-anchor="middle">○</text><rect x="42" y="1086" width="716" height="56" rx="16" fill="#F8F5FA" stroke="#E2DAE8" stroke-width="1.3"/><text x="66" y="1122" class="note" text-anchor="start" data-max-width="670">● 明确描述   ◐ 邻近机制 / 范围更窄   ○ 暂未从公开文档确认</text><text x="42" y="1172" class="note" text-anchor="start" data-max-width="720">基于 2026 年 8 月公开项目文档。○ 只代表“未确认”，绝不代表“没有”。</text></svg>