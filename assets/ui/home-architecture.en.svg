.num{font-size:21px;font-weight:850}
</style><rect width="800" height="890" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="798" height="888" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/><text x="42" y="54" class="eyebrow" text-anchor="start">SYSTEM MAP</text><text x="42" y="94" class="title" text-anchor="start" data-max-width="720">Story authority stays separate</text><text x="42" y="130" class="title" text-anchor="start" data-max-width="720">from runtime intelligence</text><text x="42" y="164" class="subtitle" text-anchor="start" data-max-width="720">Models judge fiction. Code binds state. Projects own truth.</text><rect x="42" y="202" width="344" height="238" rx="22" fill="#DDEFF8" stroke="#4F8FBA" stroke-width="2.2"/><rect x="414" y="202" width="344" height="238" rx="22" fill="#F9DDE9" stroke="#D6679A" stroke-width="2.2"/><rect x="42" y="478" width="344" height="238" rx="22" fill="#E7E1F8" stroke="#796BC4" stroke-width="2.2"/><rect x="414" y="478" width="344" height="238" rx="22" fill="#F9EDCF" stroke="#BE892F" stroke-width="2.2"/><text x="66" y="242" class="section" text-anchor="start">PROJECT AUTHORITY</text><text x="66" y="278" class="lead" text-anchor="start">Owns story truth</text><line x1="66" y1="296" x2="360" y2="296" stroke="#4F8FBA" stroke-width="1.5" stroke-linecap="round"/><text x="66" y="330" class="body" text-anchor="start">Canon + current state</text><text x="66" y="364" class="body" text-anchor="start">Plans + project profile</text><text x="66" y="398" class="body" text-anchor="start">Research + manuscripts</text><rect x="66" y="418" width="250" height="42" rx="21" fill="#FFFDFC" stroke="#4F8FBA" stroke-width="1.7"/><text x="191.0" y="446" class="pill" text-anchor="middle">ACCEPTED IS NOT PLAN</text><text x="438" y="242" class="section" text-anchor="start">SEMANTIC CONTRACTS</text><text x="438" y="278" class="lead" text-anchor="start">Model-owned judgment</text><line x1="438" y1="296" x2="732" y2="296" stroke="#D6679A" stroke-width="1.5" stroke-linecap="round"/><text x="438" y="330" class="body" text-anchor="start">Small catalog</text><text x="438" y="364" class="body" text-anchor="start">Story + character sim</text><text x="438" y="398" class="body" text-anchor="start">Quality + continuity</text><text x="438" y="432" class="body" text-anchor="start">Learning + research</text><text x="66" y="518" class="section" text-anchor="start">DETERMINISTIC SHELL</text><text x="66" y="554" class="lead" text-anchor="start">Binds execution</text><line x1="66" y1="572" x2="360" y2="572" stroke="#796BC4" stroke-width="1.5" stroke-linecap="round"/><rect x="66" y="592" width="250" height="42" rx="21" fill="#FFFDFC" stroke="#796BC4" stroke-width="1.7"/><text x="191.0" y="620" class="pill" text-anchor="middle">SESSION + CHECKPOINT</text><rect x="66" y="642" width="250" height="42" rx="21" fill="#FFFDFC" stroke="#796BC4" stroke-width="1.7"/><text x="191.0" y="670" class="pill" text-anchor="middle">CAPABILITY + ROUTING</text><rect x="66" y="692" width="250" height="42" rx="21" fill="#FFFDFC" stroke="#796BC4" stroke-width="1.7"/><text x="191.0" y="720" class="pill" text-anchor="middle">FINGERPRINT + RECEIPT</text><text x="438" y="518" class="section" text-anchor="start">EVIDENCE + EVOLUTION</text><text x="438" y="554" class="lead" text-anchor="start">Bounded authority</text><line x1="438" y1="572" x2="732" y2="572" stroke="#BE892F" stroke-width="1.5" stroke-linecap="round"/><text x="438" y="606" class="body" text-anchor="start">Quality findings</text><text x="438" y="640" class="body" text-anchor="start" data-max-width="320">Reader + corpus evidence</text><text x="438" y="674" class="body" text-anchor="start">Evals + learning</text><rect x="438" y="694" width="250" height="42" rx="21" fill="#FFFDFC" stroke="#BE892F" stroke-width="1.7"/><text x="563.0" y="722" class="pill" text-anchor="middle">EVIDENCE IS NOT CANON</text><text x="42" y="790" class="eyebrow" text-anchor="start">THE STORY THREAD</text><line x1="42" y1="820" x2="758" y2="820" stroke="#62556D" stroke-width="3" stroke-linecap="round"/><circle cx="96" cy="820" r="8" fill="#4F8FBA" stroke="none" stroke-width="0"/><circle cx="246" cy="820" r="8" fill="#D6679A" stroke="none" stroke-width="0"/><circle cx="398" cy="820" r="8" fill="#796BC4" stroke="none" stroke-width="0"/><circle cx="552" cy="820" r="8" fill="#796BC4" stroke="none" stroke-width="0"/><circle cx="704" cy="820" r="8" fill="#4D9B7D" stroke="none" stroke-width="0"/><text x="96" y="854" class="small" text-anchor="middle">Context</text><text x="246" y="854" class="small" text-anchor="middle">Contract</text><text x="398" y="854" class="small" text-anchor="middle">Model</text><text x="552" y="854" class="small" text-anchor="middle">Validate</text><text x="704" y="854" class="small" text-anchor="middle">Gate</text></svg>