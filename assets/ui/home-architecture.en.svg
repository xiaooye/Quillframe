<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 890" role="img" data-doc-tier="A"><title>Quillframe architecture</title><desc>Story Loom system map separating Project authority, model semantic contracts, deterministic runtime shell, and evidence/evolution.</desc><style>
text{font-family:"Noto Sans CJK SC","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#241D2B}
.eyebrow{font-size:22px;font-weight:800;letter-spacing:1.6px;fill:#62556D}
.title{font-size:34px;font-weight:850;letter-spacing:-.4px}
.subtitle{font-size:23px;font-weight:500;fill:#62556D}
