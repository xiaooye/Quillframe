<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">NovelForge architecture overview</title><desc id="desc">Five architecture cards for project context, harness runtime, story core, editorial quality, and evidence learning.</desc>
<rect width="1200" height="590" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="1198" height="588" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/>
<text x="52" y="60" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#4F8FBA" letter-spacing="2">ARCHITECTURE</text>
<text x="52" y="106" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="750" fill="#241D2B">Five domains. Five kinds of responsibility.</text>
<text x="52" y="139" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" fill="#62556D">References can cross boundaries. Authority cannot silently follow them.</text>
<path d="M115 382C228 290 337 446 458 359s237-89 356-4 219 80 279-9" fill="none" stroke="#796BC4" stroke-width="3" stroke-dasharray="7 9" opacity=".28"/>
<g transform="translate(52 190)"><rect width="205" height="270" rx="22" fill="#F7FCFF" stroke="#B8D9EC"/><circle cx="28" cy="30" r="8" fill="#4F8FBA"/><text x="48" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#4F8FBA">01 · PROJECT</text><text x="24" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="750" fill="#241D2B">Context</text><text x="24" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Exact framework lock</text><text x="24" y="137" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Project adapter</text><text x="24" y="162" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Sparse manifest</text><path d="M24 198H181" stroke="#D6EAF5"/><text x="24" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#241D2B">OWNS</text><text x="24" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#62556D">what enters the run</text></g>
<g transform="translate(275 190)"><rect width="205" height="270" rx="22" fill="#FAF8FF" stroke="#CFC7EE"/><circle cx="28" cy="30" r="8" fill="#796BC4"/><text x="48" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#796BC4">02 · RUNTIME</text><text x="24" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="750" fill="#241D2B">Harness</text><text x="24" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Session + checkpoint</text><text x="24" y="137" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Routing + control plane</text><text x="24" y="162" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Bounded specialists</text><path d="M24 198H181" stroke="#E3DDF4"/><text x="24" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#241D2B">OWNS</text><text x="24" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#62556D">how work executes</text></g>
<g transform="translate(498 190)"><rect width="205" height="270" rx="22" fill="#FFFEFD" stroke="#D9D1DE"/><circle cx="28" cy="30" r="8" fill="#62556D"/><text x="48" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#62556D">03 · STORY</text><text x="24" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="750" fill="#241D2B">Core</text><text x="24" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Story hierarchy</text><text x="24" y="137" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Character knowledge</text><text x="24" y="162" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Canon + settlement</text><path d="M24 198H181" stroke="#E8E3EB"/><text x="24" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#241D2B">OWNS</text><text x="24" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#62556D">what is true</text></g>
<g transform="translate(721 190)"><rect width="205" height="270" rx="22" fill="#FFFAFC" stroke="#EDC3D6"/><circle cx="28" cy="30" r="8" fill="#D6679A"/><text x="48" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#D6679A">04 · QUALITY</text><text x="24" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="750" fill="#241D2B">Editorial</text><text x="24" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Surface Fundamentals</text><text x="24" y="137" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Reader Engagement</text><text x="24" y="162" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Independent review</text><path d="M24 198H181" stroke="#F2D9E4"/><text x="24" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#241D2B">OWNS</text><text x="24" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#62556D">whether it is good</text></g>
<g transform="translate(944 190)"><rect width="204" height="270" rx="22" fill="#FFFCF5" stroke="#E8D2A5"/><circle cx="28" cy="30" r="8" fill="#BE892F"/><text x="48" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#BE892F">05 · EVIDENCE</text><text x="24" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="750" fill="#241D2B">Learning</text><text x="24" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Feedback evidence</text><text x="24" y="137" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Corpus + provenance</text><text x="24" y="162" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Evals + rollback</text><path d="M24 198H180" stroke="#F0E2C2"/><text x="24" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#241D2B">OWNS</text><text x="24" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#62556D">what may be learned</text></g>
<text x="52" y="515" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#241D2B">Three persistent state domains:</text><text x="270" y="515" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">runtime state ≠ learning state ≠ project/Canon state</text>
<text x="52" y="548" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">This separation is the foundation for safe resume, sparse context, truthful learning, and transactional Canon updates.</text>
