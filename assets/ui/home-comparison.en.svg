<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">NovelForge positioning compared with popular agent frameworks</title><desc id="desc">Four comparison cards showing LangGraph, CrewAI, AutoGen and OpenAI Agents SDK strengths, and the fiction-specific layer NovelForge adds.</desc>
<rect width="1200" height="660" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="1198" height="658" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/>
<text x="52" y="62" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#796BC4" letter-spacing="2">WHY NOVELFORGE</text>
<text x="52" y="108" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="34" font-weight="750" fill="#241D2B">Built one layer above general agent orchestration</text>
<text x="52" y="141" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#62556D">General frameworks solve agent runtime problems. NovelForge specializes in fiction authority, narrative quality, and long-running story state.</text>
<g transform="translate(52 184)">
<rect width="1096" height="92" rx="18" fill="#F7FCFF" stroke="#B8D9EC"/>
<text x="24" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="750" fill="#241D2B">LangGraph</text><text x="24" y="63" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#4F8FBA">Durable stateful orchestration</text>
<path d="M275 46H358" stroke="#4F8FBA" stroke-width="2" stroke-dasharray="5 6"/><path d="M350 40l10 6-10 6" fill="none" stroke="#4F8FBA" stroke-width="2"/>
<text x="390" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#241D2B">NovelForge adds fiction authority boundaries</text><text x="390" y="62" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#62556D">Canon lifecycle · character knowledge · reader-quality gates · settlement</text>
</g>
<g transform="translate(52 292)"><rect width="1096" height="92" rx="18" fill="#FAF8FF" stroke="#CFC7EE"/><text x="24" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="750" fill="#241D2B">CrewAI</text><text x="24" y="63" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#796BC4">Crews + automation flows</text><path d="M275 46H358" stroke="#796BC4" stroke-width="2" stroke-dasharray="5 6"/><path d="M350 40l10 6-10 6" fill="none" stroke="#796BC4" stroke-width="2"/><text x="390" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#241D2B">NovelForge defaults to one manager, not an agent round-table</text><text x="390" y="62" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#62556D">Specialists exist for isolation, capability, or genuinely independent judgment</text></g>
<g transform="translate(52 400)"><rect width="1096" height="92" rx="18" fill="#FFFAFC" stroke="#EDC3D6"/><text x="24" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="750" fill="#241D2B">AutoGen</text><text x="24" y="63" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#D6679A">General multi-agent teams</text><path d="M275 46H358" stroke="#D6679A" stroke-width="2" stroke-dasharray="5 6"/><path d="M350 40l10 6-10 6" fill="none" stroke="#D6679A" stroke-width="2"/><text x="390" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#241D2B">NovelForge makes reviewer independence a hard contract</text><text x="390" y="62" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#62556D">Fresh invocation · bounded packet · artifact fingerprint · no reviewer shopping</text></g>
<g transform="translate(52 508)"><rect width="1096" height="92" rx="18" fill="#FFFCF5" stroke="#E8D2A5"/><text x="24" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="21" font-weight="750" fill="#241D2B">OpenAI Agents SDK</text><text x="24" y="63" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#BE892F">Lean agents · tools · handoffs · tracing</text><path d="M275 46H358" stroke="#BE892F" stroke-width="2" stroke-dasharray="5 6"/><path d="M350 40l10 6-10 6" fill="none" stroke="#BE892F" stroke-width="2"/><text x="390" y="35" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#241D2B">NovelForge adds a fiction production contract above the runtime</text><text x="390" y="62" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#62556D">Project lock · Canon · prose QA · reader QA · continuity · evidence learning</text></g>
<text x="52" y="632" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Snapshot: 2026-08-14 · Specialized, not universally better. Choose the framework whose hard problem matches yours.</text>
</svg>