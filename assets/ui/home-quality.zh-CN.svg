<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">NovelForge 质量保障体系</title><desc id="desc">六阶段质量流水线：确定性契约、表层质量、读者吸引力、独立语义审查、连贯性审计和用户可见门槛，并展示失败回路。</desc>
<rect width="1200" height="620" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="1198" height="618" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/>
<text x="52" y="62" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#D6679A" letter-spacing="2">质量保障与 QA</text>
<text x="52" y="108" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="750" fill="#241D2B">质量不是一个“批评者提示词”，而是一组分层门槛</text>
<text x="52" y="141" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" fill="#62556D">每一种失败都回到真正拥有它的机制。漂亮句子不能掩盖故事、人物、读者吸引力或连贯性问题。</text>
<g transform="translate(52 190)">
<g><rect width="166" height="142" rx="20" fill="#F7FCFF" stroke="#B8D9EC"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#4F8FBA">01 · 确定性</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">契约检查</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">Schema · 生命周期</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">权威 · 内容指纹</text></g>
<g transform="translate(184 0)"><rect width="166" height="142" rx="20" fill="#FFFAFC" stroke="#EDC3D6"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#D6679A">02 · 表层</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">文本底线</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">AI 腔与碎片化</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">机械实现与结构破损</text></g>
<g transform="translate(368 0)"><rect width="166" height="142" rx="20" fill="#FFFAFC" stroke="#EDC3D6"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#D6679A">03 · 读者</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">吸引力</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">压力 · 回报 · 因果</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">继续阅读动力</text></g>
<g transform="translate(552 0)"><rect width="166" height="142" rx="20" fill="#FAF8FF" stroke="#CFC7EE"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#796BC4">04 · 独立</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">语义审查</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">独立调用</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">绑定候选稿指纹</text></g>
<g transform="translate(736 0)"><rect width="166" height="142" rx="20" fill="#FFFCF5" stroke="#E8D2A5"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#BE892F">05 · 连贯性</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">状态审计</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">知识 · 位置 · 义务</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">情绪与事件余波</text></g>
<g transform="translate(920 0)"><rect width="176" height="142" rx="20" fill="#F2FBF7" stroke="#9FCDBB" stroke-width="2"/><text x="20" y="31" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#4D9B7D">06 · 用户可见</text><text x="20" y="64" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="750" fill="#241D2B">最终门槛</text><text x="20" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">只有必须门槛</text><text x="20" y="113" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">全部解决后才展示</text></g>
</g>
<g transform="translate(52 372)"><rect width="1096" height="168" rx="22" fill="#F8F5FA" stroke="#E2DAE8"/><text x="24" y="34" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="750" fill="#241D2B">失败回路</text>
<g transform="translate(24 56)"><rect width="238" height="78" rx="14" fill="#FFFDFC" stroke="#E2DAE8"/><text x="16" y="29" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#D6679A">表层问题成簇</text><text x="16" y="54" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">→ 整个场景重新生成</text></g>
<g transform="translate(282 56)"><rect width="238" height="78" rx="14" fill="#FFFDFC" stroke="#E2DAE8"/><text x="16" y="29" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#D6679A">安全但平淡</text><text x="16" y="54" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">→ 读者压力 + 场景模拟</text></g>
<g transform="translate(540 56)"><rect width="238" height="78" rx="14" fill="#FFFDFC" stroke="#E2DAE8"/><text x="16" y="29" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#796BC4">人物失真</text><text x="16" y="54" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">→ 人物模拟层修复</text></g>
<g transform="translate(798 56)"><rect width="274" height="78" rx="14" fill="#FFFDFC" stroke="#E2DAE8"/><text x="16" y="29" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#BE892F">故事 / 连贯性失败</text><text x="16" y="54" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">→ 回到故事计划或状态修复</text></g></g>
<text x="52" y="584" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">普通 CI 负责确定性契约和盲评队列卫生；文学语义门槛必须由真实可用的模型调用或人工审阅完成。</text>
</svg>