<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" data-doc-tier="A"><title>Quillframe 质量系统</title><desc>四部分质量模型：确定性 QA、语义 QA、证据驱动的质量演化，以及绑定指纹的独立判断。</desc><style>
text{font-family:"Noto Sans CJK SC","Noto Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#241D2B}
.eyebrow{font-size:22px;font-weight:800;letter-spacing:1.5px;fill:#62556D}
.title{font-size:34px;font-weight:850;letter-spacing:-.4px}
.subtitle{font-size:23px;font-weight:500;fill:#62556D}
.section{font-size:24px;font-weight:850}
.lead{font-size:22px;font-weight:750}
.body{font-size:22px;font-weight:650}
.small{font-size:21px;font-weight:500;fill:#62556D}
.pill{font-size:20px;font-weight:800}
</style><rect width="800" height="900" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="798" height="898" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/><text x="42" y="54" class="eyebrow" text-anchor="start">质量系统</text><text x="42" y="94" class="title" text-anchor="start">质量不是一个分数</text><text x="42" y="130" class="title" text-anchor="start">而是一套诊断系统</text><text x="42" y="164" class="subtitle" text-anchor="start" data-max-width="720">不同证据回答不同问题，失败也回到不同归属层。</text><rect x="42" y="202" width="344" height="240" rx="22" fill="#E7E1F8" stroke="#796BC4" stroke-width="2.2"/><rect x="414" y="202" width="344" height="240" rx="22" fill="#F9DDE9" stroke="#D6679A" stroke-width="2.2"/><rect x="42" y="480" width="344" height="240" rx="22" fill="#F9EDCF" stroke="#BE892F" stroke-width="2.2"/><rect x="414" y="480" width="344" height="240" rx="22" fill="#DCF1E7" stroke="#4D9B7D" stroke-width="2.2"/><text x="66" y="242" class="section" text-anchor="start">确定性 QA</text><text x="66" y="278" class="lead" text-anchor="start">机器可以证明的事实</text><line x1="66" y1="296" x2="360" y2="296" stroke="#796BC4" stroke-width="1.5" stroke-linecap="round"/><text x="66" y="330" class="body" text-anchor="start">Schema 与生命周期</text><text x="66" y="364" class="body" text-anchor="start">权威与权限</text><text x="66" y="398" class="body" text-anchor="start">指纹与一次性消费</text><text x="66" y="432" class="body" text-anchor="start">版权与来源</text><text x="438" y="242" class="section" text-anchor="start">语义 QA</text><text x="438" y="278" class="lead" text-anchor="start">必须理解文本才能判断</text><line x1="438" y1="296" x2="732" y2="296" stroke="#D6679A" stroke-width="1.5" stroke-linecap="round"/><text x="438" y="330" class="body" text-anchor="start">读者反应与预期</text><text x="438" y="364" class="body" text-anchor="start">人物完整性</text><text x="438" y="398" class="body" text-anchor="start">修改归因诊断</text><text x="438" y="432" class="body" text-anchor="start">候选稿成对比较</text><text x="66" y="520" class="section" text-anchor="start">质量演化</text><text x="66" y="556" class="lead" text-anchor="start">只有证据支持才继续改</text><line x1="66" y1="574" x2="360" y2="574" stroke="#BE892F" stroke-width="1.5" stroke-linecap="round"/><text x="66" y="608" class="body" text-anchor="start">质量发现账本</text><text x="66" y="642" class="body" text-anchor="start">候选稿谱系</text><text x="66" y="676" class="body" text-anchor="start">现稿 / 挑战稿比较</text><text x="66" y="710" class="body" text-anchor="start">收益平台期可以停止修改</text><text x="438" y="520" class="section" text-anchor="start">独立判断门槛</text><text x="438" y="556" class="lead" text-anchor="start">需要独立性时使用全新调用</text><line x1="438" y1="574" x2="732" y2="574" stroke="#4D9B7D" stroke-width="1.5" stroke-linecap="round"/><text x="438" y="608" class="body" text-anchor="start">绑定精确稿件指纹</text><text x="438" y="642" class="body" text-anchor="start">受限上下文与评判标准</text><text x="438" y="676" class="body" text-anchor="start">类型化结果</text><text x="438" y="710" class="body" text-anchor="start">拒绝结论进入修复流程</text><rect x="42" y="758" width="716" height="104" rx="20" fill="#F8F5FA" stroke="#E2DAE8" stroke-width="1.6"/><text x="66" y="794" class="eyebrow" text-anchor="start">核心原则</text><text x="66" y="830" class="small" text-anchor="start" data-max-width="660">代码证明不变量；模型理解小说；二者都不能静默改写正典。</text></svg>