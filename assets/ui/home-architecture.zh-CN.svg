<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">NovelForge 架构总览</title><desc id="desc">五个架构卡片：项目上下文、调度运行时、故事核心、编辑质量和证据学习。</desc>
<rect width="1200" height="590" rx="28" fill="#FFFDFC"/><rect x="1" y="1" width="1198" height="588" rx="27" fill="none" stroke="#E2DAE8" stroke-width="2"/>
<text x="52" y="60" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#4F8FBA" letter-spacing="2">系统架构</text>
<text x="52" y="106" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="750" fill="#241D2B">五个领域，五种不同责任</text>
<text x="52" y="139" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" fill="#62556D">引用可以跨边界，权威不能悄悄跟着一起跨过去。</text>
<path d="M115 382C228 290 337 446 458 359s237-89 356-4 219 80 279-9" fill="none" stroke="#796BC4" stroke-width="3" stroke-dasharray="7 9" opacity=".28"/>
<g transform="translate(52 190)"><rect width="205" height="270" rx="22" fill="#F7FCFF" stroke="#B8D9EC"/><circle cx="28" cy="30" r="8" fill="#4F8FBA"/><text x="48" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#4F8FBA">01 · 项目</text><text x="24" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="750" fill="#241D2B">上下文</text><text x="24" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">精确框架锁定</text><text x="24" y="137" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">项目适配器</text><text x="24" y="162" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">稀疏上下文清单</text><path d="M24 198H181" stroke="#D6EAF5"/><text x="24" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#241D2B">负责</text><text x="24" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#62556D">本次运行加载什么</text></g>
<g transform="translate(275 190)"><rect width="205" height="270" rx="22" fill="#FAF8FF" stroke="#CFC7EE"/><circle cx="28" cy="30" r="8" fill="#796BC4"/><text x="48" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#796BC4">02 · 运行时</text><text x="24" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="750" fill="#241D2B">调度</text><text x="24" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">会话 + 检查点</text><text x="24" y="137" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">路由 + 控制平面</text><text x="24" y="162" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">受限专门执行器</text><path d="M24 198H181" stroke="#E3DDF4"/><text x="24" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#241D2B">负责</text><text x="24" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#62556D">工作怎样执行和恢复</text></g>
<g transform="translate(498 190)"><rect width="205" height="270" rx="22" fill="#FFFEFD" stroke="#D9D1DE"/><circle cx="28" cy="30" r="8" fill="#62556D"/><text x="48" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#62556D">03 · 故事</text><text x="24" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="750" fill="#241D2B">核心</text><text x="24" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">故事层级</text><text x="24" y="137" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">人物知识与目标</text><text x="24" y="162" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">正典 + 结算</text><path d="M24 198H181" stroke="#E8E3EB"/><text x="24" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#241D2B">负责</text><text x="24" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#62556D">故事中什么是真的</text></g>
<g transform="translate(721 190)"><rect width="205" height="270" rx="22" fill="#FFFAFC" stroke="#EDC3D6"/><circle cx="28" cy="30" r="8" fill="#D6679A"/><text x="48" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#D6679A">04 · 质量</text><text x="24" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="750" fill="#241D2B">编辑</text><text x="24" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">表层质量规则</text><text x="24" y="137" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">读者吸引力</text><text x="24" y="162" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">独立语义审查</text><path d="M24 198H181" stroke="#F2D9E4"/><text x="24" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#241D2B">负责</text><text x="24" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#62556D">成品够不够好</text></g>
<g transform="translate(944 190)"><rect width="204" height="270" rx="22" fill="#FFFCF5" stroke="#E8D2A5"/><circle cx="28" cy="30" r="8" fill="#BE892F"/><text x="48" y="36" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#BE892F">05 · 证据</text><text x="24" y="78" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="750" fill="#241D2B">学习</text><text x="24" y="112" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">用户反馈证据</text><text x="24" y="137" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">语料 + 来源</text><text x="24" y="162" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">评测 + 回滚</text><path d="M24 198H180" stroke="#F0E2C2"/><text x="24" y="228" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#241D2B">负责</text><text x="24" y="250" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#62556D">什么可以被学进去</text></g>
<text x="52" y="515" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#241D2B">三类持久状态：</text><text x="185" y="515" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">运行状态 ≠ 学习状态 ≠ 项目 / 正典状态</text>
<text x="52" y="548" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#62556D">这种分离是安全恢复、稀疏上下文、可信学习和事务化正典更新的基础。</text>
</svg>