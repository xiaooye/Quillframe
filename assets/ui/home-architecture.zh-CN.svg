<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 890" role="img" data-doc-tier="A"><title>Quillframe 系统架构</title><desc>Story Loom 系统图：项目权威、模型语义契约、确定性运行外壳以及证据演化彼此分离。</desc><style>
