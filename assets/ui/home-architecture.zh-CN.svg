="body" text-anchor="start">学习、研究与场景分叉</text><text x="66" y="518" class="section" text-anchor="start">确定性运行外壳</text><text x="66" y="554" class="lead" text-anchor="start">约束执行过程</text><line x1="66" y1="572" x2="360" y2="572" stroke="#796BC4" stroke-width="1.5" stroke-linecap="round"/><rect x="66" y="592" width="250" height="42" rx="21" fill="#FFFDFC" stroke="#796BC4" stroke-width="1.7"/><text x="191.0" y="620" class="pill" text-anchor="middle">会话 + 检查点</text><rect x="66" y="642" width="250" height="42" rx="21" fill="#FFFDFC" stroke="#796BC4" stroke-width="1.7"/><text x="191.0" y="670" class="pill" text-anchor="middle">能力 + 路由</text><rect x="66" y="692" width="250" height="42" rx="21" fill="#FFFDFC" stroke="#796BC4" stroke-width="1.7"/><text x="191.0" y="720" class="pill" text-anchor="middle">指纹 + 结果回执</text><text x="438" y="518" class="section" text-anchor="start">证据与演化</text><text x="438" y="554" class="lead" text-anchor="start">证据的权威始终受限</text><line x1="438" y1="572" x2="732" y2="572" stroke="#BE892F" stroke-width="1.5" stroke-linecap="round"/><text x="438" y="606" class="body" text-anchor="start">质量发现与读者预期</text><text x="438" y="640" class="body" text-anchor="start">语料证据与评测</text><text x="438" y="674" class="body" text-anchor="start">学习假设与候选稿历史</text><rect x="438" y="694" width="250" height="42" rx="21" fill="#FFFDFC" stroke="#BE892F" stroke-width="1.7"/><text x="563.0" y="722" class="pill" text-anchor="middle">证据本身不是正典</text><text x="42" y="790" class="eyebrow" text-anchor="start">贯穿全程的故事线</text><line x1="42" y1="820" x2="758" y2="820" stroke="#62556D" stroke-width="3" stroke-linecap="round"/><circle cx="96" cy="820" r="8" fill="#4F8FBA" stroke="none" stroke-width="0"/><circle cx="246" cy="820" r="8" fill="#D6679A" stroke="none" stroke-width="0"/><circle cx="398" cy="820" r="8" fill="#796BC4" stroke="none" stroke-width="0"/><circle cx="552" cy="820" r="8" fill="#796BC4" stroke="none" stroke-width="0"/><circle cx="704" cy="820" r="8" fill="#4D9B7D" stroke="none" s