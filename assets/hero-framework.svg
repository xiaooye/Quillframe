<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">NovelForge soft technical editorial hero</title>
  <desc id="desc">A pastel editorial illustration showing story cards, an agent terminal, a manuscript page, and connected system nodes around the NovelForge wordmark.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8FC"/>
      <stop offset="0.48" stop-color="#F8F5FF"/>
      <stop offset="1" stop-color="#F3FBFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4B3B5A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="1176" height="396" rx="34" fill="url(#wash)" stroke="#E7DDF0" stroke-width="2"/>

  <!-- decorative editorial sparkles -->
  <g fill="#C57AA0" opacity="0.9">
    <path d="M82 72h10v10H82z" transform="rotate(45 87 77)"/>
    <circle cx="116" cy="48" r="4"/>
    <circle cx="1070" cy="76" r="5"/>
  </g>
  <g stroke="#8A79C2" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M1035 46l7 15 15 7-15 7-7 15-7-15-15-7 15-7z"/>
    <path d="M152 334l5 11 11 5-11 5-5 11-5-11-11-5 11-5z"/>
  </g>

  <!-- left manuscript card -->
  <g filter="url(#shadow)">
    <rect x="82" y="112" width="238" height="210" rx="24" fill="#FFF0C7" stroke="#D6B76A" stroke-width="2"/>
    <rect x="108" y="90" width="190" height="206" rx="20" fill="#FFFDF8" stroke="#D6B76A" stroke-width="2"/>
    <rect x="130" y="120" width="108" height="12" rx="6" fill="#C9973B" opacity="0.72"/>
    <rect x="130" y="151" width="140" height="8" rx="4" fill="#D9CBA5"/>
    <rect x="130" y="172" width="122" height="8" rx="4" fill="#D9CBA5"/>
    <rect x="130" y="193" width="132" height="8" rx="4" fill="#D9CBA5"/>
    <rect x="130" y="228" width="82" height="30" rx="15" fill="#FAD7E8" stroke="#D982A8"/>
    <text x="171" y="248" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#2B2433">CANON</text>
  </g>

  <!-- center wordmark -->
  <g>
    <text x="600" y="172" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="#2B2433">NovelForge</text>
    <text x="600" y="207" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="650" fill="#6A5E74">Adaptive Fiction Agent Framework</text>
    <text x="600" y="243" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#796D84">story state · sessions · reader pressure · learning · evals</text>

    <g transform="translate(404 270)">
      <rect width="118" height="34" rx="17" fill="#FAD7E8" stroke="#D982A8"/>
      <text x="59" y="22" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#50394A">project-agnostic</text>
    </g>
    <g transform="translate(540 270)">
      <rect width="112" height="34" rx="17" fill="#E8DDFB" stroke="#8B7AC6"/>
      <text x="56" y="22" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#403653">session-native</text>
    </g>
    <g transform="translate(670 270)">
      <rect width="126" height="34" rx="17" fill="#D9F5E5" stroke="#58A98C"/>
      <text x="63" y="22" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#2F5146">provider-neutral</text>
    </g>
  </g>

  <!-- right terminal + graph -->
  <g filter="url(#shadow)">
    <rect x="870" y="92" width="246" height="178" rx="22" fill="#E8DDFB" stroke="#8B7AC6" stroke-width="2"/>
    <rect x="890" y="114" width="206" height="136" rx="15" fill="#2F2937"/>
    <circle cx="910" cy="132" r="4" fill="#F6AFCB"/>
    <circle cx="924" cy="132" r="4" fill="#F5D78E"/>
    <circle cx="938" cy="132" r="4" fill="#A9E6C6"/>
    <text x="910" y="166" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#EDE7FF">run → checkpoint</text>
    <text x="910" y="188" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#D9F5E5">review → bind</text>
    <text x="910" y="210" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#DDF2FF">result → resume</text>
  </g>

  <g stroke="#7A6A88" stroke-width="2" fill="none">
    <path d="M880 306 C930 280, 984 286, 1016 316"/>
    <path d="M1016 316 C1045 336, 1070 340, 1100 320"/>
    <path d="M1016 316 C990 352, 950 360, 922 342" stroke-dasharray="6 7"/>
  </g>
  <g>
    <circle cx="878" cy="307" r="16" fill="#DDF2FF" stroke="#5B98C4" stroke-width="2"/>
    <circle cx="1016" cy="316" r="18" fill="#FAD7E8" stroke="#D982A8" stroke-width="2"/>
    <circle cx="1102" cy="320" r="15" fill="#D9F5E5" stroke="#58A98C" stroke-width="2"/>
    <circle cx="920" cy="343" r="13" fill="#FFF0C7" stroke="#C9973B" stroke-width="2"/>
  </g>

  <!-- bottom note -->
  <text x="600" y="374" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#796D84">deterministic where possible · semantic where useful · Canon only when accepted</text>
</svg>
