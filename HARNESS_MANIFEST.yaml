version: 1.0.0-dev.0
name: quillframe
product_name: Quillframe
architecture: rust-native-ultralong-webnovel-production
entry: SKILL.md

platforms:
  supported: [windows, linux]
  filesystem_identity: native-handle-bound
  desktop_shell: tauri-2-direct-rust-core

ownership:
  core_runtime: native/quillframe-core
  filesystem_primitives: native/quillframe-native
  local_host: native/quillframe-host
  secrets: native/quillframe-secrets
  project_store: sqlite-strict-schema
  studio_ui: solidjs-typescript
  ui_tooling_only: node-pnpm

project_contract:
  manifest_schema: quillframe_project_v1_0
  manifest_keys: [project_id, title, language, schema]
  hierarchy: [book, volume, unit, chapter, scene]
  target_length: ultralong_over_5000000_chinese_characters
  durability_test_policy: real_multi_chapter_acceptance_without_synthetic_5000000_character_run

planning:
  contract: ai-native-longform-v2
  hierarchy_source: fingerprint_bound_active_plan_chain
  book_assets: [story_foundation, character_arcs, relationship_arcs]
  chapter_assets: [chapter_contract, scene_script]
  scene_brief_source: frozen_scene_script_only
  distant_plan_policy: coarse_until_rolling_refinement
  literary_judgment_owner: model
  deterministic_boundary_owner: rust_core

production:
  task_modes: [DRAFT, REVISE]
  pipeline:
    - context_query_plan
    - context_greenlight
    - context_freeze
    - corpus_greenlight
    - preference_greenlight
    - character_simulation
    - scene_resolution
    - surface_realization
    - reader_engagement
    - continuity_rule_audit
    - candidate_self_audit
    - repair_comparison
    - independent_semantic_gate
    - author_acceptance
    - settlement
    - publication
  recovery: explicit_authorized_snapshot_materialization_without_semantic_inference
  raw_intermediate_draft_visible: false
  generation_source_controls_voice_and_prose: true
  script_literary_scoring: forbidden
  model_usage_user_cap_required: false
  provider_technical_limits_observed: true

corpus:
  schema: persistence/schema/corpus/001_initial.sql
  private_database: corpus.sqlite
  source_storage: user_files_only
  scan:
    formats: [utf8_txt]
    maximum_works: 500
    maximum_depth: 8
    maximum_bytes_per_work: 134217728
    links_and_reparse_points: forbidden
  analyze_stages:
    - boundary_index
    - golden_three
    - chapter_extraction
    - aggregate_mechanisms
    - story_entities
    - report
    - style_profile
  golden_three_pause: required
  continuation_authorization: exact_checkpoint_cas
  model_prompt_persisted: false
  writer_boundary: source_free_projection_only
  active_writer_pack_limit: 4

storage:
  global_schema: persistence/schema/global
  project_schema: persistence/schema/project
  corpus_schema: persistence/schema/corpus
  journal_mode: wal
  synchronous: full
  schema_drift: fail_closed
  publication:
    formats: [md, txt]
    accepted_single_source: supported
    settled_ordered_collection: supported
    publish_mode: durable_stage_handle_bound_noreplace
    artifact_identity_revalidation: required

model_runtime:
  protocols: [openai_chat_completions, openai_responses, anthropic_messages]
  secrets: os_credential_store_only
  endpoint_policy: https_or_explicit_loopback_http
  dns_rebinding_policy: resolved_address_pinned
  stage_outcome: confirmed_or_unconfirmed_never_blind_retry

bridge:
  contract: studio/host_bridge_contract.json
  version: 11
  browser_direct_store_access: false
  generic_mutation_dispatch: false
  implemented_groups:
    - project_and_story
    - typed_planning
    - model_services
    - author_production
    - document_revision
    - candidate_review_and_revision
    - settlement
    - publication
    - corpus_analysis_and_pack_activation
    - context_compiler_and_dependency_invalidation
    - learning_feedback_review_and_preference_activation
    - story_snapshot_restore

quality:
  normal_ci_live_model_execution: forbidden
  commands:
    - cargo fmt --all -- --check
    - cargo check --workspace --all-targets --locked
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - cargo test --workspace --all-targets --locked
    - corepack pnpm run quality
    - corepack pnpm run typecheck
    - corepack pnpm run test
    - corepack pnpm run build
  tauri_manifest: studio/app/src-tauri/Cargo.toml
  acceptance:
    - native_windows_storage_and_publication
    - native_linux_storage_and_publication
    - corpus_golden_three_pause_and_resume
    - source_free_pack_to_writer_pack
    - real_multi_chapter_draft_review_revise_accept_settle_publish
    - studio_direct_rust_core
    - corrupt_projection_rejected_then_snapshot_restored

write_boundary:
  semantic_result_grants_canon_authority: false
  corpus_result_grants_canon_authority: false
  acceptance_is_settlement: false
  settlement_requires_exact_before_state: true
  publication_grants_canon_authority: false
