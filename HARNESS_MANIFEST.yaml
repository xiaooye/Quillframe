version: 7.2.0
name: novelforge
product_name: NovelForge Adaptive Fiction Agent Framework
architecture: generic-fiction-os-ai-native-contract-first-capability-aware-adaptive-learning
entry: SKILL.md

scope:
  project_agnostic: true
  built_in_novel_or_canon: false
  dependency_direction: project-to-framework-only
  supported_project_contract: novelforge_project_v1
  project_sdk: project_sdk.py
  project_adapter: project_adapter.py

fundamentals:
  story_system:
    en: core/STORY_SYSTEM.en.md
    zh_cn: core/STORY_SYSTEM.zh-CN.md
  canon_state:
    en: core/CANON_STATE.en.md
    zh_cn: core/CANON_STATE.zh-CN.md
  character_relationship:
    en: core/CHARACTER_SYSTEM.en.md
    zh_cn: core/CHARACTER_SYSTEM.zh-CN.md
  surface:
    en: surface/FUNDAMENTALS.en.md
    zh_cn: surface/FUNDAMENTALS.zh-CN.md
    mandatory_default: true
  reader_engagement:
    en: surface/READER_ENGAGEMENT.en.md
    zh_cn: surface/READER_ENGAGEMENT.zh-CN.md
    profile_weighted: true

harness:
  manager: harness/HARNESS_AGENT.md
  orchestration: harness/ORCHESTRATION_PROTOCOL.md
  session_runtime: harness/session_runtime/SESSION_RUNTIME.md
  session_schema: harness/session_runtime/session_schema.json
  session_tool: harness/session_runtime/session_runtime.py
  runtime_routing: harness/session_runtime/RUNTIME_ROUTING.md
  runtime_registry: harness/session_runtime/runtime_registry.json
  runtime_capabilities: harness/runtime_capabilities.py
  runtime_capability_docs:
    en: harness/session_runtime/RUNTIME_CAPABILITIES.en.md
    zh_cn: harness/session_runtime/RUNTIME_CAPABILITIES.zh-CN.md
  context_inspector: harness/context_inspector.py
  memory_tiers: harness/memory_tiers.py
  memory_bank: harness/memory_bank.py
  scenario_fork: harness/scenario_fork.py
  settlement_runtime: harness/settlement_runtime.py
  control_plane: harness/control_plane/CONTROL_PLANE.md
  control_plane_tool: harness/control_plane/control_plane.py
  control_plane_event_schema: harness/control_plane/event_schema.json
  control_plane_handoff_schema: harness/control_plane/handoff_schema.json
  control_plane_mcp_stdio: harness/control_plane/mcp_stdio.py
  semantic_protocol: harness/semantic_workers/SEMANTIC_WORKER_PROTOCOL.md
  semantic_execution: harness/semantic_workers/SEMANTIC_EXECUTION_RUNTIME.md
  semantic_router: harness/semantic_workers/semantic_worker_router.py
  semantic_model_contract_catalog: harness/semantic_workers/model_contract_catalog.json
  semantic_contract_packs: harness/semantic_workers/contracts
  semantic_runner: harness/semantic_workers/semantic_worker_runner.py
  semantic_local_adapter: harness/semantic_workers/adapters/local_agent_adapter.py
  semantic_openai_adapter: harness/semantic_workers/adapters/openai_responses_adapter.py
  semantic_peer_relay: harness/semantic_workers/peer_chat_relay.py

quality:
  finding_contract: quality/findings.py
  quality_evolution: quality/quality_evolution.py
  reader_expectation_ledger: quality/reader_expectation.py
  state_graph: quality/state_graph.py
  quality_evolution_schema: novelforge_quality_evolution_v2
  reader_expectation_schema: novelforge_reader_expectation_v2
  context_inspector_schema: novelforge_context_inspector_v2
  memory_tiers_schema: novelforge_memory_tiers_v2
  memory_bank_schema: novelforge_memory_bank_v1
  finding_schema: novelforge_quality_finding_v1
  state_graph_schema: novelforge_state_graph_v1
  semantic_contracts:
    reader_reaction: reader.reaction
    reader_compare: reader.compare
    character_integrity: character.integrity
    revision_diagnosis: revision.diagnose
    narrative_world: narrative.world
    reader_expectations: reader.expectations
    memory_consolidation: memory.consolidate
  semantic_intelligence_owner: model
  deterministic_code_owner: [authority, permission, fingerprint, persistence, transaction, routing, hard_budget, stage_isolation, typed_validation]
  reader_persona_basis: reading-behavior
  reader_diagnostics_are_mandatory_independent_gate: false
  pairwise_order_swap_supported: true
  absolute_score_alone_decides_keep_discard: false
  quality_evolution_result_consume_once: true
  quality_evolution_plateau_stopping: true
  context_overlay_can_mutate_canon: false
  memory_bank_can_mutate_protected_canon_reference: false
  protected_memory_edit_becomes_proposal: true
  derived_memory_authority: false
  state_graph_authority: false
  scenario_branch_authority: false
  reader_expectation_authority: false
  durable_semantic_scalar_policy: forbidden_without_calibration_and_consumer_contract

settlement:
  runtime: harness/settlement_runtime.py
  runtime_schema: novelforge_settlement_runtime_v1
  transaction_schema: novelforge_settlement_transaction_v1
  projection_receipt_schema: novelforge_projection_receipt_v1
  semantic_inference: forbidden
  explicit_acceptance_receipt_required: true
  checkpoint_before_write_required: true
  explicit_write_authorization_required: true
  exact_before_after_intent_required: true
  before_state_compare_and_swap: required
  authoritative_postcondition_check: required
  required_projection_receipts_bind_transaction_fingerprint: true
  required_projection_failure_state: settlement_incomplete
  projection_retry_after_failure: supported
  completed_projection_replay_is_immutable: true
  complete_only_after_required_projections: true

learning:
  architecture:
    en: docs/adaptive-learning.en.md
    zh_cn: docs/adaptive-learning.zh-CN.md
  durable_store: learning/learning_store.py
  durable_cycle: learning/learning_cycle.py
  semantic_work_packager: learning/learning_eval.py
  promotion_gate: learning/promotion_gate.py
  state_domains:
    - preference_evidence
    - preference_hypotheses
    - corpus_gaps
    - learning_candidates
    - promotion_log
    - learning_cycles
    - learning_cycle_artifacts
    - learning_cycle_receipts
  cycle_graph:
    - evidence_or_hypothesis
    - corpus_gap
    - discovery_plan
    - verified_discovery
    - semantic_analysis
    - eval_evidence
    - promotion_candidate
    - activation_or_promotion_gate
  scopes: [one_off, project, user_taste, general_craft]
  model_inference_alone_can_promote_user_taste: false
  general_craft_requires_counterexample_and_eval: true
  general_craft_requires_cross_work_evidence: true
  promotion_gate_grants_write_authority: false
  learning_result_consume_once: true
  personal_learning_data_committed_by_default: false

corpus:
  overview:
    en: corpus/README.en.md
    zh_cn: corpus/README.zh-CN.md
  policy:
    en: corpus/CORPUS_POLICY.en.md
    zh_cn: corpus/CORPUS_POLICY.zh-CN.md
  ingest:
    en: corpus/CORPUS_INGEST_PROTOCOL.en.md
    zh_cn: corpus/CORPUS_INGEST_PROTOCOL.zh-CN.md
  scout: corpus/corpus_scout.py
  discovery_runtime: corpus/discovery_runtime.py
  discovery_request_schema: novelforge_corpus_discovery_request_v2
  discovery_result_schema: novelforge_corpus_discovery_results_v1
  rights_gate: corpus/rights_gate.py
  benchmark_registry: corpus/benchmarks/mechanisms.json
  rights_classes: [redistributable, analysis_only, unknown]
  discovery_is_not_ingestion: true
  discovery_requires_proven_host_capability: true
  source_tool_provenance_required: true
  full_modern_copyright_mirroring_default: forbidden
  named_author_imitation_profile: forbidden

evals:
  overview:
    en: evals/README.en.md
    zh_cn: evals/README.zh-CN.md
  manifest: evals/eval_manifest.json
  runner: evals/run_evals.py
  blind_queue_builder: evals/build_judge_queue.py
  semantic_missing_state: PENDING_MODEL
  hidden_expected_in_reviewer_queue: forbidden
  normal_ci_live_model_execution: forbidden

project_engineering:
  contract:
    en: docs/project-sdk.en.md
    zh_cn: docs/project-sdk.zh-CN.md
  adapter_contract:
    en: harness/PROJECT_ADAPTER_PROTOCOL.en.md
    zh_cn: harness/PROJECT_ADAPTER_PROTOCOL.zh-CN.md
  manifest: novelforge.toml
  lockfile: novelforge.lock.json
  local_framework_materialization: .novelforge/framework
  layouts: [standard, mapped]
  change_classes: [micro_content, chapter_unit, structural_feature, canon_migration, release]
  structural_change_flow: [spec, plan, tasks, implementation, verification, acceptance]
  deterministic_project_build: required
  deterministic_project_tests: required
  framework_bundle:
    builder: release/build_framework_bundle.py
    docs:
      en: release/FRAMEWORK_BUNDLE.en.md
      zh_cn: release/FRAMEWORK_BUNDLE.zh-CN.md
    format: deterministic-posix-tar
    fingerprint: sha256-exact-bundle-bytes
    content_manifest: BUNDLE_CONTENT_MANIFEST.json
    consumer_lock_field: framework.bundle_fingerprint
    attestation_excluded_from_fingerprint_input: true

session_runtime:
  identity_model: resource-session-run-checkpoint
  chat_session_support: required
  durable_store: sqlite-reference
  persistent_session_does_not_grant_authority: true
  reviewer_default: fresh-per-fingerprint
  resume_revalidates_project_authority: true
  resume_reresolves_required_capabilities: true

runtime_capabilities:
  schema: novelforge_host_capabilities_v1
  undeclared_is_unavailable: true
  provider_name_is_not_capability_proof: true
  network_primitive_is_not_remote_authorization: true
  secrets_embedded: false
  constraints: [permission, availability, user_interaction, model_execution, usage_class]
  common_capabilities: [filesystem_read, filesystem_write, subprocess, git_cli, github_cli, codex_cli, claude_cli, web_search, github_search, user_files, file_library, mcp_client, mcp_server, provider_api, semantic_model, peer_chat_relay, human_reviewer]

control_plane:
  schema: novel_os_control_plane_v1
  event_schema: novel_os_event_v1
  handoff_schema: novel_os_handoff_v1
  event_idempotency: required
  handoff_claim: transactional-bounded-lease
  result_consumption: exactly-once-logical-receipt
  canon_authority: false
  framework_promotion_authority: false
  default_local_db: .novel-os/runtime.db
  mcp:
    protocol_version: 2025-06-18
    local_transport: stdio
    remote_transport: streamable-http
    canon_write_tools_exposed: false

runtime_transports: [current_chat, peer_chat, codex_cli, claude_code, control_plane_mcp, provider_api, github_actions, remote_mcp_worker, local_model, human_reviewer]

semantic:
  model_contract_catalog: harness/semantic_workers/model_contract_catalog.json
  contract_pack_root: harness/semantic_workers/contracts
  loading_policy: progressive_disclosure
  exact_contract_id_resolution: deterministic_runtime
  aggregate_compatibility_registry: forbidden
  semantic_intelligence_owner: model
  deterministic_runtime_does_literary_judgment: false
  fingerprint_payload: [kind, subject_id, input, rubric, output_contract]
  execution_lineage_excluded_from_fingerprint: true
  lineage_fields: [source_session_id, worker_session_id, handoff_id, attempt_id]
  hidden_gold: forbidden
  manager_self_review_independent: false
  semantic_reject_is_transport_failure: false
  result_consume_once: true
  typed_output_validation: generic-contract-subset
  learning_kinds: [corpus_analyze, preference_distill, eval_judge]
  diagnostic_kinds: [artifact_audit, external_review]

quality_layering:
  order: [framework_fundamentals, genre_platform_profile, project_profile, user_taste_profile, current_request]
  project_may_silently_disable_framework_fundamentals: false
  explicit_profile_sensitive_exceptions_supported: true

bilingual_docs:
  languages: [en, zh-CN]
  human_facing_pair_required: true
  machine_schema_single_source: true
  mermaid_diagrams: preferred

workflows:
  deterministic_ci: .github/workflows/novelforge-ci.yml
  reusable_contracts: .github/workflows/novelforge-contracts.yml
  semantic_contract_packs: .github/workflows/novelforge-semantic-contract-packs.yml
  framework_bundle: .github/workflows/novelforge-release-bundle.yml
  typed_event_router: .github/workflows/novelforge-event-router.yml
  live_semantic_optional: .github/workflows/novelforge-semantic-live.yml
  weekly_maintenance: .github/workflows/novelforge-weekly-maintenance.yml
  peer_chat:
    reusable_workflow: .github/workflows/novelforge-chat-semantic-bridge.yml
    composite_action: .github/actions/project-peer-semantic/action.yml
    bridge_runtime: .github/actions/project-peer-semantic/bridge.py
    issue_owner: consuming-project-repository
    framework_issue_listener: forbidden
    caller_must_pin_exact_framework_commit: true
    job_provenance_project_repo_binding: required
    job_provenance_framework_commit_binding: required
  normal_workflows_may_spend_model_usage: false
  live_semantic_requires_explicit_dispatch_and_secret: true
  weekly_maintenance_model_execution: false
  weekly_maintenance_web_execution_without_declared_capability: false
  weekly_maintenance_auto_promotion: false

normal_ci:
  model_execution: forbidden
  required: [py_compile, repository-hygiene, project-sdk-self-test, project-adapter-self-test, runtime-capabilities-self-test, context-inspector-self-test, memory-tiers-self-test, memory-bank-self-test, scenario-fork-self-test, settlement-runtime-self-test, quality-finding-self-test, reader-expectation-self-test, quality-evolution-self-test, state-graph-self-test, semantic-router-self-test, semantic-contract-catalog-self-test, learning-store-self-test, learning-cycle-self-test, learning-eval-self-test, promotion-gate-self-test, corpus-scout-self-test, corpus-discovery-runtime-self-test, corpus-rights-gate-self-test, framework-bundle-self-test, deterministic-double-bundle-build, generic-eval-deterministic-release, generic-eval-blind-queue, session-self-test, control-plane-self-test, mcp-self-test, local-agent-adapter-self-test, project-hosted-peer-bridge-ownership, optional-openai-dry-run]

scheduled_maintenance:
  model_execution: forbidden
  web_execution_without_declared_capability: forbidden
  auto_promotion: forbidden
  may_plan_discovery: true
  may_report_missing_capabilities: true
  may_advance_deterministic_learning_state: true

write_boundary:
  connector_event_grants_canon_authority: false
  webhook_event_grants_canon_authority: false
  schedule_grants_canon_authority: false
  semantic_result_grants_canon_authority: false
  semantic_model_contract_result_grants_canon_authority: false
  corpus_result_grants_canon_authority: false
  learning_hypothesis_grants_canon_authority: false
  context_overlay_grants_canon_authority: false
  memory_bank_grants_canon_authority: false
  reader_expectation_ledger_grants_canon_authority: false
  scenario_branch_grants_canon_authority: false
  state_graph_result_grants_canon_authority: false
  quality_evolution_result_grants_canon_authority: false
  promotion_gate_result_grants_framework_write: false
  canon_write_requires_project_acceptance_and_settlement: true
  settlement_before_state_mismatch_blocks_all_writes: true
  settlement_complete_requires_required_projection_receipts: true
  settlement_projection_receipts_bind_transaction_fingerprint: true
