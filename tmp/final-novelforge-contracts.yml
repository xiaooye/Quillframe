name: NovelForge Reusable Release Contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile every Python module
        run: |
          python - <<'PY'
          import pathlib, py_compile
          files=[p for p in pathlib.Path('.').rglob('*.py') if '.git' not in p.parts]
          for p in files: py_compile.compile(str(p), doraise=True)
          print(f'compiled {len(files)} Python files')
          PY

      - name: Repository and project contracts
        run: |
          python scripts/framework_hygiene.py
          python scripts/machine_namespace_hygiene.py > machine-namespace-test.json
          python project_sdk.py self-test > project-sdk-test.json
          python project_adapter.py self-test > project-adapter-test.json
          python harness/runtime_capabilities.py self-test > runtime-capabilities-test.json
          python harness/runtime_capabilities.py probe-local --output local-capabilities.json
          python - <<'PY'
          import json
          ns=json.load(open('machine-namespace-test.json',encoding='utf-8'))
          assert ns['machine_namespace_contract']=='PASS',ns
          d=json.load(open('local-capabilities.json',encoding='utf-8'))
          assert d['schema']=='novelforge_host_capabilities_v1'
          assert d['secrets_embedded'] is False
          assert d['capabilities']['web_search']['available'] is False
          assert d['capabilities']['github_search']['available'] is False
          PY

      - name: Deterministic author and narrative state
        run: |
          python harness/context_inspector.py self-test > context-inspector-test.json
          python harness/context_assembly.py self-test > context-assembly-test.json
          python harness/memory_tiers.py self-test > memory-tiers-test.json
          python harness/memory_bank.py --db /tmp/novelforge-memory-bank-ci.db self-test --path /tmp/novelforge-memory-bank-selftest-ci.db > memory-bank-test.json
          python harness/scenario_fork.py --db /tmp/novelforge-scenario-ci.db self-test --path /tmp/novelforge-scenario-selftest-ci.db > scenario-fork-test.json
          python harness/property_write_policy.py self-test > property-write-policy-test.json
          python harness/propagation_debt.py self-test --path /tmp/novelforge-propagation-debt-contract-ci.db > propagation-debt-test.json
          python harness/state_integrity_cross_contract.py > state-integrity-cross-contract.json
          python harness/control_plane/write_intent_guard.py self-test > write-intent-guard-test.json
          python quality/findings.py self-test > quality-finding-test.json
          python quality/quality_taxonomy.py self-test > quality-taxonomy-test.json
          python quality/repair_policy.py self-test > repair-policy-test.json
          python quality/candidate_qualification.py self-test > candidate-qualification-test.json
          python quality/regression_escape.py self-test > regression-escape-test.json
          python quality/objective_envelope.py self-test > objective-envelope-test.json
          python quality/repair_objective_regression.py self-test > repair-objective-regression-test.json
          python evals/pre_independent_qualification.py self-test > pre-independent-qualification-test.json
          python evals/repair_objective_preservation.py self-test > repair-objective-preservation-test.json
          python evals/pre_independent_qualification_ablation.py self-test > pre-independent-qualification-ablation-test.json
          python harness/semantic_workers/registered_contract_binding.py self-test > registered-contract-binding-test.json
          python harness/semantic_workers/peer_bridge_receipt.py self-test > peer-bridge-receipt-test.json
          python quality/production_readiness.py self-test > production-readiness-test.json
          python quality/production_release.py self-test > production-release-test.json
          python quality/prose_telemetry.py self-test > prose-telemetry-test.json
          python quality/reader_expectation.py --db /tmp/novelforge-reader-expectation-ci.db self-test --path /tmp/novelforge-reader-expectation-selftest-ci.db > reader-expectation-test.json
          python quality/quality_evolution.py --db /tmp/novelforge-quality-ci.db self-test --path /tmp/novelforge-quality-selftest-ci.db > quality-evolution-test.json
          python quality/state_graph.py self-test > state-graph-test.json
          python scripts/semantic_reference_integrity.py > semantic-reference-integrity-test.json

      - name: AI-native semantic contract kernel
        run: |
          python harness/semantic_workers/semantic_worker_router.py self-test > semantic-router-test.json
          python harness/semantic_workers/semantic_worker_router.py catalog > semantic-catalog-test.json
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('harness/semantic_workers')
          sys.path.insert(0,str(root))
          sys.path.insert(0,str(pathlib.Path('evals').resolve()))
          sys.path.insert(0,str(pathlib.Path('quality').resolve()))
          from objective_envelope import build as build_objective_envelope
          from registered_contract_binding import validate_registered_job
          from semantic_worker_router import make_contract_job, validate_dispatchable_job, validate_job
          from qualification_test_fixtures import make_qualified_receipt
          assert not (root/'model_contracts.json').exists()
          catalog=json.load(open(root/'model_contract_catalog.json',encoding='utf-8'))
          expected={cid for p in catalog['packs'] for cid in p['contracts']}
          assert len(expected)==sum(len(p['contracts']) for p in catalog['packs'])
          fp='sha256:'+'a'*64
          objective_envelope=build_objective_envelope({'subject_id':'CH-CI','run_id':'RUN-CI','authority_cutoff':'synthetic-ci','objective_items':[{'id':'OBJ-CI','category':'reader','statement':'Preserve reader pressure and forward pull.','source_refs':['plan:CI']}],'must_preserve':['reader pressure','forward pull'],'derived_from_rejected_realization':False})
          fixtures={
            'reader.reaction': {'candidate_text':'A bounded candidate.','persona_id':'binge_reader','reader_visible_context':[{'source_ref':'accepted:prior','text':'Only reader-visible prior context.'}]},
            'reader.engagement_audit': {'candidate_fingerprint':fp,'candidate_text':'A bounded cold-reader production candidate.','reader_grip':'very_high','reader_visible_context':[{'source_ref':'accepted:prior','text':'Only reader-visible prior context.'}]},
            'quality.candidate_self_audit': {'candidate_fingerprint':fp,'candidate_text':'A bounded manager self-audit candidate.','rule_material':[{'id':'HF-CI','authority':'framework','statement':'Use functional, owned, natural realization.'}],'regression_evidence':[],'profile_constraints':[],'voice_constraints':[],'reader_grip':'very_high'},
            'quality.semantic_rule_audit': {'candidate_fingerprint':fp,'candidate_text':'A bounded candidate for semantic rule audit.','rule_index':[{'id':'RULE-CI','severity':'blocking','authority':'framework','statement':'Do not contradict supplied accepted evidence.'}]},
            'quality.production_review': {'candidate_fingerprint':fp,'candidate_text':'A bounded independent production-review candidate.','reader_grip':'very_high','reader_visible_context':[{'source_ref':'accepted:prior','text':'Only reader-visible prior context.'}]},
            'learning.promotion_review': {'candidate_id':'LEARN-CI','scope':'user_taste','mechanism':'bounded preference mechanism','evidence_refs':['review:CI']},
            'character.action_propose': {'character_id':'CHAR-CI','current_story_order':9,'active_agenda':'Keep control of the immediate negotiation.','perceived_state':{'beliefs':['The other party may be bluffing.'],'goals':['Preserve leverage.'],'fears':[],'assumptions':[]},'immediate_situation':{'observables':[{'observable_id':'OBS-CI','observation':'The offer changed.','source_ref':'scene:CI','available_from_story_order':9}],'pressures':['Time is limited.'],'available_options':['stall','counter']},'perspective_memory':{'episodic_visible_events':[],'visibility_tagged_facts':[{'fact_id':'F-CI','claim':'The first offer was lower.','epistemic_status':'known','acquisition_mode':'directly_observed','source_ref':'accepted:scene-1','available_from_story_order':8}],'situation_patterns':[]},'relationship_state':{},'task_state':{},'location':{},'constraints':[]},
            'quality.compare': {'evolution_run_id':'RUN-CI','evolution_subject_id':'CH-CI','comparison_id':'CMP-CI','incumbent':{'candidate_id':'C0','content_fingerprint':'sha256:'+'0'*64},'challenger':{'candidate_id':'C1','content_fingerprint':'sha256:'+'1'*64,'repair_owner':'scene'},'repair_context':{'repair_target':'restore reader pressure','objective_envelope':objective_envelope}},
            'quality.ablation_compare': {'comparison_id':'ABL-CI','candidate_fingerprint':fp,'condition_a':{'condition_id':'A','input_fingerprint':'sha256:'+'1'*64,'result_fingerprint':'sha256:'+'2'*64,'judgment':{'confidence':0.8,'verdict':'accept','codes':[],'evidence':['A evidence']}},'condition_b':{'condition_id':'B','input_fingerprint':'sha256:'+'3'*64,'result_fingerprint':'sha256:'+'4'*64,'judgment':{'confidence':0.8,'verdict':'accept','codes':[],'evidence':['B evidence']}},'observation_criteria':['semantic stability','regression evidence']},
            'relationship.memory_reconcile': {'relationship_id':'REL-CI','current_story_order':9,'participants':['CHAR-A','CHAR-B'],'ordered_evidence':[{'evidence_id':'RE-CI','story_order':8,'source_ref':'accepted:REL-CI','authority':'accepted','event':'A promise created an obligation.','effects':{'obligation':'open'}}],'derived_snapshots':[{'snapshot_id':'RS-CI','as_of_story_order':8,'source_refs':['accepted:REL-CI'],'shared_state':{'status':'strained'},'per_character_perception':{'CHAR-A':'uneasy','CHAR-B':'guarded'},'open_obligations':['promise'],'emotional_residue':['distrust']}]},
            'continuity.commitment_audit': {'candidate':{'source_ref':'candidate:CI','evidence':[{'evidence_id':'E-CI','statement':'The negotiation ends with a new obligation.','source_ref':'candidate:CI#e1','story_order':9}]},'current_story_order':9,'commitments':[{'commitment_id':'COM-CI','statement':'The obligation must remain live.','authority':'active_plan','source_ref':'plan:CI'}],'required_transitions':[{'transition_id':'TR-CI','description':'Negotiation changes the parties leverage.','authority':'active_plan','source_ref':'plan:CI'}],'initial_facts':[{'fact_id':'FACT-CI','statement':'The parties begin with unequal leverage.','authority':'accepted','source_ref':'accepted:CI'}],'current_story_point':'SCN-CI'},
            'context.select': {'task':{'task_mode':'DRAFT','task_goal':'Choose only evidence needed to decide CHAR-CI next action.','current_story_point':'SCN-CI','current_story_order':9,'perspective':{'scope':'character','perspective_id':'CHAR-CI'},'active_questions':[{'question_id':'Q-CI','question':'What does CHAR-CI know about the offer?','kind':'state','as_of_story_point':'SCN-CI','as_of_story_order':9}]},'memory_blocks':[{'block_id':'M-CI','pinned':False,'authority':False,'derived':True,'source_refs':['accepted:CI'],'story_point':'SCN-CI','available_from_story_order':9,'visibility':{'scope':'character','perspective_id':'CHAR-CI'},'model_view':{'label':'offer','value':'The first offer was lower.'}}]},
            'learning.preference_interpret': {'feedback_ref':'review:CI','feedback_text':'Keep the dialogue less explanatory in this exchange.','current_task':{'task_mode':'REVISE','artifact_ref':'draft:CI'}},
            'scene.realization_project': {'scene_id':'SCN-CI','resolved_trajectory':{'state':'negotiation_continues'},'character_action_evidence':[{'character_id':'CHAR-CI','action':'withhold full rationale and counter'}],'pov_boundary':{'perspective_id':'CHAR-CI','allowed_inner_state':True}},
            'editor.repair_spec': {'candidate_fingerprint':fp,'reader_assessment':{'result':'fail','report':'Dialogue over-explains role and risk.','evidence_refs':['candidate:1']},'objective_envelope':objective_envelope}
          }
          jobs={}
          for cid in sorted(expected):
              payload=fixtures.get(cid,{'fixture':'bounded semantic input'})
              qualification=make_qualified_receipt(fp,'CI-'+cid) if cid=='quality.production_review' else None
              job=make_contract_job(cid,'CI-'+cid,payload,source_session_id='SES-CI',qualification_receipt=qualification)
              assert not validate_job(job),(cid,validate_job(job))
              if cid=='quality.production_review': assert not validate_dispatchable_job(job),(cid,validate_dispatchable_job(job))
              assert not validate_registered_job(job),(cid,validate_registered_job(job))
              assert job['permissions']['canon_write'] is False
              assert job['permissions']['framework_behavior_write'] is False
              assert job['permissions']['durable_user_taste_write'] is False
              assert job['provenance']['source']=='model_contract_pack'
              assert job['provenance']['pack_id']
              if cid in fixtures: assert job['provenance']['input_contract_validated'] is True
              jobs[cid]=job['input_fingerprint']
          cold_reader_blocked=False
          try: make_contract_job('reader.reaction','CI-BLOCK',{'candidate_text':'x','persona_id':'binge_reader','active_plan':{'future':'secret'}})
          except ValueError: cold_reader_blocked=True
          assert cold_reader_blocked
          production_reader_hidden_context_blocked=False
          try: make_contract_job('reader.engagement_audit','CI-READER-BLOCK',{'candidate_fingerprint':fp,'candidate_text':'x','active_plan':{'future':'secret'}})
          except ValueError: production_reader_hidden_context_blocked=True
          assert production_reader_hidden_context_blocked
          production_review_missing_qualification_blocked=False
          try: make_contract_job('quality.production_review','CI-PROD-MISSING',{'candidate_fingerprint':fp,'candidate_text':'x'},source_session_id='SES-CI')
          except ValueError as exc: production_review_missing_qualification_blocked='qualification' in str(exc)
          assert production_review_missing_qualification_blocked
          production_review_hidden_context_blocked=False
          try: make_contract_job('quality.production_review','CI-PROD-BLOCK',{'candidate_fingerprint':fp,'candidate_text':'x','writer_reasoning':'secret'},source_session_id='SES-CI',qualification_receipt=make_qualified_receipt(fp,'CI-PROD-BLOCK'))
          except ValueError: production_review_hidden_context_blocked=True
          assert production_review_hidden_context_blocked
          rule_expected_verdict_blocked=False
          try: make_contract_job('quality.semantic_rule_audit','CI-RULE-BLOCK',{'candidate_fingerprint':fp,'candidate_text':'x','rule_index':[{'id':'R','severity':'blocking','authority':'framework','statement':'rule'}],'expected_verdict':'fail'})
          except ValueError: rule_expected_verdict_blocked=True
          assert rule_expected_verdict_blocked
          transition_guard=False
          try: make_contract_job('continuity.commitment_audit','CI-TR-BLOCK',{'candidate':{'source_ref':'candidate:x','evidence':['x']},'commitments':[]})
          except ValueError: transition_guard=True
          assert transition_guard
          context_guard=False
          try: make_contract_job('context.select','CI-CONTEXT-BLOCK',{'memory_blocks':[]})
          except ValueError: context_guard=True
          assert context_guard
          typed=['reader.reaction','reader.engagement_audit','quality.candidate_self_audit','quality.semantic_rule_audit','quality.production_review','learning.promotion_review','character.action_propose','quality.compare','quality.ablation_compare','continuity.commitment_audit','relationship.memory_reconcile','context.select','learning.preference_interpret','scene.realization_project','editor.repair_spec']
          json.dump({'semantic_contract_catalog_contract':'PASS','contracts':sorted(expected),'fingerprints':jobs,'typed_input_contracts':typed,'cold_reader_hidden_plan_guard':cold_reader_blocked,'production_reader_hidden_context_guard':production_reader_hidden_context_blocked,'production_review_missing_qualification_guard':production_review_missing_qualification_blocked,'production_review_hidden_context_guard':production_review_hidden_context_blocked,'semantic_rule_expected_verdict_guard':rule_expected_verdict_blocked,'required_transition_input_guard':transition_guard,'task_aware_context_input_guard':context_guard,'aggregate_registry_present':False,'model_execution':False},open('semantic-contracts-test.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          python harness/semantic_workers/peer_chat_relay.py self-test > peer-chat-test.json
          python harness/semantic_workers/adapters/local_agent_adapter.py --self-test > local-agent-test.json

      - name: Adaptive learning and Corpus
        run: |
          python learning/learning_store.py --db /tmp/novelforge-learning-ci.db self-test > learning-test.json
          python learning/learning_cycle.py self-test --path /tmp/novelforge-learning-cycle-ci.db > learning-cycle-test.json
          python learning/learning_eval.py self-test > learning-eval-test.json
          python learning/promotion_gate.py self-test > promotion-gate-test.json
          python learning/author_model.py self-test > author-model-test.json
          python corpus/corpus_scout.py self-test > corpus-scout-test.json
          python corpus/discovery_runtime.py self-test > discovery-runtime-test.json
          python corpus/rights_gate.py self-test > corpus-rights-test.json
          python - <<'PY'
          import json
          d=json.load(open('corpus/benchmarks/mechanisms.json',encoding='utf-8'))
          ids={x['id'] for x in d['benchmarks']}
          assert d['schema']=='novelforge_mechanism_benchmark_registry_v1'
          assert {'BENCH-SURFACE-001','BENCH-SURFACE-006','BENCH-READER-001','BENCH-READER-002'}.issubset(ids)
          assert all(x['provenance']['raw_source_text_stored'] is False for x in d['benchmarks'])
          PY

      - name: Framework bundle and generic evals
        run: |
          mkdir -p /tmp/novelforge-bundle-ci
          python publication/compiler.py self-test > publication-test.json
          python release/build_framework_bundle.py self-test > framework-bundle-test.json
          python release/build_framework_bundle.py build --output /tmp/novelforge-bundle-ci/a.tar --report bundle-a.json
          python release/build_framework_bundle.py build --output /tmp/novelforge-bundle-ci/b.tar --report bundle-b.json
          cmp /tmp/novelforge-bundle-ci/a.tar /tmp/novelforge-bundle-ci/b.tar
          EXPECTED="$(python -c "import json;print(json.load(open('bundle-a.json'))['bundle_fingerprint'])")"
          python release/build_framework_bundle.py verify --bundle /tmp/novelforge-bundle-ci/a.tar --expected "$EXPECTED" --report bundle-verify.json
          python evals/run_evals.py --release --json > eval-release.json
          python evals/build_judge_queue.py --output /tmp/blind-eval-queue.json
          python evals/run_evals.py --json > eval-all.json
          python - <<'PY'
          import json
          a=json.load(open('bundle-a.json'));b=json.load(open('bundle-b.json'));v=json.load(open('bundle-verify.json'))
          assert a['bundle_fingerprint']==b['bundle_fingerprint'] and v['valid'] is True
          q=json.load(open('/tmp/blind-eval-queue.json'))
          assert q['blind'] is True and len(q['cases'])>=8
          forbidden={'expected','expected_verdict','expected_codes','gold','gold_label','blocks_release','prior_result'}
          def walk(x):
              if isinstance(x,dict):
                  assert not forbidden.intersection(x)
                  for v in x.values():walk(v)
              elif isinstance(x,list):
                  for v in x:walk(v)
          walk(q)
          e=json.load(open('eval-all.json'))
          assert e['counts']['FAIL']==0 and e['counts']['ERROR']==0 and e['counts']['PENDING_MODEL']>=8
          PY

      - name: Session, control plane, and top-level CLI
        run: |
          python harness/session_runtime/session_runtime.py self-test > session-test.json
          python harness/control_plane/control_plane.py --db /tmp/novelforge-control-ci.db self-test > control-plane-test.json
          python harness/control_plane/mcp_stdio.py --self-test > mcp-test.json
          python novelforge.py self-test > cli-test.json

      - name: Assert deterministic contract results
        run: |
          python - <<'PY'
          import json
          checks={
            'machine-namespace-test.json':('machine_namespace_contract','PASS'),'project-sdk-test.json':('project_sdk_contract','PASS'),'project-adapter-test.json':('project_adapter_contract','PASS'),
            'runtime-capabilities-test.json':('runtime_capabilities_contract','PASS'),'context-inspector-test.json':('context_inspector_contract','PASS'),'context-assembly-test.json':('context_assembly_contract','PASS'),
            'memory-tiers-test.json':('memory_tiers_contract','PASS'),'memory-bank-test.json':('memory_bank_contract','PASS'),'scenario-fork-test.json':('scenario_fork_contract','PASS'),'property-write-policy-test.json':('property_write_policy_contract','PASS'),
            'propagation-debt-test.json':('propagation_debt_contract','PASS'),'state-integrity-cross-contract.json':('contract','PASS'),'write-intent-guard-test.json':('write_intent_guard_contract','PASS'),
            'quality-finding-test.json':('quality_finding_contract','PASS'),'quality-taxonomy-test.json':('quality_taxonomy_contract','PASS'),'repair-policy-test.json':('repair_policy_contract','PASS'),
            'registered-contract-binding-test.json':('registered_contract_binding_contract','PASS'),'peer-bridge-receipt-test.json':('peer_bridge_receipt_contract','PASS'),'production-readiness-test.json':('production_readiness_contract','PASS'),
            'production-release-test.json':('production_release_contract','PASS'),'prose-telemetry-test.json':('prose_telemetry_contract','PASS'),'reader-expectation-test.json':('reader_expectation_contract','PASS'),'quality-evolution-test.json':('quality_evolution_contract','PASS'),
            'state-graph-test.json':('state_graph_contract','PASS'),'semantic-reference-integrity-test.json':('semantic_reference_integrity','PASS'),'semantic-router-test.json':('semantic_router_contract','PASS'),
            'semantic-contracts-test.json':('semantic_contract_catalog_contract','PASS'),'peer-chat-test.json':('peer_chat_relay_contract','PASS'),'local-agent-test.json':('local_agent_adapter_contract','PASS'),
            'learning-test.json':('learning_store_contract','PASS'),'learning-cycle-test.json':('learning_cycle_contract','PASS'),'learning-eval-test.json':('learning_eval_contract','PASS'),'promotion-gate-test.json':('promotion_gate_contract','PASS'),'author-model-test.json':('author_model_contract','PASS'),
            'corpus-scout-test.json':('corpus_scout_contract','PASS'),'discovery-runtime-test.json':('discovery_runtime_contract','PASS'),'corpus-rights-test.json':('rights_gate_contract','PASS'),
            'publication-test.json':('publication_compiler_contract','PASS'),'framework-bundle-test.json':('framework_bundle_contract','PASS'),'session-test.json':('session_runtime_contract','PASS'),'control-plane-test.json':('control_plane_contract','PASS'),'mcp-test.json':('mcp_stdio_contract','PASS'),'cli-test.json':('novelforge_cli_contract','PASS')}
          loaded={p:json.load(open(p,encoding='utf-8')) for p in checks}
          for p,(k,v) in checks.items(): assert loaded[p][k]==v,(p,loaded[p])
          assert loaded['machine-namespace-test.json']['namespace']=='NovelForge-only'
          ca=loaded['context-assembly-test.json']; assert ca['required_missing_blocks'] is True and ca['private_writer_selection_blocks'] is True and ca['semantic_relevance_judged_by_runtime'] is False and ca['context_sufficiency_judged_by_runtime'] is False and ca['semantic_obligation_matching_supported'] is False
          assert loaded['write-intent-guard-test.json']['resource_action_mismatch_blocked'] is True
          assert loaded['write-intent-guard-test.json']['stale_before_state_blocked'] is True
          assert loaded['production-release-test.json']['reviewer_pass_missing_structural_receipt_blocks'] is True
          assert loaded['production-release-test.json']['all_required_receipts_pass'] is True
          assert loaded['production-release-test.json']['base_quality_failure_still_blocks'] is True
          assert loaded['prose-telemetry-test.json']['signals_only'] is True
          assert loaded['prose-telemetry-test.json']['short_paragraphs_auto_fail'] is False
          assert loaded['prose-telemetry-test.json']['optional_diagnostic_tool'] is True
          assert loaded['prose-telemetry-test.json']['default_blind_reader_input'] is False
          assert loaded['author-model-test.json']['user_taste_write_authority_alone_not_enough'] is True
          assert loaded['author-model-test.json']['user_taste_requires_promotion_prerequisite_and_write_authority'] is True
          assert loaded['memory-tiers-test.json']['schema']=='novelforge_memory_tiers_v4'
          assert loaded['memory-tiers-test.json']['perspective_incompatible_never_enters_semantic_packet'] is True
          assert loaded['memory-tiers-test.json']['future_block_never_enters_semantic_packet'] is True
          assert loaded['memory-tiers-test.json']['question_as_of_story_order_guard'] is True
          assert loaded['memory-tiers-test.json']['pin_temporal_conflict_fail_closed'] is True
          assert loaded['memory-tiers-test.json']['grounding_reports_budget_drop'] is True
          pw=loaded['property-write-policy-test.json']; assert pw['payload_cannot_self_escalate'] is True and pw['mixed_writer_routes_to_reconcile'] is True and pw['policy_absence_preserves_legacy_behavior'] is True and pw['derived_only_is_non_authoritative'] is True and pw['route_authority_is_scoped'] is True
          pd=loaded['propagation-debt-test.json']; assert pd['no_global_invalidation_without_dependency'] is True and pd['conflicting_replay_is_rejected'] is True and pd['restart_preserves_open_debt_without_duplicate'] is True
          cross=loaded['state-integrity-cross-contract.json']; assert cross['checks']['runtime_authorization_is_valid_and_granted'] is True and cross['checks']['runtime_authorization_scope_excludes_project_write'] is True and cross['checks']['runtime_writer_cannot_bypass_settlement_only_property'] is True and cross['checks']['only_settlement_writer_gets_guarded_direct_route'] is True
