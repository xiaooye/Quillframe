<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="t d">
<title id="t">故事事实权威层级</title><desc id="d">五种权威状态，并明确计划不是正典、已接受也不等于已经完成状态落定。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24212A}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#716A74}.title{font-size:28px;font-weight:760}.label{font-size:17px;font-weight:700}.body{font-size:14px;fill:#716A74}.line{stroke:#D9D1C6;stroke-width:1.5;fill:none}</style>
<rect width="920" height="300" fill="#FFF9F0"/><text x="48" y="38" class="eyebrow">权威层级</text><text x="48" y="72" class="title">不同状态，不会自动向上升级。</text>
<circle cx="93" cy="118" r="5" fill="#24212A"/><text x="116" y="123" class="label">锁定</text><text x="310" y="123" class="body">受保护基线</text><circle cx="93" cy="152" r="5" fill="#6AA985"/><text x="116" y="157" class="label">已接受</text><text x="310" y="157" class="body">明确编辑决定</text><circle cx="93" cy="186" r="5" fill="#7AAED6"/><text x="116" y="191" class="label">活动计划</text><text x="310" y="191" class="body">未来意图</text><circle cx="93" cy="220" r="5" fill="#8D7CCB"/><text x="116" y="225" class="label">评审</text><text x="310" y="225" class="body">候选稿</text><circle cx="93" cy="254" r="5" fill="#716A74"/><text x="116" y="259" class="label">提案</text><text x="310" y="259" class="body">不具权威的建议</text><path d="M93 123 L93 249" class="line"/>
<rect x="610" y="124" width="250" height="96" rx="22" fill="#FFF3CF"/><text x="634" y="151" class="eyebrow">关键边界</text><text x="634" y="181" class="label">计划 ≠ 正典</text><text x="634" y="207" class="label">已接受 ≠ 已落定</text>
</svg>