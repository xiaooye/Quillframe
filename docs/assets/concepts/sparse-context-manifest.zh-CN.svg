<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 304" role="img" aria-labelledby="t d">
<title id="t">稀疏上下文清单</title><desc id="d">从项目、人物、状态、研究资料和基准材料中，只选择与当前任务直接相关的引用。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24212A}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#716A74}.title{font-size:28px;font-weight:760}.label{font-size:17px;font-weight:700}.body{font-size:14px;fill:#716A74}.line{stroke:#D9D1C6;stroke-width:1.5;fill:none}</style>
<rect width="920" height="304" fill="#FFF9F0"/><text x="48" y="38" class="eyebrow">稀疏上下文清单</text><text x="48" y="72" class="title">模式完整，工作集合稀疏。</text>
<rect x="55" y="126" width="130" height="48" rx="16" fill="#EAF5FF"/><text x="120" y="156" class="label" text-anchor="middle">项目 / 章节</text><rect x="200" y="126" width="130" height="48" rx="16" fill="#FCECF3"/><text x="265" y="156" class="label" text-anchor="middle">人物</text><rect x="345" y="126" width="130" height="48" rx="16" fill="#E7F7EE"/><text x="410" y="156" class="label" text-anchor="middle">状态</text><rect x="490" y="126" width="130" height="48" rx="16" fill="#FFF3CF"/><text x="555" y="156" class="label" text-anchor="middle">研究资料</text><rect x="635" y="126" width="130" height="48" rx="16" fill="#F1ECFF"/><text x="700" y="156" class="label" text-anchor="middle">基准材料</text><path d="M105 207 C240 250 610 250 802 207" class="line"/><circle cx="802" cy="207" r="6" fill="#24212A"/><text x="802" y="238" class="body" text-anchor="middle">当前调用</text><text x="48" y="280" class="body">已存储 ≠ 已注入；相关 ≠ 有权威。</text>
</svg>