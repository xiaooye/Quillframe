<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="t d">
<title id="t">Settlement Transaction</title>
<desc id="d">Acceptance、State Delta、Before-state CAS、Authorized Write、Projection 与 Post-condition。</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24212A}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#716A74}
.title{font-size:28px;font-weight:760}
.label{font-size:17px;font-weight:700}
.body{font-size:14px;fill:#716A74}
.micro{font-size:12px;fill:#716A74}
.line{stroke:#D9D1C6;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke:#716A74;stroke-width:1.3;stroke-dasharray:6 7;fill:none}
</style>
<rect width="920" height="300" fill="#FFF9F0"/>
<text x="48" y="38" class="eyebrow">SETTLEMENT</text><text x="48" y="72" class="title">Accepted Evidence 只有在这里才变成 Durable State。</text><circle cx="78" cy="154" r="6" fill="#C985A4"/><text x="78" y="184" class="label" text-anchor="middle">ACCEPT</text><text x="78" y="205" class="micro" text-anchor="middle">明确接受</text><path d="M87 154 L213 154" class="line"/><circle cx="222" cy="154" r="6" fill="#BE9A45"/><text x="222" y="184" class="label" text-anchor="middle">DELTA</text><text x="222" y="205" class="micro" text-anchor="middle">State Delta</text><path d="M231 154 L357 154" class="line"/><circle cx="366" cy="154" r="6" fill="#8D7CCB"/><text x="366" y="184" class="label" text-anchor="middle">CAS</text><text x="366" y="205" class="micro" text-anchor="middle">Before-state</text><path d="M375 154 L501 154" class="line"/><circle cx="510" cy="154" r="6" fill="#6AA985"/><text x="510" y="184" class="label" text-anchor="middle">WRITE</text><text x="510" y="205" class="micro" text-anchor="middle">授权写入</text><path d="M519 154 L645 154" class="line"/><circle cx="654" cy="154" r="6" fill="#7AAED6"/><text x="654" y="184" class="label" text-anchor="middle">PROJECT</text><text x="654" y="205" class="micro" text-anchor="middle">派生视图</text><path d="M663 154 L789 154" class="line"/><circle cx="798" cy="154" r="6" fill="#6AA985"/><text x="798" y="184" class="label" text-anchor="middle">CHECK</text><text x="798" y="205" class="micro" text-anchor="middle">Post-condition</text><rect x="550" y="237" width="310" height="34" rx="10" fill="#FCE8E8"/><text x="705" y="259" class="body" text-anchor="middle">mismatch → settlement_incomplete</text>
</svg>