<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="t d">
<title id="t">状态落定事务</title><desc id="d">从明确接受、状态变化、前置状态校验、授权写入、派生更新到事后条件检查。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24212A}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#716A74}.title{font-size:28px;font-weight:760}.label{font-size:17px;font-weight:700}.micro{font-size:12px;fill:#716A74}.body{font-size:14px;fill:#716A74}.line{stroke:#D9D1C6;stroke-width:1.5;fill:none}</style>
<rect width="920" height="300" fill="#FFF9F0"/><text x="48" y="38" class="eyebrow">状态落定</text><text x="48" y="72" class="title">已接受证据只有在这里才变成持久状态。</text>
<circle cx="78" cy="154" r="6" fill="#C985A4"/><text x="78" y="184" class="label" text-anchor="middle">接受</text><text x="78" y="205" class="micro" text-anchor="middle">明确决定</text><path d="M87 154 L213 154" class="line"/><circle cx="222" cy="154" r="6" fill="#BE9A45"/><text x="222" y="184" class="label" text-anchor="middle">变化</text><text x="222" y="205" class="micro" text-anchor="middle">状态差量</text><path d="M231 154 L357 154" class="line"/><circle cx="366" cy="154" r="6" fill="#8D7CCB"/><text x="366" y="184" class="label" text-anchor="middle">校验</text><text x="366" y="205" class="micro" text-anchor="middle">前置状态</text><path d="M375 154 L501 154" class="line"/><circle cx="510" cy="154" r="6" fill="#6AA985"/><text x="510" y="184" class="label" text-anchor="middle">写入</text><text x="510" y="205" class="micro" text-anchor="middle">明确授权</text><path d="M519 154 L645 154" class="line"/><circle cx="654" cy="154" r="6" fill="#7AAED6"/><text x="654" y="184" class="label" text-anchor="middle">派生</text><text x="654" y="205" class="micro" text-anchor="middle">更新视图</text><path d="M663 154 L789 154" class="line"/><circle cx="798" cy="154" r="6" fill="#6AA985"/><text x="798" y="184" class="label" text-anchor="middle">检查</text><text x="798" y="205" class="micro" text-anchor="middle">事后条件</text><rect x="550" y="237" width="310" height="34" rx="10" fill="#FCE8E8"/><text x="705" y="259" class="body" text-anchor="middle">不匹配 → 落定未完成</text>
</svg>