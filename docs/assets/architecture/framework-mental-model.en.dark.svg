<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="t d">
<title id="t">Quillframe framework mental model — dark</title>
<desc id="d">Open three-region architecture showing orchestration, execution and verification, and authorized settlement on a dark canvas.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#F5EFF8}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#BEB4C3}
.title{font-size:28px;font-weight:760}
.label{font-size:17px;font-weight:700}
.body{font-size:14px;fill:#BEB4C3}
.line{stroke:#625B68;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect width="920" height="300" fill="#18151E"/>
<text x="48" y="38" class="eyebrow">FRAMEWORK MENTAL MODEL</text><text x="48" y="72" class="title">From story authority to durable state</text>
<rect x="44" y="105" width="225" height="136" rx="22" fill="#1C2A35"/><rect x="292" y="105" width="350" height="136" rx="22" fill="#29233C"/><rect x="668" y="105" width="208" height="136" rx="22" fill="#1D3027"/>
<text x="64" y="129" class="eyebrow">ORCHESTRATION</text><text x="64" y="165" class="label">Project authority</text><text x="64" y="192" class="body">Manager + sparse context</text>
<text x="316" y="129" class="eyebrow">EXECUTION + VERIFICATION</text><text x="316" y="165" class="label">Semantic work</text><text x="316" y="190" class="body">Exact candidates · fingerprints</text><text x="316" y="213" class="body">Qualification · independent review</text>
<text x="692" y="129" class="eyebrow">SETTLEMENT</text><text x="692" y="165" class="label">Authorized write</text><text x="692" y="190" class="body">before → after</text><text x="692" y="213" class="body">post-condition</text>
<path d="M269 174 L292 174" class="line"/><path d="M642 174 L668 174" class="line"/><circle cx="281" cy="174" r="4" fill="#E0B85A"/><circle cx="655" cy="174" r="4" fill="#E0B85A"/>
<text x="48" y="273" class="body">Evidence can move forward; authority never does so implicitly.</text>
</svg>
