<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 294" role="img" aria-labelledby="t d">
<title id="t">框架与项目</title><desc id="d">通用框架机制与项目专属故事事实权威保持分离。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#24212A}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#716A74}.title{font-size:28px;font-weight:760}.label{font-size:17px;font-weight:700}.body{font-size:14px;fill:#716A74}.micro{font-size:12px;fill:#716A74}.line{stroke:#D9D1C6;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="920" height="294" fill="#FFF9F0"/><text x="48" y="38" class="eyebrow">框架与项目</text><text x="48" y="72" class="title">通用机制，与具体故事事实权威分离。</text>
<rect x="52" y="112" width="330" height="120" rx="22" fill="#F1ECFF"/><rect x="538" y="112" width="330" height="120" rx="22" fill="#EAF5FF"/>
<text x="76" y="138" class="eyebrow">QUILLFRAME</text><text x="76" y="169" class="label">故事 · 质量 · 运行时</text><text x="76" y="194" class="body">学习 · 语料库 · 评测 · 开发工具</text>
<text x="562" y="138" class="eyebrow">项目</text><text x="562" y="169" class="label">人物 · 正典 · 状态</text><text x="562" y="194" class="body">计划 · 研究资料 · 正文</text>
<path d="M392 171 L526 171" class="line"/><text x="459" y="155" class="micro" text-anchor="middle">依赖</text><text x="459" y="198" class="micro" text-anchor="middle">不反向导入</text><text x="48" y="270" class="body">项目 → 框架；绝不反向吸收项目私有故事事实。</text>
</svg>