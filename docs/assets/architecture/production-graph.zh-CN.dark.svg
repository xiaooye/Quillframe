<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-labelledby="t d">
<title id="t">Quillframe 生产图 — 深色</title><desc id="d">在深色画布上展示从稀疏上下文、场景模拟、内部候选稿、资格检查、独立评审到用户可见交付门的生产流程与修订回路。</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#F5EFF8}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#BEB4C3}.title{font-size:28px;font-weight:760}.label{font-size:17px;font-weight:700}.body{font-size:14px;fill:#BEB4C3}.micro{font-size:12px;fill:#BEB4C3}.line{stroke:#625B68;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#8F8496;stroke-width:1.3;stroke-dasharray:6 7;fill:none}</style>
<rect width="920" height="310" fill="#18151E"/><text x="48" y="38" class="eyebrow">生产图</text><text x="48" y="72" class="title">章节是一轮生产运行，不是一次模型补全。</text>
<circle cx="82" cy="151" r="7" fill="#83B8E0"/><text x="82" y="181" class="label" text-anchor="middle">冻结</text><path d="M91 151 L217 151" class="line"/><circle cx="226" cy="151" r="7" fill="#A89AE8"/><text x="226" y="181" class="label" text-anchor="middle">模拟</text><path d="M235 151 L361 151" class="line"/><circle cx="370" cy="151" r="7" fill="#E58AAF"/><text x="370" y="181" class="label" text-anchor="middle">候选稿</text><path d="M379 151 L505 151" class="line"/><circle cx="514" cy="151" r="7" fill="#E0B85A"/><text x="514" y="181" class="label" text-anchor="middle">资格</text><path d="M523 151 L649 151" class="line"/><circle cx="658" cy="151" r="7" fill="#A89AE8"/><text x="658" y="181" class="label" text-anchor="middle">评审</text><path d="M667 151 L793 151" class="line"/><circle cx="802" cy="151" r="7" fill="#79BE98"/><text x="802" y="181" class="label" text-anchor="middle">交付</text>
<text x="82" y="209" class="micro" text-anchor="middle">稀疏上下文</text><text x="226" y="209" class="micro" text-anchor="middle">故事 · 人物 · 读者</text><text x="370" y="209" class="micro" text-anchor="middle">内部原始稿</text><text x="514" y="209" class="micro" text-anchor="middle">修复且保持</text><text x="658" y="209" class="micro" text-anchor="middle">独立调用</text><text x="802" y="209" class="micro" text-anchor="middle">对用户可见</text>
<path d="M520 237 C480 276 360 276 300 232" class="dash"/><text x="409" y="277" class="body" text-anchor="middle">修订回到真正负责问题的机制</text>
