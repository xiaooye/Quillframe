</style>
<rect width="920" height="300" fill="#FFF9F0"/>
<text x="48" y="38" class="eyebrow">FRAMEWORK MENTAL MODEL</text><text x="48" y="72" class="title">From story authority to durable state</text><rect x="44" y="105" width="225" height="136" rx="22" fill="#EAF5FF"/><rect x="292" y="105" width="350" height="136" rx="22" fill="#F1ECFF"/><rect x="668" y="105" width="208" height="136" rx="22" fill="#E7F7EE"/><text x="64" y="129" class="eyebrow">ORCHESTRATION</text><text x="64" y="165" class="label">Project authority</text><text x="64" y="192" class="body">Manager + sparse context</text><text x="316" y="129" class="eyebrow">EXECUTION + VERIFICATION</text><text x="316" y="165" class="label">Semantic work</text><text x="316" y="190" class="body">Exact candidates · fingerprints</text><text x="316" y="213" class="body">Qualification · independent review</text><text x="692" y="129" class="eyebrow">SETTLEMENT</text><text x="692" y="165" class="label">Authorized write</text><text x="692" y="190" class="body">before → after</text><text x="692" y="213" class="body">post-condition</text><path d="M269 174 L292 174" class="line"/><path d="M642 174 L668 174" class="line"/><circle cx="281" cy="174" r="4" fill="#BE9A45"/><circle cx="655" cy="174" r="4" fill="#BE9A45"/><text x="48" y="273" class="body">Evidence can move forward; authority never does so implicitly.</text>
</svg>