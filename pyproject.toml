[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quillframe"
version = "0.9.0"
description = "Quillframe agent runtime and fiction-production core library"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Quillframe"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = [
  "quillframe*",
  "agent_runtime*",
  "model_runtime*",
  "persistence*",
  "harness*",
]
namespaces = true

[tool.setuptools.package-data]
agent_runtime = ["*.json"]
model_runtime = ["*.json"]
persistence = ["migrations/**/*.sql"]
