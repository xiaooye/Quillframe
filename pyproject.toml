[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quillframe"
version = "1.0.0-dev.0"
description = "Quillframe agent runtime and fiction-production core library"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Quillframe"}]
dependencies = []

[project.scripts]
quillframe = "quillframe.cli:main"

[tool.setuptools]
py-modules = ["core_operations", "project_resolution"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "quillframe*",
  "agent_runtime*",
  "model_runtime*",
  "persistence*",
  "production_runtime*",
  "publication*",
  "harness*",
  "quality*",
  "learning*",
  "corpus*",
  "studio*",
  "surface*",
]
namespaces = true

[tool.setuptools.package-data]
agent_runtime = ["*.json"]
model_runtime = ["*.json"]
persistence = ["schema/**/*.sql"]
harness = ["**/*.json"]
quality = ["*.json"]
learning = ["*.json"]
corpus = ["**/*.json", "**/*.md", "**/*.sql", "**/*.yaml", "**/*.yml"]
surface = ["craft/*.json", "craft/*.md", "craft/cards/*.md", "craft/history/**/*.json", "craft/history/**/*.md"]
studio = [
  "*.json",
  "app/dist/*",
  "app/dist/**/*",
  "app/dist/.well-known/quillframe-studio-footprint.json",
  "app/dist/.well-known/quillframe-host.json",
  "app/dist/.well-known/security.txt",
]
