<!doctype html>
<html lang="en" data-novelforge-godot-shadow="loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fffdfc" />
  <title>NovelForge · Godot parity shadow</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fffdfc}body{font-family:system-ui,sans-serif}#canvas{display:block;width:100%;height:100%;outline:0;background:#fffdfc}.nf-loader{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 72% 18%,rgba(249,221,233,.46),transparent 38%),radial-gradient(circle at 18% 26%,rgba(221,238,248,.55),transparent 35%),#fffdfc;color:#2d2636;transition:opacity .22s ease}.nf-loader[data-hidden="true"]{opacity:0;pointer-events:none}.nf-loader-inner{display:grid;gap:12px;text-align:center}.nf-mark{font-weight:800;letter-spacing:-.03em;font-size:22px}.nf-note{font-size:12px;color:#746b7d}.nf-progress{width:min(280px,70vw);height:6px;border-radius:999px;background:#eee8f1;overflow:hidden}.nf-progress>i{display:block;width:14%;height:100%;background:#796bc4;border-radius:inherit;animation:load 1.15s ease-in-out infinite alternate}@keyframes load{to{width:92%}}@media(prefers-reduced-motion:reduce){.nf-progress>i{animation:none;width:72%}}
  </style>
</head>
<body>
  <canvas id="canvas">Your browser does not support canvas.</canvas>
  <div id="nf-loader" class="nf-loader"><div class="nf-loader-inner"><div class="nf-mark">NovelForge</div><div class="nf-note">Godot parity shadow · production remains Solid until visual gate passes</div><div class="nf-progress"><i></i></div></div></div>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    const engine = new Engine(GODOT_CONFIG);
    engine.startGame({canvas: document.getElementById('canvas')}).then(() => {
      document.documentElement.dataset.novelforgeGodotEngine = 'started';
    }).catch((error) => {
      document.documentElement.dataset.novelforgeGodotEngine = 'error';
      document.documentElement.dataset.novelforgeGodotShadow = 'error';
      console.error(error);
    });
    window.addEventListener('novelforge:godot-ready', () => {
      document.documentElement.dataset.novelforgeGodotShadow = 'ready';
      document.getElementById('nf-loader')?.setAttribute('data-hidden','true');
    }, {once:true});
  </script>
</body>
</html>
