name: One-shot runtime event registry repair

on:
  push:
    branches: [agent/runtime-event-registry-sync]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-event-registry-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact registry/parity patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('harness/control_plane/control_plane.py')
          text = p.read_text(encoding='utf-8')

          old = '''EVENT_TYPES = {\n    "session.resume_requested",\n'''
          new = '''EVENT_TYPES = {\n    "session.resume_requested",\n    "session.terminate_requested",\n'''
          assert text.count(old) == 1, 'EVENT_TYPES anchor drifted'
          text = text.replace(old, new, 1)

          old = '''    cp = ControlPlane(path)\n    cp.init()\n    session = {'''
          new = '''    cp = ControlPlane(path)\n    cp.init()\n    event_schema = json.loads(Path(__file__).with_name("event_schema.json").read_text(encoding="utf-8"))\n    schema_event_types = set(event_schema["properties"]["event_type"]["enum"])\n    event_registry_aligned = EVENT_TYPES == schema_event_types\n    session = {'''
          assert text.count(old) == 1, 'self-test setup anchor drifted'
          text = text.replace(old, new, 1)

          old = '''    ok = all([first_session["version"] == 1, duplicate_session["duplicate"] is True, first_event["duplicate"] is False,'''
          new = '''    ok = all([event_registry_aligned, first_session["version"] == 1, duplicate_session["duplicate"] is True, first_event["duplicate"] is False,'''
          assert text.count(old) == 1, 'self-test ok anchor drifted'
          text = text.replace(old, new, 1)

          old = '''    return {"control_plane_contract": "PASS" if ok else "FAIL", "sqlite_durable_store": True, "idempotent_event_ingress": duplicate_event["duplicate"],'''
          new = '''    return {"control_plane_contract": "PASS" if ok else "FAIL", "event_schema_registry_aligned": event_registry_aligned, "sqlite_durable_store": True, "idempotent_event_ingress": duplicate_event["duplicate"],'''
          assert text.count(old) == 1, 'self-test result anchor drifted'
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify exact repair
        run: |
          git diff --check
          python -m py_compile harness/control_plane/control_plane.py harness/session_runtime/terminate_executor.py
          python harness/control_plane/control_plane.py --db /tmp/novelforge-registry-fix.db self-test
          python harness/session_runtime/terminate_executor.py self-test
          python novelforge.py self-test
      - name: Commit only the runtime repair
        run: |
          rm .github/workflows/tmp-runtime-event-registry-sync.yml
          git status --short
          EXPECTED="$(printf '%s\n' '.github/workflows/tmp-runtime-event-registry-sync.yml' 'harness/control_plane/control_plane.py')"
          test "$(git diff --name-only | sort)" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'runtime: synchronize terminate event registry'
          git push origin HEAD:agent/runtime-event-registry-sync
