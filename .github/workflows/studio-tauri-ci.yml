name: Studio Tauri 2 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'site/**'
      - 'studio/app/package.json'
      - 'studio/app/src/**'
      - 'studio/app/public/**'
      - 'studio/app/scripts/**'
      - 'studio/app/tests/**'
      - 'studio/app/vite.config.ts'
      - 'studio/app/tsconfig.json'
      - 'studio/app/index.html'
      - 'studio/app/src-tauri/**'
      - 'studio/tauri_core_sidecar.py'
      - 'studio/scripts/build_tauri_sidecar.py'
      - 'studio/host_bridge.py'
      - 'studio/host_bridge_protocol.py'
      - 'studio/host_bridge_contract.json'
      - 'model_runtime/**'
      - 'persistence/**'
      - 'agent_runtime/**'
      - 'core_operations.py'
      - 'production_runtime/**'
      - 'publication/**'
      - 'project_resolution.py'
      - 'harness/**'
      - 'quality/**'
      - 'schemas/**'
      - 'VERSION'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/studio-tauri-ci.yml'
      - '.github/workflows/quillframe-ci.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'site/**'
      - 'studio/app/package.json'
      - 'studio/app/src/**'
      - 'studio/app/public/**'
      - 'studio/app/scripts/**'
      - 'studio/app/tests/**'
      - 'studio/app/vite.config.ts'
      - 'studio/app/tsconfig.json'
      - 'studio/app/index.html'
      - 'studio/app/src-tauri/**'
      - 'studio/tauri_core_sidecar.py'
      - 'studio/scripts/build_tauri_sidecar.py'
      - 'studio/host_bridge.py'
      - 'studio/host_bridge_protocol.py'
      - 'studio/host_bridge_contract.json'
      - 'model_runtime/**'
      - 'persistence/**'
      - 'agent_runtime/**'
      - 'core_operations.py'
      - 'production_runtime/**'
      - 'publication/**'
      - 'project_resolution.py'
      - 'harness/**'
      - 'quality/**'
      - 'schemas/**'
      - 'VERSION'
      - 'pyproject.toml'
      - 'tests/**'
      - '.github/workflows/studio-tauri-ci.yml'
      - '.github/workflows/quillframe-ci.yml'

permissions:
  contents: read

jobs:
  linux-desktop-host:
    name: Studio Tauri native contract
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install CI YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux prerequisites
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config dbus-x11 gnome-keyring
      - name: Install the single root workspace lock
        run: pnpm install --frozen-lockfile
      - name: Verify the Tauri CI contract
        run: python -m unittest tests.test_tauri_ci_contract -v
      - name: Build Studio assets
        run: pnpm --filter @quillframe/studio-app build:assets
      - name: Install Chromium for browser gates
        run: pnpm --filter @quillframe/studio-app exec playwright-core install chromium
      - name: Run Studio browser smoke
        run: pnpm --filter @quillframe/studio-app browser:smoke
      - name: Run Studio local launch smoke
        run: pnpm --filter @quillframe/studio-app browser:launch
      - name: Finalize Studio generated artifacts
        run: pnpm --filter @quillframe/studio-app build:finalize
      - name: Install pinned sidecar builder
        run: python -m pip install --disable-pip-version-check 'pyinstaller>=6.16,<7'
      - name: Sidecar source self-test
        run: |
          set -euo pipefail
          report="$(mktemp)"
          trap 'rm -f "$report"' EXIT
          python studio/tauri_core_sidecar.py self-test >"$report"
          python - "$report" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["model_execution"] is False
          assert report["authority"] is False
          PY
      - name: Build target-suffixed Python Core sidecar
        run: python studio/scripts/build_tauri_sidecar.py
      - name: Assert target-suffixed sidecar executable
        run: |
          set -euo pipefail
          target="$(rustc -vV | sed -n 's/^host: //p')"
          sidecar="studio/app/src-tauri/binaries/quillframe-core-${target}"
          test -x "$sidecar"
      - name: Rust format gate
        run: cargo fmt --manifest-path studio/app/src-tauri/Cargo.toml -- --check
      - name: Rust metadata gate
        run: cargo metadata --locked --no-deps --manifest-path studio/app/src-tauri/Cargo.toml --format-version 1
      - name: Rust clippy gate
        run: cargo clippy --locked --manifest-path studio/app/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rust test gate
        run: cargo test --locked --manifest-path studio/app/src-tauri/Cargo.toml
      - name: Rust check gate
        run: cargo check --locked --manifest-path studio/app/src-tauri/Cargo.toml
      - name: Real OS Secret Service round-trip
        run: |
          set -euo pipefail
          dbus-run-session -- bash -lc '
            set -euo pipefail
            runtime="$(mktemp -d)"
            trap "rm -rf \"$runtime\"" EXIT
            export XDG_RUNTIME_DIR="$runtime"
            printf "ci-keyring\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --locked --manifest-path studio/app/src-tauri/Cargo.toml os_keyring_roundtrip -- --ignored
          '
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version '=2.11.4' --locked
      - name: Build Tauri thin host
        working-directory: studio/app
        run: cargo tauri build --debug --no-bundle --config src-tauri/tauri.conf.json -- --locked
