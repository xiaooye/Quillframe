name: Quillframe Studio Tauri

on:
  push:
    paths: ['studio/app/**', 'native/**', 'persistence/schema/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml']
  pull_request:
    paths: ['studio/app/**', 'native/**', 'persistence/schema/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml']

permissions:
  contents: read

jobs:
  direct-rust-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @quillframe/studio-app typecheck
      - run: corepack pnpm --filter @quillframe/studio-app test
      - run: corepack pnpm --filter @quillframe/studio-app build
      - run: cargo fmt --manifest-path studio/app/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path studio/app/src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path studio/app/src-tauri/Cargo.toml --locked
