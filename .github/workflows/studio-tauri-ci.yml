name: Studio Tauri 2 CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'studio/app/src-tauri/**'
      - 'studio/tauri_core_sidecar.py'
      - 'studio/scripts/build_tauri_sidecar.py'
      - 'studio/host_bridge.py'
      - 'studio/host_bridge_contract.json'
      - 'model_runtime/**'
      - 'persistence/**'
      - '.github/workflows/studio-tauri-ci.yml'
  push:
    branches: [main]
    paths:
      - 'studio/app/src-tauri/**'
      - 'studio/tauri_core_sidecar.py'
      - 'studio/scripts/build_tauri_sidecar.py'
      - 'studio/host_bridge.py'
      - 'studio/host_bridge_contract.json'
      - 'model_runtime/**'
      - 'persistence/**'
      - '.github/workflows/studio-tauri-ci.yml'

permissions:
  contents: write

jobs:
  linux-desktop-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Generate exact Tauri Cargo lock
        run: cargo generate-lockfile --manifest-path studio/app/src-tauri/Cargo.toml
      - name: Commit exact Tauri Cargo lock
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add studio/app/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already matches the resolved graph'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(tauri): lock Desktop host dependencies'
          git push origin HEAD:${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: studio/app/pnpm-lock.yaml
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config dbus-x11 gnome-keyring
      - name: Install Studio and sidecar build dependencies
        run: |
          cd studio/app && pnpm install --frozen-lockfile
          python -m pip install 'pyinstaller>=6.16,<7'
      - name: Studio Web consumer regression
        run: cd studio/app && pnpm build
      - name: Python sidecar source contract
        run: python studio/tauri_core_sidecar.py self-test
      - name: Build target-suffixed Python Core sidecar
        run: python studio/scripts/build_tauri_sidecar.py
      - name: Rust host unit tests and compile
        run: |
          cargo test --locked --manifest-path studio/app/src-tauri/Cargo.toml
          cargo check --locked --manifest-path studio/app/src-tauri/Cargo.toml
      - name: Real OS Secret Service round-trip
        run: |
          dbus-run-session -- bash -lc '
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            printf "ci-keyring\n" | gnome-keyring-daemon --unlock --components=secrets >/tmp/qf-keyring.env
            cat /tmp/qf-keyring.env
            cargo test --locked --manifest-path studio/app/src-tauri/Cargo.toml os_keyring_roundtrip -- --ignored --nocapture
          '
      - name: Tauri 2 thin-host build
        run: |
          cargo install tauri-cli --version '=2.11.4' --locked
          cd studio/app
          cargo tauri build --debug --no-bundle -- --locked
