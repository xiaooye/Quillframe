name: Production Runtime Security Fix

on:
  push:
    branches: ['agent/production-runtime-integration']

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-runtime-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Harden Host Bridge secret output boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('studio/host_bridge.py')
          text = p.read_text(encoding='utf-8')

          old = '''_SECRET_REQUEST_KEYS = {"access_token", "api_key", "apikey", "password", "secret", "token"}\n_secret_store: SecretStore = MemorySecretStore()\n'''
          new = '''_SECRET_REQUEST_KEYS = {"access_token", "api_key", "apikey", "password", "secret", "token"}\n_SECRET_OPERATIONS = {"model.service.add", "model.service.token.replace"}\n_secret_store: SecretStore = MemorySecretStore()\n'''
          if old not in text:
              raise SystemExit('secret key marker not found')
          text = text.replace(old, new, 1)

          old = '''def _redact(value: Any) -> Any:\n    """Remove credential values without erasing business authorization evidence."""\n    if isinstance(value, dict):\n        out: dict[str, Any] = {}\n        for key, child in value.items():\n            normalized = str(key).lower().replace("-", "_")\n            out[str(key)] = "<redacted>" if normalized in _SECRET_REQUEST_KEYS else _redact(child)\n        return out\n    if isinstance(value, list):\n        return [_redact(child) for child in value]\n    return value\n'''
          new = '''def _secret_values(value: Any) -> set[str]:\n    """Collect credential values only from explicitly secret-bearing request fields."""\n    found: set[str] = set()\n\n    def visit(node: Any) -> None:\n        if isinstance(node, dict):\n            for key, child in node.items():\n                normalized = str(key).lower().replace("-", "_")\n                if normalized in _SECRET_REQUEST_KEYS:\n                    if isinstance(child, str) and child:\n                        found.add(child)\n                    continue\n                visit(child)\n        elif isinstance(node, list):\n            for child in node:\n                visit(child)\n\n    visit(value)\n    return found\n\n\ndef _redact(value: Any, secret_values: set[str] | None = None) -> Any:\n    """Remove credential keys and scrub their values from nested strings.\n\n    Business authorization evidence remains fingerprint-bound because only values\n    originating from explicitly credential-bearing fields are treated as secrets.\n    """\n    secrets = secret_values or set()\n    if isinstance(value, dict):\n        out: dict[str, Any] = {}\n        for key, child in value.items():\n            normalized = str(key).lower().replace("-", "_")\n            out[str(key)] = "<redacted>" if normalized in _SECRET_REQUEST_KEYS else _redact(child, secrets)\n        return out\n    if isinstance(value, list):\n        return [_redact(child, secrets) for child in value]\n    if isinstance(value, str):\n        scrubbed = value\n        for secret in sorted(secrets, key=len, reverse=True):\n            if secret:\n                scrubbed = scrubbed.replace(secret, "<redacted>")\n        return scrubbed\n    return value\n'''
          if old not in text:
              raise SystemExit('redact block not found')
          text = text.replace(old, new, 1)

          old = '''def result(req: dict[str, Any], status: str, *, data: Any = None, error: Any = None) -> dict[str, Any]:\n    safe_req = _redact(req)\n    safe_data = _redact(data)\n    safe_error = _redact(error)\n    out = {\n        "schema": RESULT_SCHEMA,\n        "request_id": req.get("request_id"),\n        "operation": req.get("operation"),\n        "surface": req.get("surface"),\n'''
          new = '''def result(req: dict[str, Any], status: str, *, data: Any = None, error: Any = None) -> dict[str, Any]:\n    secrets = _secret_values(req)\n    safe_req = _redact(req, secrets)\n    safe_data = _redact(data, secrets)\n    safe_error = _redact(error, secrets)\n    out = {\n        "schema": RESULT_SCHEMA,\n        "request_id": safe_req.get("request_id"),\n        "operation": safe_req.get("operation"),\n        "surface": safe_req.get("surface"),\n'''
          if old not in text:
              raise SystemExit('result block not found')
          text = text.replace(old, new, 1)

          old = '''    out = invoke(req)\n    print(json.dumps(out, ensure_ascii=False, indent=2))\n    return 0 if out["status"] == "ok" else 1\n'''
          new = '''    out = invoke(req)\n    # `invoke` emits only the credential-scrubbed public bridge result. Raw request\n    # payloads and credential-bearing exception text are never written to stdout.\n    # codeql[py/clear-text-logging-sensitive-data]\n    print(json.dumps(out, ensure_ascii=False, indent=2))\n    return 0 if out["status"] == "ok" else 1\n'''
          if old not in text:
              raise SystemExit('cli output block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          t = Path('tests/test_quillframe_production_host_bridge.py')
          tests = t.read_text(encoding='utf-8')
          marker = '''    def test_production_and_secret_operations_are_not_agent_package_operations(self):\n'''
          addition = '''    def test_secret_value_is_scrubbed_from_nested_data_and_exception_text(self):\n        secret = "QF-SECRET-EXCEPTION-SENTINEL"\n        req = {\n            "schema": host_bridge.REQUEST_SCHEMA,\n            "request_id": "secret-error",\n            "operation": "model.service.add",\n            "surface": "local_app",\n            "args": {"endpoint": "https://example.invalid/v1", "access_token": secret},\n            "authority": False,\n        }\n        out = host_bridge.result(\n            req,\n            "failed",\n            data={"diagnostic": f"provider echoed {secret}"},\n            error={"code": "fixture", "message": f"request rejected credential {secret}"},\n        )\n        serialized = str(out)\n        self.assertNotIn(secret, serialized)\n        self.assertIn("<redacted>", serialized)\n        self.assertEqual(out["operation"], "model.service.add")\n        self.assertFalse(out["secret_values_persisted"])\n\n'''
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          if 'test_secret_value_is_scrubbed_from_nested_data_and_exception_text' not in tests:
              tests = tests.replace(marker, addition + marker, 1)
          t.write_text(tests, encoding='utf-8')
          PY
          python -m unittest tests.test_quillframe_production_host_bridge -v
          python studio/host_bridge.py self-test
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add studio/host_bridge.py tests/test_quillframe_production_host_bridge.py
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): scrub bridge credential output"
            git push origin HEAD:agent/production-runtime-integration
          fi
