name: One-time Runtime Branch CSS Surgery

on:
  push:
    branches: [studio/runtime-observability]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/runtime-observability
          fetch-depth: 0
      - name: Remove Studio-owned bottom-nav active chrome
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('studio/app/src/styles/atelier-workbench.css')
          text = path.read_text(encoding='utf-8')

          active_pattern = re.compile(
              r'\n\s*:root\[data-experience="story-loom-kawaii-atelier-v5"\] '
              r'\.nf-bottom-nav-item\[data-active="true"\]\s*\{\s*'
              r'color:\s*var\(--wui-color-primary\);\s*'
              r'background:\s*var\(--nf-workbench-accent-soft\);\s*'
              r'box-shadow:\s*none;\s*\}\s*',
              re.MULTILINE,
          )
          forced_pattern = re.compile(
              r'(:root\[data-experience="story-loom-kawaii-atelier-v5"\] '
              r'\.nf-nav-item\[data-active="true"\]),\s*\n\s*'
              r':root\[data-experience="story-loom-kawaii-atelier-v5"\] '
              r'\.nf-bottom-nav-item\[data-active="true"\]\s*\{'
          )

          text, active_count = active_pattern.subn('\n', text, count=1)
          text, forced_count = forced_pattern.subn(r'\1 {', text, count=1)
          if active_count != 1:
              raise SystemExit(f'expected one bottom-nav active block, found {active_count}')
          if forced_count != 1:
              raise SystemExit(f'expected one forced-colors combined selector, found {forced_count}')
          if '.nf-bottom-nav-item[data-active' in text:
              raise SystemExit('bottom-nav active selector still present')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- studio/app/src/styles/atelier-workbench.css
      - name: Commit exact cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add studio/app/src/styles/atelier-workbench.css
          git diff --cached --quiet && exit 0
          git commit -m 'studio: return bottom-nav active chrome to WeiUI'
          git push origin HEAD:studio/runtime-observability
