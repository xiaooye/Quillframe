name: Studio v8 AppShell Fixup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/studio-authoring-slice-20260818' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/studio-authoring-slice-20260818
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply AppShell patch
        run: |
          python studio/app/scripts/appshell-v8-fixup.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add studio/app/src/AppShell.tsx
          if ! git diff --cached --quiet; then
            git commit -m "feat(studio): execute Core v8 production from AI Dock"
            git push origin HEAD:agent/studio-authoring-slice-20260818
          fi
