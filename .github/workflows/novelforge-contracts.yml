name: NovelForge Reusable Release Contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile every Python module
        run: |
          python - <<'PY'
          import pathlib, py_compile
          files=[p for p in pathlib.Path('.').rglob('*.py') if '.git' not in p.parts]
          for p in files: py_compile.compile(str(p), doraise=True)
          print(f'compiled {len(files)} Python files')
          PY

      - name: Repository and project contracts
        run: |
          python scripts/framework_hygiene.py
          python scripts/machine_namespace_hygiene.py > machine-namespace-test.json
          python project_sdk.py self-test > project-sdk-test.json
          python project_adapter.py self-test > project-adapter-test.json
          python harness/runtime_capabilities.py self-test > runtime-capabilities-test.json
          python harness/runtime_capabilities.py probe-local --output local-capabilities.json
          python - <<'PY'
          import json
          ns=json.load(open('machine-namespace-test.json',encoding='utf-8'))
          assert ns['machine_namespace_contract']=='PASS',ns
          d=json.load(open('local-capabilities.json',encoding='utf-8'))
          assert d['schema']=='novelforge_host_capabilities_v1'
          assert d['secrets_embedded'] is False
          assert d['capabilities']['web_search']['available'] is False
          assert d['capabilities']['github_search']['available'] is False
          PY

      - name: Deterministic author and narrative state
        run: |
          python harness/context_inspector.py self-test > context-inspector-test.json
          python harness/memory_tiers.py self-test > memory-tiers-test.json
          python harness/memory_bank.py --db /tmp/novelforge-memory-bank-ci.db self-test --path /tmp/novelforge-memory-bank-selftest-ci.db > memory-bank-test.json
          python harness/scenario_fork.py --db /tmp/novelforge-scenario-ci.db self-test --path /tmp/novelforge-scenario-selftest-ci.db > scenario-fork-test.json
          python quality/findings.py self-test > quality-finding-test.json
          python quality/reader_expectation.py --db /tmp/novelforge-reader-expectation-ci.db self-test --path /tmp/novelforge-reader-expectation-selftest-ci.db > reader-expectation-test.json
          python quality/quality_evolution.py --db /tmp/novelforge-quality-ci.db self-test --path /tmp/novelforge-quality-selftest-ci.db > quality-evolution-test.json
          python quality/state_graph.py self-test > state-graph-test.json

      - name: AI-native semantic contract kernel
        run: |
          python harness/semantic_workers/semantic_worker_router.py self-test > semantic-router-test.json
          python harness/semantic_workers/semantic_worker_router.py catalog > semantic-catalog-test.json
          python - <<'PY'
          import json, pathlib, sys
          root=pathlib.Path('harness/semantic_workers')
          sys.path.insert(0,str(root))
          from semantic_worker_router import make_contract_job, validate_job
          assert not (root/'model_contracts.json').exists()
          catalog=json.load(open(root/'model_contract_catalog.json',encoding='utf-8'))
          expected={cid for p in catalog['packs'] for cid in p['contracts']}
          assert len(expected)==sum(len(p['contracts']) for p in catalog['packs'])
          fixtures={
            'reader.reaction': {
              'candidate_text': 'A bounded candidate.',
              'persona_id': 'binge_reader',
              'reader_visible_context': [{'source_ref':'accepted:prior','text':'Only reader-visible prior context.'}]
            },
            'character.action_propose': {
              'character_id':'CHAR-CI',
              'active_agenda':'Keep control of the immediate negotiation.',
              'perceived_state': {'beliefs':['The other party may be bluffing.'],'goals':['Preserve leverage.'],'fears':[],'assumptions':[]},
              'immediate_situation': {'observables':['The offer changed.'],'pressures':['Time is limited.'],'available_options':['stall','counter']},
              'perspective_memory': {
                'episodic_visible_events': [],
                'visibility_tagged_facts': [{'fact_id':'F-CI','claim':'The first offer was lower.','epistemic_status':'known','source_ref':'accepted:scene-1'}],
                'situation_patterns': []
              },
              'relationship_state': {}, 'task_state': {}, 'location': {}, 'constraints': []
            },
            'quality.compare': {
              'evolution_run_id':'RUN-CI', 'evolution_subject_id':'CH-CI', 'comparison_id':'CMP-CI',
              'incumbent': {'candidate_id':'C0','content_fingerprint':'sha256:'+'0'*64},
              'challenger': {'candidate_id':'C1','content_fingerprint':'sha256:'+'1'*64,'repair_owner':'scene'},
              'repair_context': {'targets':['reader pressure']}
            },
            'continuity.commitment_audit': {
              'candidate': {'source_ref':'candidate:CI','evidence':['The negotiation ends with a new obligation.']},
              'commitments': [{'commitment_id':'COM-CI','statement':'The obligation must remain live.','authority':'active_plan','source_ref':'plan:CI'}],
              'required_transitions': [{'transition_id':'TR-CI','description':'Negotiation changes the parties leverage.','authority':'active_plan','source_ref':'plan:CI'}],
              'initial_facts': [{'fact_id':'FACT-CI','statement':'The parties begin with unequal leverage.','authority':'accepted','source_ref':'accepted:CI'}],
              'current_story_point':'SCN-CI'
            }
          }
          jobs={}
          for cid in sorted(expected):
              payload=fixtures.get(cid,{'fixture':'bounded semantic input'})
              job=make_contract_job(cid,'CI-'+cid,payload,source_session_id='SES-CI')
              assert not validate_job(job),(cid,validate_job(job))
              assert job['permissions']['canon_write'] is False
              assert job['permissions']['os_behavior_write'] is False
              assert job['permissions']['durable_user_taste_write'] is False
              assert job['provenance']['source']=='model_contract_pack'
              assert job['provenance']['pack_id']
              if cid in fixtures:
                  assert job['provenance']['input_contract_validated'] is True
              jobs[cid]=job['input_fingerprint']
          cold_reader_blocked=False
          try:
              make_contract_job('reader.reaction','CI-BLOCK',{'candidate_text':'x','persona_id':'binge_reader','active_plan':{'future':'secret'}})
          except ValueError:
              cold_reader_blocked=True
          assert cold_reader_blocked
          transition_guard=False
          try:
              make_contract_job('continuity.commitment_audit','CI-TR-BLOCK',{'candidate':{'source_ref':'candidate:x','evidence':['x']},'commitments':[]})
          except ValueError:
              transition_guard=True
          assert transition_guard
          json.dump({'semantic_contract_catalog_contract':'PASS','contracts':sorted(expected),'fingerprints':jobs,'typed_input_contracts':['reader.reaction','character.action_propose','quality.compare','continuity.commitment_audit'],'cold_reader_hidden_plan_guard':cold_reader_blocked,'required_transition_input_guard':transition_guard,'aggregate_registry_present':False,'model_execution':False},open('semantic-contracts-test.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          python harness/semantic_workers/peer_chat_relay.py self-test > peer-chat-test.json
          python harness/semantic_workers/adapters/local_agent_adapter.py --self-test > local-agent-test.json

      - name: Adaptive learning and Corpus
        run: |
          python learning/learning_store.py --db /tmp/novelforge-learning-ci.db self-test > learning-test.json
          python learning/learning_cycle.py self-test --path /tmp/novelforge-learning-cycle-ci.db > learning-cycle-test.json
          python learning/learning_eval.py self-test > learning-eval-test.json
          python learning/promotion_gate.py self-test > promotion-gate-test.json
          python corpus/corpus_scout.py self-test > corpus-scout-test.json
          python corpus/discovery_runtime.py self-test > discovery-runtime-test.json
          python corpus/rights_gate.py self-test > corpus-rights-test.json
          python - <<'PY'
          import json
          d=json.load(open('corpus/benchmarks/mechanisms.json',encoding='utf-8'))
          ids={x['id'] for x in d['benchmarks']}
          assert d['schema']=='novelforge_mechanism_benchmark_registry_v1'
          assert {'BENCH-SURFACE-001','BENCH-SURFACE-006','BENCH-READER-001','BENCH-READER-002'}.issubset(ids)
          assert all(x['provenance']['raw_source_text_stored'] is False for x in d['benchmarks'])
          PY

      - name: Framework bundle and generic evals
        run: |
          mkdir -p /tmp/novelforge-bundle-ci
          python release/build_framework_bundle.py self-test > framework-bundle-test.json
          python release/build_framework_bundle.py build --output /tmp/novelforge-bundle-ci/a.tar --report bundle-a.json
          python release/build_framework_bundle.py build --output /tmp/novelforge-bundle-ci/b.tar --report bundle-b.json
          cmp /tmp/novelforge-bundle-ci/a.tar /tmp/novelforge-bundle-ci/b.tar
          EXPECTED="$(python -c "import json;print(json.load(open('bundle-a.json'))['bundle_fingerprint'])")"
          python release/build_framework_bundle.py verify --bundle /tmp/novelforge-bundle-ci/a.tar --expected "$EXPECTED" --report bundle-verify.json
          python evals/run_evals.py --release --json > eval-release.json
          python evals/build_judge_queue.py --output /tmp/blind-eval-queue.json
          python evals/run_evals.py --json > eval-all.json
          python - <<'PY'
          import json
          a=json.load(open('bundle-a.json'));b=json.load(open('bundle-b.json'));v=json.load(open('bundle-verify.json'))
          assert a['bundle_fingerprint']==b['bundle_fingerprint'] and v['valid'] is True
          q=json.load(open('/tmp/blind-eval-queue.json'))
          assert q['blind'] is True and len(q['cases'])>=8
          forbidden={'expected','expected_verdict','expected_codes','gold','gold_label','blocks_release','prior_result'}
          def walk(x):
              if isinstance(x,dict):
                  assert not forbidden.intersection(x)
                  for v in x.values():walk(v)
              elif isinstance(x,list):
                  for v in x:walk(v)
          walk(q)
          e=json.load(open('eval-all.json'))
          assert e['counts']['FAIL']==0 and e['counts']['ERROR']==0 and e['counts']['PENDING_MODEL']>=8
          PY

      - name: Session, control plane, and top-level CLI
        run: |
          python harness/session_runtime/session_runtime.py self-test > session-test.json
          python harness/control_plane/control_plane.py --db /tmp/novelforge-control-ci.db self-test > control-plane-test.json
          python harness/control_plane/mcp_stdio.py --self-test > mcp-test.json
          python novelforge.py self-test > cli-test.json

      - name: Assert deterministic contract results
        run: |
          python - <<'PY'
          import json
          checks={
            'machine-namespace-test.json':('machine_namespace_contract','PASS'),
            'project-sdk-test.json':('project_sdk_contract','PASS'),'project-adapter-test.json':('project_adapter_contract','PASS'),
            'runtime-capabilities-test.json':('runtime_capabilities_contract','PASS'),'context-inspector-test.json':('context_inspector_contract','PASS'),
            'memory-tiers-test.json':('memory_tiers_contract','PASS'),'memory-bank-test.json':('memory_bank_contract','PASS'),
            'scenario-fork-test.json':('scenario_fork_contract','PASS'),'quality-finding-test.json':('quality_finding_contract','PASS'),
            'reader-expectation-test.json':('reader_expectation_contract','PASS'),'quality-evolution-test.json':('quality_evolution_contract','PASS'),
            'state-graph-test.json':('state_graph_contract','PASS'),'semantic-router-test.json':('semantic_router_contract','PASS'),
            'semantic-contracts-test.json':('semantic_contract_catalog_contract','PASS'),'peer-chat-test.json':('peer_chat_relay_contract','PASS'),
            'local-agent-test.json':('local_agent_adapter_contract','PASS'),'learning-test.json':('learning_store_contract','PASS'),
            'learning-cycle-test.json':('learning_cycle_contract','PASS'),'learning-eval-test.json':('learning_eval_contract','PASS'),
            'promotion-gate-test.json':('promotion_gate_contract','PASS'),'corpus-scout-test.json':('corpus_scout_contract','PASS'),
            'discovery-runtime-test.json':('discovery_runtime_contract','PASS'),'corpus-rights-test.json':('rights_gate_contract','PASS'),
            'framework-bundle-test.json':('framework_bundle_contract','PASS'),'session-test.json':('session_runtime_contract','PASS'),
            'control-plane-test.json':('control_plane_contract','PASS'),'mcp-test.json':('mcp_stdio_contract','PASS'),'cli-test.json':('novelforge_cli_contract','PASS')}
          loaded={p:json.load(open(p,encoding='utf-8')) for p in checks}
          for p,(k,v) in checks.items():assert loaded[p][k]==v,(p,loaded[p])
          assert loaded['machine-namespace-test.json']['namespace']=='NovelForge-only'
          s=loaded['semantic-router-test.json']
          assert s['fingerprint_excludes_runtime_lineage'] is True
          assert s['catalog_exact_id_resolution'] is True
          assert s['aggregate_registry_required'] is False
          assert s['typed_input_validation'] is True
          assert s['typed_output_validation'] is True and s['semantic_intelligence_externalized'] is True
          sc=loaded['semantic-contracts-test.json']
          assert sc['aggregate_registry_present'] is False
          assert sc['cold_reader_hidden_plan_guard'] is True
          assert sc['required_transition_input_guard'] is True
          assert set(sc['typed_input_contracts'])=={'reader.reaction','character.action_propose','quality.compare','continuity.commitment_audit'}
          assert loaded['quality-evolution-test.json']['plateau_stopping'] is True
          assert loaded['quality-evolution-test.json']['winner_derived_from_typed_result'] is True
          assert loaded['promotion-gate-test.json']['auto_behavior_write'] is False
          assert loaded['discovery-runtime-test.json']['network_execution_performed'] is False
          assert loaded['framework-bundle-test.json']['tamper_detected'] is True
          assert loaded['cli-test.json']['model_execution'] is False
          PY

      - name: Authority and no-fabricated-worker boundaries
        env:
          OPENAI_API_KEY: ''
          NOVELFORGE_SEMANTIC_WORKER_CMD: ''
          NOVELFORGE_DISABLE_LOCAL_AGENT_AUTO: '1'
        run: |
          python - <<'PY'
          import json
          event=json.load(open('harness/control_plane/event_schema.json'))
          assert event['properties']['schema']['const']=='novelforge_event_v1'
          assert not set(event['properties']['event_type']['enum']).intersection({'draft.requested','settlement.apply','canon.write','os.promote'})
          handoff=json.load(open('harness/control_plane/handoff_schema.json'))
          assert handoff['properties']['schema']['const']=='novelforge_handoff_v1'
          perms=handoff['properties']['permissions']['properties']
          assert all(perms[k]['const'] is False for k in ('canon_write','os_behavior_write','durable_user_taste_write'))
          PY
          python harness/semantic_workers/semantic_worker_runner.py capabilities > direct-capabilities.json
          python - <<'PY'
          import json
          d=json.load(open('direct-capabilities.json'))
          assert d['independent_worker_available'] is False
          assert d['fallback_without_adapter']=='semantic_pending_at_direct_layer'
          assert {'control_plane_mcp','peer_chat_relay'}.issubset(d['higher_level_transports'])
          PY

      - name: OpenAI adapter dry-run only
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'harness/semantic_workers')
          from semantic_worker_router import make_contract_job
          json.dump(make_contract_job('reader.reaction','CI',{'candidate_text':'fixture','persona_id':'binge_reader'}),open('/tmp/job.json','w'))
          PY
          python harness/semantic_workers/adapters/openai_responses_adapter.py --dry-run < /tmp/job.json > openai-dry-run.json
          python - <<'PY'
          import json
          d=json.load(open('openai-dry-run.json'))
          assert d['valid'] is True and d['request']['store'] is False
          assert d['request']['text']['format']['type']=='json_schema'
          assert d['authorization_header_included'] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelforge-contract-artifacts
          path: |
            *-test.json
            eval-release.json
            eval-all.json
            local-capabilities.json
            bundle-a.json
            bundle-b.json
            bundle-verify.json
            direct-capabilities.json
            openai-dry-run.json
          if-no-files-found: warn
