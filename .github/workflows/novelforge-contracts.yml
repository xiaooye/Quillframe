name: NovelForge Reusable Release Contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile every Python module
        run: |
          python - <<'PY'
          import pathlib,py_compile
          files=[p for p in pathlib.Path('.').rglob('*.py') if '.git' not in p.parts]
          for p in files: py_compile.compile(str(p),doraise=True)
          print(f'compiled {len(files)} Python files')
          PY

      - name: Repository hygiene and generic-boundary gate
        run: python scripts/framework_hygiene.py

      - name: Project SDK and mapped Adapter contracts
        run: |
          python project_sdk.py self-test > project-sdk-test.json
          python project_adapter.py self-test > project-adapter-test.json

      - name: Runtime capability contract
        run: |
          python harness/runtime_capabilities.py self-test > runtime-capabilities-test.json
          python harness/runtime_capabilities.py probe-local --output local-capabilities.json
          python - <<'PY'
          import json
          d=json.load(open('local-capabilities.json',encoding='utf-8'))
          assert d['schema']=='novelforge_host_capabilities_v1'
          assert d['secrets_embedded'] is False
          # CI network/process primitives never imply remote Web/GitHub authorization.
          assert d['capabilities']['web_search']['available'] is False
          assert d['capabilities']['github_search']['available'] is False
          PY

      - name: Author control and quality evolution contracts
        run: |
          python harness/context_inspector.py self-test > context-inspector-test.json
          python harness/memory_tiers.py self-test > memory-tiers-test.json
          python harness/memory_bank.py --db /tmp/novelforge-memory-bank-ci.db self-test --path /tmp/novelforge-memory-bank-selftest-ci.db > memory-bank-test.json
          python quality/findings.py self-test > quality-finding-test.json
          python quality/reader_panel.py self-test > reader-panel-test.json
          python quality/quality_evolution.py --db /tmp/novelforge-quality-ci.db self-test --path /tmp/novelforge-quality-selftest-ci.db > quality-evolution-test.json
          python quality/revision_orchestrator.py self-test > revision-orchestrator-test.json
          python quality/character_integrity.py self-test > character-integrity-test.json
          python quality/state_graph.py self-test > state-graph-test.json

      - name: Adaptive learning and Corpus contracts
        run: |
          python learning/learning_store.py --db /tmp/novelforge-learning-ci.db self-test > learning-test.json
          python learning/learning_cycle.py self-test --path /tmp/novelforge-learning-cycle-ci.db > learning-cycle-test.json
          python learning/learning_eval.py self-test > learning-eval-test.json
          python learning/promotion_gate.py self-test > promotion-gate-test.json
          python corpus/corpus_scout.py self-test > corpus-scout-test.json
          python corpus/discovery_runtime.py self-test > discovery-runtime-test.json
          python corpus/rights_gate.py self-test > corpus-rights-test.json
          python - <<'PY'
          import json
          d=json.load(open('corpus/benchmarks/mechanisms.json',encoding='utf-8'))
          assert d['schema']=='novelforge_mechanism_benchmark_registry_v1'
          ids={x['id'] for x in d['benchmarks']}
          assert {'BENCH-SURFACE-001','BENCH-SURFACE-006','BENCH-READER-001','BENCH-READER-002'}.issubset(ids)
          assert all(x['provenance']['raw_source_text_stored'] is False for x in d['benchmarks'])
          PY

      - name: Immutable Framework bundle contract
        run: |
          mkdir -p /tmp/novelforge-bundle-ci
          python release/build_framework_bundle.py self-test > framework-bundle-test.json
          python release/build_framework_bundle.py build --output /tmp/novelforge-bundle-ci/a.tar --report bundle-a.json
          python release/build_framework_bundle.py build --output /tmp/novelforge-bundle-ci/b.tar --report bundle-b.json
          cmp /tmp/novelforge-bundle-ci/a.tar /tmp/novelforge-bundle-ci/b.tar
          EXPECTED="$(python -c "import json;print(json.load(open('bundle-a.json'))['bundle_fingerprint'])")"
          python release/build_framework_bundle.py verify --bundle /tmp/novelforge-bundle-ci/a.tar --expected "$EXPECTED" --report bundle-verify.json
          python - <<'PY'
          import json
          a=json.load(open('bundle-a.json',encoding='utf-8'))
          b=json.load(open('bundle-b.json',encoding='utf-8'))
          v=json.load(open('bundle-verify.json',encoding='utf-8'))
          assert a['bundle_fingerprint']==b['bundle_fingerprint']
          assert a['model_execution'] is False and v['model_execution'] is False
          assert v['valid'] is True
          PY

      - name: Generic eval deterministic release gate
        run: python evals/run_evals.py --release --json > eval-release.json

      - name: Build and inspect blind semantic eval queue
        run: |
          python evals/build_judge_queue.py --output /tmp/blind-eval-queue.json
          python - <<'PY'
          import json
          q=json.load(open('/tmp/blind-eval-queue.json',encoding='utf-8'))
          assert q['blind'] is True
          assert len(q['cases']) >= 8
          forbidden={'expected','expected_verdict','expected_codes','gold','gold_label','blocks_release','prior_result'}
          def walk(v):
              if isinstance(v,dict):
                  assert not forbidden.intersection(v), forbidden.intersection(v)
                  for x in v.values(): walk(x)
              elif isinstance(v,list):
                  for x in v: walk(x)
          walk(q)
          PY

      - name: Verify semantic evals remain pending without judgments
        run: |
          python evals/run_evals.py --json > eval-all.json
          python - <<'PY'
          import json
          d=json.load(open('eval-all.json',encoding='utf-8'))
          assert d['counts']['FAIL']==0
          assert d['counts']['ERROR']==0
          assert d['counts']['PENDING_MODEL'] >= 8
          PY

      - name: Session and Control Plane contracts
        run: |
          python harness/session_runtime/session_runtime.py self-test > session-test.json
          python harness/control_plane/control_plane.py --db /tmp/novelforge-control-ci.db self-test > control-plane-test.json
          python harness/control_plane/mcp_stdio.py --self-test > mcp-test.json

      - name: Semantic transport contracts
        run: |
          python harness/semantic_workers/semantic_worker_router.py self-test > semantic-router-test.json
          python harness/semantic_workers/peer_chat_relay.py self-test > peer-chat-test.json
          python harness/semantic_workers/adapters/local_agent_adapter.py --self-test > local-agent-test.json

      - name: Top-level CLI contract
        run: python novelforge.py self-test > cli-test.json

      - name: Assert deterministic contract results
        run: |
          python - <<'PY'
          import json
          checks={
            'project-sdk-test.json':('project_sdk_contract','PASS'),
            'project-adapter-test.json':('project_adapter_contract','PASS'),
            'runtime-capabilities-test.json':('runtime_capabilities_contract','PASS'),
            'context-inspector-test.json':('context_inspector_contract','PASS'),
            'memory-tiers-test.json':('memory_tiers_contract','PASS'),
            'memory-bank-test.json':('memory_bank_contract','PASS'),
            'quality-finding-test.json':('quality_finding_contract','PASS'),
            'reader-panel-test.json':('reader_panel_contract','PASS'),
            'quality-evolution-test.json':('quality_evolution_contract','PASS'),
            'revision-orchestrator-test.json':('revision_orchestrator_contract','PASS'),
            'character-integrity-test.json':('character_integrity_contract','PASS'),
            'state-graph-test.json':('state_graph_contract','PASS'),
            'learning-test.json':('learning_store_contract','PASS'),
            'learning-cycle-test.json':('learning_cycle_contract','PASS'),
            'learning-eval-test.json':('learning_eval_contract','PASS'),
            'promotion-gate-test.json':('promotion_gate_contract','PASS'),
            'corpus-scout-test.json':('corpus_scout_contract','PASS'),
            'discovery-runtime-test.json':('discovery_runtime_contract','PASS'),
            'corpus-rights-test.json':('rights_gate_contract','PASS'),
            'framework-bundle-test.json':('framework_bundle_contract','PASS'),
            'session-test.json':('session_runtime_contract','PASS'),
            'control-plane-test.json':('control_plane_contract','PASS'),
            'mcp-test.json':('mcp_stdio_contract','PASS'),
            'semantic-router-test.json':('semantic_router_contract','PASS'),
            'peer-chat-test.json':('peer_chat_relay_contract','PASS'),
            'local-agent-test.json':('local_agent_adapter_contract','PASS'),
            'cli-test.json':('novelforge_cli_contract','PASS'),
          }
          loaded={}
          for path,(key,expected) in checks.items():
              d=json.load(open(path,encoding='utf-8'));loaded[path]=d;assert d[key]==expected,(path,d)
          cp=loaded['control-plane-test.json']
          assert cp['idempotent_event_ingress'] and cp['lease_claim'] and cp['exactly_once_consumption'] and cp['authority_guard']
          assert loaded['semantic-router-test.json']['fingerprint_excludes_runtime_lineage'] is True
          assert loaded['learning-cycle-test.json']['logical_consume_once'] is True
          assert loaded['promotion-gate-test.json']['auto_behavior_write'] is False
          assert loaded['discovery-runtime-test.json']['network_execution_performed'] is False
          assert loaded['framework-bundle-test.json']['tamper_detected'] is True
          assert loaded['reader-panel-test.json']['independent_gate_satisfied'] is False
          assert loaded['reader-panel-test.json']['first_shown_bias_detected'] is True
          assert loaded['context-inspector-test.json']['protected_edit_downgraded_to_proposal'] is True
          assert loaded['context-inspector-test.json']['pre_draft_regression_isolation'] is True
          assert loaded['memory-tiers-test.json']['hard_budget'] is True
          assert loaded['memory-tiers-test.json']['whole_item_or_skip'] is True
          assert loaded['memory-bank-test.json']['protected_edit_to_proposal'] is True
          assert loaded['memory-bank-test.json']['before_state_guard'] is True
          assert loaded['memory-bank-test.json']['proposal_pre_draft_isolation'] is True
          assert loaded['memory-bank-test.json']['canon_write'] is False
          assert loaded['quality-evolution-test.json']['logical_consume_once'] is True
          assert loaded['quality-evolution-test.json']['idempotent_replay'] is True
          assert loaded['quality-evolution-test.json']['plateau_stopping'] is True
          assert loaded['revision-orchestrator-test.json']['failure_isolation'] is True
          assert loaded['revision-orchestrator-test.json']['surface_cluster_regeneration'] is True
          assert loaded['revision-orchestrator-test.json']['authority'] is False
          assert loaded['revision-orchestrator-test.json']['model_execution'] is False
          assert loaded['character-integrity-test.json']['forbidden_context_excluded'] is True
          assert loaded['state-graph-test.json']['evidence_backed_transition_exempted'] is True
          assert loaded['cli-test.json']['model_execution'] is False
          PY

      - name: Control-plane authority boundary
        run: |
          python - <<'PY'
          import json
          event=json.load(open('harness/control_plane/event_schema.json',encoding='utf-8'))
          types=set(event['properties']['event_type']['enum'])
          assert not types.intersection({'draft.requested','settlement.apply','canon.write','os.promote'})
          handoff=json.load(open('harness/control_plane/handoff_schema.json',encoding='utf-8'))
          perms=handoff['properties']['permissions']['properties']
          assert all(perms[k]['const'] is False for k in ('canon_write','os_behavior_write','durable_user_taste_write'))
          PY

      - name: Direct semantic layer must not fabricate a worker
        env:
          OPENAI_API_KEY: ''
          NOVEL_OS_SEMANTIC_WORKER_CMD: ''
          NOVEL_OS_DISABLE_LOCAL_AGENT_AUTO: '1'
        run: |
          python harness/semantic_workers/semantic_worker_runner.py capabilities > direct-capabilities.json
          python - <<'PY'
          import json
          d=json.load(open('direct-capabilities.json',encoding='utf-8'))
          assert d['independent_worker_available'] is False
          assert d['fallback_without_adapter']=='semantic_pending_at_direct_layer'
          assert {'control_plane_mcp','peer_chat_relay'}.issubset(d['higher_level_transports'])
          PY

      - name: OpenAI adapter dry-run only
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'harness/semantic_workers')
          from semantic_worker_router import fingerprint_for
          job={'job_id':'SEM-CI','kind':'eval_judge','subject_id':'CI','created_at':'now','input_fingerprint':'','input':{'text':'fixture'},'rubric':['judge fixture'],'output_contract':{},'permissions':{'canon_write':False,'os_behavior_write':False,'durable_user_taste_write':False,'allowed_result_scope':'observation'},'provenance':{'source':'ci'}}
          job['input_fingerprint']=fingerprint_for(job);json.dump(job,open('/tmp/job.json','w',encoding='utf-8'))
          PY
          python harness/semantic_workers/adapters/openai_responses_adapter.py --dry-run < /tmp/job.json > openai-dry-run.json
          python - <<'PY'
          import json
          d=json.load(open('openai-dry-run.json',encoding='utf-8'))
          assert d['valid'] is True and d['request']['store'] is False
          assert d['request']['text']['format']['type']=='json_schema'
          assert d['authorization_header_included'] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelforge-contract-artifacts
          path: |
            *-test.json
            eval-release.json
            eval-all.json
            local-capabilities.json
            bundle-a.json
            bundle-b.json
            bundle-verify.json
            direct-capabilities.json
            openai-dry-run.json
          if-no-files-found: warn
