name: NovelForge Planning Commitment Horizon

on:
  pull_request:
    branches: [main]
    paths:
      - 'harness/planning_horizon.py'
      - 'harness/planning_horizon.schema.json'
      - '.github/workflows/novelforge-planning-horizon.yml'
      - 'specs/011-planning-commitment-horizon/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile planning horizon contract
        run: python -m py_compile harness/planning_horizon.py

      - name: Validate planning horizon schema JSON
        run: python -m json.tool harness/planning_horizon.schema.json > /dev/null

      - name: Deterministic planning horizon contract
        run: |
          python harness/planning_horizon.py self-test > planning-horizon-test.json
          cat planning-horizon-test.json

      - name: Assert planning horizon invariants
        run: |
          python - <<'PY'
          import json
          d=json.load(open('planning-horizon-test.json',encoding='utf-8'))
          assert d['planning_horizon_contract']=='PASS',d
          required={
              'soft_beat_blocks_chapter_plan',
              'soft_beat_allows_beat_sheet',
              'authorized_transition_advances_exactly_once',
              'promoted_region_allows_chapter_plan',
              'writer_cannot_promote',
              'stale_transition_blocked',
              'unknown_artifact_kind_fails_closed',
              'non_adjacent_evidence_link_selected',
              'adjacent_unlinked_excluded',
              'assumption_scope_respected',
              'frontier_one_wave_no_auto_action',
              'tight_short_profile_can_allow_deep_soft_planning',
              'discovery_near_future_can_remain_soft',
              'opaque_decision_refs_preserved_without_dependency',
              'authority_false_everywhere',
          }
          assert required == set(d['checks']),d
          assert all(d['checks'].values()),d
          assert d['authority'] is False and d['model_execution'] is False,d
          assert d['planning_depth_order']==['arc_boundary','beat','scene_intent','chapter_detail'],d
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-commitment-horizon-${{ github.run_id }}
          path: planning-horizon-test.json
          if-no-files-found: warn
