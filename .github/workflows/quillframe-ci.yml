name: Quillframe Rust production CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quillframe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust compile
        run: cargo check --workspace --all-targets --locked
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rust production-chain tests
        run: cargo test --workspace --all-targets --locked

  studio:
    name: SolidJS Studio and product UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run quality
      - run: corepack pnpm run typecheck
      - run: corepack pnpm run test
      - run: corepack pnpm run build

  tauri:
    name: Tauri direct Rust Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo fmt --manifest-path studio/app/src-tauri/Cargo.toml -- --check
      - run: cargo check --manifest-path studio/app/src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path studio/app/src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path studio/app/src-tauri/Cargo.toml --locked

  runtime-boundary:
    name: Rust production runtime boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject interpreter-based product/runtime residue
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -path ./.git -prune -o -path ./target -prune -o -path '*/node_modules' -prune -o -type f \( -name '*.py' -o -name 'pyproject.toml' \) -print)"
          ! git grep -I -i -E 'pyodide|pyinstaller|setup-python|python -m|python3|\.py([^[:alnum:]_]|$)' -- '*.rs' '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.toml' 'package.json' 'Dockerfile' ':!.github/workflows/quillframe-ci.yml'

  acceptance:
    name: Native production acceptance
    needs: [rust-core, studio, tauri, runtime-boundary]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Real multi-chapter Rust chain (no synthetic 5M run)
        run: cargo test --workspace --all-targets --locked
      - name: Direct Tauri-to-Core contract
        run: cargo test --manifest-path studio/app/src-tauri/Cargo.toml --locked
