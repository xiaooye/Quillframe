name: Quillframe 0.9 CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quillframe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, SQLite, authority and namespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Version consistency
        run: python scripts/version_consistency.py
      - name: Active technical namespace hygiene
        run: python scripts/namespace_hygiene.py
      - name: Compile Model and Agent Runtime
        run: python -m compileall -q model_runtime agent_runtime quillframe harness/semantic_workers/adapters/model_runtime_adapter.py
      - name: Build and import Quillframe wheel
        run: |
          python -m pip wheel . --no-deps -w /tmp/quillframe-wheel
          python -m pip install --no-deps --target /tmp/quillframe-install /tmp/quillframe-wheel/quillframe-*.whl
          cd /tmp
          PYTHONPATH=/tmp/quillframe-install python - <<'PY'
          from quillframe import Quillframe, AgentJob
          assert Quillframe.__name__ == 'Quillframe'
          assert AgentJob.__name__ == 'AgentJob'
          print('quillframe_library_import=PASS')
          PY
      - name: Deterministic runtime capability contracts
        run: |
          python harness/runtime_capabilities.py self-test
          python harness/semantic_workers/adapters/model_runtime_adapter.py --self-test
      - name: Normal CI never invokes configured live Model API
        env:
          QUILLFRAME_MODEL_API_ENDPOINT: ''
          QUILLFRAME_MODEL_API_TOKEN: ''
        run: |
          python - <<'PY'
          import os
          assert not os.getenv('QUILLFRAME_MODEL_API_ENDPOINT')
          assert not os.getenv('QUILLFRAME_MODEL_API_TOKEN')
          print('live_model_execution=disabled')
          PY
      - name: Quillframe 0.9 persistence and authority tests
        run: python -m unittest discover -s tests -p 'test_quillframe_*.py' -v
      - name: Host Bridge self-test
        run: python studio/host_bridge.py self-test

  bundle-fingerprint:
    name: Frozen framework bundle fingerprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8533c12bec929eac44bf23a9bede45e3b24ea0af
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build deterministic bundle twice
        run: |
          mkdir -p dist
          python release/build_framework_bundle.py build --root . --output dist/quillframe-framework-a.tar --report dist/bundle-a.json
          python release/build_framework_bundle.py build --root . --output dist/quillframe-framework-b.tar --report dist/bundle-b.json
          cmp dist/quillframe-framework-a.tar dist/quillframe-framework-b.tar
          python - <<'PY'
          import json
          a=json.load(open('dist/bundle-a.json',encoding='utf-8'))
          b=json.load(open('dist/bundle-b.json',encoding='utf-8'))
          assert a['bundle_fingerprint']==b['bundle_fingerprint'],(a,b)
          print('BUNDLE_FINGERPRINT='+a['bundle_fingerprint'])
          print('CONTENT_INDEX_FINGERPRINT='+a['content_index_fingerprint'])
          print('BUNDLE_SIZE='+str(a['bundle_size']))
          print('BUNDLE_FILES='+str(a['files']))
          PY
      - name: Verify exact bundle
        run: |
          EXPECTED="$(python -c "import json;print(json.load(open('dist/bundle-a.json'))['bundle_fingerprint'])")"
          python release/build_framework_bundle.py verify --bundle dist/quillframe-framework-a.tar --expected "$EXPECTED" --report dist/bundle-verify.json
      - uses: actions/upload-artifact@v4
        with:
          name: quillframe-framework-8533c12bec929eac44bf23a9bede45e3b24ea0af
          path: |
            dist/quillframe-framework-a.tar
            dist/bundle-a.json
            dist/bundle-verify.json
          if-no-files-found: error
          retention-days: 7

  site:
    name: Product site and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: site
        run: npm install --no-audit --no-fund
      - working-directory: site
        run: npm run quality
      - working-directory: site
        run: npm run build
      - working-directory: site
        run: npm run docs:build

  studio:
    name: SolidJS Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: studio/app/pnpm-lock.yaml
      - working-directory: studio/app
        run: pnpm install --frozen-lockfile
      - working-directory: studio/app
        run: pnpm typecheck
      - working-directory: studio/app
        run: pnpm build
