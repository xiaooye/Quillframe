name: Quillframe 0.9 CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quillframe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, SQLite, authority and namespace
    runs-on: ubuntu-latest
    # SPEC021-APPLY-PERMISSION-BEGIN
    permissions:
      contents: write
    # SPEC021-APPLY-PERMISSION-END
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Version consistency
        run: python scripts/version_consistency.py
      - name: Active technical namespace hygiene
        run: python scripts/namespace_hygiene.py
      - name: Documentation governance
        run: python scripts/docs_quality.py
      - name: Compile Model and Agent Runtime
        run: python -m compileall -q model_runtime agent_runtime quillframe harness/semantic_workers/adapters/model_runtime_adapter.py
      - name: Build and import Quillframe wheel
        run: |
          python -m pip wheel . --no-deps -w /tmp/quillframe-wheel
          python -m pip install --no-deps --target /tmp/quillframe-install /tmp/quillframe-wheel/quillframe-*.whl
          cd /tmp
          PYTHONPATH=/tmp/quillframe-install python - <<'PY'
          from quillframe import Quillframe, AgentJob
          assert Quillframe.__name__ == 'Quillframe'
          assert AgentJob.__name__ == 'AgentJob'
          print('quillframe_library_import=PASS')
          PY
      - name: Deterministic runtime capability contracts
        run: |
          python harness/runtime_capabilities.py self-test
          python harness/context_runtime.py self-test
          python harness/semantic_workers/adapters/model_runtime_adapter.py --self-test
      - name: Normal CI never invokes configured live Model API
        env:
          QUILLFRAME_MODEL_API_ENDPOINT: ''
          QUILLFRAME_MODEL_API_TOKEN: ''
        run: |
          python - <<'PY'
          import os
          assert not os.getenv('QUILLFRAME_MODEL_API_ENDPOINT')
          assert not os.getenv('QUILLFRAME_MODEL_API_TOKEN')
          print('live_model_execution=disabled')
          PY
      - name: Quillframe 0.9 persistence and authority tests
        run: python -m unittest discover -s tests -p 'test_quillframe_*.py' -v
      - name: Host Bridge self-test
        run: python studio/host_bridge.py self-test
      # SPEC021-APPLY-BEGIN
      - name: Apply verified Spec 021 host hardening once
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/production-visibility-enforcement' && github.actor != 'github-actions[bot]'
        run: |
          set -euo pipefail
          PATCH=specs/021-production-visibility-enforcement/.host-hardening.patch
          git apply --exclude=studio/tauri_core_sidecar.py --check "$PATCH"
          git apply --exclude=studio/tauri_core_sidecar.py "$PATCH"
          python -m unittest \
            tests.test_quillframe_authoring_primitives \
            tests.test_quillframe_production_host_bridge \
            tests.test_quillframe_production_runtime \
            tests.test_quillframe_unified_host_bootstrap -v
          python studio/tauri_core_sidecar.py self-test
          rm -f "$PATCH" .github/workflows/spec021-host-hardening.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/quillframe-ci.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          out = []
          skipping = False
          for line in lines:
              if 'SPEC021-APPLY-PERMISSION-BEGIN' in line or 'SPEC021-APPLY-BEGIN' in line:
                  skipping = True
                  continue
              if 'SPEC021-APPLY-PERMISSION-END' in line or 'SPEC021-APPLY-END' in line:
                  skipping = False
                  continue
              if not skipping:
                  out.append(line)
          path.write_text(''.join(out), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: enforce released manuscript host boundary'
          git push origin HEAD:agent/production-visibility-enforcement
      # SPEC021-APPLY-END
      - name: Checkout exact source for ephemeral runtime bundle
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          path: runtime-src
      - name: Build exact-SHA ephemeral runtime bundle
        env:
          QUILLFRAME_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SOURCE_SHA="$(git -C runtime-src rev-parse HEAD)"
          test "${SOURCE_SHA}" = "${QUILLFRAME_SOURCE_SHA}"
          test -d runtime-src/.git
          mkdir -p /tmp/quillframe-runtime
          tar \
            -C runtime-src \
            --exclude='site/node_modules' \
            --exclude='studio/app/node_modules' \
            -czf "/tmp/quillframe-runtime/quillframe-runtime-${SOURCE_SHA}.tar.gz" .
          (cd /tmp/quillframe-runtime && sha256sum "quillframe-runtime-${SOURCE_SHA}.tar.gz" > "quillframe-runtime-${SOURCE_SHA}.sha256")
          printf '%s\n' "${SOURCE_SHA}" > /tmp/quillframe-runtime/framework-commit.txt
          tar -tzf "/tmp/quillframe-runtime/quillframe-runtime-${SOURCE_SHA}.tar.gz" | grep -q '^\./\.git/'
      - name: Upload exact-SHA ephemeral runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: quillframe-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/quillframe-runtime/
          if-no-files-found: error
          retention-days: 7

  site:
    name: Product site and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - working-directory: site
        run: npm install --no-audit --no-fund
      - working-directory: site
        run: npm run quality
      - working-directory: site
        run: npm run build
      - working-directory: site
        run: npm run docs:build

  studio:
    name: SolidJS Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: studio/app/pnpm-lock.yaml
      - working-directory: studio/app
        run: pnpm install --frozen-lockfile
      - name: Build Studio production assets and run browser acceptance
        working-directory: studio/app
        run: pnpm ci:studio
