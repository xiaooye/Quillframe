name: Quillframe 0.9 CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quillframe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, SQLite, authority and namespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply staged semantic context runtime
        run: |
          cat scripts/.semantic-context-parts/part*.txt | base64 -d | gzip -d > scripts/_apply_semantic_context_runtime.py
          python scripts/_apply_semantic_context_runtime.py
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('specs/014-semantic-context-runtime').glob('*.md'):
              text=path.read_text(encoding='utf-8')
              path.write_text('\n'.join(line.rstrip() for line in text.splitlines())+'\n', encoding='utf-8')
          router=Path('harness/semantic_workers/semantic_worker_router.py')
          text=router.read_text(encoding='utf-8')
          old='ALLOWED_KINDS={"eval_judge","corpus_analyze","benchmark_synthesize","external_review","preference_distill","artifact_audit"}'
          new='ALLOWED_KINDS={"eval_judge","corpus_analyze","benchmark_synthesize","external_review","preference_distill","artifact_audit","artifact_analyze"}'
          assert old in text or new in text
          router.write_text(text.replace(old,new), encoding='utf-8')
          schema=Path('harness/semantic_workers/job_schema.json')
          data=json.loads(schema.read_text(encoding='utf-8'))
          kinds=data['properties']['kind']['enum']
          if 'artifact_analyze' not in kinds:
              kinds.append('artifact_analyze')
          schema.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          test=Path('tests/test_quillframe_semantic_context_contracts.py')
          test.write_text('''from __future__ import annotations\nimport sys\nimport unittest\nfrom pathlib import Path\n\nROOT=Path(__file__).resolve().parents[1]\nsys.path.insert(0,str(ROOT / "harness" / "semantic_workers"))\nfrom registered_contract_binding import validate_registered_job\nfrom semantic_worker_router import make_contract_job\n\nFP="sha256:"+"a"*64\n\nclass SemanticContextContractTests(unittest.TestCase):\n    def test_profile_derive_registered_contract_is_valid(self):\n        job=make_contract_job("context.profile_derive","CHAR-1",{\n            "source":{"object_id":"CHAR-1","object_type":"Character","source_fingerprint":FP,"model_view":{},"stage_hints":["character_simulation"]},\n            "manual_override_present":False,\n        },source_session_id="SES-TEST")\n        self.assertEqual(job["kind"],"artifact_analyze")\n        self.assertEqual(validate_registered_job(job),[])\n\n    def test_stage_select_registered_contract_is_valid(self):\n        job=make_contract_job("context.stage_select","RUN-1",{\n            "task":{},"stage_id":"draft","candidate_universe_fingerprint":FP,\n            "candidates":[{"profile_id":"PROF-1","object_id":"CHAR-1","authority":"accepted","lifecycle":"active","source_fingerprint":FP,"profile_fingerprint":FP,"description":"d","trigger_when":"t","estimated_tokens":8,"semantic_tags":[],"required_for_grounding":True}],\n            "hard_budget":128,\n        },source_session_id="SES-TEST")\n        self.assertEqual(job["kind"],"artifact_audit")\n        self.assertEqual(validate_registered_job(job),[])\n\nif __name__ == "__main__":\n    unittest.main()\n''',encoding='utf-8')
          PY
      - name: Version consistency
        run: python scripts/version_consistency.py
      - name: Active technical namespace hygiene
        run: python scripts/namespace_hygiene.py
      - name: Documentation governance
        run: python scripts/docs_quality.py
      - name: Compile Model and Agent Runtime
        run: python -m compileall -q model_runtime agent_runtime quillframe harness/semantic_workers/adapters/model_runtime_adapter.py
      - name: Build and import Quillframe wheel
        run: |
          python -m pip wheel . --no-deps -w /tmp/quillframe-wheel
          python -m pip install --no-deps --target /tmp/quillframe-install /tmp/quillframe-wheel/quillframe-*.whl
          cd /tmp
          PYTHONPATH=/tmp/quillframe-install python - <<'PY'
          from quillframe import Quillframe, AgentJob
          assert Quillframe.__name__ == 'Quillframe'
          assert AgentJob.__name__ == 'AgentJob'
          print('quillframe_library_import=PASS')
          PY
      - name: Deterministic runtime capability contracts
        run: |
          python harness/runtime_capabilities.py self-test
          python harness/context_runtime.py self-test
          python harness/semantic_workers/adapters/model_runtime_adapter.py --self-test
      - name: Normal CI never invokes configured live Model API
        env:
          QUILLFRAME_MODEL_API_ENDPOINT: ''
          QUILLFRAME_MODEL_API_TOKEN: ''
        run: |
          python - <<'PY'
          import os
          assert not os.getenv('QUILLFRAME_MODEL_API_ENDPOINT')
          assert not os.getenv('QUILLFRAME_MODEL_API_TOKEN')
          print('live_model_execution=disabled')
          PY
      - name: Quillframe 0.9 persistence and authority tests
        run: python -m unittest discover -s tests -p 'test_quillframe_*.py' -v
      - name: Host Bridge self-test
        run: python studio/host_bridge.py self-test
      - name: Aggregate Framework and bundle self-test
        run: python quillframe.py self-test
      - name: Commit verified semantic context runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git reset --hard
          git clean -fd
          git switch -C agent/semantic-context-runtime origin/agent/semantic-context-runtime
          cat scripts/.semantic-context-parts/part*.txt | base64 -d | gzip -d > scripts/_apply_semantic_context_runtime.py
          python scripts/_apply_semantic_context_runtime.py
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('specs/014-semantic-context-runtime').glob('*.md'):
              text=path.read_text(encoding='utf-8')
              path.write_text('\n'.join(line.rstrip() for line in text.splitlines())+'\n', encoding='utf-8')
          router=Path('harness/semantic_workers/semantic_worker_router.py')
          text=router.read_text(encoding='utf-8')
          old='ALLOWED_KINDS={"eval_judge","corpus_analyze","benchmark_synthesize","external_review","preference_distill","artifact_audit"}'
          new='ALLOWED_KINDS={"eval_judge","corpus_analyze","benchmark_synthesize","external_review","preference_distill","artifact_audit","artifact_analyze"}'
          assert old in text or new in text
          router.write_text(text.replace(old,new), encoding='utf-8')
          schema=Path('harness/semantic_workers/job_schema.json')
          data=json.loads(schema.read_text(encoding='utf-8'))
          kinds=data['properties']['kind']['enum']
          if 'artifact_analyze' not in kinds:
              kinds.append('artifact_analyze')
          schema.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          test=Path('tests/test_quillframe_semantic_context_contracts.py')
          test.write_text('''from __future__ import annotations\nimport sys\nimport unittest\nfrom pathlib import Path\n\nROOT=Path(__file__).resolve().parents[1]\nsys.path.insert(0,str(ROOT / "harness" / "semantic_workers"))\nfrom registered_contract_binding import validate_registered_job\nfrom semantic_worker_router import make_contract_job\n\nFP="sha256:"+"a"*64\n\nclass SemanticContextContractTests(unittest.TestCase):\n    def test_profile_derive_registered_contract_is_valid(self):\n        job=make_contract_job("context.profile_derive","CHAR-1",{\n            "source":{"object_id":"CHAR-1","object_type":"Character","source_fingerprint":FP,"model_view":{},"stage_hints":["character_simulation"]},\n            "manual_override_present":False,\n        },source_session_id="SES-TEST")\n        self.assertEqual(job["kind"],"artifact_analyze")\n        self.assertEqual(validate_registered_job(job),[])\n\n    def test_stage_select_registered_contract_is_valid(self):\n        job=make_contract_job("context.stage_select","RUN-1",{\n            "task":{},"stage_id":"draft","candidate_universe_fingerprint":FP,\n            "candidates":[{"profile_id":"PROF-1","object_id":"CHAR-1","authority":"accepted","lifecycle":"active","source_fingerprint":FP,"profile_fingerprint":FP,"description":"d","trigger_when":"t","estimated_tokens":8,"semantic_tags":[],"required_for_grounding":True}],\n            "hard_budget":128,\n        },source_session_id="SES-TEST")\n        self.assertEqual(job["kind"],"artifact_audit")\n        self.assertEqual(validate_registered_job(job),[])\n\nif __name__ == "__main__":\n    unittest.main()\n''',encoding='utf-8')
          PY
          git checkout 0d211675fd9f545b83d02ab4102563f0c67e11b9 -- .github/workflows/quillframe-ci.yml
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/quillframe-ci.yml')
          s=p.read_text(encoding='utf-8')
          anchor='          python harness/runtime_capabilities.py self-test\n'
          assert anchor in s
          s=s.replace(anchor, anchor+'          python harness/context_runtime.py self-test\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f scripts/_apply_semantic_context_runtime.py
          rm -rf scripts/.semantic-context-parts
          rm -f .github/workflows/_semantic-context-runtime-apply.yml
          git add -A
          git diff --cached --check
          echo '--- final changed files ---'
          git diff --cached --name-only
          git commit -m "feat(context): add semantic context runtime"
          git push origin HEAD:agent/semantic-context-runtime

  site:
    name: Product site and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - working-directory: site
        run: npm install --no-audit --no-fund
      - working-directory: site
        run: npm run quality
      - working-directory: site
        run: npm run build
      - working-directory: site
        run: npm run docs:build

  studio:
    name: SolidJS Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: studio/app/pnpm-lock.yaml
      - working-directory: studio/app
        run: pnpm install --frozen-lockfile
      - working-directory: studio/app
        run: pnpm typecheck
      - working-directory: studio/app
        run: pnpm build
