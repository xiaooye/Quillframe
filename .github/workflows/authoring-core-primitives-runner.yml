name: Authoring Core Primitives Runner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/production-runtime-integration' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-runtime-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply frozen fixup script
        run: |
          python scripts/authoring_core_fixup.py
          python -m unittest tests.test_quillframe_authoring_primitives tests.test_quillframe_production_host_bridge -v
          python studio/host_bridge.py self-test
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add persistence/quillframe_sqlite.py core_operations.py studio/host_bridge.py studio/host_bridge_contract.json tests/test_quillframe_production_host_bridge.py tests/test_quillframe_authoring_primitives.py
          if ! git diff --cached --quiet; then
            git commit -m "feat(core): complete authoring lifecycle primitives"
            git push origin HEAD:agent/production-runtime-integration
          fi
