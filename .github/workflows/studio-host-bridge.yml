name: NovelForge Studio Host Bridge

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-host-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Studio bridge, projections, runtime command stack, and Agent Skill client
        run: |
          python -m py_compile \
            studio/host_bridge.py \
            studio/project_hub_projection.py \
            studio/publication_preview.py \
            publication/compiler.py \
            harness/control_plane/runtime_query.py \
            harness/session_runtime/resume_preflight.py \
            harness/session_runtime/resume_command.py \
            harness/session_runtime/runtime_command_authorization.py \
            harness/session_runtime/runtime_command_executor.py \
            harness/session_runtime/terminate_preflight.py \
            harness/session_runtime/terminate_command.py \
            harness/session_runtime/terminate_authorization.py \
            harness/session_runtime/terminate_executor.py \
            agent-skills/novelforge/scripts/novelforge_bridge.py

      - name: Publication preview projection self-test
        run: |
          python studio/publication_preview.py self-test > publication-preview-test.json
          cat publication-preview-test.json
          python - <<'PY'
          import json
          result=json.load(open('publication-preview-test.json',encoding='utf-8'))
          assert result['publication_preview_projection_contract']=='PASS',result
          assert result['checks']['all_profiles'] is True
          assert result['checks']['exact_text_guard'] is True
          assert result['checks']['artifact_fingerprints'] is True
          assert result['checks']['epub_internal_validation'] is True
          assert result['checks']['source_authority_not_invented'] is True
          assert result['authority'] is False and result['model_execution'] is False
          PY

      - name: Public runtime query self-test
        run: |
          if ! python harness/control_plane/runtime_query.py self-test > runtime-query-test.json; then
            cat runtime-query-test.json
            exit 1
          fi
          cat runtime-query-test.json
          python - <<'PY'
          import json
          result=json.load(open('runtime-query-test.json',encoding='utf-8'))
          assert result['runtime_query_contract']=='PASS',result
          assert result['side_effect_free_missing_store'] is True
          assert result['read_does_not_modify_store'] is True
          assert result['safe_projection'] is True
          assert result['receipt_retrieval'] is True
          assert result['authority'] is False and result['model_execution'] is False
          PY

      - name: Resume preflight self-test
        run: |
          python harness/session_runtime/resume_preflight.py self-test > resume-preflight-test.json
          cat resume-preflight-test.json
          python - <<'PY'
          import json
          result=json.load(open('resume-preflight-test.json',encoding='utf-8'))
          assert result['resume_preflight_contract']=='PASS',result
          assert result['ready_case'] is True
          assert result['stale_version_blocked'] is True
          assert result['stale_artifact_blocked'] is True
          assert result['wrong_project_blocked'] is True
          assert result['locally_provable_capability_ready'] is True
          assert result['unavailable_capability_blocked'] is True
          assert result['missing_store_side_effect_free'] is True
          assert result['mutation_performed'] is False
          assert result['authority'] is False and result['model_execution'] is False
          PY

      - name: Terminate preflight self-test
        run: |
          python harness/session_runtime/terminate_preflight.py self-test > terminate-preflight-test.json
          cat terminate-preflight-test.json
          python - <<'PY'
          import json
          result=json.load(open('terminate-preflight-test.json',encoding='utf-8'))
          assert result['session_terminate_preflight_contract']=='PASS',result
          assert result['ready_case'] is True
          assert result['stale_version_blocked'] is True
          assert result['terminal_session_blocked'] is True
          assert result['mutation_performed'] is False
          assert result['authority'] is False and result['model_execution'] is False
          PY

      - name: Runtime command executor self-test
        run: |
          python harness/session_runtime/runtime_command_executor.py self-test > runtime-command-test.json
          cat runtime-command-test.json
          python - <<'PY'
          import json
          result=json.load(open('runtime-command-test.json',encoding='utf-8'))
          assert result['runtime_command_executor_contract']=='PASS',result
          assert result['resume_applied'] is True
          assert result['cas_version_advanced_once'] is True
          assert result['denied_did_not_mutate'] is True
          assert result['idempotent_retry_replayed_receipt'] is True
          assert result['conflicting_retry_rejected'] is True
          assert result['durable_receipt_query'] is True
          assert result['authority'] is False and result['model_execution'] is False
          PY

      - name: Session terminate executor self-test
        run: |
          python harness/session_runtime/terminate_executor.py self-test > terminate-executor-test.json
          cat terminate-executor-test.json
          python - <<'PY'
          import json
          result=json.load(open('terminate-executor-test.json',encoding='utf-8'))
          assert result['session_terminate_executor_contract']=='PASS',result
          assert result['terminate_applied'] is True
          assert result['active_run_closed'] is True
          assert result['cas_version_advanced_once'] is True
          assert result['denied_did_not_mutate'] is True
          assert result['idempotent_retry_replayed_receipt'] is True
          assert result['conflicting_retry_rejected'] is True
          assert result['durable_receipt_query'] is True
          assert result['authority'] is False and result['model_execution'] is False
          PY

      - name: Portable bridge self-test
        run: |
          if ! python studio/host_bridge.py self-test > studio-host-bridge-test.json; then
            cat studio-host-bridge-test.json
            python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('studio').resolve()))
          import host_bridge as bridge

          runtime_ops={
              'runtime.sessions.list',
              'runtime.session.get',
              'runtime.events.list',
              'runtime.handoff.inspect',
              'run.receipt.get',
              'runtime.command.receipt.get',
              'session.resume.preflight',
              'session.resume',
              'session.terminate.preflight',
              'session.terminate',
          }
          setup_actions={'init','session-put','event-ingest','handoff-submit'}
          query_trace=[]
          setup_trace=[]
          original_invoke=bridge.invoke
          original_setup=bridge._run_setup

          def traced_invoke(request):
              result=original_invoke(request)
              operation=request.get('operation')
              if operation in runtime_ops or operation == 'publication.preview':
                  data=result.get('data') if isinstance(result.get('data'),dict) else {}
                  error=result.get('error') if isinstance(result.get('error'),dict) else {}
                  query_trace.append({
                      'operation': operation,
                      'status': result.get('status'),
                      'error_code': error.get('code'),
                      'data_schema': data.get('schema'),
                      'data_status': data.get('status'),
                      'count': data.get('count'),
                  })
              return result

          def traced_setup(argv, *, cwd):
              ok=original_setup(argv,cwd=cwd)
              action=next((item for item in argv if item in setup_actions),'unknown')
              setup_trace.append({'action':action,'ok':ok})
              return ok

          bridge.invoke=traced_invoke
          bridge._run_setup=traced_setup
          aggregate=bridge.self_test()
          print(json.dumps({
              'runtime_setup_trace': setup_trace,
              'runtime_query_trace': query_trace,
              'aggregate_checks': aggregate.get('checks',{}),
          },ensure_ascii=False,indent=2))
          PY
            exit 1
          fi
          cat studio-host-bridge-test.json
          if ! python agent-skills/novelforge/scripts/novelforge_bridge.py self-test > agent-skill-test.json; then
            cat agent-skill-test.json
            exit 1
          fi
          cat agent-skill-test.json

      - name: Exercise supported query through request envelope
        run: |
          python studio/host_bridge.py invoke --request studio/fixtures/host-bridge-request.synthetic.json > studio-host-bridge-query.json

      - name: Assert Studio host contracts
        run: |
          python - <<'PY'
          import json
          bridge=json.load(open('studio-host-bridge-test.json',encoding='utf-8'))
          skill=json.load(open('agent-skill-test.json',encoding='utf-8'))
          query=json.load(open('studio-host-bridge-query.json',encoding='utf-8'))
          contract=json.load(open('studio/host_bridge_contract.json',encoding='utf-8'))
          portable=json.load(open('studio/portable_product_contract.json',encoding='utf-8'))
          runtime_queries={
              'runtime.sessions.list',
              'runtime.session.get',
              'runtime.events.list',
              'runtime.handoff.inspect',
              'run.receipt.get',
              'runtime.command.receipt.get',
              'session.resume.preflight',
              'session.terminate.preflight',
          }
          supported=set(contract['operations']['supported'])
          deferred=set(contract['operations']['deferred'])
          resume=contract['operations']['supported']['session.resume']
          terminate=contract['operations']['supported']['session.terminate']
          assert bridge['studio_host_bridge_contract']=='PASS',bridge
          assert bridge['checks']['runtime_queries_supported'] is True,bridge
          assert bridge['checks']['runtime_projection_safe'] is True,bridge
          assert bridge['checks']['resume_preflight_query_safe'] is True,bridge
          assert bridge['checks']['resume_command_safe'] is True,bridge
          assert bridge['checks']['terminate_preflight_query_safe'] is True,bridge
          assert bridge['checks']['terminate_command_safe'] is True,bridge
          assert bridge['checks']['runtime_command_receipt_safe'] is True,bridge
          assert bridge['checks']['publication_preview_query_safe'] is True,bridge
          assert skill['novelforge_agent_skill_contract']=='PASS',skill
          assert skill['checks']['resume_preflight_supported'] is True,skill
          assert skill['checks']['resume_command_advertised'] is True,skill
          assert skill['checks']['resume_local_app_only'] is True,skill
          assert skill['checks']['terminate_preflight_supported'] is True,skill
          assert skill['checks']['terminate_command_advertised'] is True,skill
          assert skill['checks']['terminate_local_app_only'] is True,skill
          assert skill['checks']['agent_package_remains_read_only'] is True,skill
          assert skill['runtime_mutation_allowed'] is False,skill
          assert query['schema']=='novelforge_studio_host_bridge_result_v1',query
          assert query['operation']=='semantic.catalog' and query['status']=='ok',query
          assert query['authority'] is False and query['canon_authority'] is False
          assert query['framework_write_authority'] is False and query['settlement_authority'] is False
          assert query['request_fingerprint'].startswith('sha256:') and query['result_fingerprint'].startswith('sha256:')
          assert contract['authority'] is False and contract['invariants']['mutation_exposed'] is True
          assert set(contract['invariants']['mutation_scopes'])=={'runtime_session_state','runtime_active_run_state'}
          assert contract['invariants']['mutation_requires_operation_specific_contract'] is True
          assert contract['invariants']['mutation_requires_explicit_authorization'] is True
          assert contract['invariants']['mutation_requires_fresh_preflight'] is True
          assert contract['invariants']['mutation_requires_compare_and_swap'] is True
          assert contract['invariants']['mutation_requires_idempotent_receipt'] is True
          assert runtime_queries.issubset(supported)
          assert 'publication.preview' in supported and 'publication.preview' not in deferred
          assert not (runtime_queries & deferred)
          assert 'session.resume' in supported and 'session.resume' not in deferred
          assert resume['kind']=='command' and resume['allowed_surfaces']==['local_app']
          assert resume['mutation_scope']=='runtime_session_state_only'
          assert resume['model_execution'] is False and resume['project_write'] is False
          assert resume['canon_write'] is False and resume['framework_write'] is False and resume['settlement'] is False
          assert 'session.terminate' in supported and 'session.terminate' not in deferred
          assert terminate['kind']=='command' and terminate['allowed_surfaces']==['local_app']
          assert terminate['mutation_scope']=='runtime_session_and_active_run_state_only'
          assert terminate['model_execution'] is False and terminate['project_write'] is False
          assert terminate['canon_write'] is False and terminate['framework_write'] is False and terminate['settlement'] is False
          assert 'command.invoke' not in supported and 'command.invoke' in deferred
          assert set(portable['phase_2b_host_bridge']['supported_operations'])==supported
          assert set(portable['phase_2b_host_bridge']['deferred_operations'])==deferred
          assert portable['phase_2b_host_bridge']['mutation_exposed'] is True
          assert set(portable['phase_2b_host_bridge']['mutation_scopes'])=={'runtime_session_state','runtime_active_run_state'}
          assert portable['phase_2b_host_bridge']['mutation_surface']=='local_app_only'
          assert portable['phase_2b_host_bridge']['mutation_requires_operation_specific_contract'] is True
          assert portable['publication_preview']['temporary_build_only'] is True
          assert portable['publication_preview']['source_authority_invented'] is False
          assert portable['runtime_observability']['query_side_effect_free'] is True
          assert portable['runtime_observability']['resume_preflight_exposed'] is True
          assert portable['runtime_observability']['preflight_ready_grants_runtime_control'] is False
          assert portable['runtime_observability']['session_resume_exposed'] is True
          assert portable['runtime_observability']['session_resume_surface']=='local_app_only'
          assert portable['runtime_observability']['session_resume_requires_explicit_user_authorization'] is True
          assert portable['runtime_observability']['session_resume_requires_fresh_preflight'] is True
          assert portable['runtime_observability']['session_resume_requires_exact_before_state_cas'] is True
          assert portable['runtime_observability']['session_resume_requires_idempotent_durable_receipt'] is True
          assert portable['runtime_observability']['session_resume_model_execution'] is False
          assert portable['runtime_observability']['terminate_preflight_exposed'] is True
          assert portable['runtime_observability']['session_terminate_exposed'] is True
          assert portable['runtime_observability']['session_terminate_surface']=='local_app_only'
          assert portable['runtime_observability']['session_terminate_requires_explicit_user_authorization'] is True
          assert portable['runtime_observability']['session_terminate_requires_fresh_preflight'] is True
          assert portable['runtime_observability']['session_terminate_requires_exact_before_state_cas'] is True
          assert portable['runtime_observability']['session_terminate_requires_idempotent_durable_receipt'] is True
          assert portable['runtime_observability']['session_terminate_closes_active_run'] is True
          assert portable['runtime_observability']['session_terminate_model_execution'] is False
          assert portable['agent_package_direction']['private_runtime_imports_required'] is False
          assert portable['agent_package_direction']['runtime_mutation_allowed'] is False
          assert portable['agent_package_direction']['session_resume_is_local_app_only'] is True
          assert portable['agent_package_direction']['session_terminate_is_local_app_only'] is True
          PY

      # Repository-wide hygiene remains a gate, but it must not prevent the
      # runtime/bridge contracts above from producing direct failure evidence.
      - name: Repository hygiene
        run: |
          python scripts/framework_hygiene.py
          python scripts/docs_quality.py
