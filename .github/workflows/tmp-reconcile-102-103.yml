name: Temporary 102 103 Reconciliation

on:
  push:
    branches: [agent/pre-independent-candidate-qualification]
    paths:
      - 'tmp/reconcile_102_103.py'
      - '.github/workflows/tmp-reconcile-102-103.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pre-independent-candidate-qualification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconcile semantic contracts and documentation inventory
        run: python tmp/reconcile_102_103.py
      - name: Validate merged automatic-learning plus qualification contracts
        run: |
          python -m json.tool harness/semantic_workers/contracts/production-loop.json >/dev/null
          python -m json.tool harness/semantic_workers/model_contract_catalog.json >/dev/null
          python -m json.tool docs/documentation_manifest.json >/dev/null
          python learning/feedback_intake.py self-test
          python evals/feedback_learning_ablation.py self-test
          python quality/candidate_qualification.py self-test
          python quality/regression_escape.py self-test
          python evals/pre_independent_qualification.py self-test
          python evals/pre_independent_qualification_ablation.py self-test
          python scripts/docs_quality.py
      - name: Commit reconciled formal files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add harness/semantic_workers/contracts/production-loop.json harness/semantic_workers/model_contract_catalog.json docs/documentation_manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'merge: reconcile feedback intake and candidate qualification contracts'
          git push origin HEAD:agent/pre-independent-candidate-qualification
