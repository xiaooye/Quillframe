name: Agent Apply Batch 6-7 (temporary)

on:
  push:
    branches: [agent/8-0-batch67-quality-publication]
    paths:
      - '.agent-batch/**'
      - '.github/workflows/agent-apply-batch67.yml'

permissions:
  contents: write

jobs:
  apply-verified-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify, apply, test, and stage workflow blob
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-batch/b67.part0 .agent-batch/b67.part1 .agent-batch/b67.part2 .agent-batch/b67.part3 > /tmp/b67.b64
          echo '88cbc79052a94a4e95af917e4effe92bfaac0fa466dec5344139ae4510d968d7  /tmp/b67.b64' | sha256sum -c -
          base64 -d /tmp/b67.b64 | gzip -d > /tmp/b67.patch
          git apply --check /tmp/b67.patch
          git apply /tmp/b67.patch
          mkdir -p .agent-batch-output
          cp .github/workflows/novelforge-contracts.yml .agent-batch-output/novelforge-contracts.yml
          git checkout HEAD -- .github/workflows/novelforge-contracts.yml
          rm -rf .agent-batch
          python quality/production_readiness.py self-test > /tmp/production-readiness.json
          python publication/compiler.py self-test > /tmp/publication.json
          python release/build_framework_bundle.py self-test > /tmp/framework-bundle.json
          python evals/run_evals.py --json > /tmp/evals.json
          python scripts/version_identity.py > /tmp/version-identity.json
          python novelforge.py self-test > /tmp/novelforge-self-test.json
          python - <<'PY'
          import json
          checks=[
            ('/tmp/production-readiness.json','production_readiness_contract'),
            ('/tmp/publication.json','publication_compiler_contract'),
            ('/tmp/framework-bundle.json','framework_bundle_contract'),
            ('/tmp/version-identity.json','version_identity_contract'),
            ('/tmp/novelforge-self-test.json','novelforge_cli_contract'),
          ]
          for p,k in checks:
              d=json.load(open(p)); assert d[k]=='PASS',(p,d)
          e=json.load(open('/tmp/evals.json'))
          assert e['counts']['FAIL']==0 and e['counts']['ERROR']==0, e
          assert e['counts']['PASS']>=6 and e['counts']['PENDING_MODEL']>=13, e
          PY
          git add -A
          git diff --cached --check
          git config user.name 'NovelForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: add production-readiness and publication contracts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
