name: Agent Apply Batch 6-7 (temporary)

on:
  push:
    branches: [agent/8-0-batch67-quality-publication]
    paths:
      - '.agent-batch/**'
      - '.github/workflows/agent-apply-batch67.yml'

permissions:
  contents: read

jobs:
  diagnose-patch-parts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print staged patch-part hashes only
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .agent-batch/b67.part0 .agent-batch/b67.part1 .agent-batch/b67.part2 .agent-batch/b67.part3
          wc -c .agent-batch/b67.part0 .agent-batch/b67.part1 .agent-batch/b67.part2 .agent-batch/b67.part3
