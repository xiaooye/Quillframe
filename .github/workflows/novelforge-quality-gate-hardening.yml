name: NovelForge Quality Gate Hardening

on:
  pull_request:
    paths:
      - 'quality/**'
      - 'surface/**'
      - 'harness/semantic_workers/model_contract_catalog.json'
      - 'harness/semantic_workers/contracts/quality.json'
      - 'harness/semantic_workers/peer_chat_relay.py'
      - 'harness/semantic_workers/registered_contract_binding.py'
      - 'harness/semantic_workers/peer_bridge_receipt.py'
      - '.github/actions/project-peer-semantic/**'
      - '.github/workflows/novelforge-chat-semantic-bridge.yml'
      - '.github/workflows/novelforge-quality-gate-hardening.yml'
      - 'quality/public_peer_issue_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile quality and semantic runtime
        run: |
          python -m py_compile quality/quality_taxonomy.py quality/repair_policy.py quality/production_readiness.py quality/public_peer_issue_probe.py
          python -m py_compile harness/semantic_workers/semantic_worker_router.py harness/semantic_workers/peer_chat_relay.py
          python -m py_compile harness/semantic_workers/registered_contract_binding.py harness/semantic_workers/peer_bridge_receipt.py
          python -m py_compile .github/actions/project-peer-semantic/bridge.py
      - name: Taxonomy compatibility contract
        run: python quality/quality_taxonomy.py self-test
      - name: Fresh realization repair contract
        run: python quality/repair_policy.py self-test
      - name: Registered contract definition binding
        run: python harness/semantic_workers/registered_contract_binding.py self-test
      - name: Project peer validation receipt
        run: python harness/semantic_workers/peer_bridge_receipt.py self-test
      - name: Semantic contract kernel
        run: python harness/semantic_workers/semantic_worker_router.py self-test
      - name: Production readiness contract
        run: python quality/production_readiness.py self-test
      - name: Registered release-role contracts
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          root=Path('harness/semantic_workers')
          sys.path.insert(0,str(root))
          from registered_contract_binding import validate_registered_job
          from semantic_worker_router import fingerprint_for, make_contract_job
          fp='sha256:'+'a'*64
          reader=make_contract_job('reader.engagement_audit','CH-CI',{'candidate_fingerprint':fp,'candidate_text':'fixture'})
          prod=make_contract_job('quality.production_review','CH-CI',{'candidate_fingerprint':fp,'candidate_text':'fixture'},source_session_id='SES-MANAGER')
          assert not validate_registered_job(reader)
          assert not validate_registered_job(prod)
          forged=json.loads(json.dumps(prod))
          forged['rubric']=['manager-authored substitute rubric']
          forged['input_fingerprint']=fingerprint_for(forged)
          assert any('rubric mismatch' in x for x in validate_registered_job(forged))
          assert reader['provenance']['source']=='model_contract_pack'
          assert reader['provenance']['pack_id']=='quality'
          assert reader['provenance']['independent_gate'] is False
          assert prod['provenance']['source']=='model_contract_pack'
          assert prod['provenance']['pack_id']=='quality'
          assert prod['provenance']['independent_gate'] is True
          registry=json.load(open(root/'contracts/quality.json',encoding='utf-8'))
          assert registry['contracts']['reader.engagement_audit']['release_roles']==['reader_engagement']
          assert registry['contracts']['quality.production_review']['release_roles']==['semantic_independent']
          print({'registered_release_role_contract':'PASS','forged_registered_rubric_rejected':True})
          PY
      - name: Exact 5554 public issue peer/receipt integration probe
        env:
          EXPECTED_FRAMEWORK_COMMIT: 5554b464c6bc00ead8ac3eb2a818ad0e07d70caa
        run: |
          python quality/public_peer_issue_probe.py \
            --issue 59 \
            --framework-commit "$EXPECTED_FRAMEWORK_COMMIT" \
            > public-exact-peer-issue-59.json
          cat public-exact-peer-issue-59.json
          python - <<'PY'
          import json
          d=json.load(open('public-exact-peer-issue-59.json',encoding='utf-8'))
          assert d['result']=='PASS',d
          assert d['framework_commit_under_test']=='5554b464c6bc00ead8ac3eb2a818ad0e07d70caa',d
          assert d['production_project_receipt'] is False,d
          assert d['authority'] is False,d
          assert all(d['checks'].values()),d
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelforge-public-exact-peer-issue-59
          path: public-exact-peer-issue-59.json
          if-no-files-found: warn
          retention-days: 7
