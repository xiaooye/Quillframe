name: NovelForge Studio Cloud Host

on:
  pull_request:
    paths:
      - 'studio/app/**'
      - 'assets/brand/**'
      - '.github/workflows/studio-cloud.yml'
  push:
    branches: [main]
    paths:
      - 'studio/app/**'
      - 'assets/brand/**'
      - '.github/workflows/studio-cloud.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: studio-cloud-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT_NAME: novelforge-studio
  CLOUDFLARE_CUSTOM_DOMAIN: studio.novelforge.wei-dev.com

jobs:
  cloud-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/app/pnpm-lock.yaml

      - name: Frozen install
        working-directory: studio/app
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build hosted Studio
        working-directory: studio/app
        run: pnpm build

      - name: Verify static cloud-host contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('studio/app')
          dist = root / 'dist'
          headers = (dist / '_headers').read_text(encoding='utf-8')
          robots = (dist / 'robots.txt').read_text(encoding='utf-8')
          index = (dist / 'index.html').read_text(encoding='utf-8')
          bridge = (root / 'src/bridge.ts').read_text(encoding='utf-8')
          studio = (root / 'src/studio.tsx').read_text(encoding='utf-8')
          descriptor = json.loads((dist / '.well-known/novelforge-host.json').read_text(encoding='utf-8'))

          for needle in (
              'Content-Security-Policy:',
              "frame-ancestors 'none'",
              'X-Content-Type-Options: nosniff',
              'Referrer-Policy: no-referrer',
              'X-Robots-Tag: noindex',
          ):
              assert needle in headers, needle
          assert 'Disallow: /' in robots
          assert '__NOVELFORGE_STUDIO_TOKEN__' in index
          assert 'value !== TOKEN_PLACEHOLDER' in bridge
          assert 'bridgeTransportAvailable()' in studio
          assert descriptor == {
              'schema': 'novelforge_studio_host_descriptor_v1',
              'surface': 'cloud_ui',
              'delivery': 'cloudflare_pages',
              'core_host': 'unbound',
              'authority': False,
              'canon_authority': False,
              'framework_write_authority': False,
              'settlement_authority': False,
              'direct_core_store_access': False,
          }
          assert not (root / 'functions').exists(), 'Pages Functions are outside this slice'
          assert not list(root.glob('wrangler.*')), 'hosted shell must not introduce a Worker/Functions backend'
          assert not (dist / '404.html').exists(), 'Cloudflare Pages SPA fallback requires no top-level 404.html'
          print({'schema': 'novelforge_studio_cloud_host_check_v1', 'status': 'pass', 'authority': False})
          PY

      - name: Ensure Studio Pages project
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          status=$(curl --silent --show-error --output /tmp/studio-pages-project.json --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}")
          if [ "${status}" = "404" ]; then
            payload=$(jq -nc --arg name "${CLOUDFLARE_PROJECT_NAME}" '{name:$name, production_branch:"main"}')
            status=$(curl --silent --show-error --output /tmp/studio-pages-project.json --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")
            case "${status}" in 200|201) ;; *) cat /tmp/studio-pages-project.json; exit 1 ;; esac
          elif [ "${status}" != "200" ]; then
            cat /tmp/studio-pages-project.json
            exit 1
          fi
          jq -e '.success == true' /tmp/studio-pages-project.json >/dev/null

      - name: Deploy Studio to Cloudflare Pages
        id: deploy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          packageManager: pnpm
          command: pages deploy studio/app/dist --project-name=novelforge-studio --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }} --commit-hash=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployed host over HTTPS
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "${DEPLOYMENT_URL}"
          echo "deployment_url=${DEPLOYMENT_URL}"

          ready=false
          for _ in $(seq 1 24); do
            if curl --silent --show-error --fail "${DEPLOYMENT_URL}/" > /tmp/studio-preview-root.html; then
              if grep -q '<title>NovelForge Studio</title>' /tmp/studio-preview-root.html; then ready=true; break; fi
            fi
            sleep 2
          done
          test "${ready}" = "true"

          curl --silent --show-error --fail "${DEPLOYMENT_URL}/project?lang=en-US" > /tmp/studio-preview-project.html
          grep -q '<title>NovelForge Studio</title>' /tmp/studio-preview-project.html

          curl --silent --show-error --fail --dump-header /tmp/studio-preview-headers.txt --output /dev/null "${DEPLOYMENT_URL}/"
          grep -qi '^content-security-policy:' /tmp/studio-preview-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/studio-preview-headers.txt
          grep -qi '^referrer-policy: no-referrer' /tmp/studio-preview-headers.txt
          grep -qi '^x-robots-tag: noindex' /tmp/studio-preview-headers.txt

          curl --silent --show-error --fail "${DEPLOYMENT_URL}/.well-known/novelforge-host.json" > /tmp/studio-host.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/studio-host.json', encoding='utf-8'))
          assert data['schema']=='novelforge_studio_host_descriptor_v1'
          assert data['surface']=='cloud_ui'
          assert data['core_host']=='unbound'
          assert data['authority'] is False
          assert data['canon_authority'] is False
          assert data['framework_write_authority'] is False
          assert data['settlement_authority'] is False
          assert data['direct_core_store_access'] is False
          print({'schema':'novelforge_studio_cloud_https_check_v1','status':'pass','url':data['surface']})
          PY

      - name: Install CJK font for browser QA
        if: steps.deploy.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f >/dev/null

      - name: Browser runtime and visual QA
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/studio-cloud-qa
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "${CHROME}"
          echo "chrome=${CHROME}"

          run_chrome() {
            name="$1"
            size="$2"
            url="$3"
            profile=$(mktemp -d)
            "${CHROME}" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --disable-background-networking \
              --window-size="${size}" \
              --virtual-time-budget=3500 \
              --user-data-dir="${profile}" \
              --log-net-log="/tmp/studio-cloud-qa/${name}-netlog.json" \
              --net-log-capture-mode=IncludeSensitive \
              --screenshot="/tmp/studio-cloud-qa/${name}.png" \
              "${url}" >/tmp/studio-cloud-qa/${name}-chrome.log 2>&1
            rm -rf "${profile}"
          }

          dump_dom() {
            name="$1"
            size="$2"
            url="$3"
            profile=$(mktemp -d)
            "${CHROME}" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --disable-background-networking \
              --window-size="${size}" \
              --virtual-time-budget=3500 \
              --user-data-dir="${profile}" \
              --dump-dom \
              "${url}" > "/tmp/studio-cloud-qa/${name}-dom.html" 2>"/tmp/studio-cloud-qa/${name}-dom.log"
            rm -rf "${profile}"
          }

          run_chrome en-desktop 1440,900 "${DEPLOYMENT_URL}/?lang=en-US"
          run_chrome en-mobile 390,844 "${DEPLOYMENT_URL}/project?lang=en-US"
          run_chrome zh-mobile 390,844 "${DEPLOYMENT_URL}/?lang=zh-CN"
          dump_dom en-desktop 1440,900 "${DEPLOYMENT_URL}/?lang=en-US"
          dump_dom en-project 390,844 "${DEPLOYMENT_URL}/project?lang=en-US"
          dump_dom zh-mobile 390,844 "${DEPLOYMENT_URL}/?lang=zh-CN"

          python - <<'PY'
          from pathlib import Path

          root=Path('/tmp/studio-cloud-qa')
          en=(root/'en-desktop-dom.html').read_text(encoding='utf-8', errors='replace')
          project=(root/'en-project-dom.html').read_text(encoding='utf-8', errors='replace')
          zh=(root/'zh-mobile-dom.html').read_text(encoding='utf-8', errors='replace')

          assert 'This hosted shell is not bound to a NovelForge Core host' in en
          assert 'Cloud-hosted' in en
          assert 'Project Hub' in project
          assert 'This hosted shell is not bound to a NovelForge Core host' in project
          assert '这个云端 Studio 尚未绑定 NovelForge Core 宿主' in zh
          assert '云托管' in zh

          for netlog in root.glob('*-netlog.json'):
              text=netlog.read_text(encoding='utf-8', errors='replace')
              assert '/api/bridge/invoke' not in text, f'unbound hosted Studio contacted Core bridge: {netlog.name}'

          for image in ('en-desktop.png','en-mobile.png','zh-mobile.png'):
              path=root/image
              assert path.exists() and path.stat().st_size > 10_000, image

          (root/'runtime-proof.txt').write_text(
              'schema=novelforge_studio_cloud_runtime_proof_v1\n'
              'surface=cloud_ui\n'
              'core_host=unbound\n'
              'bridge_requests=0\n'
              'authority=false\n',
              encoding='utf-8',
          )
          print({'schema':'novelforge_studio_cloud_browser_qa_v1','status':'pass','bridge_requests':0})
          PY

      - name: Upload cloud-host QA evidence
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: studio-cloud-qa
          path: /tmp/studio-cloud-qa
          if-no-files-found: error
          retention-days: 7

      - name: Ensure production custom domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains"
          domain_api="${base}/${CLOUDFLARE_CUSTOM_DOMAIN}"
          status=$(curl --silent --show-error --output /tmp/studio-domain.json --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${domain_api}")
          if [ "${status}" = "404" ]; then
            payload=$(jq -nc --arg name "${CLOUDFLARE_CUSTOM_DOMAIN}" '{name:$name}')
            status=$(curl --silent --show-error --output /tmp/studio-domain.json --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${base}")
            case "${status}" in 200|201) ;; *) cat /tmp/studio-domain.json; exit 1 ;; esac
          elif [ "${status}" != "200" ]; then
            cat /tmp/studio-domain.json
            exit 1
          fi
          jq -e '.success == true' /tmp/studio-domain.json >/dev/null

          active=false
          for _ in $(seq 1 24); do
            curl --silent --show-error --fail \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${domain_api}" > /tmp/studio-domain-post.json
            domain_status=$(jq -r '.result.status // "unknown"' /tmp/studio-domain-post.json)
            if [ "${domain_status}" = "active" ]; then active=true; break; fi
            sleep 5
          done
          if [ "${active}" != "true" ]; then cat /tmp/studio-domain-post.json; exit 1; fi

      - name: Verify production Studio over HTTPS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 24); do
            if curl --silent --show-error --fail "https://${CLOUDFLARE_CUSTOM_DOMAIN}/" > /tmp/studio-live.html; then
              if grep -q '<title>NovelForge Studio</title>' /tmp/studio-live.html; then ready=true; break; fi
            fi
            sleep 5
          done
          test "${ready}" = "true"
          curl --silent --show-error --fail "https://${CLOUDFLARE_CUSTOM_DOMAIN}/project?lang=en-US" > /tmp/studio-live-project.html
          grep -q '<title>NovelForge Studio</title>' /tmp/studio-live-project.html
          curl --silent --show-error --fail --dump-header /tmp/studio-live-headers.txt --output /dev/null "https://${CLOUDFLARE_CUSTOM_DOMAIN}/"
          grep -qi '^content-security-policy:' /tmp/studio-live-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/studio-live-headers.txt
          curl --silent --show-error --fail "https://${CLOUDFLARE_CUSTOM_DOMAIN}/.well-known/novelforge-host.json" > /tmp/studio-live-host.json
          jq -e '.surface == "cloud_ui" and .core_host == "unbound" and .authority == false' /tmp/studio-live-host.json >/dev/null
          {
            echo '### NovelForge Studio Cloud Host'
            echo "- Production: https://${CLOUDFLARE_CUSTOM_DOMAIN}"
            echo '- Surface: cloud_ui'
            echo '- Core host: unbound by design'
            echo '- Authority: false'
          } >> "${GITHUB_STEP_SUMMARY}"
