name: Product Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/brand/**"
      - "docs/documentation_manifest.json"
      - "**/*.md"
      - ".github/workflows/product-site.yml"
  pull_request:
    paths:
      - "site/**"
      - "assets/brand/**"
      - "docs/documentation_manifest.json"
      - "**/*.md"
      - ".github/workflows/product-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: product-site-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT_NAME: novelforge
  CLOUDFLARE_CUSTOM_DOMAIN: novelforge.wei-dev.com

jobs:
  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install exact direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Product-site contract checks
        run: npm run quality

      - name: Production build
        run: npm run build

      - name: Ensure Cloudflare Pages project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          status=$(curl --silent --show-error --output /tmp/pages-project.json --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}")

          if [ "${status}" = "404" ]; then
            payload=$(jq -nc --arg name "${CLOUDFLARE_PROJECT_NAME}" '{name:$name, production_branch:"main"}')
            status=$(curl --silent --show-error --output /tmp/pages-project.json --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")
            case "${status}" in
              200|201) ;;
              *) cat /tmp/pages-project.json; exit 1 ;;
            esac
          elif [ "${status}" != "200" ]; then
            cat /tmp/pages-project.json
            exit 1
          fi

          jq -e '.success == true' /tmp/pages-project.json >/dev/null

      - name: Deploy production to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=novelforge --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Product Site custom domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          domain_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains/${CLOUDFLARE_CUSTOM_DOMAIN}"
          status=$(curl --silent --show-error --output /tmp/pages-domain.json --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${domain_api}")

          if [ "${status}" = "404" ]; then
            payload=$(jq -nc --arg name "${CLOUDFLARE_CUSTOM_DOMAIN}" '{name:$name}')
            status=$(curl --silent --show-error --output /tmp/pages-domain.json --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains")
            case "${status}" in
              200|201) ;;
              *) cat /tmp/pages-domain.json; exit 1 ;;
            esac
          elif [ "${status}" != "200" ]; then
            cat /tmp/pages-domain.json
            exit 1
          fi

          jq -e '.success == true' /tmp/pages-domain.json >/dev/null

      - name: Record Cloudflare Pages post-condition
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}" \
            --output /tmp/pages-project-post.json
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains/${CLOUDFLARE_CUSTOM_DOMAIN}" \
            --output /tmp/pages-domain-post.json

          jq -e '.success == true' /tmp/pages-project-post.json >/dev/null
          jq -e '.success == true' /tmp/pages-domain-post.json >/dev/null
          origin=$(jq -r '.result.subdomain // empty' /tmp/pages-project-post.json)
          domain_status=$(jq -r '.result.status // "unknown"' /tmp/pages-domain-post.json)
          test -n "${origin}"

          {
            echo "### Cloudflare Pages"
            echo "- Origin: https://${origin}"
            echo "- Custom domain: https://${CLOUDFLARE_CUSTOM_DOMAIN} (${domain_status})"
            echo "- External DNS CNAME: novelforge -> ${origin}"
          } >> "${GITHUB_STEP_SUMMARY}"
