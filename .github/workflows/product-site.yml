name: Product Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/brand/**"
      - "docs/documentation_manifest.json"
      - "**/*.md"
      - ".github/workflows/product-site.yml"
  pull_request:
    paths:
      - "site/**"
      - "assets/brand/**"
      - "docs/documentation_manifest.json"
      - "**/*.md"
      - ".github/workflows/product-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: product-site-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT_NAME: novelforge
  CLOUDFLARE_CUSTOM_DOMAIN: novelforge.wei-dev.com
  GODOT_RELEASE: 4.7.1-stable
  GODOT_TEMPLATE_VERSION: 4.7.1.stable
  GODOT_SOURCE_SHA256: 0230d490846467c4fd772cc70b08dc56cb3adfedd55d039de0af74ddfdba00eb
  EMSDK_VERSION: 4.0.20
  MAX_PAGE_ASSET_BYTES: 26214400

jobs:
  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install exact direct dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Product and Docs source contracts
        run: |
          npm run quality
          npm run godot:shadow:quality

      - name: Build permanent Starlight Docs surface
        run: |
          npm run content
          npm run docs:build
          test -s dist/docs/index.html

      - name: Install pinned Godot editor
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore slim Web template cache
        id: template-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/novelforge-godot-template
          key: novelforge-godot-web-${{ env.GODOT_RELEASE }}-${{ env.EMSDK_VERSION }}-kawaii2d-v2

      - name: Compile slim 2D-only Web template
        if: steps.template-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --user 'scons>=4.4,<5'
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf /tmp/emsdk
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install "${EMSDK_VERSION}"
          /tmp/emsdk/emsdk activate "${EMSDK_VERSION}"
          source /tmp/emsdk/emsdk_env.sh
          bash scripts/build-godot-web-template.sh "$HOME/.cache/novelforge-godot-template"

      - name: Install slim Web export template
        run: |
          set -euo pipefail
          template="$HOME/.cache/novelforge-godot-template/web_nothreads_release.zip"
          test -s "$template"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$template_dir"
          cp "$template" "$template_dir/web_nothreads_release.zip"
          cat "$HOME/.cache/novelforge-godot-template/build-meta.txt"

      - name: Build Godot Product root preserving Docs
        run: bash scripts/build-godot-web.sh

      - name: Record production artifact sizes
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -printf '%s %f\n' | sort -nr | head -20
          test -s dist/index.html
          test -s dist/docs/index.html
          test -s dist/_redirects

      - name: Ensure Cloudflare Pages project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}"
          status=$(curl --silent --show-error --output /tmp/pages-project.json --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}")

          if [ "${status}" = "404" ]; then
            payload=$(jq -nc --arg name "${CLOUDFLARE_PROJECT_NAME}" '{name:$name, production_branch:"main"}')
            status=$(curl --silent --show-error --output /tmp/pages-project.json --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")
            case "${status}" in
              200|201) ;;
              *) cat /tmp/pages-project.json; exit 1 ;;
            esac
          elif [ "${status}" != "200" ]; then
            cat /tmp/pages-project.json
            exit 1
          fi

          jq -e '.success == true' /tmp/pages-project.json >/dev/null

      - name: Deploy production to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=novelforge --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Product Site custom domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          domain_api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains/${CLOUDFLARE_CUSTOM_DOMAIN}"
          status=$(curl --silent --show-error --output /tmp/pages-domain.json --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${domain_api}")

          if [ "${status}" = "404" ]; then
            payload=$(jq -nc --arg name "${CLOUDFLARE_CUSTOM_DOMAIN}" '{name:$name}')
            status=$(curl --silent --show-error --output /tmp/pages-domain.json --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains")
            case "${status}" in
              200|201) ;;
              *) cat /tmp/pages-domain.json; exit 1 ;;
            esac
          elif [ "${status}" != "200" ]; then
            cat /tmp/pages-domain.json
            exit 1
          fi

          jq -e '.success == true' /tmp/pages-domain.json >/dev/null

      - name: Record Cloudflare Pages post-condition
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}" \
            --output /tmp/pages-project-post.json
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains/${CLOUDFLARE_CUSTOM_DOMAIN}" \
            --output /tmp/pages-domain-post.json

          jq -e '.success == true' /tmp/pages-project-post.json >/dev/null
          jq -e '.success == true' /tmp/pages-domain-post.json >/dev/null
          origin=$(jq -r '.result.subdomain // empty' /tmp/pages-project-post.json)
          domain_status=$(jq -r '.result.status // "unknown"' /tmp/pages-domain-post.json)
          test -n "${origin}"

          {
            echo "### Cloudflare Pages"
            echo "- Product runtime: Godot Web (Compatibility, 2D/2.5D only)"
            echo "- Docs runtime: Astro/Starlight at /docs/**"
            echo "- Origin: https://${origin}"
            echo "- Custom domain: https://${CLOUDFLARE_CUSTOM_DOMAIN} (${domain_status})"
            echo "- External DNS CNAME: novelforge -> ${origin}"
          } >> "${GITHUB_STEP_SUMMARY}"
