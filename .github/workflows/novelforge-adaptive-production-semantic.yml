name: NovelForge AI-Native Production Semantic Eval

on:
  pull_request:
    branches: [main]
    paths:
      - 'surface/FUNDAMENTALS.en.md'
      - 'surface/FUNDAMENTALS.zh-CN.md'
      - 'quality/taxonomy.json'
      - 'harness/semantic_workers/contracts/**'
      - 'evals/eval_manifest.json'
      - 'evals/ai_native_ablation_manifest.json'
      - 'evals/evaluate_ai_native_ablation.py'
      - 'evals/evaluation_execution_identity.py'
      - 'evals/cases/context_*.json'
      - 'evals/cases/character_*.json'
      - 'evals/cases/reader_*.json'
      - 'evals/cases/surface_*.json'
      - 'evals/cases/planning_horizon_*.json'
      - 'evals/cases/ablation_*.json'
      - '.github/workflows/novelforge-adaptive-production-semantic.yml'
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Semantic execution mode. Paid/model execution is manual only.'
        required: true
        default: deterministic_only
        type: choice
        options:
          - deterministic_only
          - full_semantic_suite
          - reader_contamination_3x2

permissions:
  contents: read

jobs:
  semantic-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NOVELFORGE_OPENAI_MODEL: gpt-5.6
      NOVELFORGE_OPENAI_REASONING_EFFORT: medium
      NOVELFORGE_DISABLE_LOCAL_AGENT_AUTO: '1'
      EXECUTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_mode || 'deterministic_only' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve independent evaluator capability
        id: semantic-capability
        run: |
          if [ "$EXECUTION_MODE" = 'deterministic_only' ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'requested=false' >> "$GITHUB_OUTPUT"
            python - <<'PY'
          import json
          status={
              'schema':'novelforge_feature_semantic_gate_v1',
              'feature':'ai_native_architecture_refoundation',
              'status':'PENDING_MODEL',
              'reason':'manual_semantic_execution_not_requested',
              'promotion_evidence':False,
              'model_execution':False,
          }
          json.dump(status,open('adaptive-production-semantic-status.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          elif [ -z "$OPENAI_API_KEY" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'requested=true' >> "$GITHUB_OUTPUT"
            python - <<'PY'
          import json
          status={
              'schema':'novelforge_feature_semantic_gate_v1',
              'feature':'ai_native_architecture_refoundation',
              'status':'PENDING_MODEL',
              'reason':'independent_provider_credential_unavailable',
              'promotion_evidence':False,
              'model_execution':False,
          }
          json.dump(status,open('adaptive-production-semantic-status.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('AI-native production semantic evidence: PENDING_MODEL (no independent provider credential).')
          PY
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'requested=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build blind AI-native queue and validate ablation bindings
        run: |
          python evals/build_judge_queue.py --output adaptive-production-queue.json
          python - <<'PY'
          import json
          p='adaptive-production-queue.json'
          d=json.load(open(p,encoding='utf-8'))
          wanted={
              'SURFACE-HF30-001','SURFACE-HF30-002','SURFACE-HF30-003','SURFACE-HF30-004','SURFACE-HF30-005',
              'CONTEXT-FUTURE-001','CHAR-EPISTEMIC-001',
              'PLANNING-HORIZON-001','PLANNING-HORIZON-002','PLANNING-HORIZON-003',
              'CONTEXT-REMOTE-001','CONTEXT-IRRELEVANT-001','CONTEXT-CONTINUE-001','CONTEXT-STOP-001',
              'READER-AGENDA-NATURAL-001','CHAR-INFERENCE-001','CHAR-EMBODIMENT-001',
              'ABL-READER-UNPRIMED-001','ABL-READER-PRIMED-001',
              'ABL-TELEMETRY-CLEAN-001','ABL-TELEMETRY-ANCHORED-001',
              'ABL-RULE-HOLISTIC-001','ABL-RULE-DECOMPOSED-001',
          }
          d['cases']=[c for c in d['cases'] if c.get('id') in wanted]
          ids={c['id'] for c in d['cases']}
          assert ids == wanted, {'missing':sorted(wanted-ids),'extra':sorted(ids-wanted)}
          for case in d['cases']:
              assert 'expected' not in case, case
              assert 'expected_verdict' not in case, case
              assert 'expected_codes' not in case, case
              assert 'gold' not in case, case
          by_id={c['id']:c for c in d['cases']}
          ab=json.load(open('evals/ai_native_ablation_manifest.json',encoding='utf-8'))
          assert ab['schema']=='novelforge_ai_native_ablation_manifest_v1',ab
          assert ab['manager_self_judgment_allowed'] is False,ab
          assert ab['missing_model_state']=='PENDING_MODEL',ab
          for pair in ab['pairs']:
              a=by_id[pair['incumbent_case']]
              b=by_id[pair['challenger_case']]
              ar=a['fixture'].get('candidate_ref')
              br=b['fixture'].get('candidate_ref')
              assert ar == br == pair['same_candidate_ref'], (pair,ar,br)
              assert a['fixture'].get('candidate_text') == b['fixture'].get('candidate_text'), pair['id']
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(f'validated blind AI-native queue: {len(d["cases"])} cases; ablation pairs: {len(ab["pairs"])}')
          PY

      - name: Package and validate fingerprint-bound jobs
        run: |
          python harness/semantic_workers/semantic_worker_router.py prepare-evals \
            --queue adaptive-production-queue.json --output adaptive-production-jobs.json
          python harness/semantic_workers/semantic_worker_router.py validate-jobs \
            --jobs adaptive-production-jobs.json

      - name: Prepare reader contamination 3x2 plan without model execution
        run: |
          python evals/build_judge_queue.py --output reader-contamination-queue.json
          python evals/evaluate_ai_native_ablation.py prepare --output reader-contamination-plan.json
          for rep in R1 R2 R3; do
            python harness/semantic_workers/semantic_worker_router.py prepare-evals \
              --queue reader-contamination-queue.json \
              --output "reader-contamination-${rep}-all-jobs.json" \
              --source-session-id "SES-ABL-${GITHUB_RUN_ID}-${rep}" \
              --handoff-id "HND-reader-contamination-${rep}"
            REP="$rep" python - <<'PY'
          import json,os
          rep=os.environ['REP']
          src=f'reader-contamination-{rep}-all-jobs.json'
          out=f'reader-contamination-{rep}-jobs.json'
          d=json.load(open(src,encoding='utf-8'))
          wanted={'ABL-READER-PRIMED-001','ABL-READER-UNPRIMED-001'}
          d['jobs']=[j for j in d.get('jobs',[]) if j.get('subject_id') in wanted]
          assert {j['subject_id'] for j in d['jobs']}==wanted,d
          assert all(j.get('execution',{}).get('handoff_id')==f'HND-reader-contamination-{rep}' for j in d['jobs']),d
          json.dump(d,open(out,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
            python harness/semantic_workers/semantic_worker_router.py validate-jobs \
              --jobs "reader-contamination-${rep}-jobs.json"
          done
          python - <<'PY'
          import hashlib,json
          plan=json.load(open('reader-contamination-plan.json',encoding='utf-8'))
          qfp='sha256:'+hashlib.sha256(open('reader-contamination-queue.json','rb').read()).hexdigest()
          assert qfp==plan['blind_queue_fingerprint'],(qfp,plan['blind_queue_fingerprint'])
          row=next(x for x in plan['execution_plan'] if x['pair_id']=='reader_contamination')
          assert len(row['replicates'])==3 and all(len(r['review_subjects'])==2 for r in row['replicates']),row
          expected={'incumbent':row['incumbent_input_fingerprint'],'challenger':row['challenger_input_fingerprint']}
          for rep in ('R1','R2','R3'):
              d=json.load(open(f'reader-contamination-{rep}-jobs.json',encoding='utf-8'))
              by={j['subject_id']:j for j in d['jobs']}
              assert by['ABL-READER-PRIMED-001']['input_fingerprint']==expected['incumbent']
              assert by['ABL-READER-UNPRIMED-001']['input_fingerprint']==expected['challenger']
          print('reader_contamination deterministic 3x2 plan ready; model_execution=false')
          PY

      - name: Verify independent provider capability
        if: steps.semantic-capability.outputs.available == 'true'
        run: |
          python harness/semantic_workers/semantic_worker_runner.py capabilities > adaptive-production-capabilities.json
          python - <<'PY'
          import json
          d=json.load(open('adaptive-production-capabilities.json',encoding='utf-8'))
          assert d['independent_worker_available'] is True,d
          assert d['adapter_source'] == 'openai_env',d
          assert d['built_in_model_provider'] is True,d
          PY

      - name: Execute full blind semantic suite
        if: steps.semantic-capability.outputs.available == 'true' && env.EXECUTION_MODE == 'full_semantic_suite'
        run: |
          python harness/semantic_workers/semantic_worker_runner.py run \
            --jobs adaptive-production-jobs.json \
            --output adaptive-production-execution.json \
            --require-complete
          python - <<'PY'
          import json
          r=json.load(open('adaptive-production-execution.json',encoding='utf-8'))
          assert r['status'] in {'completed','semantic_reject'},r
          json.dump({'results':r['results']},open('adaptive-production-results.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - name: Validate full-suite bindings and judgments
        if: steps.semantic-capability.outputs.available == 'true' && env.EXECUTION_MODE == 'full_semantic_suite'
        run: |
          python harness/semantic_workers/semantic_worker_router.py validate-results \
            --jobs adaptive-production-jobs.json \
            --results adaptive-production-results.json \
            --judgments-output adaptive-production-judgments.json

      - name: Evaluate full semantic regressions
        if: steps.semantic-capability.outputs.available == 'true' && env.EXECUTION_MODE == 'full_semantic_suite'
        run: |
          set +e
          python evals/run_evals.py --judgments adaptive-production-judgments.json --json > adaptive-production-eval.json
          eval_rc=$?
          set -e
          python - <<'PY'
          import json
          wanted={
              'SURFACE-HF30-001','SURFACE-HF30-002','SURFACE-HF30-003','SURFACE-HF30-004','SURFACE-HF30-005',
              'CONTEXT-FUTURE-001','CHAR-EPISTEMIC-001',
              'PLANNING-HORIZON-001','PLANNING-HORIZON-002','PLANNING-HORIZON-003',
              'CONTEXT-REMOTE-001','CONTEXT-IRRELEVANT-001','CONTEXT-CONTINUE-001','CONTEXT-STOP-001',
              'READER-AGENDA-NATURAL-001','CHAR-INFERENCE-001','CHAR-EMBODIMENT-001',
              'ABL-READER-UNPRIMED-001','ABL-READER-PRIMED-001',
              'ABL-TELEMETRY-CLEAN-001','ABL-TELEMETRY-ANCHORED-001',
              'ABL-RULE-HOLISTIC-001','ABL-RULE-DECOMPOSED-001',
          }
          d=json.load(open('adaptive-production-eval.json',encoding='utf-8'))
          selected=[r for r in d['results'] if r['case_id'] in wanted]
          assert len(selected) == len(wanted), {'selected':len(selected),'wanted':len(wanted)}
          failed=[r['case_id'] for r in selected if r['result'] != 'PASS']
          status={
              'schema':'novelforge_feature_semantic_gate_v1',
              'feature':'ai_native_architecture_refoundation',
              'status':'FAIL' if failed else 'PASS',
              'reason':'independent_blind_ai_native_regressions_or_ablations_failed' if failed else 'independent_blind_ai_native_regressions_and_ablation_expectations_passed',
              'promotion_evidence':not failed,
              'model_execution':True,
              'case_ids':sorted(wanted),
              'failed_case_ids':sorted(failed),
          }
          json.dump(status,open('adaptive-production-semantic-status.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          if failed:
              raise SystemExit('semantic regressions failed: '+', '.join(sorted(failed)))
          PY
          test "$eval_rc" -eq 0

      - name: Execute reader contamination 3x2 ablation
        if: steps.semantic-capability.outputs.available == 'true' && env.EXECUTION_MODE == 'reader_contamination_3x2'
        env:
          NOVELFORGE_MAX_SEMANTIC_CALLS: '12'
          NOVELFORGE_JOB_TIMEOUT_MINUTES: '45'
          NOVELFORGE_RESOURCE_BUDGET_BINDING: 'reader_contamination_3x2_hard_ceiling_12_calls'
        run: |
          set -euo pipefail
          calls=0
          run_batch() {
            jobs="$1"
            output="$2"
            expected="$3"
            count="$(python - "$jobs" <<'PY'
          import json,sys
          print(len(json.load(open(sys.argv[1],encoding='utf-8')).get('jobs',[])))
          PY
          )"
            test "$count" -eq "$expected"
            next=$((calls + count))
            if [ "$next" -gt 12 ]; then
              echo "semantic call ceiling would be exceeded: $next > 12" >&2
              exit 90
            fi
            calls="$next"
            printf '%s\n' "$calls" > reader-contamination-call-count.txt
            python harness/semantic_workers/semantic_worker_runner.py run \
              --jobs "$jobs" --output "$output" --require-complete
          }

          python - <<'PY'
          import json
          json.dump({'schema':'novelforge_ai_native_ablation_observations_v2','observations':[]},open('reader-contamination-observations.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

          for rep in R1 R2 R3; do
            python evals/evaluation_execution_identity.py capture \
              --queue reader-contamination-queue.json \
              --jobs "reader-contamination-${rep}-jobs.json" \
              --capabilities adaptive-production-capabilities.json \
              --candidate-commit "$GITHUB_SHA" \
              --model "$NOVELFORGE_OPENAI_MODEL" \
              --reasoning-effort "$NOVELFORGE_OPENAI_REASONING_EFFORT" \
              --domain reader_contamination \
              --output "reader-contamination-${rep}-condition-identity.json"
            python evals/evaluation_execution_identity.py validate "reader-contamination-${rep}-condition-identity.json"

            run_batch "reader-contamination-${rep}-jobs.json" "reader-contamination-${rep}-execution.json" 2
            REP="$rep" python - <<'PY'
          import json,os
          rep=os.environ['REP']
          r=json.load(open(f'reader-contamination-{rep}-execution.json',encoding='utf-8'))
          assert r['status'] in {'completed','semantic_reject'},r
          by={x['subject_id']:x for x in r['results']}
          assert {'ABL-READER-PRIMED-001','ABL-READER-UNPRIMED-001'} <= set(by),by
          for subject,out in [('ABL-READER-PRIMED-001',f'reader-contamination-{rep}-incumbent-result.json'),('ABL-READER-UNPRIMED-001',f'reader-contamination-{rep}-challenger-result.json')]:
              assert by[subject]['status']=='completed',by[subject]
              json.dump(by[subject],open(out,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

            for order in INCUMBENT_FIRST CHALLENGER_FIRST; do
              suffix='inc-first'
              if [ "$order" = 'CHALLENGER_FIRST' ]; then suffix='chal-first'; fi
              python evals/evaluate_ai_native_ablation.py review-job \
                --pair reader_contamination \
                --replicate "$rep" \
                --order "$order" \
                --incumbent-result "reader-contamination-${rep}-incumbent-result.json" \
                --challenger-result "reader-contamination-${rep}-challenger-result.json" \
                --output "reader-contamination-${rep}-${suffix}-review-job.json"
              REP="$rep" SUFFIX="$suffix" python - <<'PY'
          import json,os
          rep=os.environ['REP']; suffix=os.environ['SUFFIX']
          job=json.load(open(f'reader-contamination-{rep}-{suffix}-review-job.json',encoding='utf-8'))
          json.dump({'jobs':[job]},open(f'reader-contamination-{rep}-{suffix}-review-jobs.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          q=json.load(open('reader-contamination-queue.json',encoding='utf-8'))
          wrapper={'schema':'novelforge_ablation_pair_review_queue_v1','suite_version':q.get('suite_version'),'blind':True,'pair_review_contract':'quality.ablation_compare','subjects':[{'subject_id':job['subject_id'],'input_fingerprint':job['input_fingerprint']}]}
          json.dump(wrapper,open(f'reader-contamination-{rep}-{suffix}-review-queue.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
              python harness/semantic_workers/semantic_worker_router.py validate-jobs \
                --jobs "reader-contamination-${rep}-${suffix}-review-jobs.json"
              python evals/evaluation_execution_identity.py capture \
                --queue "reader-contamination-${rep}-${suffix}-review-queue.json" \
                --jobs "reader-contamination-${rep}-${suffix}-review-jobs.json" \
                --capabilities adaptive-production-capabilities.json \
                --candidate-commit "$GITHUB_SHA" \
                --model "$NOVELFORGE_OPENAI_MODEL" \
                --reasoning-effort "$NOVELFORGE_OPENAI_REASONING_EFFORT" \
                --domain reader_contamination_pair_review \
                --output "reader-contamination-${rep}-${suffix}-review-identity.json"
              python evals/evaluation_execution_identity.py validate "reader-contamination-${rep}-${suffix}-review-identity.json"

              run_batch "reader-contamination-${rep}-${suffix}-review-jobs.json" "reader-contamination-${rep}-${suffix}-review-execution.json" 1
              REP="$rep" ORDER="$order" SUFFIX="$suffix" python - <<'PY'
          import json,os
          rep=os.environ['REP']; order=os.environ['ORDER']; suffix=os.environ['SUFFIX']
          execution=json.load(open(f'reader-contamination-{rep}-{suffix}-review-execution.json',encoding='utf-8'))
          assert execution['status']=='completed',execution
          assert len(execution['results'])==1,execution
          result=execution['results'][0]
          assert result['status']=='completed',result
          job=json.load(open(f'reader-contamination-{rep}-{suffix}-review-job.json',encoding='utf-8'))
          plan=json.load(open('reader-contamination-plan.json',encoding='utf-8'))
          pair=next(x for x in plan['execution_plan'] if x['pair_id']=='reader_contamination')
          packet=json.load(open('reader-contamination-observations.json',encoding='utf-8'))
          packet['observations'].append({
              'pair_id':'reader_contamination',
              'replicate_id':rep,
              'presentation_order':order,
              'candidate_fingerprint':pair['candidate_fingerprint'],
              'condition_execution_identity':json.load(open(f'reader-contamination-{rep}-condition-identity.json',encoding='utf-8')),
              'incumbent_result':json.load(open(f'reader-contamination-{rep}-incumbent-result.json',encoding='utf-8')),
              'challenger_result':json.load(open(f'reader-contamination-{rep}-challenger-result.json',encoding='utf-8')),
              'pair_review_execution_identity':json.load(open(f'reader-contamination-{rep}-{suffix}-review-identity.json',encoding='utf-8')),
              'pair_review_job':job,
              'pair_review_result':result,
          })
          json.dump(packet,open('reader-contamination-observations.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
            done
          done

          test "$calls" -eq 12
          python evals/evaluate_ai_native_ablation.py evaluate \
            --observations reader-contamination-observations.json \
            --output reader-contamination-ablation-evidence.json
          python - <<'PY'
          import json
          evidence=json.load(open('reader-contamination-ablation-evidence.json',encoding='utf-8'))
          rows={x['pair_id']:x for x in evidence['pairs']}
          reader=rows['reader_contamination']
          assert reader['comparability']['pair_review_count']==6,reader
          assert reader['comparability']['condition_replicates']==3,reader
          assert reader['comparability']['exact_counterbalance'] is True,reader
          assert reader['decision']['status'] in {'SIMPLIFY','KEEP','INCONCLUSIVE'},reader
          assert rows['telemetry_anchoring']['decision']['status']=='PENDING_MODEL',rows['telemetry_anchoring']
          assert rows['rule_audit_decomposition']['decision']['status']=='PENDING_MODEL',rows['rule_audit_decomposition']
          packet=json.load(open('reader-contamination-observations.json',encoding='utf-8'))
          identities=[]
          for o in packet['observations']:
              identities += [o['condition_execution_identity'],o['pair_review_execution_identity']]
          assert all(i['resource_budget']['max_semantic_calls']==12 for i in identities),identities
          assert all(i['resource_budget']['job_timeout_minutes']==45 for i in identities),identities
          assert all(i['resource_budget']['binding']=='reader_contamination_3x2_hard_ceiling_12_calls' for i in identities),identities
          status={
              'schema':'novelforge_feature_semantic_gate_v1',
              'feature':'ai_native_architecture_refoundation',
              'status':'PENDING_MODEL',
              'reason':'reader_contamination_ablation_completed_nonpromotion_evidence',
              'promotion_evidence':False,
              'model_execution':True,
              'semantic_calls':12,
              'ablation_pair':'reader_contamination',
              'ablation_decision':reader['decision']['status'],
              'ablation_evidence_fingerprint':evidence['evidence_fingerprint'],
          }
          json.dump(status,open('adaptive-production-semantic-status.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps({'reader_contamination':reader['decision'],'semantic_calls':12,'promotion_evidence':False},ensure_ascii=False,indent=2))
          PY

      - name: Assert semantic gate status is explicit
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('adaptive-production-semantic-status.json')
          if not p.exists():
              status={
                  'schema':'novelforge_feature_semantic_gate_v1',
                  'feature':'ai_native_architecture_refoundation',
                  'status':'ERROR',
                  'reason':'semantic_workflow_failed_before_gate_receipt',
                  'promotion_evidence':False,
                  'model_execution':False,
              }
              json.dump(status,p.open('w',encoding='utf-8'),ensure_ascii=False,indent=2)
          d=json.load(p.open(encoding='utf-8'))
          assert d['schema']=='novelforge_feature_semantic_gate_v1',d
          assert d['status'] in {'PASS','FAIL','PENDING_MODEL','ERROR'},d
          assert d['promotion_evidence'] is (d['status']=='PASS'),d
          print(json.dumps(d,ensure_ascii=False,indent=2))
          if d['status']=='ERROR':
              raise SystemExit('semantic workflow ended without a valid gate result')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-production-semantic-${{ github.run_id }}
          path: |
            adaptive-production-semantic-status.json
            adaptive-production-capabilities.json
            adaptive-production-queue.json
            adaptive-production-jobs.json
            adaptive-production-execution.json
            adaptive-production-results.json
            adaptive-production-judgments.json
            adaptive-production-eval.json
            reader-contamination-queue.json
            reader-contamination-plan.json
            reader-contamination-call-count.txt
            reader-contamination-observations.json
            reader-contamination-ablation-evidence.json
            reader-contamination-*-jobs.json
            reader-contamination-*-identity.json
            reader-contamination-*-execution.json
            reader-contamination-*-result.json
            reader-contamination-*-review-job.json
            reader-contamination-*-review-queue.json
          if-no-files-found: warn
