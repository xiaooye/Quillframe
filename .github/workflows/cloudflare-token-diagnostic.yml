name: Cloudflare Token Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-token-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect effective Cloudflare token policies
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          verify_status=$(curl --silent --show-error --output /tmp/verify.json --write-out "%{http_code}" \
            --header "${auth}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")
          echo "Token verify HTTP: ${verify_status}"
          jq '{success, errors, result: (.result | {id,status,expires_on,not_before})}' /tmp/verify.json || cat /tmp/verify.json
          [ "${verify_status}" = "200" ] || exit 1
          token_id=$(jq -r '.result.id // empty' /tmp/verify.json)
          test -n "${token_id}"

          detail_status=$(curl --silent --show-error --output /tmp/detail.json --write-out "%{http_code}" \
            --header "${auth}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/${token_id}")
          echo "Token detail HTTP: ${detail_status}"
          [ "${detail_status}" = "200" ] || { jq '{success, errors, messages}' /tmp/detail.json; exit 1; }
          jq '{success, errors, result: {name: .result.name, status: .result.status, policies: [.result.policies[] | {effect, resources, permissions: [.permission_groups[].name]}]}}' /tmp/detail.json

          zone_status=$(curl --silent --show-error --output /tmp/zones.json --write-out "%{http_code}" \
            --header "${auth}" \
            "https://api.cloudflare.com/client/v4/zones?name=wei-dev.com&account.id=${CLOUDFLARE_ACCOUNT_ID}")
          echo "Zone lookup HTTP: ${zone_status}"
          jq '{success, errors, result: [.result[]? | {id,name,status}]}' /tmp/zones.json || cat /tmp/zones.json
          [ "${zone_status}" = "200" ] || exit 1
          zone_id=$(jq -r '.result[0].id // empty' /tmp/zones.json)
          test -n "${zone_id}"

          dns_status=$(curl --silent --show-error --output /tmp/dns.json --write-out "%{http_code}" \
            --header "${auth}" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?per_page=5")
          echo "Existing admin token DNS list HTTP: ${dns_status}"
          jq '{success, errors, messages, result_count: (.result | length?)}' /tmp/dns.json || cat /tmp/dns.json

          dns_read_id=$(jq -r '[.result.policies[].permission_groups[] | select(.name == "DNS Read")][0].id // empty' /tmp/detail.json)
          dns_write_id=$(jq -r '[.result.policies[].permission_groups[] | select(.name == "DNS Write")][0].id // empty' /tmp/detail.json)
          zone_read_id=$(jq -r '[.result.policies[].permission_groups[] | select(.name == "Zone Read")][0].id // empty' /tmp/detail.json)
          test -n "${dns_read_id}"
          test -n "${dns_write_id}"
          test -n "${zone_read_id}"

          probe_name="novelforge-dns-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          zone_resource="com.cloudflare.api.account.zone.${zone_id}"
          probe_payload=$(jq -nc \
            --arg name "${probe_name}" \
            --arg dns_read "${dns_read_id}" \
            --arg dns_write "${dns_write_id}" \
            --arg zone_read "${zone_read_id}" \
            --arg zone_resource "${zone_resource}" \
            '{name:$name, policies:[{effect:"allow", permission_groups:[{id:$dns_read},{id:$dns_write},{id:$zone_read}], resources:{($zone_resource):"*"}}]}')

          create_status=$(curl --silent --show-error --output /tmp/probe-create.json --write-out "%{http_code}" \
            --request POST \
            --header "${auth}" \
            --header "Content-Type: application/json" \
            --data "${probe_payload}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens")
          echo "Dedicated DNS probe token create HTTP: ${create_status}"
          if [ "${create_status}" != "200" ] && [ "${create_status}" != "201" ]; then
            jq '{success, errors, messages}' /tmp/probe-create.json || cat /tmp/probe-create.json
            exit 1
          fi
          jq -e '.success == true' /tmp/probe-create.json >/dev/null
          probe_id=$(jq -r '.result.id // empty' /tmp/probe-create.json)
          probe_value=$(jq -r '.result.value // empty' /tmp/probe-create.json)
          test -n "${probe_id}"
          test -n "${probe_value}"
          echo "::add-mask::${probe_value}"

          cleanup() {
            curl --silent --show-error \
              --request DELETE \
              --header "${auth}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/${probe_id}" \
              >/tmp/probe-delete.json || true
          }
          trap cleanup EXIT

          probe_status=$(curl --silent --show-error --output /tmp/probe-dns.json --write-out "%{http_code}" \
            --header "Authorization: Bearer ${probe_value}" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?per_page=5")
          echo "Dedicated DNS probe token list HTTP: ${probe_status}"
          jq '{success, errors, messages, result_count: (.result | length?)}' /tmp/probe-dns.json || cat /tmp/probe-dns.json

          {
            echo "### Cloudflare token diagnostic"
            echo "- admin token verify HTTP: ${verify_status}"
            echo "- admin token details HTTP: ${detail_status}"
            echo "- zone lookup HTTP: ${zone_status}"
            echo "- admin token DNS list HTTP: ${dns_status}"
            echo "- dedicated DNS probe token create HTTP: ${create_status}"
            echo "- dedicated DNS probe token DNS list HTTP: ${probe_status}"
            echo "- dedicated probe token is deleted by EXIT trap"
          } >> "${GITHUB_STEP_SUMMARY}"
