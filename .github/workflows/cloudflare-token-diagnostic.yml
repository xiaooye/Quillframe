name: Cloudflare Token Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-token-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect NovelForge Pages binding with ephemeral token
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          admin_auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          curl --silent --show-error --fail \
            --header "${admin_auth}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" \
            > /tmp/verify.json
          jq -e '.success == true and .result.status == "active"' /tmp/verify.json >/dev/null
          admin_id=$(jq -r '.result.id' /tmp/verify.json)

          curl --silent --show-error --fail \
            --header "${admin_auth}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/${admin_id}" \
            > /tmp/detail.json
          jq -e '.success == true' /tmp/detail.json >/dev/null
          pages_read_id=$(jq -r '[.result.policies[].permission_groups[] | select(.name == "Pages Read")][0].id // empty' /tmp/detail.json)
          pages_write_id=$(jq -r '[.result.policies[].permission_groups[] | select(.name == "Pages Write")][0].id // empty' /tmp/detail.json)
          test -n "${pages_read_id}"
          test -n "${pages_write_id}"

          resource="com.cloudflare.api.account.${CLOUDFLARE_ACCOUNT_ID}"
          expires_on=$(date -u -d '+15 minutes' '+%Y-%m-%dT%H:%M:%SZ')
          payload=$(jq -nc \
            --arg name "novelforge-pages-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg pages_read "${pages_read_id}" \
            --arg pages_write "${pages_write_id}" \
            --arg resource "${resource}" \
            --arg expires_on "${expires_on}" \
            '{name:$name,expires_on:$expires_on,policies:[{effect:"allow",permission_groups:[{id:$pages_read},{id:$pages_write}],resources:{($resource):"*"}}]}')

          create_status=$(curl --silent --show-error --output /tmp/temp.json --write-out "%{http_code}" \
            --request POST \
            --header "${admin_auth}" \
            --header "Content-Type: application/json" \
            --data "${payload}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens")
          echo "Pages probe token create HTTP: ${create_status}"
          case "${create_status}" in 200|201) ;; *) jq '{success,errors,messages}' /tmp/temp.json; exit 1 ;; esac
          temp_id=$(jq -r '.result.id // empty' /tmp/temp.json)
          temp_value=$(jq -r '.result.value // empty' /tmp/temp.json)
          test -n "${temp_id}"
          test -n "${temp_value}"
          echo "::add-mask::${temp_value}"

          cleanup() {
            curl --silent --show-error --request DELETE \
              --header "${admin_auth}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/${temp_id}" \
              >/tmp/delete.json || true
          }
          trap cleanup EXIT
          pages_auth="Authorization: Bearer ${temp_value}"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/novelforge"

          project_status=$(curl --silent --show-error --output /tmp/project.json --write-out "%{http_code}" \
            --header "${pages_auth}" "${base}")
          echo "Project GET HTTP: ${project_status}"
          jq '{success,errors,result:(.result | {name,subdomain,production_branch,latest_deployment:(.latest_deployment | {id,url,environment,created_on})})}' /tmp/project.json || cat /tmp/project.json

          domains_status=$(curl --silent --show-error --output /tmp/domains.json --write-out "%{http_code}" \
            --header "${pages_auth}" "${base}/domains")
          echo "Domains LIST HTTP: ${domains_status}"
          jq '{success,errors,result:[.result[]? | {name,status,verification_data,validation_data,created_on}]}' /tmp/domains.json || cat /tmp/domains.json

          for domain in novelforge.wei-dev.com wei-dev.com www.wei-dev.com; do
            encoded=$(printf '%s' "${domain}" | jq -sRr @uri)
            status=$(curl --silent --show-error --output "/tmp/domain-${domain//./_}.json" --write-out "%{http_code}" \
              --header "${pages_auth}" "${base}/domains/${encoded}")
            echo "Domain ${domain} GET HTTP: ${status}"
            jq '{success,errors,result:(.result | {name,status,verification_data,validation_data,created_on})}' "/tmp/domain-${domain//./_}.json" || true
          done

          origin_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 \
            "https://novelforge-c73.pages.dev/" || true)
          custom_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 \
            "https://novelforge.wei-dev.com/" || true)
          echo "pages.dev origin HTTP: ${origin_status:-curl-failed}"
          echo "novelforge custom host HTTP: ${custom_status:-curl-failed}"

          {
            echo "### NovelForge Pages binding diagnostic"
            echo "- dedicated Pages token create: \`${create_status}\`"
            echo "- project GET: \`${project_status}\`"
            echo "- domains LIST: \`${domains_status}\`"
            echo "- pages.dev origin HTTP: \`${origin_status:-curl-failed}\`"
            echo "- novelforge custom host HTTP: \`${custom_status:-curl-failed}\`"
            echo "- ephemeral Pages token deleted by EXIT trap"
          } >> "${GITHUB_STEP_SUMMARY}"
