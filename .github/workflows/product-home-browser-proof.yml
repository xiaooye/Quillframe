name: Product Home Browser Proof

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/brand/**'
      - '.github/workflows/product-home-browser-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-home-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  home-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install exact Product Site dependencies
        working-directory: site
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build restored Product SPA
        working-directory: site
        run: npm run content && npm run build:site

      - name: Install CJK font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f >/dev/null

      - name: Capture home layout
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/product-home-proof
          mkdir -p "$out"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"

          cd site
          npm run preview -- --host 127.0.0.1 --port 4188 > "$out/server.log" 2>&1 &
          SERVER_PID=$!
          cd ..
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:4188/ > "$out/root.html"; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          capture() {
            name="$1"; size="$2"
            profile=$(mktemp -d)
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --disable-background-networking --window-size="$size" --virtual-time-budget=5000 \
              --user-data-dir="$profile" --screenshot="$out/$name.png" \
              http://127.0.0.1:4188/ >"$out/$name.log" 2>&1
            rm -rf "$profile"
          }

          profile=$(mktemp -d)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --window-size=1440,900 --virtual-time-budget=5000 \
            --user-data-dir="$profile" --dump-dom http://127.0.0.1:4188/ > "$out/home-dom.html" 2> "$out/home-dom.log"
          rm -rf "$profile"

          grep -q 'product-appbar' "$out/home-dom.html"
          grep -q 'entry-hero' "$out/home-dom.html"
          grep -q 'hero-launcher' "$out/home-dom.html"
          grep -q 'capability-ribbon' "$out/home-dom.html"
          grep -q 'product-lab' "$out/home-dom.html"
          grep -q 'product-world' "$out/home-dom.html"
          grep -q 'knowledge-preview' "$out/home-dom.html"

          capture home-desktop 1440,900
          capture home-mobile 390,844
          test $(stat -c%s "$out/home-desktop.png") -gt 12000
          test $(stat -c%s "$out/home-mobile.png") -gt 12000

          printf '%s\n' \
            'schema=novelforge_product_home_browser_proof_v1' \
            'surface=solid_vite_kawaii_atelier' \
            'home_dom=screenshot_era' \
            'desktop=1440x900' \
            'mobile=390x844' \
            'authority=false' > "$out/proof.txt"

      - name: Upload home visual proof
        uses: actions/upload-artifact@v4
        with:
          name: product-home-browser-proof
          path: /tmp/product-home-proof
          if-no-files-found: error
          retention-days: 7
