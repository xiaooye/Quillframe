name: Verify Host Bridge v8 Runtime Tree

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b1e9a1e6bca792fcb299e3814c8bf61bf3e97e6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Aggregate self-test and deterministic bundle
        run: |
          python quillframe.py self-test
          python release/build_framework_bundle.py self-test
          python release/build_framework_bundle.py build --root . --output /tmp/a.tar --report /tmp/a.json
          python release/build_framework_bundle.py build --root . --output /tmp/b.tar --report /tmp/b.json
          cmp /tmp/a.tar /tmp/b.tar
          EXPECTED="$(python -c "import json; print(json.load(open('/tmp/a.json'))['bundle_fingerprint'])")"
          python release/build_framework_bundle.py verify --bundle /tmp/a.tar --expected "$EXPECTED"
          python - <<'PY'
          import json
          a=json.load(open('/tmp/a.json')); b=json.load(open('/tmp/b.json'))
          assert a['bundle_fingerprint']==b['bundle_fingerprint']
          assert a['content_index_fingerprint']==b['content_index_fingerprint']
          print('runtime_target_sha=6b1e9a1e6bca792fcb299e3814c8bf61bf3e97e6')
          print('real_tree_deterministic_bundle=PASS')
          print('bundle_fingerprint='+a['bundle_fingerprint'])
          print('content_index_fingerprint='+a['content_index_fingerprint'])
          print('files='+str(a['files']))
          PY
