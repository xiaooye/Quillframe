name: Product Godot Workbench Behavior

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/godot/**'
      - 'site/package.json'
      - 'site/scripts/godot-workbench-behavior-qa.mjs'
      - 'site/scripts/godot-shadow-source-quality-v19.mjs'
      - 'site/scripts/godot-glyph-policy-qa.mjs'
      - 'site/scripts/build-godot-shadow.sh'
      - '.github/workflows/product-godot-workbench-behavior.yml'
  push:
    branches: [main]
    paths:
      - 'site/godot/**'
      - 'site/package.json'
      - 'site/scripts/godot-workbench-behavior-qa.mjs'
      - 'site/scripts/godot-shadow-source-quality-v19.mjs'
      - 'site/scripts/godot-glyph-policy-qa.mjs'
      - 'site/scripts/build-godot-shadow.sh'
      - '.github/workflows/product-godot-workbench-behavior.yml'

permissions:
  contents: read

concurrency:
  group: product-godot-workbench-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: 4.7.1-stable
  GODOT_TEMPLATE_VERSION: 4.7.1.stable

jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Product Site dependencies
        working-directory: site
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Current Godot source and glyph contracts
        working-directory: site
        run: npm run godot:quality

      - name: Install pinned Godot editor and official Web templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/"
          godot --version

      - name: Build Godot Web runtime
        working-directory: site
        run: bash scripts/build-godot-shadow.sh

      - name: Execute Inspector and Playground behavior
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/novelforge-workbench-behavior
          mkdir -p "$OUT"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          python3 -m http.server 4190 --bind 127.0.0.1 --directory site/dist-godot-shadow > "$OUT/server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
            wait "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 40); do
            if curl -fsS 'http://127.0.0.1:4190/' >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          CHROME="$CHROME" node site/scripts/godot-workbench-behavior-qa.mjs \
            --url 'http://127.0.0.1:4190/' \
            --output "$OUT/workbench-behavior.json" \
            --timeout-ms 90000 > "$OUT/workbench-behavior.log" 2>&1
          node -e "const r=require('$OUT/workbench-behavior.json'); if(r.status!=='pass') process.exit(1)"

      - name: Upload workbench behavior evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-godot-workbench-behavior
          path: /tmp/novelforge-workbench-behavior
          if-no-files-found: error
          retention-days: 7
