name: Production Runtime Verification

on:
  push:
    branches: ['agent/production-runtime-integration']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-runtime-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Aggregate runtime and bundle verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Quillframe aggregate self-test
        run: python quillframe.py self-test
      - name: Framework bundle contract self-test
        run: python release/build_framework_bundle.py self-test
      - name: Build deterministic real-tree bundles twice
        run: |
          python release/build_framework_bundle.py build --root . --output /tmp/framework-a.tar --report /tmp/framework-a.json
          python release/build_framework_bundle.py build --root . --output /tmp/framework-b.tar --report /tmp/framework-b.json
          cmp /tmp/framework-a.tar /tmp/framework-b.tar
          EXPECTED="$(python -c "import json; print(json.load(open('/tmp/framework-a.json'))['bundle_fingerprint'])")"
          python release/build_framework_bundle.py verify --bundle /tmp/framework-a.tar --expected "$EXPECTED"
          python - <<'PY'
          import json
          a=json.load(open('/tmp/framework-a.json'))
          b=json.load(open('/tmp/framework-b.json'))
          assert a['bundle_fingerprint']==b['bundle_fingerprint']
          assert a['content_index_fingerprint']==b['content_index_fingerprint']
          print('real_tree_deterministic_bundle=PASS')
          print('bundle_fingerprint='+a['bundle_fingerprint'])
          print('content_index_fingerprint='+a['content_index_fingerprint'])
          print('files='+str(a['files']))
          PY
