name: NovelForge Studio Bound Browser QA

on:
  pull_request:
    paths:
      - 'studio/app/**'
      - 'studio/observability_contract.json'
      - 'studio/local_server.py'
      - 'studio/host_bridge.py'
      - 'studio/host_bridge_contract.json'
      - 'studio/publication_preview.py'
      - 'harness/session_runtime/**'
      - 'publication/**'
      - '.github/workflows/studio-bound-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'studio/app/**'
      - 'studio/observability_contract.json'
      - 'studio/local_server.py'
      - 'studio/host_bridge.py'
      - 'studio/host_bridge_contract.json'
      - 'studio/publication_preview.py'
      - 'harness/session_runtime/**'
      - 'publication/**'
      - '.github/workflows/studio-bound-browser-qa.yml'

permissions:
  contents: read

jobs:
  bound-browser-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio/app/pnpm-lock.yaml
      - name: Frozen install
        working-directory: studio/app
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build Studio
        working-directory: studio/app
        run: pnpm build
      - name: Install CJK font for truthful zh-CN rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f >/dev/null
      - name: Bound browser runtime and visual QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/studio-bound-qa
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "${CHROME}"

          python studio/local_server.py --port 4177 > /tmp/studio-bound-qa/server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "${SERVER_PID}" >/dev/null 2>&1 || true
            wait "${SERVER_PID}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:4177/ > /tmp/studio-bound-qa/root.html; then
              if grep -q '<title>NovelForge Studio</title>' /tmp/studio-bound-qa/root.html; then
                ready=true
                break
              fi
            fi
            sleep 1
          done
          test "${ready}" = "true"

          # Exercise the real deterministic publication compiler through the
          # exact loopback Host Bridge used by the browser. This proves more
          # than route chrome: the public transport, fingerprint guard, compiler,
          # temporary derived build, and safe result envelope all execute.
          python - <<'PY'
          import hashlib
          import json
          import re
          import urllib.request
          from pathlib import Path

          root = Path('/tmp/studio-bound-qa')
          html = (root / 'root.html').read_text(encoding='utf-8')
          match = re.search(r'<meta name="novelforge-studio-token" content="([^"]+)"', html)
          assert match, 'Studio transport token meta missing'
          token = match.group(1)
          base = 'http://127.0.0.1:4177'
          text = '第一段。\n\nBound browser publication preview.'
          source = {
              'book': {
                  'identifier': 'urn:novelforge:bound-browser-preview',
                  'title': 'Bound Browser Preview',
                  'language': 'zh-CN',
                  'modified': '2026-08-15T00:00:00Z',
              },
              'chapters': [{
                  'chapter_id': 'CH-001',
                  'title': '第一章',
                  'text': text,
                  'accepted_fingerprint': 'sha256:' + hashlib.sha256(text.encode('utf-8')).hexdigest(),
              }],
          }
          request = {
              'schema': 'novelforge_studio_host_bridge_request_v1',
              'request_id': 'bound-browser-publication-preview',
              'operation': 'publication.preview',
              'surface': 'local_app',
              'args': {'profile': 'epub', 'source': source},
              'authority': False,
          }
          body = json.dumps(request, ensure_ascii=False).encode('utf-8')
          http = urllib.request.Request(
              base + '/api/bridge/invoke',
              method='POST',
              data=body,
              headers={
                  'Content-Type': 'application/json',
                  'X-NovelForge-Studio-Token': token,
                  'Origin': base,
                  'Sec-Fetch-Site': 'same-origin',
              },
          )
          result = json.loads(urllib.request.urlopen(http, timeout=20).read())
          data = result.get('data') or {}
          assert result['status'] == 'ok', result
          assert data.get('schema') == 'novelforge_publication_preview_projection_v1', data
          assert data.get('compiler') == 'publication/compiler.py'
          assert data.get('accepted_fingerprint_guard') is True
          assert data.get('text_roundtrip') is True
          assert data.get('source_authority_verified') is False
          assert data.get('query_only') is True
          assert data.get('mutation_performed') is False
          assert data.get('model_execution') is False
          assert data.get('authority') is False
          assert data.get('canon_authority') is False
          assert data.get('settlement_authority') is False
          assert data.get('artifact', {}).get('sha256', '').startswith('sha256:')
          assert data.get('validation', {}).get('valid') is True
          (root / 'publication-preview-result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          run_chrome() {
            name="$1"
            size="$2"
            url="$3"
            profile=$(mktemp -d)
            "${CHROME}" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --disable-background-networking \
              --window-size="${size}" \
              --virtual-time-budget=6000 \
              --user-data-dir="${profile}" \
              --log-net-log="/tmp/studio-bound-qa/${name}-netlog.json" \
              --net-log-capture-mode=IncludeSensitive \
              --screenshot="/tmp/studio-bound-qa/${name}.png" \
              "${url}" >"/tmp/studio-bound-qa/${name}-chrome.log" 2>&1
            rm -rf "${profile}"
          }

          dump_dom() {
            name="$1"
            size="$2"
            url="$3"
            profile=$(mktemp -d)
            "${CHROME}" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --disable-background-networking \
              --window-size="${size}" \
              --virtual-time-budget=6000 \
              --user-data-dir="${profile}" \
              --dump-dom \
              "${url}" >"/tmp/studio-bound-qa/${name}-dom.html" 2>"/tmp/studio-bound-qa/${name}-dom.log"
            rm -rf "${profile}"
          }

          run_chrome workspace-en-desktop 1440,900 'http://127.0.0.1:4177/workspace?lang=en-US'
          run_chrome agents-en-desktop 1440,900 'http://127.0.0.1:4177/agents?lang=en-US'
          run_chrome inspector-en-desktop 1440,900 'http://127.0.0.1:4177/inspect?lang=en-US'
          run_chrome control-en-desktop 1440,900 'http://127.0.0.1:4177/control?lang=en-US'
          run_chrome architecture-en-desktop 1440,900 'http://127.0.0.1:4177/architecture?lang=en-US'
          run_chrome publication-en-desktop 1440,900 'http://127.0.0.1:4177/publication?lang=en-US'
          run_chrome publication-zh-mobile 390,844 'http://127.0.0.1:4177/publication?lang=zh-CN'
          run_chrome runtime-en-desktop 1440,900 'http://127.0.0.1:4177/runtime?lang=en-US'
          run_chrome runtime-zh-mobile 390,844 'http://127.0.0.1:4177/runtime?lang=zh-CN'
          run_chrome capabilities-en-desktop 1440,900 'http://127.0.0.1:4177/capabilities?lang=en-US'
          run_chrome semantic-en-desktop 1440,900 'http://127.0.0.1:4177/semantic?lang=en-US'
          run_chrome semantic-en-mobile 390,844 'http://127.0.0.1:4177/semantic?lang=en-US'
          run_chrome diagnostics-en-desktop 1440,900 'http://127.0.0.1:4177/diagnostics?lang=en-US'
          run_chrome diagnostics-zh-mobile 390,844 'http://127.0.0.1:4177/diagnostics?lang=zh-CN'

          dump_dom workspace-en 1440,900 'http://127.0.0.1:4177/workspace?lang=en-US'
          dump_dom agents-en 1440,900 'http://127.0.0.1:4177/agents?lang=en-US'
          dump_dom inspector-en 1440,900 'http://127.0.0.1:4177/inspect?lang=en-US'
          dump_dom control-en 1440,900 'http://127.0.0.1:4177/control?lang=en-US'
          dump_dom architecture-en 1440,900 'http://127.0.0.1:4177/architecture?lang=en-US'
          dump_dom publication-en 1440,900 'http://127.0.0.1:4177/publication?lang=en-US'
          dump_dom publication-zh 390,844 'http://127.0.0.1:4177/publication?lang=zh-CN'
          dump_dom runtime-en 1440,900 'http://127.0.0.1:4177/runtime?lang=en-US'
          dump_dom runtime-zh 390,844 'http://127.0.0.1:4177/runtime?lang=zh-CN'
          dump_dom capabilities-en 1440,900 'http://127.0.0.1:4177/capabilities?lang=en-US'
          dump_dom semantic-en 1440,900 'http://127.0.0.1:4177/semantic?lang=en-US'
          dump_dom diagnostics-en 1440,900 'http://127.0.0.1:4177/diagnostics?lang=en-US'
          dump_dom diagnostics-zh 390,844 'http://127.0.0.1:4177/diagnostics?lang=zh-CN'

          python - <<'PY'
          import re
          from pathlib import Path

          root = Path('/tmp/studio-bound-qa')
          dom = lambda name: (root / f'{name}-dom.html').read_text(encoding='utf-8', errors='replace')
          workspace = dom('workspace-en')
          agents = dom('agents-en')
          inspector = dom('inspector-en')
          control = dom('control-en')
          architecture = dom('architecture-en')
          publication = dom('publication-en')
          publication_zh = dom('publication-zh')
          runtime = dom('runtime-en')
          runtime_zh = dom('runtime-zh')
          capabilities = dom('capabilities-en')
          semantic = dom('semantic-en')
          diagnostics = dom('diagnostics-en')
          diagnostics_zh = dom('diagnostics-zh')

          assert 'Local Playground' in workspace
          assert 'Run preview' in workspace
          assert 'deterministic browser preview' in workspace

          assert 'One run, explicit state, observable boundaries' in agents
          assert 'Run + Trace' in agents
          assert 'Handoff + Approval' in agents
          assert 'Evidence + Receipt' in agents

          # Product workbenches stay in the same bound shell and preserve the
          # reverted Story Loom product language while displaying real Core state.
          assert 'CORE INSPECTOR · EXACT PROJECTIONS' in inspector
          assert 'Inspect real projections' in inspector
          assert 'GUARDED RUNTIME CONTROL' in control
          assert 'Refresh real state' in control
          assert 'runtime-state only' in control
          assert 'LIVE ARCHITECTURE · CORE PROJECTION' in architecture
          assert 'Load real run' in architecture
          assert 'PUBLICATION COMPILER · DERIVED ONLY' in publication
          assert 'Build EPUB preview' in publication
          assert '用真正的 compiler' in publication_zh
          for text in (inspector, control, architecture, publication, publication_zh):
              assert 'This hosted shell is not bound to a NovelForge Core host' not in text
              assert 'Inspector' in text or '检查项目' in text
              assert 'Architecture' in text or '架构观测' in text
              assert 'Publication' in text or '出版' in text
              assert 'Control Plane' in text or '控制台' in text

          assert 'Runtime observatory' in runtime
          assert 'Sessions, checkpoints, events, and receipts' in runtime
          assert 'Project root' in runtime
          assert 'Load runtime' in runtime
          assert 'Studio never opens the runtime store directly' in runtime
          assert 'Session、Checkpoint、Event 与 Receipt' in runtime_zh
          assert 'Studio 不会直接打开 runtime store' in runtime_zh
          assert 'This hosted shell is not bound to a NovelForge Core host' not in runtime

          assert 'Observable state is public; one runtime command is guarded' in capabilities
          assert 'Supported Host Bridge operations' in capabilities
          assert 'Additional writes still deferred' in capabilities
          assert 'runtime.sessions.list' in capabilities
          assert 'runtime.session.get' in capabilities
          assert 'runtime.events.list' in capabilities
          assert 'runtime.handoff.inspect' in capabilities
          assert 'run.receipt.get' in capabilities
          assert 'runtime.command.receipt.get' in capabilities
          assert 'session.resume' in capabilities
          assert 'publication.preview' in capabilities
          assert 'This hosted shell is not bound to a NovelForge Core host' not in capabilities

          assert 'Registered model contracts' in semantic
          assert 'Registration is evidence of a contract boundary' in semantic
          assert 'This hosted shell is not bound to a NovelForge Core host' not in semantic

          assert 'Framework doctor' in diagnostics
          assert 'What this check validated' in diagnostics
          assert 'What this check did NOT validate' in diagnostics
          assert 'This hosted shell is not bound to a NovelForge Core host' not in diagnostics
          assert '这项检查验证了什么' in diagnostics_zh
          assert '这项检查没有验证什么' in diagnostics_zh
          assert '下面的状态只属于 framework.doctor' in diagnostics_zh

          for image in (
              'workspace-en-desktop.png',
              'agents-en-desktop.png',
              'inspector-en-desktop.png',
              'control-en-desktop.png',
              'architecture-en-desktop.png',
              'publication-en-desktop.png',
              'publication-zh-mobile.png',
              'runtime-en-desktop.png',
              'runtime-zh-mobile.png',
              'capabilities-en-desktop.png',
              'semantic-en-desktop.png',
              'semantic-en-mobile.png',
              'diagnostics-en-desktop.png',
              'diagnostics-zh-mobile.png',
          ):
              path = root / image
              assert path.exists() and path.stat().st_size > 10_000, image

          # Bound pages must use the one public typed bridge endpoint; no alternate API is allowed.
          bridge_pages = (
              'inspector-en-desktop-netlog.json',
              'control-en-desktop-netlog.json',
              'architecture-en-desktop-netlog.json',
              'publication-en-desktop-netlog.json',
              'publication-zh-mobile-netlog.json',
              'runtime-en-desktop-netlog.json',
              'runtime-zh-mobile-netlog.json',
              'capabilities-en-desktop-netlog.json',
              'semantic-en-desktop-netlog.json',
              'semantic-en-mobile-netlog.json',
              'diagnostics-en-desktop-netlog.json',
              'diagnostics-zh-mobile-netlog.json',
          )
          for name in bridge_pages:
              text = (root / name).read_text(encoding='utf-8', errors='replace')
              assert '/api/bridge/invoke' in text, f'expected typed bridge request in {name}'
              assert '/api/' not in text.replace('/api/bridge/invoke', ''), f'unexpected Studio API path in {name}'

          workspace_netlog = (root / 'workspace-en-desktop-netlog.json').read_text(encoding='utf-8', errors='replace')
          assert '/api/' not in workspace_netlog.replace('/api/bridge/invoke', ''), 'Workspace route observed an unexpected API path'

          agents_source = Path('studio/app/src/routes/Agents.tsx').read_text(encoding='utf-8')
          assert 'invokeBridge' not in agents_source, 'Agents route must not invoke Core operations'
          assert 'fetch(' not in agents_source, 'Agents route must not open an alternate transport'
          agents_netlog = (root / 'agents-en-desktop-netlog.json').read_text(encoding='utf-8', errors='replace')
          assert '/api/' not in agents_netlog.replace('/api/bridge/invoke', ''), 'Agents route observed an unexpected API path'

          runtime_source = Path('studio/app/src/routes/Runtime.tsx').read_text(encoding='utf-8')
          for operation in ('runtime.sessions.list', 'runtime.session.get', 'runtime.events.list', 'runtime.handoff.inspect', 'run.receipt.get'):
              assert operation in runtime_source, f'Runtime route missing public bridge operation {operation}'
          for forbidden in ('.novelforge/runtime.db', 'sqlite3', 'localStorage.', 'sessionStorage.'):
              assert forbidden not in runtime_source, f'Runtime route bypasses public projection boundary: {forbidden}'
          resume_call = re.search(r'invokeBridge(?:<[^>]+>)?\(\s*["\']session\.resume["\']', runtime_source)
          assert resume_call is None, 'Runtime observatory must remain query-only; resume belongs to Control'

          control_source = Path('studio/app/src/routes/Control.tsx').read_text(encoding='utf-8')
          for operation in ('session.resume.preflight', 'session.resume', 'runtime.command.receipt.get'):
              assert operation in control_source, f'Control route missing guarded command operation {operation}'
          assert 'user_authorized: true' in control_source, 'Control must bind explicit user action into the resume request'
          assert 'crypto.randomUUID()' in control_source, 'Control must issue a unique typed command id'
          assert 'recoverReceipt' in control_source, 'Control must recover a durable receipt after an ambiguous transport failure'
          for forbidden in ('.novelforge/runtime.db', 'sqlite3', 'localStorage.', 'sessionStorage.', 'project.mutate', 'command.invoke'):
              assert forbidden not in control_source, f'Control bypasses declared command boundary: {forbidden}'

          publication_source = Path('studio/app/src/routes/Publication.tsx').read_text(encoding='utf-8')
          assert 'publication.preview' in publication_source
          assert 'publication/compiler.py' in publication_source
          assert 'source_authority_verified' in publication_source
          for forbidden in ('project.mutate', 'command.invoke', 'session.resume'):
              assert forbidden not in publication_source, f'Publication preview must stay query-only: {forbidden}'

          inspector_source = Path('studio/app/src/routes/Inspector.tsx').read_text(encoding='utf-8')
          assert 'loadProductProjection' in inspector_source
          assert 'quality_score' not in inspector_source and 'release_eligibility' not in inspector_source

          (root / 'runtime-proof.txt').write_text(
              'schema=novelforge_studio_bound_browser_qa_v3\n'
              'surface=local_app\n'
              'core_host=bound\n'
              'workspace_surface=local_playground\n'
              'inspector_surface=real_core_projection\n'
              'architecture_surface=real_run_observatory\n'
              'publication_surface=real_deterministic_compiler\n'
              'control_plane=guarded_runtime_command\n'
              'runtime_surface=side_effect_free_observatory\n'
              'session_resume_exposed=true\n'
              'session_resume_surface=local_app_only\n'
              'session_resume_model_execution=false\n'
              'generic_runtime_control_exposed=false\n'
              'runtime_query_transport=public_host_bridge\n'
              'runtime_command_transport=public_host_bridge\n'
              'publication_preview_transport=public_host_bridge\n'
              'agent_runtime_model=novelforge_native\n'
              'capability_boundary_source=bridge.describe+capabilities.inspect\n'
              'semantic_source=semantic.catalog\n'
              'diagnostics_source=framework.doctor\n'
              'authority=false\n',
              encoding='utf-8',
          )
          print({'schema': 'novelforge_studio_bound_browser_qa_v3', 'status': 'pass', 'authority': False})
          PY
      - name: Upload bound browser QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: studio-bound-browser-qa
          path: /tmp/studio-bound-qa
          if-no-files-found: error
          retention-days: 7
