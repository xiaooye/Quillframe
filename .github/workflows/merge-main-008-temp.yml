name: Merge Main Into 008 Story Workspace

on:
  push:
    branches: [feature/008-story-workspace]
    paths:
      - '.github/workflows/merge-main-008-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main preserving Story Workspace manifest additions
        run: python scripts/merge_main_008_temp.py
