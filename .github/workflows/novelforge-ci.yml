name: NovelForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    uses: ./.github/workflows/novelforge-contracts.yml

  state-integrity:
    uses: ./.github/workflows/novelforge-state-integrity-p0.yml

  planning-horizon:
    uses: ./.github/workflows/novelforge-planning-horizon.yml

  resume-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile resume preflight
        run: python -m py_compile harness/session_runtime/resume_preflight.py
      - name: Deterministic resume preflight contract
        run: python harness/session_runtime/resume_preflight.py self-test

  resume-command-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile typed resume command validator
        run: python -m py_compile harness/session_runtime/resume_command.py
      - name: Validate command schema JSON
        run: python -m json.tool harness/session_runtime/resume_command_schema.json > /dev/null
      - name: Deterministic resume command candidate contract
        run: python harness/session_runtime/resume_command.py self-test

  runtime-command-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile runtime command authorization validator
        run: python -m py_compile harness/session_runtime/runtime_command_authorization.py
      - name: Validate authorization schema JSON
        run: python -m json.tool harness/session_runtime/runtime_command_authorization_schema.json > /dev/null
      - name: Deterministic runtime command authorization contract
        run: python harness/session_runtime/runtime_command_authorization.py self-test

  runtime-command-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile runtime command executor
        run: python -m py_compile harness/session_runtime/runtime_command_executor.py
      - name: Validate runtime command receipt schemas
        run: |
          python -m json.tool harness/session_runtime/runtime_command_receipt_schema.json > /dev/null
          python -m json.tool harness/session_runtime/runtime_command_execution_result_schema.json > /dev/null
      - name: Deterministic authorized runtime command execution contract
        run: python harness/session_runtime/runtime_command_executor.py self-test

  session-terminate-command:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile session terminate toolchain
        run: |
          python -m py_compile \
            harness/session_runtime/session_runtime.py \
            harness/session_runtime/terminate_preflight.py \
            harness/session_runtime/terminate_command.py \
            harness/session_runtime/terminate_authorization.py \
            harness/session_runtime/terminate_executor.py
      - name: Validate terminate and shared receipt schemas
        run: |
          python -m json.tool harness/session_runtime/terminate_command_schema.json > /dev/null
          python -m json.tool harness/session_runtime/terminate_authorization_schema.json > /dev/null
          python -m json.tool harness/session_runtime/runtime_command_receipt_schema.json > /dev/null
          python -m json.tool harness/control_plane/event_schema.json > /dev/null
      - name: Deterministic session terminate contracts
        run: |
          python harness/session_runtime/session_runtime.py self-test
          python harness/session_runtime/terminate_preflight.py self-test
          python harness/session_runtime/terminate_command.py self-test
          python harness/session_runtime/terminate_authorization.py self-test
          python harness/session_runtime/terminate_executor.py self-test

  semantic-eval-execution-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile semantic eval execution identity
        run: python -m py_compile evals/evaluation_execution_identity.py
      - name: Deterministic semantic eval execution identity contract
        run: python evals/evaluation_execution_identity.py self-test

  documentation-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Framework version identity
        run: python scripts/version_identity.py
      - name: Deterministic documentation quality
        run: python scripts/docs_quality.py

  peer-bridge-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Project-hosted peer bridge ownership contract
        run: python scripts/peer_bridge_contract.py
