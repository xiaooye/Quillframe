name: NovelForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    uses: ./.github/workflows/novelforge-contracts.yml

  state-integrity:
    uses: ./.github/workflows/novelforge-state-integrity-p0.yml

  resume-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile resume preflight
        run: python -m py_compile harness/session_runtime/resume_preflight.py
      - name: Deterministic resume preflight contract
        run: python harness/session_runtime/resume_preflight.py self-test

  documentation-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Framework version identity
        run: python scripts/version_identity.py
      - name: Deterministic documentation quality
        run: python scripts/docs_quality.py

  peer-bridge-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Project-hosted peer bridge ownership contract
        run: python scripts/peer_bridge_contract.py
