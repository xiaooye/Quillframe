name: NovelForge Author Steering

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  author-steering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile author steering runtime
        run: python -m py_compile harness/control_plane/author_steering.py harness/control_plane/control_plane.py
      - name: Validate author steering schema
        run: python -m json.tool harness/control_plane/author_steering.schema.json > /dev/null
      - name: Deterministic author steering contract
        run: python harness/control_plane/author_steering.py self-test > author-steering-test.json
      - name: Assert steering invariants
        run: |
          python - <<'PY'
          import json
          d=json.load(open('author-steering-test.json',encoding='utf-8'))
          assert d['author_steering_contract']=='PASS',d
          for key in [
            'conflicting_delivery_fails_closed',
            'future_only_note_does_not_apply_to_current_run',
            'decision_binds_event_run_safe_point_and_artifacts',
            'consume_once',
            'conflicting_replay_fails_closed',
            'drift_requires_explicit_acknowledgement',
            'consequential_write_transaction_not_interruptible',
            'requested_safe_point_timing_is_enforced',
            'invalidated_candidate_requires_pending_handoff_cancellation',
            'wrong_run_rebinding_fails_closed',
            'no_follow_up_side_effects_are_executed_here',
            'authority_is_always_false',
          ]:
              assert d[key] is True,(key,d)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: author-steering-contract
          path: author-steering-test.json
          if-no-files-found: error
