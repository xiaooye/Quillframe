name: NovelForge Author Steering

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  author-steering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile author steering runtime
        run: |
          python -m py_compile harness/control_plane/control_plane.py
          python -m py_compile harness/control_plane/author_steering.py

      - name: Validate author steering schema
        run: python -m json.tool harness/control_plane/author_steering.schema.json > /dev/null

      - name: Deterministic author steering contract
        run: |
          python harness/control_plane/author_steering.py self-test --path /tmp/novelforge-author-steering-ci.db > author-steering-test.json

      - name: Assert replay, authority, and safe-point invariants
        run: |
          python - <<'PY'
          import json
          d=json.load(open('author-steering-test.json',encoding='utf-8'))
          assert d['author_steering_contract']=='PASS',d
          assert d['duplicate_identical_delivery_is_idempotent'] is True
          assert d['conflicting_duplicate_fails_closed'] is True
          assert d['safe_point_decision_is_fingerprint_bound'] is True
          assert d['consequential_write_is_non_interruptible'] is True
          assert d['consume_once_survives_replay'] is True
          assert d['future_note_does_not_invalidate_current_candidate'] is True
          assert d['resume_lineage_can_reinterpret_once'] is True
          assert d['handoff_cancel_is_bounded_to_pending_ids'] is True
          assert d['consume_at_is_enforced'] is True
          assert d['unrelated_run_does_not_consume_event'] is True
          assert d['steering_never_grants_durable_authority'] is True
          assert d['model_execution'] is False
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: author-steering-contract
          path: author-steering-test.json
          if-no-files-found: error
