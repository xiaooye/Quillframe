name: Retire Cloudflare Pages one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-pages-retire.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose-studio-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STUDIO_DOMAIN: studio.quillframe.wei-dev.com
      STUDIO_WORKERS_DEV: quillframe-studio.cool-meadow-eb73.workers.dev
    steps:
      - name: Inspect Cloudflare Worker, DNS, Pages and HTTP state
        id: diag
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          api='https://api.cloudflare.com/client/v4'

          echo '== workers.dev HTTP =='
          workers_code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/workers-dev.html -w '%{http_code}' "https://${STUDIO_WORKERS_DEV}/" || true)
          echo "workers.dev: HTTP ${workers_code}"
          if [[ -s /tmp/workers-dev.html ]]; then
            grep -o '<title>[^<]*</title>' /tmp/workers-dev.html | head -1 || true
          fi

          echo '== custom domain HTTP =='
          custom_code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/custom.html -w '%{http_code}' "https://${STUDIO_DOMAIN}/" || true)
          echo "custom domain: HTTP ${custom_code}"
          if [[ -s /tmp/custom.html ]]; then
            grep -o '<title>[^<]*</title>' /tmp/custom.html | head -1 || true
          fi

          echo '== Worker custom-domain API =='
          domains_code=$(curl -sS -o /tmp/worker-domains.json -w '%{http_code}' --get "${auth[@]}" \
            --data-urlencode "hostname=${STUDIO_DOMAIN}" \
            "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" || true)
          echo "workers/domains: HTTP ${domains_code}"
          if [[ "${domains_code}" == 200 ]]; then
            jq '{success, result: [.result[] | {id, hostname, service, zone_name, environment}]}' /tmp/worker-domains.json
          else
            jq '{success, errors}' /tmp/worker-domains.json 2>/dev/null || cat /tmp/worker-domains.json
          fi

          echo '== Pages project API =='
          pages_code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" \
            "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/quillframe-studio" || true)
          echo "Pages project: HTTP ${pages_code}"

          echo '== zone and DNS API =='
          zones_code=$(curl -sS -o /tmp/zones.json -w '%{http_code}' --get "${auth[@]}" \
            --data-urlencode 'name=wei-dev.com' \
            --data-urlencode "account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            "${api}/zones" || true)
          echo "zones: HTTP ${zones_code}"
          if [[ "${zones_code}" == 200 ]]; then
            zone_id=$(jq -r '.result | if length == 1 then .[0].id else empty end' /tmp/zones.json)
            if [[ -n "${zone_id}" ]]; then
              dns_code=$(curl -sS -o /tmp/dns.json -w '%{http_code}' --get "${auth[@]}" \
                --data-urlencode "name=${STUDIO_DOMAIN}" \
                "${api}/zones/${zone_id}/dns_records" || true)
              echo "DNS query: HTTP ${dns_code}"
              if [[ "${dns_code}" == 200 ]]; then
                jq '{success, result: [.result[] | {id, type, name, content, proxied, ttl}]}' /tmp/dns.json
              fi
            fi
          fi

          echo "workers_code=${workers_code}" >> "$GITHUB_OUTPUT"
          echo "custom_code=${custom_code}" >> "$GITHUB_OUTPUT"
          echo "domains_code=${domains_code}" >> "$GITHUB_OUTPUT"
          echo "pages_code=${pages_code}" >> "$GITHUB_OUTPUT"

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKERS_CODE: ${{ steps.diag.outputs.workers_code }}
          CUSTOM_CODE: ${{ steps.diag.outputs.custom_code }}
          DOMAINS_CODE: ${{ steps.diag.outputs.domains_code }}
          PAGES_CODE: ${{ steps.diag.outputs.pages_code }}
        run: |
          set -euo pipefail
          state=error
          description="Studio cutover: workers.dev=${WORKERS_CODE:-?} custom=${CUSTOM_CODE:-?} domainsAPI=${DOMAINS_CODE:-?} Pages=${PAGES_CODE:-?}"
          if [[ "${WORKERS_CODE}" == 200 && "${CUSTOM_CODE}" == 200 ]]; then state=success; fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -nc --arg state "${state}" --arg target_url "${target_url}" --arg description "${description}" --arg context 'quillframe/studio-cutover-diag' '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
