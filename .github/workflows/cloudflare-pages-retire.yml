name: Retire Cloudflare Pages one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-pages-retire.yml'

permissions:
  contents: write

concurrency:
  group: quillframe-pages-retire
  cancel-in-progress: false

jobs:
  retire-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_PROJECT: quillframe
      PRODUCT_DOMAIN: quillframe.wei-dev.com
      STUDIO_PROJECT: quillframe-studio
      STUDIO_DOMAIN: studio.quillframe.wei-dev.com
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Retire Pages projects behind verified Worker routes
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"

          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          api='https://api.cloudflare.com/client/v4'

          verify_product() {
            curl -fsSL --connect-timeout 10 --max-time 30 "https://${PRODUCT_DOMAIN}/" -o /tmp/qf-product.html
            grep -Fq '<title>Quillframe' /tmp/qf-product.html
            curl -fsSL --connect-timeout 10 --max-time 30 "https://${PRODUCT_DOMAIN}/docs/" -o /tmp/qf-docs.html
            grep -Fq 'Quillframe' /tmp/qf-docs.html
          }

          verify_studio() {
            curl -fsSL --connect-timeout 10 --max-time 30 "https://${STUDIO_DOMAIN}/" -o /tmp/qf-studio.html
            grep -Fq '<title>Quillframe Studio</title>' /tmp/qf-studio.html
            curl -fsSL --connect-timeout 10 --max-time 30 "https://${STUDIO_DOMAIN}/.well-known/quillframe-host.json" -o /tmp/qf-host.json
            jq -e '.schema == "quillframe_studio_host_descriptor_v1" and .authority == false' /tmp/qf-host.json >/dev/null
          }

          verify_with_retries() {
            local kind="$1"
            local ok=false
            for attempt in $(seq 1 20); do
              if "verify_${kind}"; then ok=true; break; fi
              sleep 3
            done
            test "${ok}" = true
          }

          ensure_placeholder_dns() {
            local zone_id="$1" domain="$2"
            local dns_base="${api}/zones/${zone_id}/dns_records"
            curl -fsS --get "${auth[@]}" --data-urlencode "name=${domain}" "${dns_base}" -o /tmp/qf-dns-now.json
            jq -e '.success == true' /tmp/qf-dns-now.json >/dev/null
            local count
            count=$(jq '.result | length' /tmp/qf-dns-now.json)
            if [[ "${count}" == 0 ]]; then
              local payload
              payload=$(jq -nc --arg name "${domain}" '{type:"AAAA",name:$name,content:"100::",ttl:1,proxied:true}')
              curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' --data "${payload}" "${dns_base}" -o /tmp/qf-dns-create.json
              jq -e '.success == true' /tmp/qf-dns-create.json >/dev/null
            elif [[ "${count}" == 1 ]]; then
              local id type content proxied
              id=$(jq -r '.result[0].id' /tmp/qf-dns-now.json)
              type=$(jq -r '.result[0].type' /tmp/qf-dns-now.json)
              content=$(jq -r '.result[0].content' /tmp/qf-dns-now.json)
              proxied=$(jq -r '.result[0].proxied' /tmp/qf-dns-now.json)
              if [[ "${type}" != AAAA || "${content}" != '100::' || "${proxied}" != true ]]; then
                echo "Refusing unexpected DNS state for ${domain}: ${type} ${content} proxied=${proxied}" >&2
                exit 1
              fi
            else
              echo "Refusing ambiguous DNS state for ${domain}: ${count} records" >&2
              jq '.result' /tmp/qf-dns-now.json >&2
              exit 1
            fi
          }

          prune_deployments() {
            local project="$1" canonical="$2"
            local base="${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/deployments"
            local rounds=0
            while :; do
              rounds=$((rounds + 1))
              if (( rounds > 30 )); then
                echo "Deployment prune exceeded safety bound for ${project}" >&2
                exit 1
              fi
              curl -fsS --get "${auth[@]}" --data-urlencode 'page=1' --data-urlencode 'per_page=100' "${base}" -o /tmp/qf-deployments.json
              jq -e '.success == true' /tmp/qf-deployments.json >/dev/null
              mapfile -t ids < <(jq -r --arg canonical "${canonical}" '.result[]?.id | select(. != $canonical)' /tmp/qf-deployments.json)
              if (( ${#ids[@]} == 0 )); then break; fi
              echo "Pruning ${#ids[@]} old deployments from ${project}"
              for id in "${ids[@]}"; do
                status=$(curl -sS -o /tmp/qf-deployment-delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "${base}/${id}?force=true")
                case "${status}" in
                  200|404) ;;
                  *)
                    echo "Failed deleting ${project} deployment ${id} (HTTP ${status})" >&2
                    cat /tmp/qf-deployment-delete.json >&2
                    exit 1
                    ;;
                esac
              done
            done
          }

          retire_project() {
            local project="$1" domain="$2" kind="$3"
            local project_api="${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}"
            local project_file="/tmp/qf-${project}-project.json"

            status=$(curl -sS -o "${project_file}" -w '%{http_code}' "${auth[@]}" "${project_api}")
            if [[ "${status}" == 404 ]]; then
              echo "Pages project already absent: ${project}"
              return 0
            fi
            [[ "${status}" == 200 ]] || { cat "${project_file}" >&2; exit 1; }
            jq -e '.success == true' "${project_file}" >/dev/null

            local canonical
            canonical=$(jq -r '.result.canonical_deployment.id // empty' "${project_file}")
            test -n "${canonical}"

            local domain_api="${project_api}/domains/${domain}"
            status=$(curl -sS -o /tmp/qf-pages-domain.json -w '%{http_code}' "${auth[@]}" "${domain_api}")
            [[ "${status}" == 200 ]] || { echo "Expected Pages custom domain ${domain} before retirement (HTTP ${status})" >&2; cat /tmp/qf-pages-domain.json >&2; exit 1; }
            jq -e '.success == true' /tmp/qf-pages-domain.json >/dev/null
            local zone_id
            zone_id=$(jq -r '.result.zone_tag // empty' /tmp/qf-pages-domain.json)
            test -n "${zone_id}"

            local dns_base="${api}/zones/${zone_id}/dns_records"
            curl -fsS --get "${auth[@]}" --data-urlencode "name=${domain}" "${dns_base}" -o /tmp/qf-dns-before.json
            jq -e '.success == true' /tmp/qf-dns-before.json >/dev/null
            local count
            count=$(jq '.result | length' /tmp/qf-dns-before.json)
            [[ "${count}" == 1 ]] || { echo "Expected exactly one DNS record for ${domain}; found ${count}" >&2; jq '.result' /tmp/qf-dns-before.json >&2; exit 1; }

            local record_id old_type old_content old_proxied expected
            record_id=$(jq -r '.result[0].id' /tmp/qf-dns-before.json)
            old_type=$(jq -r '.result[0].type' /tmp/qf-dns-before.json)
            old_content=$(jq -r '.result[0].content' /tmp/qf-dns-before.json)
            old_proxied=$(jq -r '.result[0].proxied' /tmp/qf-dns-before.json)
            expected="${project}.pages.dev"

            if [[ "${old_type}" == CNAME && "${old_content%.}" == "${expected}" ]]; then
              payload=$(jq -nc --arg name "${domain}" '{type:"AAAA",name:$name,content:"100::",ttl:1,proxied:true}')
              curl -fsS -X PUT "${auth[@]}" -H 'Content-Type: application/json' --data "${payload}" "${dns_base}/${record_id}" -o /tmp/qf-dns-cutover.json
              jq -e '.success == true' /tmp/qf-dns-cutover.json >/dev/null
              echo "DNS cut over from Pages to Worker-route placeholder: ${domain}"

              if ! verify_with_retries "${kind}"; then
                echo "Worker route verification failed after DNS cutover; rolling back ${domain}" >&2
                rollback=$(jq -nc --arg type "${old_type}" --arg name "${domain}" --arg content "${old_content}" --argjson proxied "${old_proxied}" '{type:$type,name:$name,content:$content,ttl:1,proxied:$proxied}')
                curl -fsS -X PUT "${auth[@]}" -H 'Content-Type: application/json' --data "${rollback}" "${dns_base}/${record_id}" >/tmp/qf-dns-rollback.json
                jq -e '.success == true' /tmp/qf-dns-rollback.json >/dev/null
                exit 1
              fi
            elif [[ "${old_type}" == AAAA && "${old_content}" == '100::' && "${old_proxied}" == true ]]; then
              echo "Worker-route placeholder already present: ${domain}"
              verify_with_retries "${kind}"
            else
              echo "Refusing unexpected DNS before Pages retirement for ${domain}: ${old_type} ${old_content} proxied=${old_proxied}" >&2
              exit 1
            fi

            status=$(curl -sS -o /tmp/qf-pages-domain-delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "${domain_api}")
            case "${status}" in
              200|404) ;;
              *) cat /tmp/qf-pages-domain-delete.json >&2; exit 1;;
            esac
            ensure_placeholder_dns "${zone_id}" "${domain}"
            verify_with_retries "${kind}"

            prune_deployments "${project}" "${canonical}"

            deleted=false
            for attempt in $(seq 1 3); do
              status=$(curl -sS -o /tmp/qf-project-delete.json -w '%{http_code}' -X DELETE "${auth[@]}" "${project_api}")
              if [[ "${status}" == 200 ]] && jq -e '.success == true' /tmp/qf-project-delete.json >/dev/null 2>&1; then
                deleted=true
                break
              fi
              echo "Project delete attempt ${attempt} failed for ${project}; pruning again" >&2
              prune_deployments "${project}" "${canonical}"
              sleep 2
            done
            if [[ "${deleted}" != true ]]; then
              cat /tmp/qf-project-delete.json >&2
              exit 1
            fi

            status=$(curl -sS -o /tmp/qf-project-post.json -w '%{http_code}' "${auth[@]}" "${project_api}")
            [[ "${status}" == 404 ]] || { echo "Pages project still exists after delete: ${project}" >&2; cat /tmp/qf-project-post.json >&2; exit 1; }
            verify_with_retries "${kind}"
            echo "Retired Pages project: ${project}"
          }

          verify_with_retries product
          verify_with_retries studio
          retire_project "${PRODUCT_PROJECT}" "${PRODUCT_DOMAIN}" product
          retire_project "${STUDIO_PROJECT}" "${STUDIO_DOMAIN}" studio
          verify_with_retries product
          verify_with_retries studio

      - name: Remove one-shot workflow after success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cloudflare-pages-retire.yml
          git commit -m 'ops(cloudflare): remove one-shot Pages retirement workflow [skip ci]'
          git push origin HEAD:main
