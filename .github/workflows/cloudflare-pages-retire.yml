name: Retire Cloudflare Pages one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-pages-retire.yml'

permissions:
  contents: read
  statuses: write

jobs:
  verify-final-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify Pages are gone and Workers own both production hostnames
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          api='https://api.cloudflare.com/client/v4'

          verify_pages_absent() {
            local project="$1"
            code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" \
              "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}" || true)
            [[ "${code}" == 404 ]] || { echo "Pages still exists: ${project} HTTP ${code}" >&2; exit 1; }
          }

          verify_worker_domain() {
            local host="$1" service="$2"
            code=$(curl -sS -o /tmp/domains.json -w '%{http_code}' --get "${auth[@]}" \
              --data-urlencode "hostname=${host}" \
              "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" || true)
            [[ "${code}" == 200 ]] || { echo "Workers domains API failed for ${host}: HTTP ${code}" >&2; exit 1; }
            jq -e --arg host "${host}" --arg service "${service}" '
              .success == true and
              ([.result[] | select(.hostname == $host and .service == $service and .environment == "production")] | length == 1)
            ' /tmp/domains.json >/dev/null
          }

          verify_workers_dev() {
            local host="$1" marker="$2"
            code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/worker.html -w '%{http_code}' "https://${host}/" || true)
            [[ "${code}" == 200 ]] && grep -Fq "${marker}" /tmp/worker.html
          }

          verify_edge() {
            local host="$1" marker="$2"
            code=$(curl -sS -L --connect-timeout 10 --max-time 30 -D /tmp/edge.headers -o /tmp/edge.html -w '%{http_code}' "https://${host}/" || true)
            if [[ "${code}" == 200 ]] && grep -Fq "${marker}" /tmp/edge.html; then return 0; fi
            if [[ "${code}" == 403 ]] && grep -Eqi '^cf-mitigated:[[:space:]]*challenge' /tmp/edge.headers; then return 0; fi
            echo "Unexpected edge response for ${host}: HTTP ${code}" >&2
            return 1
          }

          verify_pages_absent quillframe
          verify_pages_absent quillframe-studio

          verify_worker_domain quillframe.wei-dev.com quillframe
          verify_worker_domain studio.quillframe.wei-dev.com quillframe-studio

          verify_workers_dev quillframe.cool-meadow-eb73.workers.dev '<title>Quillframe'
          verify_workers_dev quillframe-studio.cool-meadow-eb73.workers.dev '<title>Quillframe Studio</title>'

          verify_edge quillframe.wei-dev.com '<title>Quillframe'
          verify_edge studio.quillframe.wei-dev.com '<title>Quillframe Studio</title>'

          echo 'verified=true' >> "$GITHUB_OUTPUT"
          echo 'Final Cloudflare state: Pages absent; both production hostnames owned by native Workers.'

      - name: Publish final cutover status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "${VERIFIED}" == true && "${JOB_STATUS}" == success ]]; then
            state=success
            description='Pages retired; both production hostnames owned by native Workers'
          else
            state=failure
            description='Final Cloudflare cutover verification failed'
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -nc --arg state "${state}" --arg target_url "${target_url}" --arg description "${description}" --arg context 'quillframe/cloudflare-cutover' '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
