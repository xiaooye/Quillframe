name: NovelForge Weekly Maintenance

on:
  schedule:
    - cron: '37 6 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'learning/**'
      - 'corpus/**'
      - 'evals/**'
      - 'harness/runtime_capabilities.py'
      - 'harness/SELF_IMPROVEMENT_PROTOCOL*'
      - 'release/**'
      - '.github/workflows/novelforge-weekly-maintenance.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: novelforge-weekly-maintenance
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deterministic 7.1 maintenance contracts
        run: |
          python evals/run_evals.py --release --json > maintenance-release-evals.json
          python evals/build_judge_queue.py --output maintenance-semantic-queue.json
          python harness/runtime_capabilities.py probe-local --output maintenance-capabilities.json
          python learning/learning_store.py --db /tmp/novelforge-maintenance-learning.db self-test > maintenance-learning-store.json
          python learning/learning_cycle.py self-test --path /tmp/novelforge-maintenance-cycle.db > maintenance-learning-cycle.json
          python learning/learning_eval.py self-test > maintenance-learning-eval.json
          python learning/promotion_gate.py self-test > maintenance-promotion-gate.json
          python corpus/corpus_scout.py self-test > maintenance-corpus-scout.json
          python corpus/discovery_runtime.py self-test > maintenance-discovery-runtime.json
          python corpus/rights_gate.py self-test > maintenance-rights-gate.json
          python release/build_framework_bundle.py self-test > maintenance-framework-bundle.json

      - name: Build maintenance inbox report
        run: |
          python - <<'PY'
          import json, os, pathlib, datetime
          evals=json.load(open('maintenance-release-evals.json',encoding='utf-8'))
          queue=json.load(open('maintenance-semantic-queue.json',encoding='utf-8'))
          caps=json.load(open('maintenance-capabilities.json',encoding='utf-8'))
          cycle=json.load(open('maintenance-learning-cycle.json',encoding='utf-8'))
          promotion=json.load(open('maintenance-promotion-gate.json',encoding='utf-8'))
          discovery=json.load(open('maintenance-discovery-runtime.json',encoding='utf-8'))
          bundle=json.load(open('maintenance-framework-bundle.json',encoding='utf-8'))
          benchmarks=json.load(open('corpus/benchmarks/mechanisms.json',encoding='utf-8'))
          available=[k for k,v in caps.get('capabilities',{}).items() if isinstance(v,dict) and v.get('available') is True]
          payload={
            'schema':'novelforge_maintenance_report_v2',
            'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'repository':os.environ.get('GITHUB_REPOSITORY'),
            'commit':os.environ.get('GITHUB_SHA'),
            'run_id':os.environ.get('GITHUB_RUN_ID'),
            'deterministic_release_blockers':evals.get('release_blockers',[]),
            'semantic_cases_waiting_for_real_judgment':len(queue.get('cases',[])),
            'mechanism_benchmarks':len(benchmarks.get('benchmarks',[])),
            'declared_local_capabilities':available,
            'learning_cycle_contract':cycle.get('learning_cycle_contract'),
            'promotion_gate_contract':promotion.get('promotion_gate_contract'),
            'discovery_runtime_contract':discovery.get('discovery_runtime_contract'),
            'framework_bundle_contract':bundle.get('framework_bundle_contract'),
            'model_execution':False,
            'web_execution':False,
            'auto_promotion':False,
            'autonomous_boundary':'deterministic_observe_plan_validate_and_advance_state_only',
            'corpus_discovery_note':'Actual source discovery is dispatched only when an authorized host declares the required capability. This workflow never infers Web/GitHub authorization from network access.'
          }
          json.dump(payload,open('weekly-maintenance-report.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          md=[
            '# NovelForge · Weekly Maintenance','',
            f"- Commit: `{payload['commit']}`",
            f"- Release blockers: {len(payload['deterministic_release_blockers'])}",
            f"- Semantic cases awaiting independent judgment: {payload['semantic_cases_waiting_for_real_judgment']}",
            f"- Mechanism benchmarks: {payload['mechanism_benchmarks']}",
            f"- Learning Cycle contract: {payload['learning_cycle_contract']}",
            f"- Promotion Gate contract: {payload['promotion_gate_contract']}",
            f"- Discovery Runtime contract: {payload['discovery_runtime_contract']}",
            f"- Framework Bundle contract: {payload['framework_bundle_contract']}",
            '', '## Autonomy boundary','',
            'This workflow may deterministically observe, plan, validate, checkpoint and advance typed learning state. It does not execute an LLM, search the web without a declared authorized capability, promote Framework behavior, or mutate Project Canon.',
            '', payload['corpus_discovery_note'],''
          ]
          pathlib.Path('weekly-maintenance-report.md').write_text('\n'.join(md),encoding='utf-8')
          required=(
            payload['learning_cycle_contract']=='PASS' and
            payload['promotion_gate_contract']=='PASS' and
            payload['discovery_runtime_contract']=='PASS' and
            payload['framework_bundle_contract']=='PASS'
          )
          if payload['deterministic_release_blockers'] or not required:
              raise SystemExit('maintenance contract blocker present')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelforge-weekly-maintenance-${{ github.run_id }}
          path: |
            weekly-maintenance-report.md
            weekly-maintenance-report.json
            maintenance-release-evals.json
            maintenance-semantic-queue.json
            maintenance-capabilities.json
            maintenance-learning-store.json
            maintenance-learning-cycle.json
            maintenance-learning-eval.json
            maintenance-promotion-gate.json
            maintenance-corpus-scout.json
            maintenance-discovery-runtime.json
            maintenance-rights-gate.json
            maintenance-framework-bundle.json
          if-no-files-found: warn

      - name: Update maintenance inbox issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE='NovelForge · Weekly Maintenance'
          NUMBER="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "NovelForge · Weekly Maintenance") | .number' | head -n1)"
          if [ -z "$NUMBER" ]; then
            gh issue create --title "$TITLE" --body-file weekly-maintenance-report.md
          else
            gh issue edit "$NUMBER" --body-file weekly-maintenance-report.md
          fi
