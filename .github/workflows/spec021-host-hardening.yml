name: Spec 021 host hardening apply

on:
  push:
    branches: [agent/production-visibility-enforcement]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/production-visibility-enforcement
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Apply exact verified host-hardening patch
        run: |
          git apply --check specs/021-production-visibility-enforcement/.host-hardening.patch
          git apply specs/021-production-visibility-enforcement/.host-hardening.patch
      - name: Verify Python host and production boundaries
        run: |
          python -m unittest \
            tests.test_quillframe_authoring_primitives \
            tests.test_quillframe_production_host_bridge \
            tests.test_quillframe_production_runtime \
            tests.test_quillframe_unified_host_bootstrap -v
          python studio/tauri_core_sidecar.py self-test
      - name: Commit and remove one-shot machinery
        run: |
          rm specs/021-production-visibility-enforcement/.host-hardening.patch .github/workflows/spec021-host-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: enforce released manuscript host boundary'
          git push origin HEAD:agent/production-visibility-enforcement
