name: Apply semantic context runtime
on:
  push:
    branches: [agent/semantic-context-runtime]
    paths:
      - .github/workflows/_semantic-context-runtime-apply.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-context-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply structural patch
        run: |
          cat scripts/.semantic-context-parts/part*.txt | base64 -d | gzip -d > /tmp/apply.py
          python /tmp/apply.py
      - name: Deterministic context tests
        run: |
          python harness/context_runtime.py self-test
          python -m unittest discover -s tests -p 'test_quillframe_*.py' -v
          python studio/host_bridge.py self-test
          python quillframe.py self-test
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -r scripts/.semantic-context-parts .github/workflows/_semantic-context-runtime-apply.yml
          git add -A
          git diff --cached --check
          git commit -m "feat(context): add semantic context runtime"
          git push origin HEAD:agent/semantic-context-runtime
