name: Temporary Promote Final Quality Workflow Blobs

on:
  push:
    branches: [agent/pre-independent-candidate-qualification]
    paths:
      - '.github/workflows/tmp-promote-final-quality-workflow-blobs.yml'

permissions:
  contents: write
  actions: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pre-independent-candidate-qualification
          fetch-depth: 0
      - name: Fetch validated workflow artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/final-quality
          gh api repos/${{ github.repository }}/actions/artifacts/9299661155/zip > /tmp/final-quality.zip
          unzip -q /tmp/final-quality.zip -d /tmp/final-quality
          test -f /tmp/final-quality/novelforge-contracts.yml
          test -f /tmp/final-quality/novelforge-semantic-contract-packs.yml
          test -f /tmp/final-quality/novelforge-quality-gate-hardening.yml
          echo '078d9d8431f0fd1cc75be22ca3fee0d6aa4f79036cdcdb4b33fa9ff9ede55d4f  /tmp/final-quality/novelforge-contracts.yml' | sha256sum -c -
          echo '0c27d94d9e562a3767c3242732ceed5473bfbfde9bd540775d9465a43c1eedbe  /tmp/final-quality/novelforge-semantic-contract-packs.yml' | sha256sum -c -
          echo '8dbecc1b2c700e9ab272931697672ecd4c5e2fc74d091a83235c9736007610ed  /tmp/final-quality/novelforge-quality-gate-hardening.yml' | sha256sum -c -
      - name: Stage exact artifact bytes as ordinary blobs
        run: |
          cp /tmp/final-quality/novelforge-contracts.yml tmp/final-novelforge-contracts.yml
          cp /tmp/final-quality/novelforge-semantic-contract-packs.yml tmp/final-novelforge-semantic-contract-packs.yml
          cp /tmp/final-quality/novelforge-quality-gate-hardening.yml tmp/final-novelforge-quality-gate-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/final-novelforge-contracts.yml tmp/final-novelforge-semantic-contract-packs.yml tmp/final-novelforge-quality-gate-hardening.yml
          git commit -m 'dev: stage validated workflow blobs'
          git push origin HEAD:agent/pre-independent-candidate-qualification
