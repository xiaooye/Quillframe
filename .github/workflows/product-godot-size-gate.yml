name: Product Godot Size Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-godot-size-gate.yml'
      - 'site/godot/**'
      - 'site/scripts/fetch-godot-fonts.sh'
      - 'site/scripts/build-godot-shadow.sh'

permissions:
  contents: read

concurrency:
  group: product-godot-size-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: 4.7.1-stable
  GODOT_TEMPLATE_VERSION: 4.7.1.stable
  MAX_PAGE_ASSET_BYTES: 26214400

jobs:
  asset-ceiling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot editor and Web templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/"
      - name: Build current Godot shadow export
        working-directory: site
        run: bash scripts/build-godot-shadow.sh
      - name: Record exact asset sizes
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/novelforge-godot-size
          mkdir -p "$OUT"
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root = Path('site/dist-godot-shadow')
          limit = int(os.environ['MAX_PAGE_ASSET_BYTES'])
          files = []
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  size = p.stat().st_size
                  files.append({'path': str(p.relative_to(root)), 'bytes': size, 'mib': round(size / 1048576, 3), 'over_limit': size > limit})
          report = {
              'schema': 'novelforge_godot_asset_ceiling_v1',
              'cloudflare_pages_single_asset_limit_bytes': limit,
              'cloudflare_pages_single_asset_limit_mib': 25,
              'largest_first': sorted(files, key=lambda x: x['bytes'], reverse=True),
          }
          Path('/tmp/novelforge-godot-size/asset-sizes.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          for item in report['largest_first'][:20]:
              print(f"{item['mib']:8.3f} MiB  {item['path']}")
          offenders = [x for x in files if x['over_limit']]
          if offenders:
              print('OVER_LIMIT=' + ','.join(f"{x['path']}:{x['mib']}MiB" for x in offenders))
              raise SystemExit(2)
          PY
      - name: Upload asset-size evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-godot-asset-sizes
          path: /tmp/novelforge-godot-size
          if-no-files-found: error
          retention-days: 7
