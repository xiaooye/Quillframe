name: Temporary Objective Preservation Patch

on:
  push:
    branches: [agent/pre-independent-candidate-qualification]
    paths:
      - 'tmp/patch_objective_preservation.py'
      - '.github/workflows/tmp-objective-preservation-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pre-independent-candidate-qualification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply objective-preservation integration
        run: python tmp/patch_objective_preservation.py
      - name: Correct hidden-expectation isolation assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('evals/repair_objective_preservation.py')
          text=p.read_text(encoding='utf-8')
          old="'expectations_not_in_model_jobs':all(c['expected'] not in serialized_jobs for c in CASES if c['expected']!='semantic_compare'),"
          new="'expectations_not_in_model_jobs':'\"expected\"' not in serialized_jobs,"
          if text.count(old)!=1:
              raise SystemExit('expected exactly one legacy hidden-label assertion')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Register structural spec documentation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/documentation_manifest.json')
          doc=json.loads(p.read_text(encoding='utf-8'))
          entries=[
            {
              'id':'spec-014-pre-independent-candidate-qualification','tier':'C',
              'english':'specs/014-pre-independent-candidate-qualification/spec.en.md',
              'chinese':'specs/014-pre-independent-candidate-qualification/spec.zh-CN.md',
              'audience':'framework maintainers','purpose':'structural specification for manager candidate qualification and objective-preserving repair before independent review',
              'authority_sources':['HARNESS_MANIFEST.yaml','harness/semantic_workers/contracts/quality.json','harness/semantic_workers/contracts/creative-evolution.json','quality/candidate_qualification.py','quality/regression_escape.py','quality/objective_envelope.py','quality/repair_objective_regression.py'],
              'visual_policy':'contract','rewrite_policy':'preserve','freshness_owner':'quality-maintainers','status':'candidate_review'
            },
            {
              'id':'plan-014-pre-independent-candidate-qualification','tier':'C',
              'english':'specs/014-pre-independent-candidate-qualification/plan.en.md',
              'chinese':'specs/014-pre-independent-candidate-qualification/plan.zh-CN.md',
              'audience':'framework maintainers','purpose':'implementation plan for pre-independent qualification and objective-preserving repair',
              'authority_sources':['specs/014-pre-independent-candidate-qualification/spec.en.md','quality/candidate_qualification.py','quality/objective_envelope.py'],
              'visual_policy':'contract','rewrite_policy':'preserve','freshness_owner':'quality-maintainers','status':'candidate_review'
            },
            {
              'id':'tasks-014-pre-independent-candidate-qualification','tier':'C',
              'english':'specs/014-pre-independent-candidate-qualification/tasks.en.md',
              'chinese':'specs/014-pre-independent-candidate-qualification/tasks.zh-CN.md',
              'audience':'framework maintainers','purpose':'implementation and verification checklist for qualification and repair-objective preservation',
              'authority_sources':['specs/014-pre-independent-candidate-qualification/spec.en.md','specs/014-pre-independent-candidate-qualification/plan.en.md'],
              'visual_policy':'contract','rewrite_policy':'preserve','freshness_owner':'quality-maintainers','status':'candidate_review'
            },
            {
              'id':'research-014-objective-preservation','tier':'C',
              'english':'specs/014-pre-independent-candidate-qualification/research-objective-preservation.en.md',
              'chinese':'specs/014-pre-independent-candidate-qualification/research-objective-preservation.zh-CN.md',
              'audience':'framework maintainers and evaluators','purpose':'primary-research synthesis and inference boundaries for repair objective preservation',
              'authority_sources':['current primary research','specs/014-pre-independent-candidate-qualification/spec.en.md','evals/repair_objective_preservation.py'],
              'visual_policy':'contract','rewrite_policy':'preserve','freshness_owner':'framework-research','status':'candidate_review'
            },
          ]
          existing={x.get('id') for x in doc.get('documents',[])}
          for entry in entries:
              if entry['id'] not in existing:
                  doc['documents'].append(entry)
          p.write_text(json.dumps(doc,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate deterministic contracts
        run: |
          python -m json.tool harness/semantic_workers/contracts/production-loop.json > /dev/null
          python -m json.tool harness/semantic_workers/contracts/creative-evolution.json > /dev/null
          python -m json.tool harness/semantic_workers/model_contract_catalog.json > /dev/null
          python -m json.tool docs/documentation_manifest.json > /dev/null
          python -m py_compile quality/objective_envelope.py quality/repair_objective_regression.py quality/candidate_qualification.py quality/repair_policy.py quality/quality_evolution.py
          python -m py_compile harness/semantic_workers/semantic_worker_router.py evals/pre_independent_qualification.py evals/repair_objective_preservation.py
          python quality/objective_envelope.py self-test
          python quality/repair_objective_regression.py self-test
          python quality/repair_policy.py self-test
          python quality/quality_evolution.py self-test
          python quality/candidate_qualification.py self-test
          python harness/semantic_workers/semantic_worker_router.py self-test
          python evals/pre_independent_qualification.py self-test
          python evals/repair_objective_preservation.py self-test
          python scripts/docs_quality.py
      - name: Commit validated source and docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quality/objective_envelope.py quality/repair_objective_regression.py quality/candidate_qualification.py quality/repair_policy.py quality/quality_evolution.py \
            harness/semantic_workers/semantic_worker_router.py harness/semantic_workers/model_contract_catalog.json \
            harness/semantic_workers/contracts/production-loop.json harness/semantic_workers/contracts/creative-evolution.json \
            evals/pre_independent_qualification.py evals/repair_objective_preservation.py \
            specs/014-pre-independent-candidate-qualification/ docs/documentation_manifest.json docs/quality-assurance.en.md docs/quality-assurance.zh-CN.md \
            docs/production-pipeline.en.md docs/production-pipeline.zh-CN.md \
            harness/semantic_workers/SEMANTIC_WORKER_PROTOCOL.en.md harness/semantic_workers/SEMANTIC_WORKER_PROTOCOL.zh-CN.md
          git rm tmp/patch_objective_preservation.py
          if [ -f tmp/patch_qualification_docs.py ]; then git rm tmp/patch_qualification_docs.py; fi
          git commit -m 'quality: preserve creative objectives across repair'
          git push origin HEAD:agent/pre-independent-candidate-qualification
