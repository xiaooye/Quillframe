name: NovelForge Project-Hosted Peer Chat Bridge

on:
  workflow_call:
    inputs:
      mode:
        description: prepare or validate-result
        required: true
        type: string
      project_root:
        description: NovelForge Project root in the caller repository
        required: true
        type: string
      project_id:
        description: Expected Project ID
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: novelforge-peer-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  project-peer-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consuming Project repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute exact-revision NovelForge peer bridge
        uses: $/.github/actions/project-peer-semantic
        with:
          mode: ${{ inputs.mode }}
          project-root: ${{ inputs.project_root }}
          project-id: ${{ inputs.project_id }}
          github-token: ${{ github.token }}
