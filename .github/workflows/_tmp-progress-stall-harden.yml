name: Progress stall one-shot hardening

on:
  push:
    branches: [agent/progress-stall-runtime]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[progress-stall-hardened]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/progress-stall-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fail-closed progress/stall hardening
        run: python scripts/_tmp_harden_progress_stall.py
      - name: Remove one-shot migration helpers
        run: |
          rm scripts/_tmp_harden_progress_stall.py
          rm .github/workflows/_tmp-progress-stall-harden.yml
      - name: Attempt branch-only commit
        run: |
          git config user.name 'novelforge-runtime-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'runtime: bind progress evidence to durable session state [progress-stall-hardened]'
          git push origin HEAD:agent/progress-stall-runtime
