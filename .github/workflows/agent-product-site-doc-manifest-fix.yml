name: Agent Product Site Doc Manifest Fix (temporary)

on:
  push:
    branches: [agent/product-site-doc-manifest-fix]
    paths:
      - '.github/workflows/agent-product-site-doc-manifest-fix.yml'

permissions:
  contents: write

jobs:
  register-product-site-spec-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Register spec docs and validate documentation governance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/documentation_manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          ids={x['id'] for x in d['documents']}
          additions=[
            {"id":"004-novelforge-product-site-spec","tier":"C","english":"specs/004-novelforge-product-site/spec.en.md","chinese":"specs/004-novelforge-product-site/spec.zh-CN.md","audience":"product and framework maintainers","purpose":"active product-site requirements and acceptance contract","authority_sources":["specs/004-novelforge-product-site/","HARNESS_MANIFEST.yaml","studio/","site/"],"visual_policy":"contract","rewrite_policy":"rebuild","freshness_owner":"product-experience","status":"candidate_review"},
            {"id":"004-novelforge-product-site-plan","tier":"C","english":"specs/004-novelforge-product-site/plan.en.md","chinese":"specs/004-novelforge-product-site/plan.zh-CN.md","audience":"product and framework maintainers","purpose":"active product-site implementation plan","authority_sources":["specs/004-novelforge-product-site/","HARNESS_MANIFEST.yaml","studio/","site/"],"visual_policy":"contract","rewrite_policy":"rebuild","freshness_owner":"product-experience","status":"candidate_review"},
            {"id":"004-novelforge-product-site-tasks","tier":"C","english":"specs/004-novelforge-product-site/tasks.en.md","chinese":"specs/004-novelforge-product-site/tasks.zh-CN.md","audience":"product and framework maintainers","purpose":"active product-site implementation task ledger","authority_sources":["specs/004-novelforge-product-site/","HARNESS_MANIFEST.yaml","studio/","site/"],"visual_policy":"contract","rewrite_policy":"rebuild","freshness_owner":"product-experience","status":"candidate_review"}
          ]
          missing=[x for x in additions if x['id'] not in ids]
          assert len(missing)==3, f'unexpected pre-existing product-site registration: {ids & {x["id"] for x in additions}}'
          d['documents'].extend(missing)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python scripts/version_identity.py > /tmp/version-identity.json
          python scripts/docs_quality.py > /tmp/docs-quality.txt
          python - <<'PY'
          import json
          d=json.load(open('/tmp/version-identity.json'))
          assert d['version_identity_contract']=='PASS',d
          PY
          git diff --check
          git add docs/documentation_manifest.json
          git config user.name 'NovelForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'docs: register product-site spec documents'
          git push origin "HEAD:${GITHUB_REF_NAME}"
