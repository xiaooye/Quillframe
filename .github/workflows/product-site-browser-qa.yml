name: Product Site Browser QA

on:
  pull_request:
    paths:
      - 'site/**'
      - 'assets/brand/**'
      - '.github/workflows/product-site-browser-qa.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/brand/**'
      - '.github/workflows/product-site-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-site-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: 4.7.1-stable
  GODOT_TEMPLATE_VERSION: 4.7.1.stable

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install exact Product Site dependencies
        working-directory: site
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build Product and Docs source surfaces
        working-directory: site
        run: npm run build

      - name: Install pinned Godot and Web export templates
        working-directory: site
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl -fsSL -o /tmp/godot-templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/"

      - name: Export Godot production root
        working-directory: site
        run: npm run godot:build

      - name: Install CJK font for truthful bilingual rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f >/dev/null

      - name: Responsive Godot Web browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/product-site-browser-qa
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "${CHROME}"
          export CHROME

          cd site
          npm run preview -- --host 127.0.0.1 --port 4188 > /tmp/product-site-browser-qa/server.log 2>&1 &
          SERVER_PID=$!
          cd ..
          cleanup() {
            kill "${SERVER_PID}" >/dev/null 2>&1 || true
            wait "${SERVER_PID}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 40); do
            if curl --silent --show-error --fail http://127.0.0.1:4188/ > /tmp/product-site-browser-qa/root.html; then
              if grep -q 'NovelForge' /tmp/product-site-browser-qa/root.html; then
                ready=true
                break
              fi
            fi
            sleep 1
          done
          test "${ready}" = "true"

          # Deep product routes resolve to the Godot host document while
          # documentation remains a separate semantic HTML application.
          for route in architecture studio publication inspect playground agents changelog; do
            curl --silent --show-error --fail "http://127.0.0.1:4188/${route}" > "/tmp/product-site-browser-qa/${route}.html"
            grep -q 'data-novelforge-runtime="loading"' "/tmp/product-site-browser-qa/${route}.html"
          done
          curl --silent --show-error --fail http://127.0.0.1:4188/docs/ > /tmp/product-site-browser-qa/docs.html
          grep -qiE 'starlight|documentation|docs' /tmp/product-site-browser-qa/docs.html

          proof() {
            name="$1"
            width="$2"
            height="$3"
            url="$4"
            node site/scripts/godot-browser-proof.mjs \
              --url "${url}" \
              --width "${width}" \
              --height "${height}" \
              --timeout-ms 90000 \
              --output "/tmp/product-site-browser-qa/${name}.png" \
              | tee "/tmp/product-site-browser-qa/${name}-proof.json"
          }

          # Real elapsed-time CDP polling is deliberate: a 40 MB WebAssembly
          # runtime may still be compiling after network progress reaches 100%.
          # Virtual-time screenshots can therefore capture only a completed
          # loader and falsely report the scene as broken.
          proof product-desktop 1440 900 'http://127.0.0.1:4188/'
          proof architecture-desktop 1440 900 'http://127.0.0.1:4188/architecture'
          proof studio-desktop 1440 900 'http://127.0.0.1:4188/studio'
          proof publication-desktop 1440 900 'http://127.0.0.1:4188/publication'
          proof architecture-mobile 390 844 'http://127.0.0.1:4188/architecture'

          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('/tmp/product-site-browser-qa')
          desktop = []
          for image in (
              'product-desktop.png',
              'architecture-desktop.png',
              'studio-desktop.png',
              'publication-desktop.png',
              'architecture-mobile.png',
          ):
              path = root / image
              assert path.exists() and path.stat().st_size > 10_000, image
              digest = sha256(path.read_bytes()).hexdigest()
              if 'desktop' in image:
                  desktop.append(digest)

          # A single shared loading splash across every route is not a passing
          # browser test. Product scenes must render route-specific frames.
          assert len(set(desktop)) >= 3, desktop

          (root / 'browser-proof.txt').write_text(
              'schema=novelforge_product_site_browser_qa_v5\n'
              'runtime=godot_web\n'
              'runtime_ready_marker=true\n'
              'real_time_cdp_wait=true\n'
              'branded_loader=true\n'
              'dimension=2d_2_5d\n'
              'deep_routes=true\n'
              'docs_boundary=astro_starlight\n'
              'desktop=1440x900\n'
              'mobile=390x844\n'
              'authority=false\n',
              encoding='utf-8',
          )
          print({'schema': 'novelforge_product_site_browser_qa_v5', 'status': 'pass', 'screenshots': 5, 'real_time_cdp_wait': True, 'authority': False})
          PY

      - name: Upload Product Site browser QA evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-site-browser-qa
          path: /tmp/product-site-browser-qa
          if-no-files-found: error
          retention-days: 7
