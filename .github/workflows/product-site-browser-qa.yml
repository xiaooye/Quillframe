name: Product Site Browser QA

on:
  pull_request:
    paths:
      - 'site/**'
      - 'assets/brand/**'
      - 'specs/004-novelforge-product-site/**'
      - '.github/workflows/product-site.yml'
      - '.github/workflows/product-site-browser-qa.yml'
      - '.github/workflows/product-godot-route-parity.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/brand/**'
      - 'specs/004-novelforge-product-site/**'
      - '.github/workflows/product-site.yml'
      - '.github/workflows/product-site-browser-qa.yml'
      - '.github/workflows/product-godot-route-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-site-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: 4.7.1-stable
  GODOT_TEMPLATE_VERSION: 4.7.1.stable
  GODOT_SOURCE_SHA256: 0230d490846467c4fd772cc70b08dc56cb3adfedd55d039de0af74ddfdba00eb
  EMSDK_VERSION: 4.0.20
  MAX_PAGE_ASSET_BYTES: 26214400

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install exact Product Site dependencies
        working-directory: site
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Source contracts and permanent Docs build
        working-directory: site
        run: |
          npm run godot:quality
          npm run content
          npm run docs:build

      - name: Install pinned Godot editor
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore slim Web template cache
        id: template-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/novelforge-godot-template
          key: novelforge-godot-web-${{ env.GODOT_RELEASE }}-${{ env.EMSDK_VERSION }}-kawaii2d-textedit-v3

      - name: Compile slim 2D-only Web template
        if: steps.template-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 -m pip install --user 'scons>=4.4,<5'
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf /tmp/emsdk
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install "${EMSDK_VERSION}"
          /tmp/emsdk/emsdk activate "${EMSDK_VERSION}"
          source /tmp/emsdk/emsdk_env.sh
          bash site/scripts/build-godot-web-template.sh "$HOME/.cache/novelforge-godot-template"

      - name: Install slim Web export template
        run: |
          set -euo pipefail
          template="$HOME/.cache/novelforge-godot-template/web_nothreads_release.zip"
          meta="$HOME/.cache/novelforge-godot-template/build-meta.txt"
          test -s "$template"
          grep -qx 'disable_advanced_gui=false' "$meta"
          grep -qx 'text_edit=true' "$meta"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$template_dir"
          cp "$template" "$template_dir/web_nothreads_release.zip"

      - name: Build production Godot root preserving Docs
        working-directory: site
        run: bash scripts/build-godot-web.sh

      - name: Godot runtime, full surfaces, interactions, and Docs QA
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/product-site-browser-qa
          mkdir -p "$OUT"
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"

          python3 -m http.server 4188 --bind 127.0.0.1 --directory site/dist > "$OUT/server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
            wait "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4188/ >/dev/null && curl -fsS http://127.0.0.1:4188/docs/ >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          CHROME="$CHROME" node site/scripts/run-godot-interaction-qa.mjs \
            --url "http://127.0.0.1:4188/" \
            --output "$OUT/interaction.json" --timeout-ms 90000 >"$OUT/interaction.log" 2>&1

          CHROME="$CHROME" node site/scripts/godot-studio-handoff-qa.mjs \
            --url "http://127.0.0.1:4188/?route=/studio" \
            --output "$OUT/studio-handoff.json" --timeout-ms 30000 >"$OUT/studio-handoff.log" 2>&1

          godot_shot() {
            local name="$1" width="$2" height="$3" layout="$4" route="$5"
            local locale="${6:-}" wheel="${7:-0}" markers="${8:-}"
            local url="http://127.0.0.1:4188/?route=${route}"
            if [ -n "$locale" ]; then
              url="${url}&locale=${locale}"
            fi
            local -a extra=()
            if [ "$wheel" != "0" ]; then extra+=(--wheel-y "$wheel"); fi
            if [ -n "$markers" ]; then extra+=(--expect-marker "$markers"); fi
            CHROME="$CHROME" node site/scripts/godot-shadow-browser-shot.mjs \
              --url "$url" \
              --output "$OUT/${name}.png" --width "$width" --height "$height" \
              --expect-layout "$layout" --timeout-ms 90000 "${extra[@]}" >"$OUT/${name}.log" 2>&1
            test -s "$OUT/${name}.png"
          }

          COMPLETE='novelforgeVisualCompletion=ready,novelforgeVisualPolish=ready,novelforgeTypographyCjk=ready'
          HOME_COMPLETE="${COMPLETE},novelforgeHomeSections=complete"
          ARCH_COMPLETE="${COMPLETE},novelforgeArchitectureInspector=ready"
          PUB_COMPLETE="${COMPLETE},novelforgePublicationPreview=ready"

          godot_shot home-desktop 1440 900 desktop / '' 0 "$HOME_COMPLETE"
          godot_shot architecture-desktop 1440 900 desktop /architecture '' 0 "$ARCH_COMPLETE"
          godot_shot studio-desktop 1440 900 desktop /studio '' 0 "$COMPLETE"
          godot_shot publication-desktop 1440 900 desktop /publication '' 0 "$PUB_COMPLETE"
          godot_shot inspect-desktop 1440 900 desktop /inspect '' 0 "$COMPLETE"
          godot_shot agents-desktop 1440 900 desktop /agents '' 0 "$COMPLETE"
          godot_shot home-mobile 390 844 phone / '' 0 "$HOME_COMPLETE"
          godot_shot architecture-mobile 390 844 phone /architecture '' 0 "$ARCH_COMPLETE"
          godot_shot publication-mobile 390 844 phone /publication '' 0 "$PUB_COMPLETE"

          godot_shot home-zh-desktop 1440 900 desktop / zh-CN 0 "${HOME_COMPLETE},locale=zh-CN"
          godot_shot architecture-zh-desktop 1440 900 desktop /architecture zh-CN 0 "${ARCH_COMPLETE},locale=zh-CN"
          godot_shot publication-zh-desktop 1440 900 desktop /publication zh-CN 0 "${PUB_COMPLETE},locale=zh-CN"

          # Calibrated deep-surface captures. Separate screenshots deliberately
          # target the post-hero sections that previously vanished or rendered
          # empty instead of accepting a generic changed frame.
          godot_shot home-capabilities-desktop 1440 900 desktop / '' 430 "$HOME_COMPLETE"
          godot_shot home-product-world-desktop 1440 900 desktop / '' 820 "$HOME_COMPLETE"
          godot_shot architecture-inspector-desktop 1440 900 desktop /architecture '' 760 "$ARCH_COMPLETE"
          godot_shot publication-preview-desktop 1440 900 desktop /publication '' 720 "$PUB_COMPLETE"
          godot_shot publication-provenance-desktop 1440 900 desktop /publication '' 1180 "$PUB_COMPLETE"
          godot_shot home-capabilities-mobile 390 844 phone / '' 280 "$HOME_COMPLETE"
          godot_shot home-knowledge-mobile 390 844 phone / '' 1050 "$HOME_COMPLETE"
          godot_shot architecture-inspector-mobile 390 844 phone /architecture '' 1450 "$ARCH_COMPLETE"
          # Keep the preview checkpoint before max-scroll. A 650px wheel delta
          # clamps to the same provenance frame as 1050px on this phone height.
          godot_shot publication-preview-mobile 390 844 phone /publication '' 350 "$PUB_COMPLETE"
          godot_shot publication-provenance-mobile 390 844 phone /publication '' 1050 "$PUB_COMPLETE"

          # The compact hero surfaces now stack evidence vertically. Capture max
          # scroll checkpoints as blocking evidence that later deep surfaces are
          # not clipped by the expanded hero or stale stage-height constants.
          godot_shot architecture-inspector-compact 768 1024 compact /architecture '' 1800 "$ARCH_COMPLETE"
          godot_shot publication-provenance-compact 768 1024 compact /publication '' 1800 "$PUB_COMPLETE"

          test -s site/dist/docs/index.html
          grep -q '^/architecture /index.html 200$' site/dist/_redirects
          grep -q '^/docs /docs/ 301$' site/dist/_redirects
          grep -q 'data-novelforge-runtime="loading"' site/dist/index.html

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('/tmp/product-site-browser-qa')
          interaction = json.loads((root/'interaction.json').read_text(encoding='utf-8'))
          handoff = json.loads((root/'studio-handoff.json').read_text(encoding='utf-8'))
          assert interaction['status'] == 'pass', interaction
          assert interaction['compact_locale_evidence'] == ['en-US', 'zh-CN'], interaction
          assert handoff['status'] == 'pass', handoff
          assert handoff['url'] == 'https://studio.novelforge.wei-dev.com/', handoff
          assert handoff['target'] == '_blank', handoff
          assert handoff['noopener'] and handoff['noreferrer'], handoff
          images = sorted(p for p in root.glob('*.png') if not p.name.startswith('responsive-'))
          responsive_images = sorted(root.glob('responsive-*.png'))
          assert len(images) == 24, len(images)
          assert len(responsive_images) == 49, len(responsive_images)
          for image in [*images, *responsive_images]:
              assert image.stat().st_size > 12_000, image
          def digest(name):
              return hashlib.sha256((root/name).read_bytes()).hexdigest()
          assert digest('home-desktop.png') != digest('home-capabilities-desktop.png')
          assert digest('home-capabilities-desktop.png') != digest('home-product-world-desktop.png')
          assert digest('home-mobile.png') != digest('home-capabilities-mobile.png')
          assert digest('home-capabilities-mobile.png') != digest('home-knowledge-mobile.png')
          assert digest('architecture-desktop.png') != digest('architecture-inspector-desktop.png')
          assert digest('publication-desktop.png') != digest('publication-preview-desktop.png')
          assert digest('publication-preview-mobile.png') != digest('publication-provenance-mobile.png')
          assert digest('responsive-en-architecture-768x1024.png') != digest('architecture-inspector-compact.png')
          assert digest('responsive-en-publication-768x1024.png') != digest('publication-provenance-compact.png')
          (root/'browser-proof.txt').write_text(
              'schema=novelforge_product_site_godot_browser_qa_v6\n'
              'product_runtime=godot_web\n'
              'docs_runtime=astro_starlight\n'
              'desktop=1440x900\n'
              'mobile=390x844\n'
              'interaction=true\n'
              'studio_handoff=true\n'
              'responsive_evidence=true\n'
              'compact_routes=all_major_routes\n'
              'compact_locales=en-US,zh-CN\n'
              'compact_deep_surfaces=true\n'
              'cjk_visual_proof=true\n'
              'visual_polish_marker=true\n'
              'deep_surface_scroll=calibrated\n'
              'home_full_body=true\n'
              'architecture_inspector=true\n'
              'publication_preview_and_provenance=true\n'
              'direct_route_rewrites=true\n'
              'authority=false\n',
              encoding='utf-8',
          )
          print({'schema':'novelforge_product_site_godot_browser_qa_v6','status':'pass','surface_screenshots':len(images),'responsive_screenshots':len(responsive_images),'compact_locales':['en-US','zh-CN'],'compact_deep_surfaces':True,'studio_handoff':True,'interaction':True,'deep_surface_scroll':'calibrated','cjk_visual_proof':True,'visual_polish_marker':True})
          PY

      - name: Upload Product Site browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-site-browser-qa
          path: /tmp/product-site-browser-qa
          if-no-files-found: error
          retention-days: 7
