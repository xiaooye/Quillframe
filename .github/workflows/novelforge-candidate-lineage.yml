name: NovelForge Candidate Lineage

on:
  pull_request:
    paths:
      - 'quality/candidate_lineage.py'
      - 'quality/quality_evolution.py'
      - 'evals/candidate_lineage_ablation.py'
      - 'docs/CANDIDATE_LINEAGE_V1.*.md'
      - 'specs/015-candidate-lineage/**'
      - '.github/workflows/novelforge-candidate-lineage.yml'
  push:
    branches: [main]
    paths:
      - 'quality/candidate_lineage.py'
      - 'quality/quality_evolution.py'
      - 'evals/candidate_lineage_ablation.py'
      - 'docs/CANDIDATE_LINEAGE_V1.*.md'
      - 'specs/015-candidate-lineage/**'
      - '.github/workflows/novelforge-candidate-lineage.yml'

permissions:
  contents: read

jobs:
  deterministic-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing quality-evolution regression
        run: python quality/quality_evolution.py self-test
      - name: Candidate lineage A-H contract
        run: python quality/candidate_lineage.py self-test
      - name: Legacy-vs-lineage architecture ablation
        run: python evals/candidate_lineage_ablation.py self-test
      - name: Framework hygiene
        run: python scripts/framework_hygiene.py
      - name: Compile changed Python
        run: python -m py_compile quality/candidate_lineage.py evals/candidate_lineage_ablation.py
