name: Agent Semantic Acceptance Freeze
on:
  push:
    branches: [agent/8-0-semantic-acceptance-freeze]
    paths: ['.github/workflows/agent-semantic-acceptance-freeze.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python .agent-semantic-acceptance-freeze.py
          python evals/validate_semantic_acceptance.py self-test >/tmp/semantic-acceptance.json
          python evals/run_evals.py --json >/tmp/evals.json
          python scripts/version_identity.py >/tmp/version.json
          python scripts/docs_quality.py >/tmp/docs.txt
          python scripts/framework_hygiene.py >/tmp/hygiene.txt
          python novelforge.py self-test >/tmp/selftest.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/semantic-acceptance.json'))
          e=json.load(open('/tmp/evals.json'))
          v=json.load(open('/tmp/version.json'))
          s=json.load(open('/tmp/selftest.json'))
          assert a['semantic_acceptance_baseline_contract']=='PASS',a
          assert a['semantic_case_count']==13,a
          assert e['counts']['FAIL']==0 and e['counts']['ERROR']==0 and e['counts']['PENDING_MODEL']==13,e
          assert v['version_identity_contract']=='PASS',v
          assert s['novelforge_cli_contract']=='PASS',s
          PY
          git diff --check
          rm .agent-semantic-acceptance-freeze.py
          git add -A
          git config user.name 'NovelForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'test: integrate semantic acceptance baseline validation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
