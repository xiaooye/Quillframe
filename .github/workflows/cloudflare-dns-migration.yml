name: Cloudflare DNS Migration Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-dns-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-dns-migration-preflight
  cancel-in-progress: false

env:
  MIGRATION_ZONE: wei-dev.com

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure pending Cloudflare zone
        id: zone
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          list_url="https://api.cloudflare.com/client/v4/zones?name=${MIGRATION_ZONE}&account.id=${CLOUDFLARE_ACCOUNT_ID}"
          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${list_url}" > /tmp/zones.json
          jq -e '.success == true' /tmp/zones.json >/dev/null

          zone_id=$(jq -r --arg name "${MIGRATION_ZONE}" '.result[] | select(.name == $name) | .id' /tmp/zones.json | head -n1)
          if [ -z "${zone_id}" ]; then
            payload=$(jq -nc --arg name "${MIGRATION_ZONE}" --arg account "${CLOUDFLARE_ACCOUNT_ID}" '{name:$name, account:{id:$account}, type:"full"}')
            curl --silent --show-error --fail \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "https://api.cloudflare.com/client/v4/zones" > /tmp/zone.json
            jq -e '.success == true' /tmp/zone.json >/dev/null
          else
            curl --silent --show-error --fail \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}" > /tmp/zone.json
            jq -e '.success == true' /tmp/zone.json >/dev/null
          fi

          zone_id=$(jq -r '.result.id' /tmp/zone.json)
          zone_status=$(jq -r '.result.status' /tmp/zone.json)
          ns1=$(jq -r '.result.name_servers[0] // empty' /tmp/zone.json)
          ns2=$(jq -r '.result.name_servers[1] // empty' /tmp/zone.json)
          test -n "${zone_id}"
          test -n "${ns1}"
          test -n "${ns2}"

          echo "zone_id=${zone_id}" >> "${GITHUB_OUTPUT}"
          echo "zone_status=${zone_status}" >> "${GITHUB_OUTPUT}"
          echo "ns1=${ns1}" >> "${GITHUB_OUTPUT}"
          echo "ns2=${ns2}" >> "${GITHUB_OUTPUT}"

      - name: Trigger Cloudflare DNS scan
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/scan/trigger" > /tmp/scan-trigger.json
          jq -e '.success == true' /tmp/scan-trigger.json >/dev/null
          sleep 15

      - name: Read scanned records and current public DNS
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          ZONE_STATUS: ${{ steps.zone.outputs.zone_status }}
          CF_NS1: ${{ steps.zone.outputs.ns1 }}
          CF_NS2: ${{ steps.zone.outputs.ns2 }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/scan/review" > /tmp/scan-review.json
          jq -e '.success == true' /tmp/scan-review.json >/dev/null

          current_ns=$(dig +short NS "${MIGRATION_ZONE}" | sort || true)
          current_ds=$(dig +short DS "${MIGRATION_ZONE}" | sort || true)
          current_mx=$(dig +short MX "${MIGRATION_ZONE}" | sort -n || true)
          current_txt=$(dig +short TXT "${MIGRATION_ZONE}" | sort || true)
          current_caa=$(dig +short CAA "${MIGRATION_ZONE}" | sort || true)
          current_dmarc=$(dig +short TXT "_dmarc.${MIGRATION_ZONE}" | sort || true)
          current_dkim=$(dig +short TXT "google._domainkey.${MIGRATION_ZONE}" | sort || true)

          {
            echo "### wei-dev.com → Cloudflare DNS migration preflight"
            echo ""
            echo "- Cloudflare zone status: \`${ZONE_STATUS}\`"
            echo "- Assigned nameserver 1: \`${CF_NS1}\`"
            echo "- Assigned nameserver 2: \`${CF_NS2}\`"
            echo ""
            echo "#### Current authoritative delegation"
            echo '```text'
            printf '%s\n' "${current_ns:-<none>}"
            echo '```'
            echo ""
            echo "#### Current DS records"
            echo '```text'
            printf '%s\n' "${current_ds:-<none>}"
            echo '```'
            echo ""
            echo "#### Current MX"
            echo '```text'
            printf '%s\n' "${current_mx:-<none>}"
            echo '```'
            echo ""
            echo "#### Current apex TXT"
            echo '```text'
            printf '%s\n' "${current_txt:-<none>}"
            echo '```'
            echo ""
            echo "#### Current CAA"
            echo '```text'
            printf '%s\n' "${current_caa:-<none>}"
            echo '```'
            echo ""
            echo "#### Current _dmarc TXT"
            echo '```text'
            printf '%s\n' "${current_dmarc:-<none>}"
            echo '```'
            echo ""
            echo "#### Current google._domainkey TXT"
            echo '```text'
            printf '%s\n' "${current_dkim:-<none>}"
            echo '```'
            echo ""
            echo "#### Cloudflare scan candidates"
            echo '```text'
            jq -r '.result[] | [.type, .name, (.priority // "-"), .ttl, .content] | @tsv' /tmp/scan-review.json | sort
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          jq -r '.result[] | [.type, .name, (.priority // "-"), .ttl, .content] | @tsv' /tmp/scan-review.json | sort

      - name: Guardrail
        shell: bash
        run: |
          echo "Preflight only: registrar nameservers were not changed and scanned records were not accepted."
