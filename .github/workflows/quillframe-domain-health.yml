name: Quillframe Domain Health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quillframe-domain-health.yml'
      - 'site/**'
      - 'studio/app/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  public-domain-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCT_DOMAIN: quillframe.wei-dev.com
      STUDIO_DOMAIN: studio.quillframe.wei-dev.com
    steps:
      - name: Verify public DNS from independent resolvers
        run: |
          set -euo pipefail
          check_dns() {
            domain="$1"
            resolved=0
            for resolver in cloudflare google; do
              if [ "${resolver}" = cloudflare ]; then
                endpoint='https://cloudflare-dns.com/dns-query'
                header=(-H 'accept: application/dns-json')
              else
                endpoint='https://dns.google/resolve'
                header=()
              fi

              for type in A AAAA; do
                echo "== ${domain} ${type} via ${resolver} DoH =="
                response=$(curl -fsS --get "${endpoint}" "${header[@]}" \
                  --data-urlencode "name=${domain}" \
                  --data-urlencode "type=${type}")
                echo "${response}" | jq .
                test "$(echo "${response}" | jq -r '.Status')" = "0"
                if echo "${response}" | jq -e '.Answer and (.Answer | length > 0)' >/dev/null; then
                  resolved=$((resolved + 1))
                fi
              done
            done
            test "${resolved}" -gt 0
          }
          check_dns "${PRODUCT_DOMAIN}"
          check_dns "${STUDIO_DOMAIN}"

      - name: Verify public HTTPS surfaces
        run: |
          set -euo pipefail
          curl -fsvL --connect-timeout 10 --max-time 30 "https://${PRODUCT_DOMAIN}/" -o /tmp/product.html
          grep -Fq '<title>Quillframe' /tmp/product.html
          curl -fsSL --connect-timeout 10 --max-time 30 "https://${PRODUCT_DOMAIN}/docs/" -o /tmp/docs.html
          grep -Fq 'Quillframe' /tmp/docs.html
          curl -fsvL --connect-timeout 10 --max-time 30 "https://${STUDIO_DOMAIN}/" -o /tmp/studio.html
          grep -Fq '<title>Quillframe Studio</title>' /tmp/studio.html
          curl -fsSL --connect-timeout 10 --max-time 30 "https://${STUDIO_DOMAIN}/.well-known/quillframe-host.json" -o /tmp/host.json
          jq -e '.schema == "quillframe_studio_host_descriptor_v1" and .authority == false' /tmp/host.json >/dev/null

      - name: Publish public domain health status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success) state=success; description='Public DNS and HTTPS verified from GitHub Actions' ;;
            failure) state=failure; description='Public DNS or HTTPS verification failed' ;;
            *) state=error; description="Domain health ended with ${JOB_STATUS}" ;;
          esac
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -nc --arg state "${state}" --arg target_url "${target_url}" --arg description "${description}" --arg context 'quillframe/domain-health' '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null

  legacy-pages-retirement:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify legacy Pages projects are gone
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          product=$(curl -sS -o /tmp/product-pages.json -w '%{http_code}' "${auth[@]}" "${base}/quillframe")
          studio=$(curl -sS -o /tmp/studio-pages.json -w '%{http_code}' "${auth[@]}" "${base}/quillframe-studio")
          echo "quillframe Pages GET: HTTP ${product}"
          echo "quillframe-studio Pages GET: HTTP ${studio}"
          echo "product=${product}" >> "$GITHUB_OUTPUT"
          echo "studio=${studio}" >> "$GITHUB_OUTPUT"
          if [[ "${product}" != 404 || "${studio}" != 404 ]]; then
            echo 'Legacy Pages projects are still present.' >&2
            exit 1
          fi

      - name: Publish Pages retirement status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_HTTP: ${{ steps.pages.outputs.product }}
          STUDIO_HTTP: ${{ steps.pages.outputs.studio }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "${PRODUCT_HTTP}" == 404 && "${STUDIO_HTTP}" == 404 && "${JOB_STATUS}" == success ]]; then
            state=success
            description='Legacy Cloudflare Pages projects are retired'
          else
            state=failure
            description="Pages remain: product=${PRODUCT_HTTP:-?}, studio=${STUDIO_HTTP:-?}"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -nc --arg state "${state}" --arg target_url "${target_url}" --arg description "${description}" --arg context 'quillframe/pages-retired' '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
