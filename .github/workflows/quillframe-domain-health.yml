name: Quillframe Domain Health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quillframe-domain-health.yml'
      - 'site/**'
      - 'studio/app/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  public-domain-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCT_DOMAIN: quillframe.wei-dev.com
      STUDIO_DOMAIN: studio.quillframe.wei-dev.com
      PRODUCT_WORKERS_DEV: quillframe.cool-meadow-eb73.workers.dev
      STUDIO_WORKERS_DEV: quillframe-studio.cool-meadow-eb73.workers.dev
    steps:
      - name: Verify public DNS from independent resolvers
        run: |
          set -euo pipefail
          check_dns() {
            domain="$1"
            resolved=0
            for resolver in cloudflare google; do
              if [ "${resolver}" = cloudflare ]; then
                endpoint='https://cloudflare-dns.com/dns-query'
                header=(-H 'accept: application/dns-json')
              else
                endpoint='https://dns.google/resolve'
                header=()
              fi

              for type in A AAAA; do
                echo "== ${domain} ${type} via ${resolver} DoH =="
                response=$(curl -fsS --get "${endpoint}" "${header[@]}" \
                  --data-urlencode "name=${domain}" \
                  --data-urlencode "type=${type}")
                echo "${response}" | jq .
                test "$(echo "${response}" | jq -r '.Status')" = "0"
                if echo "${response}" | jq -e '.Answer and (.Answer | length > 0)' >/dev/null; then
                  resolved=$((resolved + 1))
                fi
              done
            done
            test "${resolved}" -gt 0
          }
          check_dns "${PRODUCT_DOMAIN}"
          check_dns "${STUDIO_DOMAIN}"

      - name: Verify custom-domain edge and Worker artifacts
        run: |
          set -euo pipefail

          check_edge() {
            domain="$1"
            marker="$2"
            headers="/tmp/${domain}.headers"
            body="/tmp/${domain}.html"
            code=$(curl -sS -L --connect-timeout 10 --max-time 30 -D "${headers}" -o "${body}" -w '%{http_code}' "https://${domain}/" || true)

            if [ "${code}" = 200 ] && grep -Fq "${marker}" "${body}"; then
              echo "${domain}: HTTP 200"
              return 0
            fi

            if [ "${code}" = 403 ] && grep -Eqi '^cf-mitigated:[[:space:]]*challenge' "${headers}"; then
              echo "${domain}: Cloudflare Challenge is active; edge is reachable"
              return 0
            fi

            echo "Unexpected edge response for ${domain}: HTTP ${code}" >&2
            cat "${headers}" >&2 || true
            return 1
          }

          check_edge "${PRODUCT_DOMAIN}" '<title>Quillframe'
          check_edge "${STUDIO_DOMAIN}" '<title>Quillframe Studio</title>'

          curl -fsSL --connect-timeout 10 --max-time 30 "https://${PRODUCT_WORKERS_DEV}/" -o /tmp/product-worker.html
          grep -Fq '<title>Quillframe' /tmp/product-worker.html
          curl -fsSL --connect-timeout 10 --max-time 30 "https://${PRODUCT_WORKERS_DEV}/docs/" -o /tmp/docs-worker.html
          grep -Fq 'Quillframe' /tmp/docs-worker.html

          curl -fsSL --connect-timeout 10 --max-time 30 "https://${STUDIO_WORKERS_DEV}/" -o /tmp/studio-worker.html
          grep -Fq '<title>Quillframe Studio</title>' /tmp/studio-worker.html
          curl -fsSL --connect-timeout 10 --max-time 30 "https://${STUDIO_WORKERS_DEV}/.well-known/quillframe-host.json" -o /tmp/host-worker.json
          jq -e '.schema == "quillframe_studio_host_descriptor_v1" and .authority == false' /tmp/host-worker.json >/dev/null

      - name: Publish public domain health status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success) state=success; description='Public DNS, edge policy, and native Worker artifacts verified' ;;
            failure) state=failure; description='Public domain or native Worker health verification failed' ;;
            *) state=error; description="Domain health ended with ${JOB_STATUS}" ;;
          esac
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -nc --arg state "${state}" --arg target_url "${target_url}" --arg description "${description}" --arg context 'quillframe/domain-health' '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
