name: Retire legacy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-legacy-pages.yml'

permissions:
  contents: read
  statuses: write

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.123.0
      - name: Retire exact legacy Pages projects
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json')
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"

          get_status() {
            local project="$1"
            curl -sS -o "/tmp/${project}.json" -w '%{http_code}' "${auth[@]}" "${base}/${project}"
          }

          for project in quillframe quillframe-studio; do
            status=$(get_status "${project}")
            test "${status}" = "200"
            jq -e '.success == true' "/tmp/${project}.json" >/dev/null
            returned=$(jq -r '.result.name' "/tmp/${project}.json")
            test "${returned}" = "${project}"
          done

          prune_deployments() {
            local project="$1"
            local prod_id=""
            local rounds=0
            while :; do
              rounds=$((rounds + 1))
              test "${rounds}" -le 1000
              ids=$(wrangler pages deployment list --project-name "${project}" --json | jq -r '.[].Id')
              to_delete=$(printf '%s\n' "${ids}" | grep -v -F -x "${prod_id}" | grep . || true)
              if [ -z "${to_delete}" ]; then
                echo "${project}: deployment pruning complete; active production=${prod_id:-none}"
                break
              fi
              deleted_this_round=0
              while IFS= read -r id; do
                [ -n "${id}" ] || continue
                set +e
                output=$(wrangler pages deployment delete "${id}" --project-name "${project}" --force 2>&1)
                rc=$?
                set -e
                printf '%s\n' "${output}"
                if [ "${rc}" -eq 0 ] && printf '%s' "${output}" | grep -q 'Successfully deleted'; then
                  deleted_this_round=$((deleted_this_round + 1))
                  continue
                fi
                if printf '%s' "${output}" | grep -qi 'active production deployment'; then
                  prod_id="${id}"
                  continue
                fi
                echo "Unexpected deployment deletion result for ${project}/${id}" >&2
                exit 1
              done <<< "${to_delete}"
              if [ "${deleted_this_round}" -eq 0 ] && [ -z "${prod_id}" ]; then
                echo "No progress pruning ${project}" >&2
                exit 1
              fi
            done
          }

          for project in novelforge novelforge-studio; do
            status=$(get_status "${project}")
            if [ "${status}" = "404" ]; then
              echo "${project}: already absent"
              continue
            fi
            test "${status}" = "200"
            jq -e '.success == true' "/tmp/${project}.json" >/dev/null
            returned=$(jq -r '.result.name' "/tmp/${project}.json")
            test "${returned}" = "${project}"
            prune_deployments "${project}"
            delete_status=$(curl -sS -o "/tmp/${project}-delete.json" -w '%{http_code}' -X DELETE "${auth[@]}" "${base}/${project}")
            case "${delete_status}" in 200|202|204) ;; *) cat "/tmp/${project}-delete.json"; exit 1;; esac
            post=$(get_status "${project}")
            test "${post}" = "404"
            echo "${project}: deleted"
          done

          for project in quillframe quillframe-studio; do
            status=$(get_status "${project}")
            test "${status}" = "200"
            jq -e '.success == true and .result.name == "'"${project}"'"' "/tmp/${project}.json" >/dev/null
          done

      - name: Publish retirement status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success) state=success; description='Legacy NovelForge Pages projects retired' ;;
            failure) state=failure; description='Legacy Pages retirement failed' ;;
            *) state=error; description="Legacy Pages retirement ended with ${JOB_STATUS}" ;;
          esac
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(jq -nc --arg state "${state}" --arg target_url "${target_url}" --arg description "${description}" --arg context 'quillframe/legacy-pages-retired' '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
