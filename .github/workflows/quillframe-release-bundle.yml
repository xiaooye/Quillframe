name: Quillframe Framework Release Bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v0.9.1 tag to verify without publishing a new Release.
        required: true
        default: v0.9.1
        type: string
  push:
    tags: ['v0.9.1']

permissions:
  contents: write

jobs:
  bundle:
    name: Deterministic v0.9.1 bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release identity and deterministic bundle contract
        id: build
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/version_consistency.py
          python scripts/version_identity.py
          python release/build_framework_bundle.py self-test
          FRAMEWORK_VERSION="$(tr -d '\r\n' < VERSION)"
          test "$FRAMEWORK_VERSION" = "0.9.1"
          test "$RELEASE_TAG" = "v${FRAMEWORK_VERSION}"
          COMMIT="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_COMMIT="$(git rev-parse origin/main)"
          test "$COMMIT" = "$MAIN_COMMIT"
          BUNDLE_NAME="quillframe-framework-${COMMIT}.tar"
          mkdir -p release-out
          python release/build_framework_bundle.py build --output "release-out/${BUNDLE_NAME}" --report release-out/build-1.json
          python release/build_framework_bundle.py build --output "release-out/quillframe-framework-${COMMIT}.second.tar" --report release-out/build-2.json
          cmp "release-out/${BUNDLE_NAME}" "release-out/quillframe-framework-${COMMIT}.second.tar"
          FINGERPRINT="$(python - <<'PY'
          import json
          print(json.load(open('release-out/build-1.json', encoding='utf-8'))['bundle_fingerprint'])
          PY
          )"
          python release/build_framework_bundle.py verify --bundle "release-out/${BUNDLE_NAME}" --expected "$FINGERPRINT" --report release-out/verify.json
          rm "release-out/quillframe-framework-${COMMIT}.second.tar"
          cat > release-out/artifact-manifest.json <<EOF
          {"schema":"quillframe_release_artifact_manifest_v1","framework_version":"${FRAMEWORK_VERSION}","commit":"${COMMIT}","tag":"${RELEASE_TAG}","bundle":"${BUNDLE_NAME}","bundle_fingerprint":"${FINGERPRINT}","model_execution":false}
          EOF
          printf '%s\n' "$COMMIT" > release-out/framework-commit.txt
          (cd release-out && sha256sum "$BUNDLE_NAME" build-1.json build-2.json verify.json artifact-manifest.json framework-commit.txt > SHA256SUMS)
          printf 'commit=%s\n' "$COMMIT" >> "$GITHUB_OUTPUT"
          printf 'bundle=%s\n' "$BUNDLE_NAME" >> "$GITHUB_OUTPUT"
          printf 'fingerprint=%s\n' "$FINGERPRINT" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Upload release bundle evidence
        uses: actions/upload-artifact@v4
        with:
          name: quillframe-v0.9.1-${{ steps.build.outputs.commit }}
          path: release-out/
          if-no-files-found: error
      - name: Publish GitHub Release for a tag push
        if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.9.1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          BUNDLE_NAME: ${{ steps.build.outputs.bundle }}
          COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "release-out/$BUNDLE_NAME" release-out/SHA256SUMS release-out/build-1.json release-out/build-2.json release-out/verify.json release-out/artifact-manifest.json release-out/framework-commit.txt --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "Quillframe $RELEASE_TAG" --notes-file CHANGELOG.en.md
      - name: Re-download and verify the published Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v0.9.1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          BUNDLE_NAME: ${{ steps.build.outputs.bundle }}
          COMMIT: ${{ steps.build.outputs.commit }}
          FINGERPRINT: ${{ steps.build.outputs.fingerprint }}
        run: |
          set -euo pipefail
          mkdir -p release-recovery/download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-recovery/download
          cd release-recovery/download
          sha256sum -c SHA256SUMS
          test "$(cat framework-commit.txt)" = "$COMMIT"
          test "$(python -c 'import json; print(json.load(open("artifact-manifest.json", encoding="utf-8"))["bundle_fingerprint"])')" = "$FINGERPRINT"
          python - <<'PY'
          import json
          import os
          manifest = json.load(open("artifact-manifest.json", encoding="utf-8"))
          assert manifest["commit"] == os.environ["COMMIT"]
          assert manifest["tag"] == os.environ["RELEASE_TAG"]
          assert manifest["bundle"] == os.environ["BUNDLE_NAME"]
          assert manifest["bundle_fingerprint"] == os.environ["FINGERPRINT"]
          assert manifest["framework_version"] == "0.9.1"
          PY
          python "$GITHUB_WORKSPACE/release/build_framework_bundle.py" verify --bundle "$BUNDLE_NAME" --expected "$FINGERPRINT"
          mkdir unpacked
          tar -xf "$BUNDLE_NAME" -C unpacked
          python unpacked/quillframe.py doctor
          python unpacked/quillframe.py self-test
          python unpacked/project_sdk.py self-test --tmp "$RUNNER_TEMP/quillframe-release-sdk"
          python unpacked/harness/control_plane/mcp_stdio.py --self-test
          python unpacked/studio/host_bridge.py self-test
          mkdir wheels install
          python -m pip wheel unpacked --no-deps -w wheels
          python -m pip install --no-deps --target install wheels/quillframe-*.whl
          INSTALL_DIR="$PWD/install"
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH="$INSTALL_DIR" python - <<'PY'
          from quillframe import AgentJob, Quillframe
          assert AgentJob.__name__ == "AgentJob"
          assert Quillframe.__name__ == "Quillframe"
          print("released_artifact_import=PASS")
          PY
          )
