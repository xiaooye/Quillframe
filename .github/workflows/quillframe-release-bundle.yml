name: Quillframe 1.0 Development Acceptance Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Deterministic 1.0.0-dev.0 bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify development identity and bundle contract
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "1.0.0-dev.0"
          python scripts/version_consistency.py
          python scripts/version_identity.py
          python quality/clean_break.py
          python release/build_framework_bundle.py self-test
          COMMIT="$(git rev-parse HEAD)"
          BUNDLE_NAME="quillframe-framework-${COMMIT}.tar"
          mkdir -p acceptance-out
          python release/build_framework_bundle.py build --output "acceptance-out/${BUNDLE_NAME}" --report acceptance-out/build-1.json
          python release/build_framework_bundle.py build --output "acceptance-out/quillframe-framework-${COMMIT}.second.tar" --report acceptance-out/build-2.json
          cmp "acceptance-out/${BUNDLE_NAME}" "acceptance-out/quillframe-framework-${COMMIT}.second.tar"
          FINGERPRINT="$(python -c 'import json; print(json.load(open("acceptance-out/build-1.json", encoding="utf-8"))["bundle_fingerprint"])')"
          python release/build_framework_bundle.py verify --bundle "acceptance-out/${BUNDLE_NAME}" --expected "$FINGERPRINT" --report acceptance-out/verify.json
          rm "acceptance-out/quillframe-framework-${COMMIT}.second.tar"
          python - "$COMMIT" "$BUNDLE_NAME" "$FINGERPRINT" <<'PY'
          import json
          import sys
          commit, bundle, fingerprint = sys.argv[1:]
          payload = {
              "schema": "quillframe_development_bundle_evidence_v1",
              "framework_version": "1.0.0-dev.0",
              "commit": commit,
              "bundle": bundle,
              "bundle_fingerprint": fingerprint,
              "release_promotion_performed": False,
              "hosted_deployment": "awaiting_external",
              "model_execution": False,
          }
          with open("acceptance-out/artifact-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, sort_keys=True)
              handle.write("\n")
          PY
          (cd acceptance-out && sha256sum "$BUNDLE_NAME" build-1.json build-2.json verify.json artifact-manifest.json > SHA256SUMS)
      - name: Upload development acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: quillframe-1.0.0-dev.0-${{ github.sha }}
          path: acceptance-out/
          if-no-files-found: error
