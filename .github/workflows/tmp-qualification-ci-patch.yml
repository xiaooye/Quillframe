name: Temporary Qualification CI Patch

on:
  push:
    branches: [agent/pre-independent-candidate-qualification]
    paths:
      - 'tmp/patch_qualification_ci.py'
      - '.github/workflows/tmp-qualification-ci-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pre-independent-candidate-qualification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply CI wiring patch after corrected deterministic assertions
        run: python tmp/patch_qualification_ci.py
      - name: Validate YAML text and targeted Python controls
        run: |
          python -m py_compile evals/pre_independent_qualification.py evals/pre_independent_qualification_ablation.py evals/qualification_test_fixtures.py
          python evals/pre_independent_qualification.py self-test
          python evals/pre_independent_qualification_ablation.py self-test
          python quality/candidate_qualification.py self-test
          python quality/regression_escape.py self-test
      - name: Commit CI wiring and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/novelforge-contracts.yml .github/workflows/novelforge-semantic-contract-packs.yml .github/workflows/novelforge-quality-gate-hardening.yml
          git rm tmp/patch_qualification_ci.py .github/workflows/tmp-qualification-ci-patch.yml
          git commit -m 'ci: enforce qualification contracts'
          git push origin HEAD:agent/pre-independent-candidate-qualification
