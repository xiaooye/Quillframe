name: Spec 021 one-shot apply

on:
  push:
    branches: [agent/production-visibility-enforcement]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/production-visibility-enforcement
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Assemble and verify exact patch
        run: |
          cat \
            specs/021-production-visibility-enforcement/.apply.part1 \
            specs/021-production-visibility-enforcement/.apply.part2 \
            specs/021-production-visibility-enforcement/.apply.part3 \
            > /tmp/spec021.patch
          git apply --check /tmp/spec021.patch
          git apply /tmp/spec021.patch
      - name: Verify production visibility candidate
        run: |
          python -m unittest \
            tests.test_quillframe_authoring_primitives \
            tests.test_quillframe_production_host_bridge \
            tests.test_quillframe_production_runtime -v
      - name: Commit verified implementation and remove one-shot machinery
        run: |
          rm \
            specs/021-production-visibility-enforcement/.apply.part1 \
            specs/021-production-visibility-enforcement/.apply.part2 \
            specs/021-production-visibility-enforcement/.apply.part3 \
            .github/workflows/spec021-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: enforce production candidate visibility'
          git push origin HEAD:agent/production-visibility-enforcement
