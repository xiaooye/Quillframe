name: Temporary prune superseded UI branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-prune-ui-branches.yml

permissions:
  contents: write

jobs:
  prune-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only superseded UI refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          keep = {'main', 'agent/planning-commitment-horizon', 'ui/godot'}
          stale = ['godot-visual-next', 'ui/kawaii-godot-restore']

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'novelforge-ui-branch-cleanup',
          }

          def request(url, method='GET'):
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = resp.read()
                      return resp.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  body = exc.read().decode('utf-8', 'replace')
                  raise RuntimeError(f'{method} {url} -> {exc.code}: {body}') from exc

          def branches():
              status, data = request(f'https://api.github.com/repos/{repo}/branches?per_page=100')
              assert status == 200
              return {item['name'] for item in data}

          before = branches()
          missing = keep - before
          if missing:
              raise SystemExit(f'keep refs missing before cleanup: {sorted(missing)}')

          for branch in stale:
              if branch not in before:
                  print(f'ALREADY_ABSENT {branch}')
                  continue
              encoded = urllib.parse.quote(branch, safe='')
              status, _ = request(f'https://api.github.com/repos/{repo}/git/refs/heads/{encoded}', method='DELETE')
              if status not in (204, 404):
                  raise SystemExit(f'unexpected delete status {status} for {branch}')
              print(f'DELETED {branch}')

          after = branches()
          survivors = set(stale) & after
          if survivors:
              raise SystemExit(f'superseded UI refs survived: {sorted(survivors)}')
          missing = keep - after
          if missing:
              raise SystemExit(f'keep refs missing after cleanup: {sorted(missing)}')

          print('UI_BRANCH_CLEANUP_PASS')
          print('remaining branches:', sorted(after))
          PY
