name: Temporary Pre-Independent Qualification Patch

on:
  push:
    branches:
      - agent/pre-independent-candidate-qualification
    paths:
      - 'tmp/apply_pre_independent_patch.py'
      - '.github/workflows/tmp-pre-independent-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pre-independent-candidate-qualification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact patch
        run: python tmp/apply_pre_independent_patch.py
      - name: Compile patched runtime
        run: |
          python -m py_compile \
            quality/candidate_qualification.py \
            quality/regression_escape.py \
            quality/production_readiness.py \
            quality/production_release.py \
            harness/semantic_workers/semantic_worker_router.py \
            harness/semantic_workers/semantic_worker_runner.py \
            harness/semantic_workers/peer_chat_relay.py \
            harness/semantic_workers/registered_contract_binding.py
          python -m json.tool harness/semantic_workers/contracts/quality.json > /dev/null
          python -m json.tool quality/candidate_qualification.schema.json > /dev/null
          python -m json.tool quality/regression_escape.schema.json > /dev/null
      - name: Targeted deterministic contracts
        run: |
          python harness/semantic_workers/semantic_worker_router.py self-test
          python harness/semantic_workers/registered_contract_binding.py self-test
          python quality/candidate_qualification.py self-test
          python quality/regression_escape.py self-test
          python quality/production_readiness.py self-test
          python quality/production_release.py self-test
          python harness/semantic_workers/peer_chat_relay.py self-test
      - name: Commit patch and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add harness/semantic_workers/contracts/quality.json \
            quality/candidate_qualification.py \
            quality/candidate_qualification.schema.json \
            harness/semantic_workers/semantic_worker_router.py \
            harness/semantic_workers/semantic_worker_runner.py \
            harness/semantic_workers/peer_chat_relay.py \
            harness/semantic_workers/registered_contract_binding.py \
            quality/production_readiness.py \
            quality/production_release.py
          git rm tmp/apply_pre_independent_patch.py .github/workflows/tmp-pre-independent-patch.yml
          git commit -m 'quality: enforce pre-independent candidate qualification'
          git push origin HEAD:agent/pre-independent-candidate-qualification
