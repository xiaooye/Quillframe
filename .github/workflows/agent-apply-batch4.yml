name: Agent Apply Batch 4 (temporary)

on:
  push:
    branches: [agent/8-0-batch4-character-epistemic]
    paths:
      - '.agent-batch/**'
      - '.github/workflows/agent-apply-batch4.yml'

permissions:
  contents: write

jobs:
  apply-verified-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify, apply, test, and stage workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          cp .agent-batch/b4.part1 /tmp/b4.b64
          echo '4f48b26ebdee75beed89abe90df4d4d2e4faa72b02959b0abecf4d384bde16de  /tmp/b4.b64' | sha256sum -c -
          base64 -d /tmp/b4.b64 | gzip -d > /tmp/b4.patch
          git apply --check /tmp/b4.patch
          git apply /tmp/b4.patch
          mkdir -p .agent-batch-output
          cp .github/workflows/novelforge-contracts.yml .agent-batch-output/novelforge-contracts.yml
          cp .github/workflows/novelforge-semantic-contract-packs.yml .agent-batch-output/novelforge-semantic-contract-packs.yml
          git checkout HEAD -- .github/workflows/novelforge-contracts.yml .github/workflows/novelforge-semantic-contract-packs.yml
          rm -rf .agent-batch
          python harness/semantic_workers/semantic_worker_router.py self-test > /tmp/semantic-router.json
          python scripts/version_identity.py > /tmp/version-identity.json
          python novelforge.py self-test > /tmp/novelforge-self-test.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/semantic-router.json'))['semantic_router_contract'] == 'PASS'
          assert json.load(open('/tmp/version-identity.json'))['version_identity_contract'] == 'PASS'
          assert json.load(open('/tmp/novelforge-self-test.json'))['novelforge_cli_contract'] == 'PASS'
          PY
          git add -A
          git diff --cached --check
          git config user.name 'NovelForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: bind character actions to epistemic evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
