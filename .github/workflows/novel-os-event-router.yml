name: Novel OS Event Router

on:
  repository_dispatch:
    types: [novel-os-event]
  workflow_dispatch:
    inputs:
      event_json:
        description: 'One novel_os_event_v1 JSON object'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: novel-os-event-${{ github.event.client_payload.event.event_id || github.run_id }}
  cancel-in-progress: false

jobs:
  validate-and-receive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize external event
        env:
          DISPATCH_EVENT: ${{ toJson(github.event.client_payload.event) }}
          MANUAL_EVENT: ${{ inputs.event_json }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          if os.environ['EVENT_NAME']=='repository_dispatch':
              raw=os.environ.get('DISPATCH_EVENT','')
              event=json.loads(raw)
          else:
              event=json.loads(os.environ.get('MANUAL_EVENT',''))
          if not isinstance(event,dict):
              raise SystemExit('event must be one JSON object')
          pathlib.Path('/tmp/novel-os-event.json').write_text(json.dumps(event,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Validate idempotency and authority boundary
        run: |
          python harness/control_plane/control_plane.py --db /tmp/event-router.db event-ingest --event /tmp/novel-os-event.json > event-receipt.json
          python - <<'PY'
          import json
          receipt=json.load(open('event-receipt.json',encoding='utf-8'))
          assert receipt['accepted'] is True
          PY

      - name: Classify safe routing intent
        run: |
          python - <<'PY'
          import json
          event=json.load(open('/tmp/novel-os-event.json',encoding='utf-8'))
          routes={
            'session.resume_requested':'resume-candidate',
            'semantic.requested':'semantic-queue-candidate',
            'semantic.result_received':'result-bind-candidate',
            'eval.requested':'eval-candidate',
            'maintenance.requested':'maintenance-candidate',
            'research.refresh_requested':'research-candidate',
            'feedback.observed':'learning-observation',
            'artifact.acceptance_observed':'settlement-precondition-observation'
          }
          route=routes[event['event_type']]
          out={'event_id':event['event_id'],'event_type':event['event_type'],'route':route,'authority':'candidate-or-observation-only','automatic_canon_write':False,'automatic_draft':False,'automatic_settlement':False,'automatic_os_promotion':False}
          json.dump(out,open('event-route.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: novel-os-event-${{ github.run_id }}
          path: |
            event-receipt.json
            event-route.json
          if-no-files-found: error
