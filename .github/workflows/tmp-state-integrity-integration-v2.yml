name: One-shot state-integrity integration v2

on:
  push:
    branches: [agent/state-integrity-p0-v2]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/state-integrity-p0-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Expand untracked files in temporary guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/tmp_state_integrity_integration.py')
          t=p.read_text(encoding='utf-8')
          old='subprocess.check_output(["git", "status", "--porcelain"], cwd=ROOT, text=True)'
          new='subprocess.check_output(["git", "status", "--porcelain", "-uall"], cwd=ROOT, text=True)'
          assert t.count(old)==1
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply and verify P0 integration
        continue-on-error: true
        run: python scripts/tmp_state_integrity_integration.py
      - name: Assert local integration commit exists
        run: |
          test "$(git log -1 --format=%s)" = "state: integrate P0 contracts and documentation"
          test ! -e .github/workflows/tmp-state-integrity-integration-v2.yml
          test ! -e scripts/tmp_state_integrity_integration.py
          git show --stat --oneline HEAD
      - name: Stage verified integration artifact
        run: |
          rm -rf /tmp/p0-integrated
          mkdir -p /tmp/p0-integrated/docs /tmp/p0-integrated/specs/008-state-integrity-p0
          cp HARNESS_MANIFEST.yaml /tmp/p0-integrated/
          cp .github/workflows/novelforge-contracts.yml /tmp/p0-integrated/novelforge-contracts.yml
          cp docs/documentation_manifest.json /tmp/p0-integrated/docs/
          cp specs/008-state-integrity-p0/* /tmp/p0-integrated/specs/008-state-integrity-p0/
          (cd /tmp/p0-integrated && find . -type f ! -name VERIFIED_SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > VERIFIED_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: verified-state-integrity-integration-v2
          path: /tmp/p0-integrated
          if-no-files-found: error
