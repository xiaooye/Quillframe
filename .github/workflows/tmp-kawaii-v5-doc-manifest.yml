name: Temporary Kawaii v5 documentation manifest repair

on:
  push:
    branches: [agent/docs-manifest-kawaii-v5]
    paths:
      - '.tmp_register_kawaii_v5_docs.py'
      - '.github/workflows/tmp-kawaii-v5-doc-manifest.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register kawaii v5 bilingual docs
        run: python .tmp_register_kawaii_v5_docs.py
      - name: Validate documentation governance
        run: |
          python scripts/docs_quality.py
          python scripts/framework_hygiene.py
          git diff --check
      - name: Commit only the manifest repair
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "docs/documentation_manifest.json"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'NovelForge Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/documentation_manifest.json
          git commit -m 'docs: register Story Loom kawaii atelier v5 specs'
          git push origin "HEAD:${GITHUB_REF_NAME}"
