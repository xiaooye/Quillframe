name: NovelForge Live Semantic Evals

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Semantic eval domain, or all
        required: true
        default: all
        type: string
      model:
        description: OpenAI API model id
        required: true
        default: gpt-5.1
        type: string
      reasoning_effort:
        description: OpenAI reasoning effort
        required: true
        default: medium
        type: choice
        options: [low, medium, high]

permissions:
  contents: read

jobs:
  live-semantic:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NOVEL_OS_OPENAI_MODEL: ${{ inputs.model }}
      NOVEL_OS_OPENAI_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
      NOVEL_OS_DISABLE_LOCAL_AGENT_AUTO: '1'
      SEMANTIC_DOMAIN: ${{ inputs.domain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require explicitly configured API credential
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'OPENAI_API_KEY repository secret is required for this optional live workflow.' >&2
            exit 2
          fi

      - name: Build blind semantic queue
        run: |
          python evals/build_judge_queue.py --output semantic-live-queue.json
          python - <<'PY'
          import json, os
          p='semantic-live-queue.json'
          d=json.load(open(p,encoding='utf-8'))
          domain=os.environ['SEMANTIC_DOMAIN'].strip()
          if domain and domain != 'all':
              d['cases']=[c for c in d['cases'] if c.get('domain') == domain]
          if not d['cases']:
              raise SystemExit(f'no semantic cases for domain={domain!r}')
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - name: Package fingerprint-bound jobs
        run: |
          python harness/semantic_workers/semantic_worker_router.py prepare-evals \
            --queue semantic-live-queue.json --output semantic-live-jobs.json
          python harness/semantic_workers/semantic_worker_router.py validate-jobs \
            --jobs semantic-live-jobs.json

      - name: Verify provider-backed independent capability
        run: |
          python harness/semantic_workers/semantic_worker_runner.py capabilities > semantic-live-capabilities.json
          python - <<'PY'
          import json
          d=json.load(open('semantic-live-capabilities.json',encoding='utf-8'))
          assert d['independent_worker_available'] is True, d
          assert d['adapter_source'] == 'openai_env', d
          assert d['built_in_model_provider'] is True, d
          PY

      - name: Execute independent semantic jobs
        run: |
          python harness/semantic_workers/semantic_worker_runner.py run \
            --jobs semantic-live-jobs.json \
            --output semantic-live-execution.json \
            --require-complete
          python - <<'PY'
          import json
          r=json.load(open('semantic-live-execution.json',encoding='utf-8'))
          assert r['status'] in {'completed','semantic_reject'}, r
          json.dump({'results':r['results']},open('semantic-live-results.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - name: Validate bindings and construct judgments
        run: |
          python harness/semantic_workers/semantic_worker_router.py validate-results \
            --jobs semantic-live-jobs.json \
            --results semantic-live-results.json \
            --judgments-output semantic-live-judgments.json

      - name: Evaluate semantic judgments
        run: |
          DOMAIN="$SEMANTIC_DOMAIN"
          if [ "$DOMAIN" = 'all' ]; then
            python evals/run_evals.py --judgments semantic-live-judgments.json --release
            python evals/run_evals.py --judgments semantic-live-judgments.json --json > semantic-live-eval-results.json
          else
            python evals/run_evals.py --domain "$DOMAIN" --judgments semantic-live-judgments.json --release
            python evals/run_evals.py --domain "$DOMAIN" --judgments semantic-live-judgments.json --json > semantic-live-eval-results.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: novelforge-semantic-live-${{ github.run_id }}
          path: |
            semantic-live-capabilities.json
            semantic-live-queue.json
            semantic-live-jobs.json
            semantic-live-execution.json
            semantic-live-results.json
            semantic-live-judgments.json
            semantic-live-eval-results.json
          if-no-files-found: warn
