name: Story Loom Design System

on:
  pull_request:
    paths:
      - 'assets/brand/**'
      - 'assets/provenance.json'
      - 'scripts/design_system_quality.py'
      - '.github/workflows/story-loom-design-system.yml'
  push:
    branches: [main]
    paths:
      - 'assets/brand/**'
      - 'assets/provenance.json'
      - 'scripts/design_system_quality.py'
      - '.github/workflows/story-loom-design-system.yml'

permissions:
  contents: read

jobs:
  design-system-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Story Loom integration contract
        run: python scripts/design_system_quality.py
      - name: Repository documentation quality
        run: python scripts/docs_quality.py
