name: Author steering one-shot integration

on:
  push:
    branches: [agent/author-steering-runtime-v2]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[author-steering-integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/author-steering-runtime-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fail-closed manifest migration
        run: python scripts/_tmp_integrate_author_steering.py
      - name: Remove one-shot migration helpers
        run: |
          rm scripts/_tmp_integrate_author_steering.py
          rm .github/workflows/_tmp-author-steering-integrate.yml
      - name: Commit branch-only integration
        run: |
          git config user.name 'novelforge-runtime-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'runtime: integrate author steering release contract [author-steering-integrated]'
          git push origin HEAD:agent/author-steering-runtime-v2
