name: Quillframe Project Peer Semantic Bridge
description: Execute the generic peer-chat relay against a consuming Project issue while enforcing exact Framework lock binding.
inputs:
  mode:
    description: prepare or validate-result
    required: true
  project-root:
    description: Path to the Quillframe Project root in the caller repository
    required: true
  project-id:
    description: Expected Project ID
    required: true
  github-token:
    description: Caller repository token with issues write permission
    required: true
outputs:
  validation-receipt:
    description: Machine receipt emitted only after validate-result succeeds; empty during prepare mode.
    value: ${{ steps.bridge.outputs.validation-receipt }}
runs:
  using: composite
  steps:
    - name: Execute project-hosted peer bridge
      id: bridge
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        QUILLFRAME_BRIDGE_MODE: ${{ inputs.mode }}
        QUILLFRAME_PROJECT_ROOT: ${{ inputs.project-root }}
        QUILLFRAME_PROJECT_ID: ${{ inputs.project-id }}
        QUILLFRAME_ACTION_PATH: ${{ github.action_path }}
        QUILLFRAME_ACTION_REF: ${{ github.action_ref }}
        QUILLFRAME_ACTION_REPOSITORY: ${{ github.action_repository }}
      run: python "$QUILLFRAME_ACTION_PATH/bridge.py"
