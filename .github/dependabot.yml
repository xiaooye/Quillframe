version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      solid:
        patterns:
          - "solid-js"
          - "@solidjs/*"
          - "vite-plugin-solid"

  - package-ecosystem: "npm"
    directory: "/studio/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      solid:
        patterns:
          - "solid-js"
          - "@solidjs/*"
          - "vite-plugin-solid"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
