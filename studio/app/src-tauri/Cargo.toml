[package]
name = "quillframe-studio"
version = "0.9.1"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
keyring = "4.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
tauri-plugin-shell = "2.3.5"
uuid = { version = "1", features = ["v4"] }
