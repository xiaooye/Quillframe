[package]
name = "quillframe-studio"
version = "1.0.0-dev.0"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
quillframe-core = { path = "../../../native/quillframe-core" }
quillframe-secrets = { path = "../../../native/quillframe-secrets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
